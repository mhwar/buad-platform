# Cloudflare Pages configuration
# This file configures D1 bindings for Pages Functions.
# Do NOT add [site] section — this is a static Pages project.

name = "buad-platform"
compatibility_date = "2024-01-01"

# D1 database binding
# After creating the D1 database in Cloudflare dashboard, update the database_id below.
[[d1_databases]]
binding = "BUAD_DB"
database_name = "buad-platform"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
