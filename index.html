/* Migrate old page_layout values (mm-based heights) to new px-based system.
   Also forces top/bottom margins to the tight defaults so the gap between
   the header band and the first clause text matches inter-clause spacing
   (≈ 14px, identical on EVERY body page). */
Pages._migrateContractLayout = function(contract) {
  if (!contract.page_layout) {
    contract.page_layout = {
      header: { show: true, image: '', height: 180, overlay: [] },
      footer: { show: true, image: '', height: 90, overlay: [{text:'صفحة {{page_number}} من {{total_pages}}', pos:'bottom-center', font_size:9, color:'#6B7280'}] }
    };
  }
  var h = contract.page_layout.header;
  var f = contract.page_layout.footer;
  if (h) {
    // Old mm-based heights or oversized defaults get reset to 180px
    if (!h.height || h.height < 110 || h.height === 200) h.height = 180;
    if (!h.overlay) h.overlay = [];
    delete h.mode; delete h.image_position; delete h.show_logo;
    delete h.title; delete h.doc_number; delete h.show_page_num; delete h.custom_right;
  }
  if (f) {
    // Old 150px default → 90px (industry-standard footer)
    if (!f.height || f.height < 60 || f.height === 150) f.height = 90;
    if (!f.overlay) f.overlay = [];
    delete f.mode; delete f.image_position;
    delete f.left_text; delete f.center_text; delete f.show_page_num; delete f.custom_right;
  }
  // Force top/bottom margins to 0 — first/last clause's natural padding (14px)
  // is the entire gap; this matches the inter-clause spacing exactly on every page.
  if (!contract.doc_margins) contract.doc_margins = {top:0, right:2.0, bottom:0, left:2.0};
  var m = contract.doc_margins;
  m.top = 0;
  m.bottom = 0;
  if (m.right > 2.5 || !m.right) m.right = 2.0;
  if (m.left > 2.5 || !m.left) m.left = 2.0;
  // Persist the migration so the saved DB value reflects the new defaults
  if (contract._migrated_v2 !== true && Pages._contractProjId) {
    contract._migrated_v2 = true;
    try { DB.saveContract(Pages._contractProjId, contract); } catch(e) {}
  }
  // Migrate cover to free-form elements if not done yet
  if (contract.cover && !contract.cover.elements) {
    Pages._migrateCoverToFree(contract.cover);
    if (!contract._cover_free_v1 && Pages._contractProjId) {
      contract._cover_free_v1 = true;
      try { DB.saveContract(Pages._contractProjId, contract); } catch(e) {}
    }
  }
};

/* Render cover page content (no header/footer slots) */
Pages._renderCoverContent = function(contract, opts) {
  opts = opts || {};
  // Free-form renderer: used when cover has elements[]
  if (contract.cover && Array.isArray(contract.cover.elements)) {
    return Pages._renderCoverContentFree(contract, opts);
  }
  var vars = contract.variables || {};
  var ds = contract.doc_style || {title_size:18, subtitle_size:12};
  var preview = opts.preview;
  var frameClass = 'cov-frame-' + (contract.cover && contract.cover.frame_style ? contract.cover.frame_style : 'modern');
  var isCovImage = frameClass === 'cov-frame-image';
  var covBgPos = (contract.cover && contract.cover.bg_position) || 'center';
  var bgImgHtml = (isCovImage && contract.cover && contract.cover.bg_image)
    ? '<img class="cov-bg-img" src="'+contract.cover.bg_image+'" style="object-position:'+UI.escHtml(covBgPos)+'">'
      + '<div class="cov-overlay" style="background:rgba(0,0,0,'+UI.escHtml(String((contract.cover && contract.cover.overlay_opacity)||0.55))+')"></div>'
    : '';
  var covBg = (isCovImage && !(contract.cover && contract.cover.bg_image))
    ? ';background:'+UI.escHtml((contract.cover && contract.cover.bg_color)||'#0F2A4A')
    : '';
  var logoHtml = contract.cover && contract.cover.logo
    ? '<img src="'+contract.cover.logo+'" style="max-width:120px;max-height:72px;object-fit:contain;display:block;margin:0 auto 12px">'
    : (preview ? '' : '<div class="cov-logo-slot" title="رفع شعار"><i data-lucide="building-2"></i><span style="display:block;font-size:9px;margin-top:3px">شعار</span></div>');
  var companyHtml = contract.cover && contract.cover.company_name
    ? '<div style="font-size:11pt;font-weight:600;color:#0F2A4A;margin-bottom:8px">'+UI.escHtml(contract.cover.company_name)+'</div>'
    : '';
  var partyA = vars.party_a_name ? UI.escHtml(vars.party_a_name) : (preview ? '_______________' : '<span style="color:#9CA3AF">اسم الطرف الأول</span>');
  var partyB = vars.party_b_name ? UI.escHtml(vars.party_b_name) : (preview ? '_______________' : '<span style="color:#9CA3AF">اسم الطرف الثاني</span>');
  return '<div class="cov-page-inner '+frameClass+'" style="width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden'+covBg+'">' +
    bgImgHtml +
    '<div class="cov-frame-wrap">' +
      logoHtml + companyHtml +
      '<div class="cov-title" style="font-size:'+(ds.title_size||18)+'pt">'+UI.escHtml(contract.title)+'</div>' +
      '<div class="cov-subtitle">'+UI.escHtml((contract.cover && contract.cover.subtitle) != null ? contract.cover.subtitle : 'المملكة العربية السعودية')+'</div>' +
      '<div class="cov-parties-box">' +
        '<div class="cov-parties-row"><strong>الطرف الأول</strong>'+partyA+'</div>' +
        '<div class="cov-parties-row"><strong>الطرف الثاني</strong>'+partyB+'</div>' +
      '</div>' +
      '<div class="cov-ref-line">'+(vars.contract_date_gregorian?UI.escHtml(vars.contract_date_gregorian):'')+(vars.contract_city?' · '+UI.escHtml(vars.contract_city):'')+'</div>' +
    '</div>' +
  '</div>';
};

/* Default element layout for new covers */
Pages._defaultCoverElements = function() {

    { id: DB.uid(), type:'text',    x:50, y:30, w:85, align:'center', props:{text:'{{title}}', font_size:22, font_weight:'700', color:'#0F2A4A'} },
    { id: DB.uid(), type:'text',    x:50, y:44, w:70, align:'center', props:{text:'المملكة العربية السعودية', font_size:12, font_weight:'400', color:'#6B7280'} },
    { id: DB.uid(), type:'divider', x:50, y:52, w:60, align:'center', props:{color:'#D1D5DB', thickness:1} },

  ];
};

/* Convert old frame_style cover to free-form elements[] */
Pages._migrateCoverToFree = function(cover) {
  if (!cover) cover = {};
  if (cover.elements) return cover;
  var els = Pages._defaultCoverElements();
  if (cover.logo) els[0].props.src = cover.logo;
  if (cover.company_name) els[1].props.text = cover.company_name;
  if (!cover.bg_type) {
    if (cover.frame_style === 'image' && cover.bg_image) {
      cover.bg_type = 'image';
      cover.bg_overlay = typeof cover.overlay_opacity === 'number' ? cover.overlay_opacity : 0.3;
    } else {
      cover.bg_type = 'color';
      if (!cover.bg_color) cover.bg_color = '#FFFFFF';
    }
  }
  cover.elements = els;
  return cover;
};

/* Resolve {{vars}} inside a cover text element — full variable set */
Pages._applyVarsToCoverEl = function(text, vars, contract) {
  if (!text) return '';
  var settings = DB.getSettings();
  return text.replace(/\{\{(\w+)\}\}/g, function(match, key) {
    if (key === 'title') return UI.escHtml((contract && contract.title) || '');
    if (key === 'footer_label') return UI.escHtml((contract && contract.footer_label) || '');
    if (key === 'company_name') return UI.escHtml(settings.company_name || (vars && vars.company_name) || '');
    if (key === 'company_email') return UI.escHtml(settings.company_email || '');
    if (key === 'company_phone') return UI.escHtml(settings.company_phone || '');
    if (key === 'duration_full') {
      var dv = ((vars && vars.duration_months) || '').toString().trim();
      var du = ((vars && vars.duration_unit) || 'شهر').trim();
      return dv ? UI.escHtml(dv + ' ' + du) : '';
    }
    if (key === 'contract_amount_words') {
      var amt = parseFloat(((vars && vars.contract_amount) || '').replace(/,/g,''));
      return UI.escHtml(Pages._numToArabic(amt) || '');
    }
    var val = vars && vars[key];
    return val ? UI.escHtml(String(val)) : match;
  });
};

/* Render one cover element */
Pages._renderCoverEl = function(el, vars, contract, editable) {
  vars = vars || {};
  var t = el.type || 'text';
  var p = el.props || {};
  var innerHtml = '';

  if (t === 'logo' || t === 'logo_a' || t === 'logo_b') {
    var logoLabel = t === 'logo_a' ? 'شعار الطرف الأول' : t === 'logo_b' ? 'شعار الطرف الثاني' : 'شعار الجهة';
    var logoIcon = t === 'logo' ? 'building-2' : 'building';
    var mhStyle = p.max_height ? 'max-height:'+p.max_height+'px;' : '';
    if (p.src) {
      var changeHint = editable ? ' style="cursor:pointer" onclick="Pages._clickCoverElUpload(\''+el.id+'\')" title="انقر لتغيير الشعار"' : '';
      innerHtml = '<div class="cov-el-logo"><img src="'+p.src+'" alt="" style="'+mhStyle+'max-width:100%;object-fit:contain"'+changeHint+'></div>';
    } else if (editable) {
      innerHtml = '<div class="cov-el-logo"><div class="logo-ph" style="cursor:pointer" onclick="Pages._clickCoverElUpload(\''+el.id+'\')" title="'+logoLabel+' — انقر للرفع"><i data-lucide="'+logoIcon+'" style="width:28px;height:28px"></i><span style="font-size:9px;margin-top:4px;display:block">'+logoLabel+'<br><span style="color:var(--iris-500)">انقر للرفع</span></span></div></div>';
    }
  } else if (t === 'text') {
    var txt = Pages._applyVarsToCoverEl(p.text || '', vars, contract);
    var fs = p.font_size || 12;
    var fw = p.font_weight || '400';
    var fc = p.color || '#1F2937';
    innerHtml = '<div class="cov-el-text" style="font-size:'+fs+'pt;font-weight:'+fw+';color:'+UI.escHtml(fc)+'">'+txt+'</div>';
  } else if (t === 'parties') {
    var partyA = vars.party_a_name ? UI.escHtml(vars.party_a_name) : '_______________';
    var partyB = vars.party_b_name ? UI.escHtml(vars.party_b_name) : '_______________';
    var rows = '';
    if (p.show_a !== false) rows += '<div class="cov-parties-row"><strong>الطرف الأول</strong>'+partyA+'</div>';
    if (p.show_b !== false) rows += '<div class="cov-parties-row"><strong>الطرف الثاني</strong>'+partyB+'</div>';
    innerHtml = '<div class="cov-el-parties"><div class="cov-parties-box">'+rows+'</div></div>';
  } else if (t === 'divider') {
    var hrStyle = 'border-top:'+(p.thickness||1)+'px solid '+(p.color||'#D1D5DB');
    innerHtml = '<div class="cov-el-divider"><hr style="'+hrStyle+'"></div>';
  } else if (t === 'image') {
    var mhStyleImg = p.max_height ? 'max-height:'+p.max_height+'px;' : '';
    if (p.src) {
      var imgChangeHint = editable ? ' style="cursor:pointer;'+mhStyleImg+'max-width:100%;display:block;object-fit:contain" onclick="Pages._clickCoverElUpload(\''+el.id+'\')" title="انقر لتغيير الصورة"' : ' style="'+mhStyleImg+'max-width:100%;display:block;object-fit:contain"';
      innerHtml = '<div class="cov-el-image"><img src="'+p.src+'" alt=""'+imgChangeHint+'></div>';
    } else if (editable) {
      innerHtml = '<div class="cov-el-image"><div class="logo-ph" style="cursor:pointer" onclick="Pages._clickCoverElUpload(\''+el.id+'\')" title="صورة — انقر للرفع"><i data-lucide="image" style="width:24px;height:24px"></i><span style="font-size:9px;color:var(--iris-500);display:block;margin-top:4px">انقر للرفع</span></div></div>';
    }
  }

  if (!innerHtml) return '';

  var x = typeof el.x === 'number' ? el.x : 50;
  var y = typeof el.y === 'number' ? el.y : 10;
  var w = typeof el.w === 'number' ? el.w : 80;
  var align = el.align || 'center';
  var leftPct = (x - w / 2);
  var style = 'left:'+leftPct.toFixed(2)+'%;top:'+y.toFixed(2)+'%;width:'+w+'%;text-align:'+align;

  var dragAttrs = editable
    ? ' data-draggable="1" data-el-x="'+x+'" data-el-y="'+y+'" data-el-id="'+el.id+'"'
      + ' onpointerdown="Pages._startCoverElDrag(event,\''+el.id+'\')"'
      + ' onpointermove="Pages._coverElDragMove(event)"'
      + ' onpointerup="Pages._coverElDragEnd(event)"'
    : '';

  return '<div class="cov-el" style="'+style+'"'+dragAttrs+'>'+innerHtml+'</div>';
};

/* Render free-form cover canvas */
Pages._renderCoverContentFree = function(contract, opts) {
  opts = opts || {};
  var editable = opts.editable !== false;
  var vars = contract.variables || {};
  var cover = contract.cover || {};
  var elements = cover.elements || [];

  var bgStyle = '';
  var bgImgHtml = '';
  if (cover.bg_type === 'image' && cover.bg_image) {
    bgImgHtml = '<img class="cov-bg-img" src="'+cover.bg_image+'" alt="">';
    var ov = cover.bg_overlay || 0;
    if (ov > 0) bgImgHtml += '<div class="cov-free-bg-overlay" style="background:rgba(0,0,0,'+ov+')"></div>';
  } else {
    bgStyle = 'background:'+(cover.bg_color || '#FFFFFF');
  }

  var elsHtml = elements.map(function(el) {
    return Pages._renderCoverEl(el, vars, contract, editable);
  }).join('');

  return '<div class="cov-free-canvas">'
    + '<div class="cov-free-bg"'+(bgStyle?' style="'+bgStyle+'"':'')+'>'+bgImgHtml+'</div>'
    + elsHtml
    + '</div>';
};

/* Render a single page header/footer band with image background and overlay text slots */
Pages._renderHeaderBand = function(hdr, pageNum, totalPages, vars, contract) {
  if (hdr.show === false) return '<header class="doc-page-hdr" style="height:0"></header>';
  var h = hdr.height || 200;
  var imgHtml = hdr.image ? '<img class="doc-page-hdr-img" src="'+hdr.image+'">' : '';
  var overlay = (hdr.overlay || []).map(function(slot) {
    var text = Pages._applyOverlayVars(slot.text || '', vars, pageNum, totalPages, contract);
    if (!text) return '';
    var style = 'font-size:'+(slot.font_size||9)+'pt;color:'+(slot.color||'#1F2937')+';font-weight:'+(slot.font_weight||'400');
    return '<span class="hdr-slot" data-pos="'+(slot.pos||'top-right')+'" style="'+style+'">'+UI.escHtml(text)+'</span>';
  }).join('');
  var hasContent = hdr.image || (hdr.overlay||[]).some(function(s){return s.text;});
  var emptyClass = hasContent ? '' : ' empty';
  return '<header class="doc-page-hdr'+emptyClass+'" style="height:'+h+'px">' +
    imgHtml +
    '<div class="doc-page-hdr-overlay">' + overlay + '</div>' +
    (hasContent ? '' : '<span>الرأس فارغ — أضف صورة أو نص من الإعدادات</span>') +
  '</header>';
};
Pages._renderFooterBand = function(ftr, pageNum, totalPages, vars, contract) {
  if (ftr.show === false) return '<footer class="doc-page-ftr" style="height:0"></footer>';
  var h = ftr.height || 150;
  var imgHtml = ftr.image ? '<img class="doc-page-ftr-img" src="'+ftr.image+'">' : '';
  var overlay = (ftr.overlay || []).map(function(slot) {
    var text = Pages._applyOverlayVars(slot.text || '', vars, pageNum, totalPages, contract);
    if (!text) return '';
    var style = 'font-size:'+(slot.font_size||9)+'pt;color:'+(slot.color||'#1F2937')+';font-weight:'+(slot.font_weight||'400');
    return '<span class="ftr-slot" data-pos="'+(slot.pos||'bottom-center')+'" style="'+style+'">'+UI.escHtml(text)+'</span>';
  }).join('');
  var hasContent = ftr.image || (ftr.overlay||[]).some(function(s){return s.text;});
  var emptyClass = hasContent ? '' : ' empty';
  return '<footer class="doc-page-ftr'+emptyClass+'" style="height:'+h+'px">' +
    imgHtml +
    '<div class="doc-page-ftr-overlay">' + overlay + '</div>' +
    (hasContent ? '' : '<span>الذيل فارغ — أضف صورة أو نص من الإعدادات</span>') +
  '</footer>';
};

/* Substitute variables in overlay text — page numbers, contract vars, company settings */
Pages._applyOverlayVars = function(text, vars, pageNum, totalPages, contract) {
  if (!text) return '';
  var settings = DB.getSettings();
  return text.replace(/\{\{(\w+)\}\}/g, function(match, key) {
    if (key === 'page_number') return String(pageNum);
    if (key === 'total_pages') return String(totalPages);
    if (key === 'contract_amount_words') {
      var amt = parseFloat(((vars && vars.contract_amount)||'').replace(/,/g,''));
      return Pages._numToArabic(amt) || '';
    }
    if (key === 'company_name') return settings.company_name || (vars && vars.company_name) || '';
    if (key === 'company_email') return settings.company_email || '';
    if (key === 'company_phone') return settings.company_phone || '';
    if (key === 'footer_label') return (contract && contract.footer_label) || '';
    if (key === 'duration_full') {
      var dv = ((vars && vars.duration_months) || '').toString().trim();
      var du = ((vars && vars.duration_unit) || 'شهر').trim();
      return dv ? dv + ' ' + du : '';
    }
    var v = (vars && vars[key]) || '';
    return String(v).trim();
  });
};

/* Render one clause block — used both for measuring and for final DOM.
   opts.fragmentMode: 'full' (default) | 'first' (with title, partial content)
                    | 'continued' (continuation in next page, title with "(تابع)") */
Pages._renderClauseHtml = function(cl, idx, totalClauses, contract, opts) {
  opts = opts || {};
  var ds = contract.doc_style || {clause_title_size:14};
  var fragmentMode = opts.fragmentMode || 'full';
  var contentText = opts.contentOverride != null ? opts.contentOverride : cl.content;
  var contentHtml = opts.editable
    ? UI.escHtml(contentText)
    : (Pages._contractPreview
        ? Pages._applyVars(UI.escHtml(contentText), contract.variables)
        : UI.escHtml(contentText));
  var showControls = opts.editable && fragmentMode !== 'continued';
  var controls = showControls
    ? '<div class="clause-controls">' +
        (idx>0 ? '<button class="clause-ctrl-btn" onclick="Pages.moveClause(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+',\'up\')" title="للأعلى"><i data-lucide="chevron-up"></i></button>' : '') +
        (idx<totalClauses-1 ? '<button class="clause-ctrl-btn" onclick="Pages.moveClause(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+',\'down\')" title="للأسفل"><i data-lucide="chevron-down"></i></button>' : '') +
        '<button class="clause-ctrl-btn'+(cl.page_break?' break-active':'')+'" onclick="Pages.toggleClauseBreak(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+')" title="'+(cl.page_break?'إلغاء فصل الصفحة':'ابدأ صفحة جديدة')+'"><i data-lucide="arrow-down-to-line"></i></button>' +
        '<button class="clause-ctrl-btn'+(cl.allow_split?' break-active':'')+'" onclick="Pages.toggleClauseSplit(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+')" title="'+(cl.allow_split?'منع تقسيم البند':'اسمح بتقسيم البند')+'"><i data-lucide="scissors"></i></button>' +
        '<button class="clause-ctrl-btn danger" onclick="Pages.deleteClause(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+')" title="حذف البند"><i data-lucide="x"></i></button>' +
      '</div>'
    : '';
  var bodyAttrs = (opts.editable && fragmentMode !== 'continued')
    ? ' contenteditable="true" data-clause-idx="'+idx+'" data-fragment-mode="'+fragmentMode+'" onblur="Pages.saveClauseContent(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+',this)"'
    : ' data-clause-idx="'+idx+'" data-fragment-mode="'+fragmentMode+'"';
  var titleText = cl.title + (fragmentMode === 'continued' ? ' (تابع)' : '');
  var titleHtml = (fragmentMode === 'continued-no-title')
    ? ''
    : '<div class="clause-title" style="font-size:'+(ds.clause_title_size||14)+'pt">'+UI.escHtml(titleText)+'</div>';
  return '<div class="clause-block'+(cl.page_break?' has-break':'')+'" id="clause-'+cl.id+(fragmentMode==='full'?'':'-'+fragmentMode)+'">' +
    controls +
    '<div class="clause-block-inner">' +
      titleHtml +
      '<div class="clause-body"'+bodyAttrs+'>'+contentHtml+'</div>' +
    '</div>' +
  '</div>';
};

/* Split clause content into paragraphs (on blank-line boundaries).
   Single-paragraph clauses return a one-item array. */
Pages._splitClauseParagraphs = function(content) {
  if (!content) return [''];
  // Split on \n\n (paragraph breaks); fall back to \n if no double-newlines
  var paras = content.split(/\n\s*\n/);
  if (paras.length === 1) {
    // No paragraph breaks — try single newlines as soft boundaries for very long clauses
    paras = content.split(/\n/).filter(function(p){ return p.trim().length > 0; });
  }
  return paras.length > 0 ? paras : [content];
};

/* Render the centered title shown at the top of the first body page (after cover).
   Returns empty string if disabled. */
Pages._renderFirstPageTitle = function(contract) {
  if (contract.hide_body_title === true) return '';
  var ds = contract.doc_style || {};
  var sz = ds.body_title_size || ds.title_size || 18;
  return '<div class="doc-body-title" style="font-size:'+sz+'pt;text-align:center;font-weight:700;color:#0F2A4A;'+
    'padding:0 0 14px;margin-bottom:6px">'+
    UI.escHtml(contract.title||'') +
  '</div>';
};

/* Render signature page content */
Pages._renderSignatureHtml = function(contract) {
  var vars = contract.variables || {};
  function sigBlock(label, orgName, repName, repTitle) {
    return '<div class="sig-block">' +
      '<div class="sig-block-title">'+label+'</div>' +
      '<div class="sig-block-org">'+UI.escHtml(orgName||'_______________')+'</div>' +
      (repName ? '<div class="sig-block-rep">'+UI.escHtml(repName)+'</div>' : '<div class="sig-block-rep sig-placeholder">اسم الممثل</div>') +
      (repTitle ? '<div class="sig-block-rep-title">'+UI.escHtml(repTitle)+'</div>' : '<div class="sig-block-rep-title sig-placeholder">الصفة</div>') +
      '<div class="sig-line"></div>' +
      '<div class="sig-line-label">التوقيع والختم</div>' +
    '</div>';
  }
  return '<div class="sig-page">' +
    '<div style="border-top:1.5px solid #0F2A4A;margin-bottom:32px"></div>' +
    '<div class="sig-grid">' +
      sigBlock('الطرف الأول', vars.party_a_name, vars.party_a_rep_name, vars.party_a_title) +
      sigBlock('الطرف الثاني', vars.party_b_name, vars.party_b_rep_name, vars.party_b_title) +
    '</div>' +
  '</div>';
};

/* Paginate clauses into A4 pages by measuring rendered heights.
   Splits long clauses on paragraph boundaries when:
   - Total clause height > 50% of page (auto-split threshold), OR
   - cl.allow_split is true (manual override)
   Constraints:
   - Title never separates from its first paragraph (orphan protection)
   - Last paragraph never alone on next page (widow protection)
*/
Pages._paginateContract = function(contract, opts) {
  opts = opts || {};
  var ds = contract.doc_style || {font_size:14, line_height:1.5, clause_title_size:14};
  var pl = contract.page_layout;
  var hdrH = pl.header.height || 200;
  var ftrH = pl.footer.height || 150;
  var PX = 37.795;
  var dm = contract.doc_margins || {top:0, right:2.0, bottom:0, left:2.0};
  var headerGap = (pl.header && typeof pl.header.bottom_gap === 'number') ? pl.header.bottom_gap : 0;
  var footerGap = (pl.footer && typeof pl.footer.top_gap === 'number') ? pl.footer.top_gap : 0;
  var bodyPadLeft = dm.left * PX, bodyPadRight = dm.right * PX;
  var maxBodyHeight = 1123 - hdrH - ftrH - headerGap - footerGap;
  var bodyInnerWidth = 794 - bodyPadLeft - bodyPadRight;

  var measureEl = document.createElement('div');
  measureEl.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;'+
    'width:'+bodyInnerWidth+'px;'+
    'font-family:\'IBM Plex Sans Arabic\',\'Tajawal\',system-ui;'+
    'font-size:'+(ds.font_size||14)+'pt;line-height:'+(ds.line_height||1.5)+';'+
    'direction:rtl;color:#1F2937';
  document.body.appendChild(measureEl);

  function measureClauseHtml(cl, idx, total, fragmentMode, contentOverride) {
    var html = Pages._renderClauseHtml(cl, idx, total, contract, {
      editable:false, fragmentMode:fragmentMode||'full', contentOverride:contentOverride
    });
    measureEl.innerHTML = html;
    return measureEl.firstElementChild ? measureEl.firstElementChild.offsetHeight : 0;
  }

  var enabledClauses = contract.clauses.filter(function(c){return c.enabled!==false;});
  var pages = [[]];
  // First body page reserves height for the centered document title
  var firstPageTitleHtml = Pages._renderFirstPageTitle(contract);
  var firstPageTitleHeight = 0;
  if (firstPageTitleHtml) {
    measureEl.innerHTML = firstPageTitleHtml;
    firstPageTitleHeight = measureEl.firstElementChild ? measureEl.firstElementChild.offsetHeight : 0;
  }
  var currentHeight = firstPageTitleHeight; // first page starts with title already taking space
  var totalClauses = enabledClauses.length;
  var AUTO_SPLIT_THRESHOLD = 0.5; // split clauses taller than 50% of page

  function pushNewPage() {
    pages.push([]);
    currentHeight = 0;
  }
  function addToCurrentPage(item) {
    pages[pages.length-1].push(item);
    currentHeight += item.height;
  }

  enabledClauses.forEach(function(cl, i) {
    if (cl.page_break && pages[pages.length-1].length > 0) {
      pushNewPage();
    }
    var fullHeight = measureClauseHtml(cl, i, totalClauses, 'full');
    var fits = currentHeight + fullHeight <= maxBodyHeight;

    // Case 1: clause fits in current page → place as-is
    if (fits) {
      addToCurrentPage({ clause: cl, idx: i, height: fullHeight, mode:'full' });
      return;
    }

    var allowSplit = cl.allow_split || fullHeight > maxBodyHeight * AUTO_SPLIT_THRESHOLD;
    var paragraphs = Pages._splitClauseParagraphs(cl.content);
    var splittable = allowSplit && paragraphs.length >= 2;

    // Case 2: clause doesn't fit and isn't splittable → push to next page (full)
    if (!splittable) {
      if (pages[pages.length-1].length > 0) pushNewPage();
      addToCurrentPage({ clause: cl, idx: i, height: fullHeight, mode:'full' });
      return;
    }

    // Case 3: clause is splittable — try to fit a prefix on current page
    var spaceLeft = maxBodyHeight - currentHeight;
    var prefixParas = [];
    var prefixHeight = 0;
    var firstParaHeight = measureClauseHtml(cl, i, totalClauses, 'first', paragraphs[0]);

    // Orphan protection: title + first para must fit together to start on this page
    if (firstParaHeight > spaceLeft || currentHeight === 0) {
      // Can't even fit title+first para, or page is empty (then no point splitting yet)
      if (currentHeight > 0 && firstParaHeight > spaceLeft) {
        pushNewPage();
        spaceLeft = maxBodyHeight;
      }
    }

    // Greedy: add paragraphs to prefix as long as they fit
    var prefixCount = 0;
    for (var p = 0; p < paragraphs.length; p++) {
      var trial = prefixParas.concat([paragraphs[p]]).join('\n\n');
      var trialHeight = measureClauseHtml(cl, i, totalClauses, 'first', trial);
      if (trialHeight <= spaceLeft) {
        prefixParas.push(paragraphs[p]);
        prefixHeight = trialHeight;
        prefixCount = p + 1;
      } else {
        break;
      }
    }

    // Widow protection: don't leave only 1 paragraph for the continuation
    // Unless that's the only way to fit anything
    if (prefixCount > 0 && prefixCount === paragraphs.length - 1) {
      // Only one para left for next page → take it with prefix if it fits combined
      // (i.e., un-split this clause and push it all to next page)
      prefixParas = [];
      prefixCount = 0;
    }

    if (prefixCount > 0) {
      // Place the prefix on current page
      addToCurrentPage({
        clause: cl, idx: i, height: prefixHeight, mode:'first',
        content: prefixParas.join('\n\n')
      });
    }

    // Continuation on next page(s)
    var remaining = paragraphs.slice(prefixCount);
    if (remaining.length > 0) {
      pushNewPage();
      // Render remaining as 'continued' fragment(s). May still need further splits.
      var contParas = [];
      var contHeight = 0;
      var hasTitleBeenShown = (prefixCount > 0); // if prefix shown, continuation uses "(تابع)" title
      var continuationMode = hasTitleBeenShown ? 'continued' : 'full';
      for (var q = 0; q < remaining.length; q++) {
        var trialCont = contParas.concat([remaining[q]]).join('\n\n');
        var trialContHeight = measureClauseHtml(cl, i, totalClauses, continuationMode, trialCont);
        if (trialContHeight > maxBodyHeight && contParas.length > 0) {
          // Flush current and start a new page
          addToCurrentPage({
            clause: cl, idx: i, height: contHeight, mode: continuationMode,
            content: contParas.join('\n\n')
          });
          pushNewPage();
          contParas = [remaining[q]];
          contHeight = measureClauseHtml(cl, i, totalClauses, 'continued', remaining[q]);
          continuationMode = 'continued';
        } else {
          contParas.push(remaining[q]);
          contHeight = trialContHeight;
        }
      }
      if (contParas.length > 0) {
        addToCurrentPage({
          clause: cl, idx: i, height: contHeight, mode: continuationMode,
          content: contParas.join('\n\n')
        });
      }
    }
  });

  // Signature page: try to fit on last body page; otherwise own page
  var sigHtml = Pages._renderSignatureHtml(contract);
  measureEl.innerHTML = sigHtml;
  var sigH = measureEl.firstElementChild ? measureEl.firstElementChild.offsetHeight : 200;
  if (currentHeight + sigH > maxBodyHeight && pages[pages.length-1].length > 0) {
    pages.push([{ type:'signatures' }]);
  } else {
    pages[pages.length-1].push({ type:'signatures' });
  }

  measureEl.remove();
  return pages;
};

Pages._renderContractDoc = function(contract, opts) {
  opts = opts || {};
  var editable = opts.editable !== false; // default true; pass false for template preview
  // coverEditable can be set independently — lets template canvas have draggable cover
  // while clauses remain non-editable (preview-only)
  var coverEditable = opts.coverEditable !== undefined ? opts.coverEditable : editable;
  Pages._migrateContractLayout(contract);
  var vars = contract.variables || {};
  var ds = contract.doc_style || {font_size:14, line_height:1.5, title_size:18, clause_title_size:14};
  var dm = contract.doc_margins || {top:1.0, right:2.0, bottom:1.0, left:2.0};
  var pl = contract.page_layout;
  var hdrH = pl.header.height || 200;
  var ftrH = pl.footer.height || 150;

  // 1. Cover page (no header/footer slots, full content area)
  var coverPageHtml =
    '<div class="doc-page cov-page" style="--hdr-h:0;--ftr-h:0">' +
      '<div class="doc-page-body cov-body">' +
        Pages._renderCoverContent(contract, {preview:false, editable:coverEditable}) +
      '</div>' +
    '</div>';

  // 2. Paginate clause text + signature
  var pages = Pages._paginateContract(contract);
  var totalPages = pages.length; // cover is not counted in page numbering

  // 3. Render each body page with full header/footer (var substitution per page)
  var totalClauses = contract.clauses.filter(function(c){return c.enabled!==false;}).length;
  // Custom gap between header band and body content (px). Default 0 — clause's own
  // 14px padding-top creates the natural rhythm.
  var headerGap = (pl.header && typeof pl.header.bottom_gap === 'number') ? pl.header.bottom_gap : 0;
  var footerGap = (pl.footer && typeof pl.footer.top_gap === 'number') ? pl.footer.top_gap : 0;
  var bodyPagesHtml = pages.map(function(page, idx) {
    var pageNum = idx + 1; // cover not counted; first body page = 1
    var pageStyle = '--hdr-h:'+hdrH+'px;--ftr-h:'+ftrH+'px';
    // doc_margins is in cm (sides). Top/bottom use the user-controllable px gaps.
    var bodyStyle = 'padding:'+headerGap+'px '+dm.right+'cm '+footerGap+'px '+dm.left+'cm;'+
      'font-size:'+(ds.font_size||14)+'pt;line-height:'+(ds.line_height||1.5);
    var bodyContent = page.map(function(item) {
      if (item.type === 'signatures') return Pages._renderSignatureHtml(contract);
      return Pages._renderClauseHtml(item.clause, item.idx, totalClauses, contract, {
        editable: editable,
        fragmentMode: item.mode || 'full',
        contentOverride: item.content
      });
    }).join('');
    // First body page (idx===0) gets the centered document title above clauses
    var firstPageTitle = (idx === 0) ? Pages._renderFirstPageTitle(contract) : '';
    return '<div class="doc-page" style="'+pageStyle+'">' +
      Pages._renderHeaderBand(pl.header, pageNum, totalPages, vars, contract) +
      '<div class="doc-page-body" style="'+bodyStyle+'">' +
        firstPageTitle +
        bodyContent +
      '</div>' +
      Pages._renderFooterBand(pl.footer, pageNum, totalPages, vars, contract) +
    '</div>';
  }).join('');

  return '<div class="contract-doc" id="contract-doc" style="font-size:'+(ds.font_size||14)+'pt;line-height:'+(ds.line_height||1.5)+'">' +
    coverPageHtml +
    bodyPagesHtml +
  '</div>';
};

Pages._applyVars = function(text, vars) {
  if (!vars) return text;
  return text.replace(/\{\{(\w+)\}\}/g, function(match, key) {
    if (key === 'contract_amount_words') {
      var amt = parseFloat(((vars && vars.contract_amount)||'').replace(/,/g,''));
      var words = Pages._numToArabic(amt);
      return words ? '<span class="var-chip" data-vk="contract_amount_words">'+UI.escHtml(words)+'</span>'
                   : '<span class="var-chip empty" data-vk="contract_amount_words">{{contract_amount_words}}</span>';
    }
    if (key === 'duration_full') {
      var dv = (vars.duration_months || '').toString().trim();
      var du = (vars.duration_unit || 'شهر').trim();
      var full = dv ? dv + ' ' + du : '';
      return full ? '<span class="var-chip" data-vk="duration_full">'+UI.escHtml(full)+'</span>'
                  : '<span class="var-chip empty" data-vk="duration_full">{{duration_full}}</span>';
    }
    var val = vars[key];
    if (val && val.trim()) {
      return '<span class="var-chip" data-vk="'+key+'">'+UI.escHtml(val)+'</span>';
    }
    return '<span class="var-chip empty" data-vk="'+key+'">'+match+'</span>';
  });
};

/* ─── Arabic number-to-words (تفقيط) ─── */
Pages._numToArabic = function(n) {
  n = Math.round(parseFloat(n) || 0);
  if (!n || n < 0) return '';
  var ones = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة',
    'عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر',
    'ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  var tens  = ['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  var huns  = ['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
  function c(x) {
    if (x===0) return '';
    if (x<20) return ones[x];
    if (x<100) { var u=ones[x%10]; return u ? u+' و'+tens[Math.floor(x/10)] : tens[Math.floor(x/10)]; }
    if (x<1000) { var h=huns[Math.floor(x/100)]; var r=c(x%100); return r ? h+' و'+r : h; }
    if (x<1000000) {
      var k=Math.floor(x/1000); var r=c(x%1000);
      var kw=k===1?'ألف':k===2?'ألفان':k<=10?c(k)+' آلاف':c(k)+' ألفاً';
      return r ? kw+' و'+r : kw;
    }
    var m=Math.floor(x/1000000); var r=c(x%1000000);
    var mw=m===1?'مليون':m===2?'مليونان':m<=10?c(m)+' ملايين':c(m)+' مليوناً';
    return r ? mw+' و'+r : mw;
  }
  return c(n);
};

Pages._applyVarsPlain = function(text, vars) {
  if (!vars) return text;
  return text.replace(/\{\{(\w+)\}\}/g, function(match, key) {
    if (key === 'contract_amount_words') {
      var amt = parseFloat((vars.contract_amount||'').replace(/,/g,''));
      var words = Pages._numToArabic(amt);
      return words || '';
    }
    if (key === 'duration_full') {
      var dv = (vars.duration_months || '').toString().trim();
      var du = (vars.duration_unit || 'شهر').trim();
      return dv ? dv + ' ' + du : '';
    }
    var val = vars[key];
    return (val && String(val).trim()) ? String(val) : '';
  });
};

Pages.updateContractVar = function(projId, contractId, key, value) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  if (!c.variables) c.variables = {};
  c.variables[key] = value;
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  // Refresh cover: free-form cover needs full re-render; old style uses inline DOM update
  if (c.cover && Array.isArray(c.cover.elements)) {
    Pages._refreshCoverPage(projId, contractId);
  }
  // Always update signature blocks (party names/titles at bottom of doc)
  Pages._refreshContractCover(c);
  // If this variable is used in a header/footer overlay, re-render bands across all pages
  if (Pages._maybeRefreshBands(c, key)) return;
  // Live-update all variable chips in the WYSIWYG clause bodies
  var val = String(value||'').trim();
  var docEl = document.getElementById('contract-doc');
  if (docEl) {
    docEl.querySelectorAll('[data-vk="'+key+'"]').forEach(function(chip) {
      chip.textContent = val || '{{'+key+'}}';
      chip.className = 'var-chip' + (val ? '' : ' empty');
    });
    // Auto-update amount-words chips when amount changes
    if (key === 'contract_amount') {
      var words = Pages._numToArabic(parseFloat((value||'').replace(/,/g,'')));
      docEl.querySelectorAll('[data-vk="contract_amount_words"]').forEach(function(chip) {
        chip.textContent = words || '{{contract_amount_words}}';
        chip.className = 'var-chip' + (words ? '' : ' empty');
      });
    }
  }

/* Full re-render of the contract canvas — used after structural changes
   (page layout, margins, header/footer overlay). Re-paginates from scratch. */
Pages._refreshContractCanvas = function(contract) {
  var docEl = document.getElementById('contract-doc');
  if (!docEl || !docEl.parentNode) return;
  var newHtml = Pages._renderContractDoc(contract);
  var tmp = document.createElement('div');
  tmp.innerHTML = newHtml;
  var newDoc = tmp.firstChild;
  docEl.parentNode.replaceChild(newDoc, docEl);
  if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: newDoc});
  Pages._scaleDocPages();
};

/* Scale .doc-page elements to fit the canvas width on narrow screens.
   Each page keeps its 794px internal width (correct for printing) but is
   visually shrunk with transform:scale so it fits the viewport. */
Pages._scaleDocPages = function() {
  var canvas = document.querySelector('.contract-canvas-area');
  if (!canvas) return;
  var doc = canvas.querySelector('.contract-doc');
  if (!doc) return;
  var available = canvas.clientWidth - 8;
  if (available >= 800) {
    doc.style.zoom = '';
    return;
  }
  // zoom changes layout dimensions (unlike transform:scale) — works in Safari/Chrome/Firefox 126+
  doc.style.zoom = (available / 794).toFixed(4);
};

Pages.moveClause = function(projId, contractId, clauseIdx, dir) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  var enabledClauses = c.clauses.filter(function(x){return x.enabled!==false;});
  var newIdx = dir==='up' ? clauseIdx-1 : clauseIdx+1;
  if (newIdx<0||newIdx>=enabledClauses.length) return;
  var realIdx = c.clauses.indexOf(enabledClauses[clauseIdx]);
  var realNewIdx = c.clauses.indexOf(enabledClauses[newIdx]);
  if (realIdx<0||realNewIdx<0) return;
  var tmp = c.clauses[realIdx]; c.clauses[realIdx]=c.clauses[realNewIdx]; c.clauses[realNewIdx]=tmp;
  var ordI = 0;
  c.clauses.forEach(function(cl) {
    if (cl.enabled!==false) {
      var base = cl.title.replace(/^المادة\s+\S+\s*:\s*/,'');
      cl.title = 'المادة '+(CONTRACT_ORDINALS[ordI]||(ordI+1).toString())+': '+base;
      ordI++;
    }
  });
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  Pages.render_contract({projId:projId, contractId:contractId});
};

Pages.addClauseFromLib = function(projId, contractId, clauseKey) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  var libClause = null;
  for (var tKey in CONTRACT_TEMPLATES) {
    var tpl = CONTRACT_TEMPLATES[tKey];
    var found = tpl.clauses.find(function(cl){return cl.key===clauseKey;});
    if (found) { libClause = found; break; }
  }
  var libItem = CLAUSE_LIBRARY.find(function(x){return x.key===clauseKey;});
  if (!libClause) {
    libClause = {key:clauseKey, baseTitle: libItem ? libItem.title : clauseKey, content:''};
  }
  var enabledCount = c.clauses.filter(function(x){return x.enabled!==false;}).length;
  var newClause = {
    id: DB.uid(),
    key: clauseKey,
    title: 'المادة '+(CONTRACT_ORDINALS[enabledCount]||(enabledCount+1).toString())+': '+(libClause.baseTitle||libItem&&libItem.title||clauseKey),
    content: libClause.content||'',
    enabled: true
  };
  c.clauses.push(newClause);
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  // New clause needs pagination — re-render the canvas
  Pages._refreshContractCanvas(c);
};

Pages.saveClauseContent = function(projId, contractId, clauseIdx, el) {
  if (Pages._contractPreview) return; // don't save preview content
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  var enabledClauses = c.clauses.filter(function(x){return x.enabled!==false;});
  var cl = enabledClauses[clauseIdx];
  if (!cl) return;
  // Reassemble content from ALL fragments of this clause across pages
  var fragments = document.querySelectorAll('.clause-body[data-clause-idx="'+clauseIdx+'"]');
  if (fragments.length > 1) {
    var parts = [];
    fragments.forEach(function(f) { parts.push(f.innerText || f.textContent || ''); });
    cl.content = parts.join('\n\n').replace(/\n{3,}/g, '\n\n').trim();
  } else {
    cl.content = el.innerText || el.textContent || '';
  }
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  // Re-paginate after a brief delay (let the blur complete first)
  if (fragments.length > 1) {
    setTimeout(function(){ Pages._refreshContractCanvas(c); }, 50);
  }
};

/* ─── Cover drag & drop ─── */

Pages._coverDragState = null;

Pages._startCoverElDrag = function(event, elId) {
  event.preventDefault();
  event.stopPropagation();
  var el = event.currentTarget;
  var covPage = el.closest('.cov-page');
  if (!covPage) return;
  var pageRect = covPage.getBoundingClientRect();
  var initPtrX = (event.clientX - pageRect.left) / pageRect.width * 100;
  var initPtrY = (event.clientY - pageRect.top) / pageRect.height * 100;
  Pages._coverDragState = {
    elId: elId, elEl: el, pageRect: pageRect,
    initPtrX: initPtrX, initPtrY: initPtrY,
    initElX: parseFloat(el.getAttribute('data-el-x')) || 50,
    initElY: parseFloat(el.getAttribute('data-el-y')) || 10,
    _newX: undefined, _newY: undefined
  };
  el.setPointerCapture(event.pointerId);
  el.classList.add('cov-el-dragging');
};

Pages._coverElDragMove = function(event) {
  var ds = Pages._coverDragState;
  if (!ds || !event.buttons) return;
  var pr = ds.pageRect;
  var curX = (event.clientX - pr.left) / pr.width * 100;
  var curY = (event.clientY - pr.top) / pr.height * 100;
  var newX = Math.max(0, Math.min(100, ds.initElX + (curX - ds.initPtrX)));
  var newY = Math.max(0, Math.min(97, ds.initElY + (curY - ds.initPtrY)));
  var w = parseFloat(ds.elEl.style.width) || 80;
  ds.elEl.style.left = (newX - w / 2).toFixed(2) + '%';
  ds.elEl.style.top = newY.toFixed(2) + '%';
  ds.elEl.setAttribute('data-el-x', newX.toFixed(1));
  ds.elEl.setAttribute('data-el-y', newY.toFixed(1));
  ds._newX = newX;
  ds._newY = newY;
};

Pages._coverElDragEnd = function(event) {
  var ds = Pages._coverDragState;
  if (!ds) return;
  Pages._coverDragState = null;
  ds.elEl.classList.remove('cov-el-dragging');
  if (ds._newX === undefined) return;
  var x = Math.round(ds._newX * 10) / 10;
  var y = Math.round(ds._newY * 10) / 10;
  // Update position inputs live
  var xInp = document.getElementById('pos-x-' + ds.elId);
  var yInp = document.getElementById('pos-y-' + ds.elId);
  if (xInp) xInp.value = x;
  if (yInp) yInp.value = y;
  // Save (position-only, no canvas refresh needed)
  var tplEdEl = document.getElementById('pg-template-editor');
  if (tplEdEl && tplEdEl.offsetParent !== null && Pages._tplEditorId) {
    Pages.updateTplCoverElPos(Pages._tplEditorId, ds.elId, x, y);
  } else if (Pages._contractProjId && Pages._contractId) {
    Pages.updateContractCoverElPos(Pages._contractProjId, Pages._contractId, ds.elId, x, y);
  }
};

/* Click on a logo/image placeholder or image in the canvas to open file picker inline */
Pages._clickCoverElUpload = function(elId) {
  var inpId = 'cov-inline-up-' + elId.replace(/[^a-zA-Z0-9]/g,'_');
  var inp = document.getElementById(inpId);
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.id = inpId; inp.style.display = 'none';
    inp.addEventListener('change', function() {
      var file = inp.files && inp.files[0];
      if (!file) { document.body.removeChild(inp); return; }
      var reader = new FileReader();
      reader.onload = function(e) {
        var src = e.target.result;
        var tplEdEl = document.getElementById('pg-template-editor');
        if (tplEdEl && tplEdEl.offsetParent !== null && Pages._tplEditorId) {
          Pages.updateTplCoverEl(Pages._tplEditorId, elId, 'src', src);
        } else if (Pages._contractProjId && Pages._contractId) {
          Pages.updateContractCoverEl(Pages._contractProjId, Pages._contractId, elId, 'src', src);
        }
        try { document.body.removeChild(inp); } catch(e) {}
      };
      reader.readAsDataURL(file);
    });
    document.body.appendChild(inp);
  }
  inp.click();
};

Pages.handleHeaderImageUpload = function(projId, contractId, input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    Pages.updatePageLayout(projId, contractId, 'header', 'image', e.target.result);
    Pages.render_contract({projId:projId, contractId:contractId});
  };
  reader.readAsDataURL(file);
};

Pages.handleFooterImageUpload = function(projId, contractId, input) {

/* Update updateContractVar to also re-render headers/footers when vars used there change */
Pages._maybeRefreshBands = function(c, key) {
  // If any header/footer overlay text references this key, re-render bands
  var pl = c.page_layout;
  if (!pl) return false;
  var token = '{{' + key + '}}';
  function used(band) {
    return (band.overlay || []).some(function(s) { return (s.text||'').indexOf(token) >= 0; });
  }
  if (used(pl.header) || used(pl.footer)) {
    Pages._refreshContractCanvas(c);
    return true;
  }
  return false;
};

Pages.updateDocStyle = function(projId, contractId, key, value) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  if (!c.doc_style) c.doc_style = {font_size:14, line_height:1.5, title_size:18, clause_title_size:14, subtitle_size:12};
  c.doc_style[key] = value;
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  var docEl = document.getElementById('contract-doc');
  if (docEl) {
    var ds2 = c.doc_style;
    docEl.style.fontSize = (ds2.font_size||14)+'pt';
    docEl.style.lineHeight = (ds2.line_height||1.5).toString();
    var covTitle = docEl.querySelector('.cov-title');
    if (covTitle) covTitle.style.fontSize = (ds2.title_size||18)+'pt';
    docEl.querySelectorAll('.clause-title').forEach(function(el){
      el.style.fontSize = (ds2.clause_title_size||14)+'pt';
    });
    // Force font-size + line-height on .clause-body so the slider takes effect
    // (CSS no longer hard-codes these on .clause-body — inheritance works,
    //  but inline styles guarantee live updates without re-render)
    docEl.querySelectorAll('.clause-body').forEach(function(el){
      el.style.fontSize = (ds2.font_size||14)+'pt';
      el.style.lineHeight = (ds2.line_height||1.5).toString();
    });
  }
};

Pages.updateDocMargins = function(projId, contractId, key, value) {

  var c = contracts.find(function(x){return x.id===contractId;});

  if (!c.doc_margins) c.doc_margins = {top:1.0, right:2.0, bottom:1.0, left:2.0};
  c.doc_margins[key] = parseFloat(value)||1.0;

};

Pages.updatePageLayout = function(projId, contractId, section, key, value) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  if (!c.page_layout) c.page_layout = {header:{show:true,overlay:[]},footer:{show:true,overlay:[]}};
  if (!c.page_layout[section]) c.page_layout[section] = {overlay:[]};
  c.page_layout[section][key] = value;
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  Pages._refreshContractCanvas(c);
};

/* Copy specifications text to clipboard for sending to designer */
Pages.copyBandSpecs = function(section, currentH) {
  var label = section === 'header' ? 'الهيدر (رأس الصفحة)' : 'الفوتر (تذييل الصفحة)';
  var pxW = 794, hMm = Math.round(currentH * 25.4 / 96);
  var rec2xW = pxW * 2, rec2xH = currentH * 2;
  var rec3xW = pxW * 3, rec3xH = currentH * 3;
  var text =
    '═══ قياسات تصميم ' + label + ' ═══\n\n' +
    'الأبعاد المطلوبة (في صفحة A4):\n' +
    '• العرض: ' + pxW + ' بكسل (210 مم)\n' +
    '• الارتفاع: ' + currentH + ' بكسل (' + hMm + ' مم)\n\n' +
    'أبعاد ملف التصميم:\n' +
    '• الموصى به (2× Retina): ' + rec2xW + ' × ' + rec2xH + ' بكسل\n' +
    '• الأمثل (3× طباعة): ' + rec3xW + ' × ' + rec3xH + ' بكسل\n\n' +
    'المواصفات التقنية:\n' +
    '• الدقة: 300 DPI للطباعة / 96 DPI للويب\n' +
    '• التنسيق: PNG أو JPG\n' +
    '• نظام الألوان: RGB / CMYK للطباعة\n' +
    '• المنطقة الآمنة: ترك 30 بكسل من الحواف\n' +
    '• الخلفية: الصورة ستملأ كامل عرض الصفحة (cover)\n\n' +
    'ملاحظات مهمة:\n' +
    '— تجنب وضع نصوص متغيرة (تاريخ، رقم، ترقيم) في الصورة\n' +
    '— هذه النصوص تُضاف برمجياً فوق الصورة عبر النظام\n';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){
      UI.toast('تم نسخ القياسات للحافظة');
    }, function(){
      UI.toast('فشل النسخ', 'warn');
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    UI.toast('تم نسخ القياسات للحافظة');
  }
};

/* Open a modal listing available variables — clicking one inserts the token
   into the targeted overlay text input. */
Pages.openVarPicker = function(projId, contractId, section, slotIdx, inputId) {
  var groups = { auto:'تلقائية', company:'بيانات الجهة', contract:'بيانات العقد', party:'الأطراف' };
  var byGroup = { auto:[], company:[], contract:[], party:[] };
  Pages._OVERLAY_VARS.forEach(function(v){ byGroup[v.group].push(v); });
  function rowHtml(v) {
    var safeToken = v.token.replace(/'/g, "\\'");
    return '<button class="var-pick-row" onclick="Pages._insertVarToken(\''+inputId+'\',\''+safeToken+'\',\''+projId+'\',\''+contractId+'\',\''+section+'\','+slotIdx+')" '+
      'style="display:flex;justify-content:space-between;width:100%;padding:8px 12px;border:none;background:transparent;cursor:pointer;text-align:right;font-family:inherit;border-bottom:1px solid var(--border);transition:background 120ms">' +
      '<span style="color:var(--fg-1);font-size:13px">'+UI.escHtml(v.label)+'</span>' +
      '<code style="background:var(--neutral-100);padding:2px 6px;border-radius:3px;font-size:11px;color:var(--iris-600)">'+UI.escHtml(v.token)+'</code>' +
    '</button>';
  }
  var html =
    '<div style="padding:16px 0;max-width:480px">' +
      '<h2 style="margin:0 16px 4px;font-size:15px;color:var(--fg-1)">اختر متغيراً لإدراجه</h2>' +
      '<div style="font-size:11px;color:var(--fg-3);margin:0 16px 12px">سيُستبدل المتغير بقيمته الفعلية عند الطباعة</div>' +
      Object.keys(byGroup).map(function(g) {
        if (!byGroup[g].length) return '';
        return '<div style="margin-bottom:8px">' +
          '<div style="font-size:11px;font-weight:600;color:var(--fg-3);padding:6px 16px;background:var(--bg-elevated);letter-spacing:.3px">'+groups[g]+'</div>' +
          byGroup[g].map(rowHtml).join('') +
        '</div>';
      }).join('') +
      '<div style="padding:12px 16px;text-align:end;border-top:1px solid var(--border)">' +
        '<button class="btn" onclick="UI.closeModalForce()">إلغاء</button>' +
      '</div>' +
    '</div>' +
    '<style>.var-pick-row:hover{background:var(--iris-50)!important}</style>';
  UI.openModal(html);
  if (typeof lucide !== 'undefined') setTimeout(function(){ lucide.createIcons(); }, 50);
};

Pages._insertVarToken = function(inputId, token, projId, contractId, section, slotIdx) {
  var inp = document.getElementById(inputId);
  if (inp) {
    // Insert at cursor position, or append
    var start = (typeof inp.selectionStart === 'number') ? inp.selectionStart : inp.value.length;
    var end = (typeof inp.selectionEnd === 'number') ? inp.selectionEnd : inp.value.length;
    var newVal = inp.value.slice(0, start) + token + inp.value.slice(end);
    inp.value = newVal;
    if (projId === '__tpl__') {
      Pages.updateTplOverlay(contractId, section, slotIdx, 'text', newVal);
    } else {
      Pages.updateOverlay(projId, contractId, section, slotIdx, 'text', newVal);
    }
  }
  UI.closeModalForce();
};

Pages._getCustomVars = function(ctx, id, clauseId) {
  var obj;
  if (ctx === 'tpl') {
    obj = DB.getCustomTemplates().find(function(x){return x.id===id;});
  } else {
    obj = DB.getContracts(Pages._customVarProjId).find(function(x){return x.id===id;});
  }
  return (obj && obj.custom_vars) || [];
};

/* Build an ASCII token key from an arbitrary label. Falls back to a unique id. */
Pages._slugifyVarKey = function(label) {
  var slug = String(label||'').toLowerCase().trim()
    .replace(/[^a-z0-9_\s-]/g, '')      // drop non-ASCII (incl. Arabic)
    .replace(/[\s-]+/g, '_')
    .replace(/^_+|_+$/g, '');
  if (!slug) slug = 'var_' + Date.now().toString(36).slice(-5);
  return 'c_' + slug;                    // c_ prefix marks custom vars
};

/* Live-filter the variable list by label or token. */
Pages._filterClauseVars = function(q) {
  q = (q||'').trim().toLowerCase();
  var list = document.getElementById('clause-var-list');
  if (!list) return;
  list.querySelectorAll('.var-pick-row').forEach(function(row) {
    var label = (row.getAttribute('data-label')||'').toLowerCase();
    var code = (row.querySelector('code') ? row.querySelector('code').textContent : '').toLowerCase();
    row.style.display = (!q || label.indexOf(q)>=0 || code.indexOf(q)>=0) ? '' : 'none';
  });
  // Hide group headers with no visible rows
  list.querySelectorAll('.var-pick-group').forEach(function(grp) {
    var anyVisible = Array.prototype.some.call(grp.querySelectorAll('.var-pick-row'), function(r){ return r.style.display !== 'none'; });
    grp.style.display = anyVisible ? '' : 'none';
  });
};

/* Insert a token into the target clause textarea at the caret and persist. */
Pages._insertClauseVar = function(ctx, id, clauseId, taId, token) {
  var ta = document.getElementById(taId);
  if (ta) {
    var start = (typeof ta.selectionStart === 'number') ? ta.selectionStart : ta.value.length;
    var end = (typeof ta.selectionEnd === 'number') ? ta.selectionEnd : ta.value.length;
    var newVal = ta.value.slice(0, start) + token + ta.value.slice(end);
    ta.value = newVal;
    if (ctx === 'tpl') {
      Pages.updateTplClauseContent(id, clauseId, newVal);
    } else {
      Pages.updateContractClauseContentVal(Pages._customVarProjId, id, clauseId, newVal);
    }
    UI.closeModalForce();
    setTimeout(function(){
      var ta2 = document.getElementById(taId);
      if (ta2) { ta2.focus(); var pos = start + token.length; try { ta2.setSelectionRange(pos, pos); } catch(e){} }
    }, 30);
    return;
  }
  UI.closeModalForce();
};

/* Create a new custom variable (registered on the template/contract) and insert it. */
Pages._addCustomVarAndInsert = function(ctx, id, clauseId, taId) {
  var inp = document.getElementById('clause-var-new');
  var label = inp ? inp.value.trim() : '';
  if (!label) { if (inp) inp.focus(); return; }
  var key = Pages._slugifyVarKey(label);
  var obj;
  if (ctx === 'tpl') {
    obj = DB.getCustomTemplates().find(function(x){return x.id===id;});
  } else {
    obj = DB.getContracts(Pages._customVarProjId).find(function(x){return x.id===id;});
  }
  if (!obj) { UI.closeModalForce(); return; }
  if (!obj.custom_vars) obj.custom_vars = [];
  // Dedupe: reuse existing key if same label already defined
  var existing = obj.custom_vars.find(function(c){ return c.label === label; });
  if (existing) { key = existing.key; }
  else {
    // Ensure key uniqueness
    var base = key, n = 2;
    while (obj.custom_vars.some(function(c){ return c.key === key; })) { key = base + '_' + n; n++; }
    obj.custom_vars.push({ key:key, label:label });
  }
  obj.updated = (new Date()).toISOString().slice(0,10);
  if (ctx === 'tpl') {
    DB.saveCustomTemplate(obj);
  } else {
    // Seed the value so it appears in the variables panel
    if (!obj.variables) obj.variables = {};
    if (!(key in obj.variables)) obj.variables[key] = '';
    DB.saveContract(Pages._customVarProjId, obj);
  }
  Pages._insertClauseVar(ctx, id, clauseId, taId, '{{'+key+'}}');
};

Pages.saveContractNow = function(silent) {
  if (!Pages._contractProjId || !Pages._contractId) return;
  var contracts = DB.getContracts(Pages._contractProjId);
  var c = contracts.find(function(x){return x.id===Pages._contractId;});
  if (!c) return;
  var enabledClauses = c.clauses.filter(function(x){return x.enabled!==false;});
  // Group fragments by clauseIdx and reassemble multi-page splits
  var fragmentsByIdx = {};
  document.querySelectorAll('.clause-body[data-clause-idx]').forEach(function(el) {
    var idx = parseInt(el.getAttribute('data-clause-idx'), 10);
    if (!fragmentsByIdx[idx]) fragmentsByIdx[idx] = [];
    fragmentsByIdx[idx].push(el.innerText || el.textContent || '');
  });
  Object.keys(fragmentsByIdx).forEach(function(idxStr) {
    var idx = parseInt(idxStr, 10);
    var cl = enabledClauses[idx];
    if (!cl) return;
    var parts = fragmentsByIdx[idx];
    cl.content = (parts.length > 1)
      ? parts.join('\n\n').replace(/\n{3,}/g, '\n\n').trim()
      : parts[0];
  });
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(Pages._contractProjId, c);
  if (!silent && UI.toast) UI.toast('تم الحفظ');
};

      id: DB.uid(),

Pages.updateTemplateName = function(id, val) {

Pages.updateTemplateField = function(id, field, val) {

};

Pages.updateTplField = function(id, field, val) {
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===id;});
  if (!tpl) return;
  if (field==='company_name'||field==='logo'||field==='frame_style') {

Pages._insertVarToClipboard = function(text) {

    navigator.clipboard.writeText(text).then(function(){
      if (UI.toast) UI.toast('تم نسخ ' + text);
    });
  }
};

Pages.moveTplClause = function(id, idx, dir) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  var enabled = t.clauses.filter(function(c){return c.enabled!==false;});
  var newIdx = dir==='up' ? idx-1 : idx+1;
  if (newIdx<0||newIdx>=enabled.length) return;
  var ri = t.clauses.indexOf(enabled[idx]);
  var rni = t.clauses.indexOf(enabled[newIdx]);
  var tmp = t.clauses[ri]; t.clauses[ri]=t.clauses[rni]; t.clauses[rni]=tmp;
  var oi = 0;
  t.clauses.forEach(function(cl){
    if (cl.enabled!==false) {
      var base = cl.title.replace(/^المادة\s+\S+\s*:\s*/,'');
      cl.title = 'المادة '+(CONTRACT_ORDINALS[oi]||(oi+1).toString())+': '+base;
      oi++;
    }
  });
  t.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(t);
  Pages.render_template_editor({templateId: id});
};

Pages.deleteTplClause = function(tplId, clauseId) {
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===tplId;});
  if (!tpl) return;
  var cl = tpl.clauses.find(function(c){return c.id===clauseId;});
  if (!cl) return;
  cl.enabled = false;
  tpl.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(tpl);
  Pages.render_template_editor({templateId: tplId});
};

Pages.saveTplClause = function(id, idx, el) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  var enabled = t.clauses.filter(function(c){return c.enabled!==false;});
  if (enabled[idx]) enabled[idx].content = el.innerText||el.textContent||'';
  t.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(t);
};

Pages.addClauseToTemplate = function(id, clauseKey) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  var enabledCount = t.clauses.filter(function(c){return c.enabled!==false;}).length;
  var libItem = CLAUSE_LIBRARY.find(function(x){return x.key===clauseKey;});
  var baseTitle = libItem ? libItem.title : clauseKey;
  var content = '';
  for (var tKey in CONTRACT_TEMPLATES) {
    var found = CONTRACT_TEMPLATES[tKey].clauses.find(function(c){return c.key===clauseKey;});
    if (found) { content = found.content; break; }
  }
  t.clauses.push({
    id: DB.uid(), key: clauseKey,
    title: 'المادة '+(CONTRACT_ORDINALS[enabledCount]||(enabledCount+1).toString())+': '+baseTitle,
    content: content, enabled: true
  });
  DB.saveCustomTemplate(t);
  Pages.render_template_editor({templateId: id});
};

Pages.saveTemplateFinal = function(id) {
  // Flush any pending textarea/input changes by triggering blur on active element
  if (document.activeElement && document.activeElement !== document.body) {
    document.activeElement.blur();
  }
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===id;});
  if (tpl) {
    tpl.updated = (new Date()).toISOString().slice(0,10);
    DB.saveCustomTemplate(tpl);
  }
  if (UI.toast) UI.toast('تم حفظ النموذج', 'success');
};

Pages.toggleTplMobilePanel = function(panel) {
  var leftSidebar  = document.querySelector('#pg-template-editor .contract-sidebar-left');
  var rightSidebar = document.querySelector('#pg-template-editor .contract-sidebar-right');
  var isLeftOpen   = leftSidebar && leftSidebar.classList.contains('mob-open');
  var isRightOpen  = rightSidebar && rightSidebar.classList.contains('mob-open');
  if (leftSidebar) leftSidebar.classList.remove('mob-open');
  if (rightSidebar) rightSidebar.classList.remove('mob-open');
  if (panel==='clauses' && !isLeftOpen && leftSidebar) leftSidebar.classList.add('mob-open');
  if (panel==='settings' && !isRightOpen && rightSidebar) rightSidebar.classList.add('mob-open');
};

/* ─── Template right-sidebar tab switch ─── */
Pages.switchTplTab = function(tab) {
  var cp = document.getElementById('tpl-tab-cls-panel');
  var sp = document.getElementById('tpl-tab-sets-panel');
  var cb = document.getElementById('tpl-tab-cls-btn');
  var sb = document.getElementById('tpl-tab-sets-btn');
  if (!cp) return;
  [cp, sp].forEach(function(el){ if (el) el.style.display = 'none'; });
  [cb, sb].forEach(function(el){ if (el) el.classList.remove('active'); });
  if (tab === 'clauses') {
    if (cp) cp.style.display = '';
    if (cb) cb.classList.add('active');
  } else {
    if (sp) sp.style.display = '';
    if (sb) sb.classList.add('active');
  }
};

Pages.updateTplCoverBg = function(tplId, key, value) {
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===tplId;});
  if (!tpl) return;
  if (!tpl.cover) tpl.cover = {};
  tpl.cover[key] = value;
  tpl.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(tpl);
  Pages._refreshTplCoverPage(tplId);
};

Pages.addTplCoverEl = function(tplId, type) {
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===tplId;});
  if (!tpl || !tpl.cover || !tpl.cover.elements) return;
  var defaults = { logo:{src:''}, logo_a:{src:''}, logo_b:{src:''}, text:{text:'نص جديد',font_size:14,font_weight:'400',color:'#1F2937'}, parties:{show_a:true,show_b:true}, divider:{color:'#D1D5DB',thickness:1}, image:{src:''} };
  tpl.cover.elements.push({ id:DB.uid(), type:type, x:50, y:50, w:70, align:'center', props:defaults[type]||{} });
  tpl.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(tpl);
  Pages.render_template_editor({templateId:tplId});
};

Pages.deleteTplCoverEl = function(tplId, elId) {
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===tplId;});
  if (!tpl || !tpl.cover || !tpl.cover.elements) return;
  tpl.cover.elements = tpl.cover.elements.filter(function(e){return e.id!==elId;});
  tpl.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(tpl);
  Pages.render_template_editor({templateId:tplId});
};

Pages.updateTplCoverEl = function(tplId, elId, key, value) {
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===tplId;});
  if (!tpl || !tpl.cover || !tpl.cover.elements) return;
  var el = tpl.cover.elements.find(function(e){return e.id===elId;});
  if (!el) return;
  if (key==='x'||key==='y'||key==='w'||key==='align') { el[key]=value; }
  else { if (!el.props) el.props={}; el.props[key]=value; }
  tpl.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(tpl);
  Pages._refreshTplCoverPage(tplId);
};

Pages.updateTplCoverElPos = function(tplId, elId, x, y) {
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===tplId;});
  if (!tpl || !tpl.cover || !tpl.cover.elements) return;
  var el = tpl.cover.elements.find(function(e){return e.id===elId;});
  if (!el) return;
  el.x = x; el.y = y;
  tpl.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(tpl);
};

Pages._refreshTplCoverPage = function(tplId) {
  var tpl = DB.getCustomTemplates().find(function(x){return x.id===tplId;});
  if (!tpl) return;
  var fakeC = Pages._templateToPreviewContract(tpl);
  var covBody = document.querySelector('#tpl-canvas-area .cov-page .cov-body');
  if (!covBody) return;
  covBody.innerHTML = Pages._renderCoverContent(fakeC, {editable:true});
  if (typeof lucide !== 'undefined') lucide.createIcons({rootElement:covBody});
};

Pages._doSaveContractAsTemplate = function(projId, contractId) {
  var nameInp = document.getElementById('save-tpl-name-inp');
  var name = nameInp ? (nameInp.value||'').trim() : '';
  if (!name) { UI.toast('أدخل اسماً للنموذج','danger'); return; }
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  var today = (new Date()).toISOString().slice(0,10);
  var tpl = {
    id: DB.uid(),
    name: name,
    template_type: c.template_type || 'blank',
    created: today, updated: today,
    clauses: JSON.parse(JSON.stringify(c.clauses||[])),
    cover: JSON.parse(JSON.stringify(c.cover||{frame_style:'modern'})),
    footer_label: c.footer_label || 'سري',
    doc_style: JSON.parse(JSON.stringify(c.doc_style||{})),
    doc_margins: JSON.parse(JSON.stringify(c.doc_margins||{})),
    page_layout: JSON.parse(JSON.stringify(c.page_layout||{})),
    custom_vars: JSON.parse(JSON.stringify(c.custom_vars||[]))
  };
  // Clear company_name from cover (client-specific); images/layout are retained
  if (tpl.cover) tpl.cover.company_name = '';
  DB.saveCustomTemplate(tpl);
  UI.closeModalForce();
  UI.toast('تم الحفظ: ' + name, 'success');
};

Pages.exportData = function() {
  var data = {};
  for (var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if (k&&k.startsWith('buad2_')) data[k]=localStorage.getItem(k);
  }
  var blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download='buad_backup.json'; a.click();
  URL.revokeObjectURL(url);
  UI.toast('تم التصدير','success');
};

Pages.importData = function(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var data = JSON.parse(e.target.result);
      Object.keys(data).forEach(function(k){ localStorage.setItem(k,data[k]); });
      UI.toast('تم الاستيراد','success');
      Nav.go('dash');
    } catch(err){ UI.toast('خطأ في استيراد البيانات','danger'); }
  };
  reader.readAsText(file);
};

Pages.clearData = function() {
  if (!confirm('هل تريد حذف كل البيانات؟ لا يمكن التراجع عن هذا الإجراء.')) return;
  var keys=[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('buad2_'))keys.push(k);}
  keys.forEach(function(k){localStorage.removeItem(k);});
  UI.toast('تم مسح البيانات');
  Nav.go('dash');
};
