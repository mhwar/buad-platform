Pages._applyVars = function(text, vars) {
  if (!vars) return text;
  return text.replace(/\{\{(\w+)\}\}/g, function(match, key) {
    var val = vars[key];
    if (val && val.trim()) {
      return '<span class="var-chip">'+UI.escHtml(val)+'</span>';
    }
    return '<span class="var-chip empty">'+match+'</span>';
  });
};

Pages._applyVarsPlain = function(text, vars) {
  if (!vars) return text;
  return text.replace(/\{\{(\w+)\}\}/g, function(match, key) {
    var val = vars[key];
    return (val && String(val).trim()) ? String(val) : '';
  });
};

Pages.moveClause = function(projId, contractId, clauseIdx, dir) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  var enabledClauses = c.clauses.filter(function(x){return x.enabled!==false;});
  var newIdx = dir==='up' ? clauseIdx-1 : clauseIdx+1;
  if (newIdx<0||newIdx>=enabledClauses.length) return;
  var realIdx = c.clauses.indexOf(enabledClauses[clauseIdx]);
  var realNewIdx = c.clauses.indexOf(enabledClauses[newIdx]);
  if (realIdx<0||realNewIdx<0) return;
  var tmp = c.clauses[realIdx]; c.clauses[realIdx]=c.clauses[realNewIdx]; c.clauses[realNewIdx]=tmp;
  var ordI = 0;
  c.clauses.forEach(function(cl) {
    if (cl.enabled!==false) {
      var base = cl.title.replace(/^المادة\s+\S+\s*:\s*/,'');
      cl.title = 'المادة '+(CONTRACT_ORDINALS[ordI]||(ordI+1).toString())+': '+base;
      ordI++;
    }
  });
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  Pages.render_contract({projId:projId, contractId:contractId});
};

Pages.deleteClause = function(projId, contractId, clauseIdx) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  var enabledClauses = c.clauses.filter(function(x){return x.enabled!==false;});
  var cl = enabledClauses[clauseIdx];
  if (!cl) return;
  cl.enabled = false;
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  var el = document.getElementById('clause-'+cl.id);
  if (el) el.remove();
};

Pages.addClauseFromLib = function(projId, contractId, clauseKey) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  var libClause = null;
  for (var tKey in CONTRACT_TEMPLATES) {
    var tpl = CONTRACT_TEMPLATES[tKey];
    var found = tpl.clauses.find(function(cl){return cl.key===clauseKey;});
    if (found) { libClause = found; break; }
  }
  var libItem = CLAUSE_LIBRARY.find(function(x){return x.key===clauseKey;});
  if (!libClause) {
    libClause = {key:clauseKey, baseTitle: libItem ? libItem.title : clauseKey, content:''};
  }
  var enabledCount = c.clauses.filter(function(x){return x.enabled!==false;}).length;
  var newClause = {
    id: DB.uid(),
    key: clauseKey,
    title: 'المادة '+(CONTRACT_ORDINALS[enabledCount]||(enabledCount+1).toString())+': '+(libClause.baseTitle||libItem&&libItem.title||clauseKey),
    content: libClause.content||'',
    enabled: true
  };
  c.clauses.push(newClause);
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  var clausesBody = document.getElementById('contract-clauses-body');
  if (clausesBody) {
    var div = document.createElement('div');
    div.innerHTML = Pages._renderSingleClause(newClause, enabledCount, enabledCount);
    clausesBody.appendChild(div.firstChild);
    if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: clausesBody.lastElementChild});
  }
};

Pages._renderSingleClause = function(cl, idx, total) {
  return '<div class="clause-block" id="clause-'+cl.id+'">' +
    '<div class="clause-controls">' +
      (idx>0 ? '<button class="clause-ctrl-btn" onclick="Pages.moveClause(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+',\'up\')" title="للأعلى"><i data-lucide="chevron-up"></i></button>' : '') +
      (idx<total ? '<button class="clause-ctrl-btn" onclick="Pages.moveClause(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+',\'down\')" title="للأسفل"><i data-lucide="chevron-down"></i></button>' : '') +
      '<button class="clause-ctrl-btn danger" onclick="Pages.deleteClause(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+')" title="حذف"><i data-lucide="x"></i></button>' +
    '</div>' +
    '<div class="clause-block-inner">' +
      '<div class="clause-title">'+UI.escHtml(cl.title)+'</div>' +
      '<div class="clause-body" contenteditable="true" data-clause-idx="'+idx+'" onblur="Pages.saveClauseContent(\''+Pages._contractProjId+'\',\''+Pages._contractId+'\','+idx+',this)">'+UI.escHtml(cl.content)+'</div>' +
    '</div>' +
  '</div>';
};

Pages.saveClauseContent = function(projId, contractId, clauseIdx, el) {
  if (Pages._contractPreview) return; // don't save preview content
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  var enabledClauses = c.clauses.filter(function(x){return x.enabled!==false;});
  var cl = enabledClauses[clauseIdx];
  if (!cl) return;
  cl.content = el.innerText || el.textContent || '';
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
};

Pages.updateContractCover = function(projId, contractId, key, value) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  if (key === 'footer_label') {
    c.footer_label = value;
  } else {
    if (!c.cover) c.cover = {};
    c.cover[key] = value;
  }
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  // Re-render the cover page live for visual keys
  var reRenderKeys = ['frame_style','bg_image','bg_color','overlay_opacity','logo','company_name'];
  if (reRenderKeys.indexOf(key) !== -1) {
    var docEl = document.getElementById('contract-doc');
    if (docEl) {
      var updatedC = DB.getContracts(projId).find(function(x){return x.id===contractId;});
      if (updatedC) {
        var newDocHtml = Pages._renderContractDoc(updatedC);
        var tmp = document.createElement('div');
        tmp.innerHTML = newDocHtml;
        var newDocEl = tmp.firstChild;
        docEl.parentNode.replaceChild(newDocEl, docEl);
        if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: document.getElementById('contract-clauses-body')});
      }
    }
  }
};

Pages.updatePageLayout = function(projId, contractId, section, key, value) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  if (!c.page_layout) c.page_layout = {header:{show:true},footer:{show:true}};
  if (!c.page_layout[section]) c.page_layout[section] = {};
  c.page_layout[section][key] = value;
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
  // re-render entire doc
  var docEl = document.getElementById('contract-doc');
  if (docEl) {
    var updated = DB.getContracts(projId).find(function(x){return x.id===contractId;});
    if (updated) {
      var newDocHtml = Pages._renderContractDoc(updated);
      var tmp = document.createElement('div');
      tmp.innerHTML = newDocHtml;
      var newDocEl = tmp.firstChild;
      docEl.parentNode.replaceChild(newDocEl, docEl);
      if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: document.getElementById('contract-clauses-body')});
    }
  }

Pages.updateContractStatus = function(projId, contractId, value) {
  var contracts = DB.getContracts(projId);
  var c = contracts.find(function(x){return x.id===contractId;});
  if (!c) return;
  c.status = value;
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(projId, c);
};

Pages.toggleContractPreview = function() {
  Pages._contractPreview = !Pages._contractPreview;
  var page = document.getElementById('pg-contract');
  var btn = document.getElementById('contract-preview-btn');
  if (page) page.classList.toggle('cep-preview', Pages._contractPreview);
  if (btn) {
    btn.innerHTML = Pages._contractPreview
      ? '<i data-lucide="pencil"></i>تحرير'
      : '<i data-lucide="eye"></i>معاينة';
    if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: btn});
  }
  if (Pages._contractPreview) {
    var contracts = DB.getContracts(Pages._contractProjId);
    var c = contracts.find(function(x){return x.id===Pages._contractId;});
    if (c) {
      document.querySelectorAll('.clause-body').forEach(function(el, i) {
        el.setAttribute('contenteditable', 'false');
        var enabledClauses = c.clauses.filter(function(x){return x.enabled!==false;});
        var cl = enabledClauses[i];
        if (cl) {
          el.innerHTML = Pages._applyVars(UI.escHtml(cl.content), c.variables);
        }
      });
    }
  } else {
    var contracts2 = DB.getContracts(Pages._contractProjId);
    var c2 = contracts2.find(function(x){return x.id===Pages._contractId;});
    if (c2) {
      document.querySelectorAll('.clause-body').forEach(function(el, i) {
        var enabledClauses = c2.clauses.filter(function(x){return x.enabled!==false;});
        var cl = enabledClauses[i];
        if (cl) el.textContent = cl.content;
        el.setAttribute('contenteditable', 'true');
      });
    }
  }
};

Pages.switchContractTab = function(tab) {
  var vp = document.getElementById('ctab-vars-panel');
  var sp = document.getElementById('ctab-sets-panel');
  var vb = document.getElementById('ctab-vars-btn');
  var sb = document.getElementById('ctab-sets-btn');
  if (!vp || !sp) return;
  if (tab === 'vars') {
    vp.style.display = ''; sp.style.display = 'none';
    if (vb) vb.classList.add('active');
    if (sb) sb.classList.remove('active');
  } else {
    vp.style.display = 'none'; sp.style.display = '';
    if (vb) vb.classList.remove('active');
    if (sb) sb.classList.add('active');
  }
};

Pages.saveContractNow = function(silent) {
  if (!Pages._contractProjId || !Pages._contractId) return;
  var contracts = DB.getContracts(Pages._contractProjId);
  var c = contracts.find(function(x){return x.id===Pages._contractId;});
  if (!c) return;
  document.querySelectorAll('.clause-body[data-clause-idx]').forEach(function(el) {
    var idx = parseInt(el.getAttribute('data-clause-idx'), 10);
    var enabledClauses = c.clauses.filter(function(x){return x.enabled!==false;});
    var cl = enabledClauses[idx];
    if (cl) cl.content = el.innerText || el.textContent || '';
  });
  c.updated = (new Date()).toISOString().slice(0,10);
  DB.saveContract(Pages._contractProjId, c);
  if (!silent && UI.toast) UI.toast('تم الحفظ');
};

/* ─── MOBILE CONTRACT PANEL TOGGLE ─── */
Pages.toggleContractMobilePanel = function(panel) {
  var leftSidebar  = document.querySelector('#pg-contract .contract-sidebar-left');
  var rightSidebar = document.querySelector('#pg-contract .contract-sidebar-right');
  var clsBtn = document.getElementById('cmb-clauses');
  var varBtn = document.getElementById('cmb-vars');
  var isLeftOpen  = leftSidebar && leftSidebar.classList.contains('mob-open');
  var isRightOpen = rightSidebar && rightSidebar.classList.contains('mob-open');

  // close all first
  if (leftSidebar)  leftSidebar.classList.remove('mob-open');
  if (rightSidebar) rightSidebar.classList.remove('mob-open');
  if (clsBtn) clsBtn.classList.remove('active');
  if (varBtn) varBtn.classList.remove('active');

  if (panel==='clauses' && !isLeftOpen) {
    if (leftSidebar) leftSidebar.classList.add('mob-open');
    if (clsBtn) clsBtn.classList.add('active');
  }
  if (panel==='vars' && !isRightOpen) {
    if (rightSidebar) rightSidebar.classList.add('mob-open');
    if (varBtn) varBtn.classList.add('active');
  }
};

Pages.duplicateBuiltInTemplate = function(tplKey) {
  var tpl = CONTRACT_TEMPLATES[tplKey];
  if (!tpl) return;
  var today = (new Date()).toISOString().slice(0,10);
  var clauses = tpl.clauses.map(function(cl, i) {
    return {
      id: DB.uid(),
      key: cl.key,
      title: 'المادة '+(CONTRACT_ORDINALS[i]||(i+1).toString())+': '+(cl.baseTitle||cl.key),
      content: cl.content,
      enabled: true
    };
  });
  var newTpl = {
    id: DB.uid(),
    name: tpl.title + ' (نسخة)',
    template_type: tplKey,
    created: today,
    updated: today,
    clauses: clauses,
    cover: {frame_style:'modern', company_name:'', logo:''},
    footer_label: 'سري'
  };
  DB.saveCustomTemplate(newTpl);
  Nav.go('template-editor', {templateId: newTpl.id});
};

  params = params||{};

  var isNew = templateId === 'new';
  var templates = DB.getCustomTemplates();

Pages.updateTemplateName = function(id, val) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  t.name = val;
  t.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(t);
  var covTitle = document.querySelector('#pg-template-editor .cov-title');
  if (covTitle) covTitle.textContent = val;
};

Pages.updateTemplateField = function(id, field, val) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  if (field==='company_name'||field==='logo'||field==='frame_style') {
    if (!t.cover) t.cover={};
    t.cover[field] = val;
    if (field==='frame_style') {
      var covPage = document.querySelector('#pg-template-editor .cov-page');
      if (covPage) covPage.className = 'cov-page cov-frame-'+val;
    }
  } else if (field==='footer_label') {
    t.footer_label = val;
  }
  t.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(t);
};

Pages.handleLogoUpload = function(templateId, input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    Pages.updateTemplateField(templateId, 'logo', e.target.result);
    Pages.render_template_editor({templateId: templateId});
  };
  reader.readAsDataURL(file);
};

Pages._insertVarToClipboard = function(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){
      if (UI.toast) UI.toast('تم نسخ ' + text);
    });
  }
};

Pages.moveTplClause = function(id, idx, dir) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  var enabled = t.clauses.filter(function(c){return c.enabled!==false;});
  var newIdx = dir==='up' ? idx-1 : idx+1;
  if (newIdx<0||newIdx>=enabled.length) return;
  var ri = t.clauses.indexOf(enabled[idx]);
  var rni = t.clauses.indexOf(enabled[newIdx]);
  var tmp = t.clauses[ri]; t.clauses[ri]=t.clauses[rni]; t.clauses[rni]=tmp;
  var oi = 0;
  t.clauses.forEach(function(cl){
    if (cl.enabled!==false) {
      var base = cl.title.replace(/^المادة\s+\S+\s*:\s*/,'');
      cl.title = 'المادة '+(CONTRACT_ORDINALS[oi]||(oi+1).toString())+': '+base;
      oi++;
    }
  });
  t.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(t);
  Pages.render_template_editor({templateId: id});
};

Pages.deleteTplClause = function(id, idx) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  var enabled = t.clauses.filter(function(c){return c.enabled!==false;});
  var cl = enabled[idx];
  if (!cl) return;
  cl.enabled = false;
  DB.saveCustomTemplate(t);
  var el = document.getElementById('tplcl-'+cl.id);
  if (el) el.remove();
};

Pages.saveTplClause = function(id, idx, el) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  var enabled = t.clauses.filter(function(c){return c.enabled!==false;});
  if (enabled[idx]) enabled[idx].content = el.innerText||el.textContent||'';
  t.updated = (new Date()).toISOString().slice(0,10);
  DB.saveCustomTemplate(t);
};

Pages.addClauseToTemplate = function(id, clauseKey) {
  var arr = DB.getCustomTemplates();
  var t = arr.find(function(x){return x.id===id;});
  if (!t) return;
  var enabledCount = t.clauses.filter(function(c){return c.enabled!==false;}).length;
  var libItem = CLAUSE_LIBRARY.find(function(x){return x.key===clauseKey;});
  var baseTitle = libItem ? libItem.title : clauseKey;
  var content = '';
  for (var tKey in CONTRACT_TEMPLATES) {
    var found = CONTRACT_TEMPLATES[tKey].clauses.find(function(c){return c.key===clauseKey;});
    if (found) { content = found.content; break; }
  }
  t.clauses.push({
    id: DB.uid(), key: clauseKey,
    title: 'المادة '+(CONTRACT_ORDINALS[enabledCount]||(enabledCount+1).toString())+': '+baseTitle,
    content: content, enabled: true
  });
  DB.saveCustomTemplate(t);
  Pages.render_template_editor({templateId: id});
};

Pages.saveTemplateFinal = function(id) {
  document.querySelectorAll('.clause-body[data-tpl-clause-idx]').forEach(function(el) {
    var idx = parseInt(el.getAttribute('data-tpl-clause-idx'), 10);
    var arr = DB.getCustomTemplates();
    var t = arr.find(function(x){return x.id===id;});
    if (!t) return;
    var enabled = t.clauses.filter(function(c){return c.enabled!==false;});
    if (enabled[idx]) enabled[idx].content = el.innerText||el.textContent||'';
    t.updated = (new Date()).toISOString().slice(0,10);
    DB.saveCustomTemplate(t);
  });
  if (UI.toast) UI.toast('تم حفظ النموذج');
};

Pages.toggleTplMobilePanel = function(panel) {
  var leftSidebar  = document.querySelector('#pg-template-editor .contract-sidebar-left');
  var rightSidebar = document.querySelector('#pg-template-editor .contract-sidebar-right');
  var isLeftOpen   = leftSidebar && leftSidebar.classList.contains('mob-open');
  var isRightOpen  = rightSidebar && rightSidebar.classList.contains('mob-open');
  if (leftSidebar) leftSidebar.classList.remove('mob-open');
  if (rightSidebar) rightSidebar.classList.remove('mob-open');
  if (panel==='clauses' && !isLeftOpen && leftSidebar) leftSidebar.classList.add('mob-open');
  if (panel==='settings' && !isRightOpen && rightSidebar) rightSidebar.classList.add('mob-open');
};

Pages.exportData = function() {
  var data = {};
  for (var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if (k&&k.startsWith('buad2_')) data[k]=localStorage.getItem(k);
  }
  var blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download='buad_backup.json'; a.click();
  URL.revokeObjectURL(url);
  UI.toast('تم التصدير','success');
};

Pages.importData = function(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var data = JSON.parse(e.target.result);
      Object.keys(data).forEach(function(k){ localStorage.setItem(k,data[k]); });
      UI.toast('تم الاستيراد','success');
      Nav.go('dash');
    } catch(err){ UI.toast('خطأ في استيراد البيانات','danger'); }
  };
  reader.readAsText(file);
};

Pages.clearData = function() {
  if (!confirm('هل تريد حذف كل البيانات؟ لا يمكن التراجع عن هذا الإجراء.')) return;
  var keys=[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('buad2_'))keys.push(k);}
  keys.forEach(function(k){localStorage.removeItem(k);});
  UI.toast('تم مسح البيانات');
  Nav.go('dash');
};
