<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>بُعد — إدارة مالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
:root {
  /* ── Primary: Indigo (modern fintech) ── */
  --primary-50:  #EEF2FF;
  --primary-100: #E0E7FF;
  --primary-200: #C7D2FE;
  --primary-300: #A5B4FC;
  --primary-400: #818CF8;
  --primary-500: #6366F1;
  --primary-600: #4F46E5;
  --primary-700: #4338CA;
  --primary-800: #3730A3;
  --primary-900: #312E81;
  --primary-950: #1E1B4B;

  /* ── Neutral: Slate ── */
  --neutral-0:   #FFFFFF;
  --neutral-50:  #F8FAFC;
  --neutral-100: #F1F5F9;
  --neutral-200: #E2E8F0;
  --neutral-300: #CBD5E1;
  --neutral-400: #94A3B8;
  --neutral-500: #64748B;
  --neutral-600: #475569;
  --neutral-700: #334155;
  --neutral-800: #1E293B;
  --neutral-900: #0F172A;
  --neutral-950: #020617;

  /* ── Semantic ── */
  --success-50:  #ECFDF5;
  --success-100: #D1FAE5;
  --success-500: #10B981;
  --success-600: #059669;
  --success-700: #047857;
  --warning-50:  #FFFBEB;
  --warning-100: #FEF3C7;
  --warning-500: #F59E0B;
  --warning-600: #D97706;
  --warning-700: #B45309;
  --danger-50:   #FFF1F2;
  --danger-100:  #FFE4E6;
  --danger-500:  #F43F5E;
  --danger-600:  #E11D48;
  --danger-700:  #BE123C;
  --info-50:     #F0F9FF;
  --info-100:    #E0F2FE;
  --info-500:    #0EA5E9;
  --info-600:    #0284C7;
  --info-700:    #0369A1;

  /* ── Accent (teal) ── */
  --accent-50:  #F0FDFA;
  --accent-500: #14B8A6;
  --accent-600: #0D9488;
  --accent-700: #0F766E;

  /* ── Surface aliases ── */
  --bg-app:       var(--neutral-50);
  --bg-elevated:  var(--neutral-0);
  --bg-subtle:    var(--neutral-100);
  --bg-muted:     var(--neutral-200);
  --border:       var(--neutral-200);
  --border-hover: var(--neutral-300);
  --text:         var(--neutral-900);
  --text-strong:  var(--neutral-800);
  --text-muted:   var(--neutral-500);
  --text-subtle:  var(--neutral-400);

  /* ── Typography Scale ── */
  --font-2xs:  11px;
  --font-xs:   12px;
  --font-sm:   13px;
  --font-base: 14px;
  --font-md:   15px;
  --font-lg:   16px;
  --font-xl:   18px;
  --font-2xl:  22px;
  --font-3xl:  clamp(22px, 2.4vw + 14px, 28px);
  --font-4xl:  clamp(26px, 4vw + 16px, 34px);
  --font-5xl:  clamp(32px, 5vw + 18px, 42px);

  --lh-tight:   1.2;
  --lh-snug:    1.4;
  --lh-normal:  1.6;
  --lh-relaxed: 1.75;

  --font-ui:    "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:  "IBM Plex Mono", "Menlo", "Consolas", monospace;
  --font-latin: "Inter", system-ui, sans-serif;

  /* ── Spacing (4px base) ── */
  --space-0_5: 2px;   --space-1: 4px;    --space-1_5: 6px;
  --space-2:   8px;   --space-3: 12px;   --space-4:   16px;
  --space-5:   20px;  --space-6: 24px;   --space-8:   32px;
  --space-10:  40px;  --space-12:48px;   --space-16:  64px;
  --space-20:  80px;

  /* ── Radii ── */
  --radius-xs:   4px;
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   16px;
  --radius-xl:   20px;
  --radius-2xl:  28px;
  --radius-full: 9999px;

  /* ── Shadows ── */
  --shadow-xs:    0 1px 2px rgba(15, 23, 42, .04);
  --shadow-sm:    0 1px 3px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
  --shadow-md:    0 4px 12px rgba(15, 23, 42, .08), 0 2px 4px rgba(15, 23, 42, .04);
  --shadow-lg:    0 12px 28px rgba(15, 23, 42, .10), 0 4px 10px rgba(15, 23, 42, .05);
  --shadow-xl:    0 24px 48px rgba(15, 23, 42, .12), 0 8px 20px rgba(15, 23, 42, .06);
  --shadow-focus: 0 0 0 4px rgba(99, 102, 241, .20);
  --shadow-brand: 0 8px 24px -8px rgba(79, 70, 229, .40);

  /* ── Motion ── */
  --transition-fast: .12s ease;
  --transition:      .2s cubic-bezier(.16,1,.3,1);
  --transition-slow: .4s cubic-bezier(.16,1,.3,1);

  /* ── Layout ── */
  --sidebar-w:   268px;
  --sidebar-col: 72px;
  --topbar-h:    60px;
  --container-pad: clamp(16px, 3vw, 28px);

  /* ── Backwards-compat aliases (will be removed in phase 6) ── */
  --brand:        var(--primary-600);
  --brand-light:  var(--primary-50);
  --brand-hover:  var(--primary-700);
  --success:      var(--success-600);
  --success-light:var(--success-50);
  --danger:       var(--danger-600);
  --danger-light: var(--danger-50);
  --warn:         var(--warning-600);
  --warn-light:   var(--warning-50);
  --gray-50:      var(--neutral-50);
  --gray-100:     var(--neutral-100);
  --gray-200:     var(--neutral-200);
  --gray-300:     var(--neutral-300);
  --gray-400:     var(--neutral-400);
  --gray-500:     var(--neutral-500);
  --gray-700:     var(--neutral-700);
  --gray-800:     var(--neutral-800);
  --gray-900:     var(--neutral-900);
  --radius:       var(--radius-md);
  --shadow:       var(--shadow-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:var(--font-ui);direction:rtl;
  background:var(--bg-app);color:var(--text);
  font-size:var(--font-sm);line-height:var(--lh-normal);
  font-feature-settings:"kern" 1, "liga" 1;
}
a{text-decoration:none;color:inherit;cursor:pointer}
button{font-family:inherit}

/* Focus ring (a11y) */
:focus-visible{outline:none;box-shadow:var(--shadow-focus);border-radius:var(--radius-sm)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{box-shadow:var(--shadow-focus)}

/* Skip-to-content for keyboard users */
.skip-link{position:absolute;top:-40px;right:8px;background:var(--primary-600);color:#fff;padding:8px 16px;border-radius:var(--radius-sm);z-index:9999;font-size:var(--font-sm);font-weight:600;transition:top var(--transition)}
.skip-link:focus{top:8px}

/* Phosphor icon base styling */
.ph,.ph-bold,.ph-fill,.ph-duotone,.ph-thin,.ph-light{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:1em;line-height:1;flex-shrink:0;
}
i[class*="ph-"]{vertical-align:middle}

/* ── App shell ── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:#fff;
  border-left:1px solid var(--gray-200);
  display:flex;flex-direction:column;
  transition:width var(--transition);
  overflow:hidden;position:relative;z-index:200;
}
.sidebar.collapsed{width:var(--sidebar-col)}
.sb-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 14px 13px;border-bottom:1px solid var(--gray-200);
  flex-shrink:0;min-height:60px;
}
.sb-logo{display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
.sb-logo-icon{
  width:34px;height:34px;border-radius:10px;
  background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;color:#fff;flex-shrink:0;
}
.sb-logo-text{font-size:16px;font-weight:700;color:var(--gray-900);opacity:1;transition:opacity var(--transition)}
.sidebar.collapsed .sb-logo-text{opacity:0;pointer-events:none;width:0;overflow:hidden}
.sb-toggle{
  background:none;border:none;color:var(--gray-400);
  font-size:20px;cursor:pointer;padding:4px 6px;border-radius:6px;
  transition:var(--transition);flex-shrink:0;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.sb-toggle:hover{background:var(--gray-100);color:var(--gray-700)}
.sb-toggle i[class*="ph-"]{font-size:18px;transition:transform var(--transition)}
.sidebar.collapsed .sb-toggle i[class*="ph-"]{transform:scaleX(-1)}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto;overflow-x:hidden}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:2px}
.sb-section-label{
  font-size:9.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:var(--gray-400);padding:10px 10px 4px;
  white-space:nowrap;overflow:hidden;transition:opacity var(--transition);
}
.sidebar.collapsed .sb-section-label{opacity:0}
.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:9px;cursor:pointer;
  color:var(--gray-500);font-size:12.5px;font-weight:500;
  transition:var(--transition);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;position:relative;
}
.sb-item:hover{background:var(--gray-100);color:var(--gray-900)}
.sb-item.active{background:var(--brand-light);color:var(--brand);font-weight:600}
.sb-item.active::after{
  content:'';position:absolute;right:0;top:20%;bottom:20%;
  width:3px;background:var(--brand);border-radius:2px 0 0 2px;
}
.sb-icon{
  width:30px;height:30px;border-radius:7px;
  background:var(--gray-100);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;transition:var(--transition);
}
.sb-icon i[class*="ph-"]{font-size:16px}
.sb-item:hover .sb-icon{background:var(--gray-200)}
.sb-item.active .sb-icon{background:rgba(0,25,125,.12);color:var(--brand)}
.sb-label{transition:opacity var(--transition)}
.sidebar.collapsed .sb-label{opacity:0;width:0;overflow:hidden}

/* Sidebar overlay for mobile */
.sb-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.sb-overlay.active{opacity:1;display:block;pointer-events:all}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Top bar ── */
.top-bar{
  background:#fff;border-bottom:1px solid var(--gray-200);
  padding:0 20px;display:flex;align-items:center;gap:12px;
  flex-shrink:0;height:56px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.top-bar-menu{
  display:none;background:none;border:none;cursor:pointer;
  color:var(--gray-700);padding:6px;border-radius:8px;
  align-items:center;justify-content:center;transition:var(--transition);
}
.top-bar-menu i[class*="ph-"]{font-size:20px}
.top-bar-menu:hover{background:var(--gray-100)}
.top-bar-divider{width:1px;height:24px;background:var(--gray-200);flex-shrink:0}
.top-bar-breadcrumb{
  flex:1;font-size:12.5px;color:var(--gray-500);
  display:flex;align-items:center;gap:6px;
}
.top-bar-breadcrumb span{cursor:default}
.top-bar-breadcrumb .bc-page{
  font-weight:600;color:var(--gray-900);font-size:13px;
}
.top-bar-breadcrumb .bc-sep{color:var(--gray-300)}
.top-bar-actions{display:flex;align-items:center;gap:8px}

/* ── Pages ── */
.page{display:none;flex:1;min-height:0;overflow-y:auto;padding:20px 24px}
.page.active{display:block}

/* ── Buttons ── */
.btn{
  font-family:inherit;font-size:12.5px;font-weight:500;
  padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--gray-200);
  cursor:pointer;background:#fff;color:var(--gray-700);
  transition:var(--transition);white-space:nowrap;display:inline-flex;
  align-items:center;gap:6px;line-height:1.3;
}
.btn:hover{background:var(--gray-100)}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--gray-500)}
.btn-ghost:hover{background:var(--gray-100);color:var(--gray-700)}
.btn-danger{background:var(--danger-light);color:var(--danger);border-color:#f5c6c2}
.btn-danger:hover{background:#f8d7d4}
.btn-sm{padding:5px 10px;font-size:11.5px}

/* ── Cards ── */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:600;color:var(--gray-900);margin-bottom:16px}

/* ── Stat cards ── */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
}
.stat-card-label{font-size:11px;color:var(--gray-500);margin-bottom:6px}
.stat-card-value{font-size:22px;font-weight:600;color:var(--gray-900);font-family:"IBM Plex Mono",monospace;line-height:1.2}
.stat-card-sub{font-size:10.5px;color:var(--gray-400);margin-top:4px}
.stat-card.brand .stat-card-value{color:var(--brand)}
.stat-card.success .stat-card-value{color:var(--success)}
.stat-card.danger .stat-card-value{color:var(--danger)}
.stat-card.warn .stat-card-value{color:var(--warn)}

/* ── Fin stat strip (entries tab) ── */
.fin-stat-strip{display:flex;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.fsi{flex:1;padding:14px 16px;border-left:1px solid var(--gray-100);position:relative;min-width:0}
.fsi:last-child{border-left:none}
.fsi::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--gray-200)}
.fsi.fsi-danger::before{background:var(--danger)}
.fsi.fsi-success::before{background:var(--success)}
.fsi.fsi-warn::before{background:var(--warn)}
.fsi.fsi-brand::before{background:var(--brand)}
.fsi-lbl{font-size:11px;color:var(--gray-500);margin-bottom:3px}
.fsi-val{font-size:20px;font-weight:700;font-family:"IBM Plex Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.fsi.fsi-danger .fsi-val{color:var(--danger)}
.fsi.fsi-success .fsi-val{color:var(--success)}
.fsi.fsi-warn .fsi-val{color:var(--warn)}
.fsi.fsi-brand .fsi-val{color:var(--brand)}
.fsi-sub{font-size:10px;color:var(--gray-400);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:500px){.fsi{padding:10px 12px}.fsi-val{font-size:16px}.fsi-lbl{font-size:10px}}

/* ── Page header ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-header h1{font-size:18px;font-weight:700;color:var(--gray-900)}
.page-header-sub{font-size:12px;color:var(--gray-500);margin-top:2px}

/* ── Tables ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{
  text-align:right;padding:11px 16px;font-size:10.5px;font-weight:700;
  color:var(--gray-500);background:var(--gray-50);letter-spacing:.5px;
  text-transform:uppercase;border-bottom:2px solid var(--gray-200);white-space:nowrap;
}
.data-table td{
  padding:12px 16px;border-bottom:1px solid var(--gray-100);
  color:var(--gray-700);vertical-align:middle;
}
.data-table tr:hover td{background:var(--brand-light)}
.data-table tr:last-child td{border-bottom:none}

/* ── Entry table (compact, fixed layout, expandable) ── */
.entry-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.entry-tbl th{
  text-align:right;padding:11px 14px;font-size:10.5px;font-weight:700;
  color:var(--gray-500);background:var(--gray-50);letter-spacing:.5px;
  text-transform:uppercase;border-bottom:2px solid var(--gray-200);white-space:nowrap;
}
.entry-tbl td{
  padding:0 14px;height:48px;
  border-bottom:1px solid var(--gray-100);
  vertical-align:middle;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.entry-tbl .er{cursor:pointer;transition:background .12s}
.entry-tbl .er:hover td{background:var(--brand-light)}
.entry-tbl .er.income-row td:first-child{border-right:3px solid var(--success)}
.entry-tbl .er.expense-row td:first-child{border-right:3px solid var(--danger)}
.entry-tbl .ed{display:none}
.entry-tbl .ed.open{display:table-row}
.entry-tbl .ed > td{
  background:#F7F9FF;padding:14px 16px;
  white-space:normal;height:auto;
  border-bottom:2px solid var(--gray-200);
  border-right:3px solid var(--brand-light);
}
.entry-tbl .col-type{width:80px}
.entry-tbl .col-cat{width:90px}
.entry-tbl .col-amt{width:145px;text-align:left}
.entry-tbl .col-status{width:78px}
.entry-tbl .col-chev{width:34px;text-align:center;color:var(--gray-400)}
.entry-chev{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;transition:all .18s;color:var(--gray-400)}
.entry-chev i[class*="ph-"]{font-size:12px;transition:transform var(--transition)}
.entry-chev.open{background:var(--brand-light);color:var(--brand)}
.entry-chev.open i[class*="ph-"]{transform:rotate(180deg)}
.entry-detail-grid{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px}
.entry-detail-item{min-width:80px}
.entry-detail-item .edi-lbl{font-size:10px;color:var(--gray-400);margin-bottom:2px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.entry-detail-item .edi-val{font-weight:600;color:var(--gray-800);font-size:12.5px}

/* ── Badges ── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;
}
.badge.success{background:var(--success-light);color:var(--success)}
.badge.brand{background:var(--brand-light);color:var(--brand)}
.badge.warn{background:var(--warn-light);color:var(--warn)}
.badge.danger{background:var(--danger-light);color:var(--danger)}
.badge.gray{background:var(--gray-100);color:var(--gray-500)}
/* Extended badge palette */
.badge.purple{background:#EDE9FE;color:#7C3AED}
.badge.amber{background:#FEF3C7;color:#D97706}
.badge.emerald{background:#D1FAE5;color:#059669}
.badge.indigo{background:#E0E7FF;color:#4338CA}
.badge.rose{background:#FFE4E6;color:#E11D48}
.badge.cyan{background:#CFFAFE;color:#0891B2}
.badge i[class*="ph-"]{font-size:11px}

/* ── Forms ── */
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field-label{display:block;font-size:11.5px;font-weight:600;color:var(--gray-700);margin-bottom:5px}
.field-input{
  width:100%;padding:8px 11px;border:1px solid var(--gray-200);
  border-radius:var(--radius-sm);font-family:inherit;font-size:12.5px;
  color:var(--gray-900);background:#fff;transition:var(--transition);outline:none;
}
.field-input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light)}
select.field-input{cursor:pointer}
.field-hint{font-size:10.5px;color:var(--gray-400);margin-top:3px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.toggle-label{font-size:12.5px;color:var(--gray-700)}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;background:var(--gray-200);border-radius:20px;
  cursor:pointer;transition:var(--transition);
}
.toggle-slider:before{
  content:'';position:absolute;width:14px;height:14px;
  bottom:3px;right:3px;background:#fff;border-radius:50%;
  transition:var(--transition);
}
.toggle input:checked + .toggle-slider{background:var(--brand)}
.toggle input:checked + .toggle-slider:before{transform:translateX(-16px)}
.inline-group{display:flex;gap:6px;align-items:center}
.inline-group .field-input{flex:1}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;padding:16px;
}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal-box{
  background:#fff;border-radius:var(--radius);
  width:100%;max-width:520px;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-md);
  transform:translateY(12px);transition:transform .2s;
}
.modal-overlay.active .modal-box{transform:translateY(0)}
.modal-header{
  padding:16px 20px;border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.modal-header h3{font-size:15px;font-weight:700;color:var(--gray-900)}
.modal-close{
  background:none;border:none;cursor:pointer;font-size:20px;
  color:var(--gray-400);padding:2px 6px;border-radius:6px;transition:var(--transition);
}
.modal-close:hover{background:var(--gray-100);color:var(--gray-700)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{
  padding:14px 20px;border-top:1px solid var(--gray-200);
  display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;
}

/* ── Tabs ── */
.tabs{
  display:flex;gap:4px;margin-bottom:20px;
  background:var(--gray-100);border-radius:10px;padding:4px;
}
.tab-btn{
  padding:8px 18px;font-family:inherit;font-size:12.5px;font-weight:500;
  border:none;background:transparent;cursor:pointer;color:var(--gray-500);
  border-radius:8px;transition:var(--transition);display:inline-flex;align-items:center;gap:6px;
}
.tab-btn:hover{background:rgba(255,255,255,.7);color:var(--gray-800)}
.tab-btn.active{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab-btn i[class*="ph-"]{font-size:14px}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── Toast ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--gray-900);color:#fff;padding:10px 20px;
  border-radius:var(--radius-sm);font-size:12.5px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:2000;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.danger{background:var(--danger)}
.toast.warn{background:var(--warn)}

/* ── Empty state ── */
.empty-state{text-align:center;padding:48px 24px;color:var(--gray-400)}
.empty-state-icon{font-size:40px;margin-bottom:12px;opacity:.5;display:flex;justify-content:center}
.empty-state-icon i[class*="ph-"]{font-size:44px;color:var(--neutral-300)}
.empty-state h3{font-size:14px;font-weight:600;color:var(--gray-500);margin-bottom:6px}
.empty-state p{font-size:12px;color:var(--gray-400)}

/* ── Client cards grid ── */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.client-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);transition:var(--transition);
}
.client-card:hover{box-shadow:var(--shadow-md);border-color:var(--gray-400)}
.client-card-name{font-size:14px;font-weight:700;color:var(--gray-900);margin-bottom:4px}
.client-card-meta{font-size:11px;color:var(--gray-500);margin-bottom:12px}
.client-card-actions{display:flex;gap:6px}

/* ── Filter bar ── */
.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-bar .field-input{max-width:180px}
.filter-select{padding:7px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-family:inherit;font-size:12px;color:var(--gray-700);background:#fff;cursor:pointer;outline:none}
.filter-select:focus{border-color:var(--brand)}

/* ── Info grid ── */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.info-item{}
.info-item-label{font-size:10.5px;color:var(--gray-400);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.info-item-value{font-size:13px;font-weight:500;color:var(--gray-900)}

/* ── Fin page specifics ── */
.fin-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fin-summary-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--gray-100);font-size:12.5px}
.fin-summary-row:last-child{border-bottom:none;font-weight:700;font-size:13px}
.fin-summary-row .lbl{color:var(--gray-500)}
.fin-summary-row .val{font-family:"IBM Plex Mono",monospace;font-weight:600}
/* ── Ctrl page grids ── */
.ctrl-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ctrl-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
/* ── Calc Trail (waterfall) ── */
.calc-trail{padding:0}
.calc-trail-row{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100);font-size:12.5px}
.calc-trail-row:last-child{border-bottom:none}
.calc-trail-row.ct-divider{border-top:2px solid var(--gray-300);margin-top:4px;padding-top:10px;border-bottom:none}
.calc-trail-sign{width:14px;text-align:center;font-weight:700;color:var(--gray-400);flex-shrink:0;font-family:"IBM Plex Mono",monospace}
.calc-trail-lbl{flex:1;color:var(--gray-700)}
.calc-trail-formula{font-size:11px;color:var(--gray-400);font-weight:400}
.calc-trail-val{font-family:"IBM Plex Mono",monospace;font-weight:600;min-width:105px;text-align:left;flex-shrink:0}

.budget-table-wrap{overflow-x:auto;margin-top:10px}
.add-row-btn{font-size:12px;color:var(--brand);background:none;border:none;cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:4px}
.add-row-btn:hover{text-decoration:underline}
.fee-calc-badge{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--danger);background:var(--danger-light);padding:4px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.ctrl-fees{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.badge-registered{font-size:11px;font-weight:600;color:var(--success);background:var(--success-light);padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
@media(max-width:600px){.ctrl-fees{grid-template-columns:1fr}}
.alert-notice{background:var(--warn-light);border:1px solid var(--warn);color:var(--warn);padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* ── Ctrl Drawer ── */
.ctrl-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:900;opacity:0;pointer-events:none;transition:opacity .2s}
.ctrl-drawer-overlay.active{opacity:1;pointer-events:all}
.ctrl-drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,96vw);background:#fff;z-index:901;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12)}
.ctrl-drawer.active{transform:translateX(0)}
.ctrl-drawer-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--gray-200);position:sticky;top:0;background:#fff;z-index:2}
.ctrl-drawer-header h3{font-size:14px;font-weight:700;color:var(--gray-900)}
.ctrl-drawer-body{padding:16px}
.ctrl-fab{position:fixed;bottom:28px;left:28px;width:50px;height:50px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,25,125,.35);z-index:800;display:none;align-items:center;justify-content:center;transition:.2s}
.ctrl-fab:hover{background:#0021a0;transform:scale(1.07)}
.ctrl-fab.visible{display:flex}

/* ── Table enhancements ── */
.data-table tbody tr.income-row td:first-child{border-right:3px solid var(--success)}
.data-table tbody tr.expense-row td:first-child{border-right:3px solid var(--danger)}
.amount-income{color:var(--success)!important;font-weight:700}
.amount-expense{color:var(--danger)!important;font-weight:700}

/* ── Report tabs ── */
.report-tabs{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);overflow:hidden;width:fit-content}
.report-tab{padding:8px 20px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--gray-500);border:none;font-family:inherit;transition:.15s}
.report-tab.active{background:var(--brand);color:#fff}

/* ── Waterfall ── */
.wf-table{width:100%;font-size:12.5px}
.wf-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:3px}
.wf-row:hover{background:var(--gray-50)}
.wf-row.wf-total{background:var(--gray-50);border:1px solid var(--gray-200);font-weight:700;margin-top:6px}
.wf-sign{width:18px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--gray-400);flex-shrink:0;font-size:13px}
.wf-lbl{flex:1;color:var(--gray-700);font-size:12.5px}
.wf-formula{font-size:11px;color:var(--gray-400)}
.wf-bar-wrap{width:80px;flex-shrink:0}
.wf-bar-track{background:var(--gray-100);border-radius:20px;height:5px;overflow:hidden}
.wf-bar-fill{height:100%;border-radius:20px;transition:width .4s}
.wf-val{font-family:'IBM Plex Mono',monospace;font-weight:700;min-width:120px;text-align:left;font-size:12.5px}

/* ── Download panel ── */
.dl-panel{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--gray-50);border:1px solid var(--gray-200);
  border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;
}
.dl-panel-info{font-size:12px;color:var(--gray-500)}
.dl-panel-info strong{color:var(--gray-900);font-size:13px}
.dl-panel-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-dl{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;font-size:12px;font-weight:500;font-family:inherit;
  border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);border:1px solid;
  white-space:nowrap;
}
.btn-dl-pdf{background:#fff2f2;border-color:#fecaca;color:#b91c1c}
.btn-dl-pdf:hover{background:#fee2e2}
.btn-dl-csv{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.btn-dl-csv:hover{background:#dcfce7}
.btn-dl-print{background:var(--brand-light);border-color:#c7d2fe;color:var(--brand)}
.btn-dl-print:hover{background:#dde4ff}
.btn-dl i[class*="ph-"]{font-size:13px}

/* ── Overview report layout ── */
.ov-2col{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-bottom:16px}
.ov-inc-exp-bar{margin-top:10px}
.ov-bar-row{margin-bottom:10px}
.ov-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.ov-bar-track{background:var(--gray-100);border-radius:20px;height:8px;overflow:hidden}
.ov-bar-fill{height:100%;border-radius:20px;transition:width .5s}

@media(max-width:700px){.ov-2col{grid-template-columns:1fr}}

/* ── Stat mini ── */
.stat-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-mini{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow)}
.stat-mini-label{font-size:10px;color:var(--gray-500);margin-bottom:4px}
.stat-mini-val{font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace}
@media(max-width:600px){.stat-mini-grid{grid-template-columns:repeat(2,1fr)}}

/* ── Inline tab mini ── */
.mini-tabs{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);overflow:hidden;width:fit-content}
.mini-tab{padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;color:var(--gray-500);border:none;font-family:inherit;transition:var(--transition)}
.mini-tab.active{background:var(--brand);color:#fff}

/* ── Progress bar ── */
.progress-bar-wrap{background:var(--gray-100);border-radius:20px;height:6px;overflow:hidden;margin-top:4px}
.progress-bar{height:100%;border-radius:20px;background:var(--brand);transition:width .4s}

/* ── Divider ── */
.divider{height:1px;background:var(--gray-200);margin:16px 0}

/* ── Scrollable table wrapper ── */
.tbl-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius-sm)}
.tbl-responsive .data-table{min-width:560px}

/* ── Print ── */
@media print{
  .sidebar,.top-bar,.ctrl-fab,.modal-overlay,.ctrl-drawer,.ctrl-drawer-overlay,
  .tabs,.filter-bar,.page-header .flex,.alert-notice,
  .entry-tbl .col-chev,.entry-tbl .ed{display:none!important}
  body{background:#fff}
  .page{display:block!important;padding:0;overflow:visible}
  .card{box-shadow:none!important;break-inside:avoid}
  #main{width:100%!important}
  @page{margin:18mm 15mm}
}

/* ── Responsive ── */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;bottom:0;right:0;z-index:200;transform:translateX(100%);transition:transform .2s}
  .sidebar.mobile-open{transform:translateX(0)}
  .sb-overlay{display:block;pointer-events:none}
  #main{width:100%}
  .top-bar-menu{display:flex}
  .stat-cards{grid-template-columns:repeat(2,1fr)}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .client-grid{grid-template-columns:1fr}
  .ctrl-2col,.ctrl-3col{grid-template-columns:1fr}
  .calc-trail-row{font-size:12px}
  .calc-trail-val{min-width:90px}
  .page{padding:14px}
  .sidebar.collapsed{width:var(--sidebar-w)}
}
@media(max-width:480px){
  .stat-cards{grid-template-columns:1fr}
}

/* ── Project hero header ── */
.proj-hero{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.proj-hero-band{
  background:linear-gradient(135deg,#001260 0%,#0230e0 70%,#1a56fb 100%);
  padding:20px 22px 18px;position:relative;overflow:hidden;
}
.proj-hero-band::before{
  content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;
  background:rgba(255,255,255,.04);border-radius:50%;
}
.proj-hero-band::after{
  content:'';position:absolute;right:80px;bottom:-80px;width:240px;height:240px;
  background:rgba(255,255,255,.03);border-radius:50%;
}
.proj-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}
.proj-hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.proj-hero-badge{border-radius:20px;padding:3px 11px;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent}
.proj-hero-badge-status{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2)}
.proj-hero-badge-status.st-active{background:rgba(30,200,80,.25);border-color:rgba(50,220,80,.35);color:#a7f3c8}
.proj-hero-badge-status.st-completed{background:rgba(100,200,255,.2);border-color:rgba(100,200,255,.3);color:#bfefff}
.proj-hero-badge-status.st-paused{background:rgba(255,190,0,.2);border-color:rgba(255,200,0,.3);color:#fde68a}
.proj-hero-badge-type{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.1)}
.proj-hero-name{font-size:20px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:7px;letter-spacing:-.2px}
.proj-hero-meta{font-size:11.5px;color:rgba(255,255,255,.6);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.proj-hero-meta-item{display:flex;align-items:center;gap:4px}
.proj-hero-meta-item i[class*="ph-"]{font-size:12px;opacity:.85}
.proj-hero-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px;position:relative;z-index:1}
.proj-hero-edit{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:var(--radius-sm);padding:6px 14px;font-size:11.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.proj-hero-edit:hover{background:rgba(255,255,255,.22)}

/* Progress bar in hero */
.proj-hero-progress{margin-top:14px;position:relative;z-index:1}
.proj-hero-progress-labels{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.55);margin-bottom:5px}
.proj-hero-progress-track{background:rgba(255,255,255,.12);border-radius:20px;height:5px;overflow:hidden}
.proj-hero-progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,.9));transition:width .5s ease}
.proj-hero-progress-fill.overspent{background:linear-gradient(90deg,#f87171,#ef4444)}

/* Stats strip */
.proj-hero-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--gray-200)}
.phs{padding:12px 16px;border-left:1px solid var(--gray-200);min-width:0;position:relative}
.phs:last-child{border-left:none}
.phs-lbl{font-size:10px;color:var(--gray-400);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;letter-spacing:.2px}
.phs-val{font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.phs::before{content:'';position:absolute;top:0;right:0;left:0;height:2px}
.phs.ph-brand::before{background:var(--brand)}
.phs.ph-danger::before{background:var(--danger)}
.phs.ph-success::before{background:var(--success)}
.phs.ph-warn::before{background:var(--warn)}
.phs.ph-brand .phs-val{color:var(--brand)}
.phs.ph-danger .phs-val{color:var(--danger)}
.phs.ph-success .phs-val{color:var(--success)}
.phs.ph-warn .phs-val{color:var(--warn)}
@media(max-width:600px){
  .proj-hero-band{padding:14px 14px 12px}
  .proj-hero-name{font-size:16px}
  .proj-hero-stats{grid-template-columns:repeat(2,1fr)}
  .phs{padding:10px 12px}
  .phs-val{font-size:13px}
}

/* ── Entry table date column ── */
.entry-tbl .col-date{width:82px;font-size:12px;color:var(--gray-500)}

/* ── Utility ── */
.text-muted{color:var(--gray-400)}
.text-right{text-align:left}/* in RTL left = visual right */
.mono{font-family:"IBM Plex Mono",monospace}
.fw-600{font-weight:600}
.mt-8{margin-top:8px}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.mt-20{margin-top:20px}
.mb-12{margin-bottom:12px}
.gap-8{gap:8px}
.flex{display:flex}.flex-center{align-items:center}.justify-between{justify-content:space-between}
.w-full{width:100%}
.section-title{font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gray-200)}

/* ── Dashboard v2 ── */
.dash-greeting{
  background:linear-gradient(135deg,#001a8c 0%,#0230e0 60%,#1a56fb 100%);
  border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  box-shadow:0 4px 20px rgba(0,25,140,.18);position:relative;overflow:hidden;
}
.dash-greeting::before{
  content:'';position:absolute;left:-40px;top:-40px;width:160px;height:160px;
  background:rgba(255,255,255,.05);border-radius:50%;
}
.dash-greeting::after{
  content:'';position:absolute;left:60px;bottom:-60px;width:200px;height:200px;
  background:rgba(255,255,255,.04);border-radius:50%;
}
.dash-greeting-text h2{font-size:17px;font-weight:700;color:#fff;margin-bottom:4px}
.dash-greeting-text p{font-size:12px;color:rgba(255,255,255,.65)}
.dash-greeting-actions{display:flex;gap:8px;flex-shrink:0;position:relative;z-index:1}
.btn-white{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--radius-sm);padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-white:hover{background:rgba(255,255,255,.25)}
.btn-white-solid{background:#fff;border:1px solid #fff;color:var(--brand);border-radius:var(--radius-sm);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-white-solid:hover{background:#f0f4ff}

/* KPI Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:var(--transition);
}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kpi-card-accent{position:absolute;top:0;right:0;left:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.kpi-card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi-card-icon i[class*="ph-"]{font-size:18px}
.kpi-card-label{font-size:11px;color:var(--gray-500);font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.kpi-card-value{font-size:22px;font-weight:700;font-family:"IBM Plex Mono",monospace;line-height:1.1;margin-bottom:6px}
.kpi-card-sub{font-size:11px;color:var(--gray-400);display:flex;align-items:center;gap:4px}
.kpi-trend-up{color:var(--success);font-weight:600}
.kpi-trend-down{color:var(--danger);font-weight:600}

/* Dashboard 2-col */
.dash-2col{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-bottom:20px}
.dash-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}

/* Project status donut */
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0}
.donut-legend{width:100%;display:flex;flex-direction:column;gap:7px}
.donut-legend-item{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.donut-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-left:8px}
.donut-legend-lbl{flex:1;color:var(--gray-700)}
.donut-legend-val{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--gray-900);font-size:11px}

/* Horizontal bar chart */
.hbar-item{margin-bottom:10px}
.hbar-label{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}
.hbar-name{color:var(--gray-700);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
.hbar-val{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--gray-900);font-size:11px;white-space:nowrap}
.hbar-track{background:var(--gray-100);border-radius:20px;height:7px;overflow:hidden}
.hbar-fill{height:100%;border-radius:20px;transition:width .5s ease}

/* Activity feed */
.activity-feed{display:flex;flex-direction:column;gap:0}
.activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:12px}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.activity-dot i[class*="ph-"]{font-size:13px}
.activity-body{flex:1;min-width:0}
.activity-title{font-weight:600;color:var(--gray-900);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-meta{color:var(--gray-400);font-size:11px}

/* Quick actions */
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa-btn{
  background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);
  padding:11px 12px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;
  color:var(--gray-700);transition:var(--transition);display:flex;align-items:center;gap:8px;
  text-align:right;
}
.qa-btn:hover{background:var(--brand-light);border-color:var(--brand);color:var(--brand)}
.qa-btn i[class*="ph-"]{font-size:15px}

/* Dash section header */
.dash-sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dash-sec-hdr h3{font-size:13px;font-weight:700;color:var(--gray-900);display:flex;align-items:center;gap:6px}
.dash-sec-hdr h3 i[class*="ph-"]{font-size:14px;color:var(--neutral-400)}

@media(max-width:900px){
  .dash-2col{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .dash-greeting{flex-direction:column;align-items:flex-start}
  .quick-actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sb-header">
      <div class="sb-logo">
        <div class="sb-logo-icon">ب</div>
        <span class="sb-logo-text">بُعد</span>
      </div>

    <div id="pg-clients"  class="page"></div>

</div>

<!-- Modal -->

  <div id="modal-box" class="modal-box"></div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
/* ═══════════════════════════════════════════
   DB LAYER
═══════════════════════════════════════════ */
var DB = {
  uid: function() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  },
  getClients: function() {
    try { return JSON.parse(localStorage.getItem('buad2_clients')||'[]'); } catch(e){ return []; }
  },
  saveClients: function(a) {
    localStorage.setItem('buad2_clients', JSON.stringify(a));
  },
  getProjects: function() {
    try { return JSON.parse(localStorage.getItem('buad2_projects')||'[]'); } catch(e){ return []; }
  },
  saveProjects: function(a) {
    localStorage.setItem('buad2_projects', JSON.stringify(a));
  },
  getFin: function(pid) {
    try {
      var d = JSON.parse(localStorage.getItem('buad2_fin_'+pid)||'null');
      if (d && typeof d==='object') return d;
    } catch(e){}
    return {
      ctrl: {
        contract_value:0, vat_pct:15, vat_type:'pct', vat_base:'gross',
        vat_included:false, exec_v:10, exec_type:'pct', exec_base:'gross',
        mkt_v:0, mkt_type:'pct', mkt_base:'gross', mkt_internal:false,
        cb_v:0, cb_type:'pct', cb_base:'gross',
        contract_no:'', contract_date:'', client_name_override:''
      },
      budget: [],
      entries: [],
      tasks: { tasks:[], 'req-us':[], 'req-cl':[] }
    };
  },
  saveFin: function(pid, d) {
    localStorage.setItem('buad2_fin_'+pid, JSON.stringify(d));
  }
};

/* ═══════════════════════════════════════════
   FINCALC
═══════════════════════════════════════════ */
var FinCalc = {
  calc: function(pid) {
    var fin = DB.getFin(pid);
    var c = fin.ctrl || {};
    var cv = parseFloat(c.contract_value)||0;
    var vatPct = parseFloat(c.vat_pct)||0;
    var vatIncluded = !!c.vat_included;
    var execV = parseFloat(c.exec_v)||0;
    var mktV = parseFloat(c.mkt_v)||0;
    var cbV = parseFloat(c.cb_v)||0;
    var isInternalMkt = !!c.mkt_internal;

    var contractNet, vatAmt;
    if (vatIncluded) {
      contractNet = cv / (1 + vatPct/100);
      vatAmt = cv - contractNet;
    } else {
      contractNet = cv;
      vatAmt = cv * vatPct / 100;
    }
    var grossTotal = contractNet + vatAmt;

    function _applyFee(v, type, base, net, gross) {
      if (type === 'fixed') return parseFloat(v) || 0;
      return (base === 'gross' ? gross : net) * (parseFloat(v) || 0) / 100;
    }
    var execAmt = _applyFee(c.exec_v, c.exec_type||'pct', c.exec_base||'net', contractNet, grossTotal);
    var mkt     = _applyFee(c.mkt_v,  c.mkt_type||'pct',  c.mkt_base||'net',  contractNet, grossTotal);
    var cb      = _applyFee(c.cb_v,   c.cb_type||'pct',   c.cb_base||'net',   contractNet, grossTotal);
    var cfAmt   = _applyFee(c.cf_v,   c.cf_type||'pct',   c.cf_base||'net',   contractNet, grossTotal);

    var budget = fin.budget || [];
    var budgetTotal = budget.reduce(function(s,b){ return s+(parseFloat(b.amount)||0); }, 0);

    var entries = fin.entries || [];
    var totalExpenses = entries.filter(function(e){ return e.type==='expense'; })
      .reduce(function(s,e){ return s+(parseFloat(e.amount)||0); }, 0);
    var totalIncome = entries.filter(function(e){ return e.type==='income'; })
      .reduce(function(s,e){ return s+(parseFloat(e.amount)||0); }, 0);
    var execIncomeReg = entries.filter(function(e){ return e.type==='income' && e.cat==='exec'; })
      .reduce(function(s,e){ return s+(parseFloat(e.amount)||0); }, 0);
    var profitMargins = entries.filter(function(e){ return e.type==='expense'; })
      .reduce(function(s,e){
        var pm = parseFloat(e.profit_margin)||0;
        var pmt = e.profit_margin_type||'pct';
        return s + (pmt==='fixed' ? pm : pm*(parseFloat(e.amount)||0)/100);
      }, 0);
    var nonExecInc = totalIncome - execIncomeReg;

    var execHasIncome = execIncomeReg > 0;
    var profit = execHasIncome
      ? Math.max(0, execIncomeReg + profitMargins + nonExecInc + (isInternalMkt ? mkt : 0))
      : Math.max(0, execAmt + profitMargins + nonExecInc + (isInternalMkt ? mkt : 0));

    var available  = contractNet - execAmt - mkt - cb - cfAmt;
    // المتبقي = إجمالي العقد − كل البنود المسجّلة (هامش الربح يُضاف للربح فقط ولا يُخصم مرة إضافية)
    var totalAllEntries = entries.reduce(function(s,e){ return s+(parseFloat(e.amount)||0); }, 0);
    var remaining  = grossTotal - totalAllEntries;

    // اكتشاف بنود الاتفاقية غير المسجّلة
    var regCats = entries.map(function(e){ return e.cat; });
    var missingItems = [];
    if (cfAmt > 0 && regCats.indexOf('cf') < 0) missingItems.push('ضريبة القيمة المضافة (الرسوم)');
    if (execAmt > 0 && regCats.indexOf('exec') < 0) missingItems.push('أتعاب التنفيذ');
    if (mkt > 0 && regCats.indexOf('mkt') < 0) missingItems.push('التسويق');
    if (cb > 0 && regCats.indexOf('cashback') < 0) missingItems.push('كاش باك');

    return {
      cv:cv, vatIncluded:vatIncluded, vatPct:vatPct, vatAmt:vatAmt,
      contractNet:contractNet, grossTotal:grossTotal,
      execAmt:execAmt, mkt:mkt, cb:cb,
      budgetTotal:budgetTotal, available:available,
      totalExpenses:totalExpenses, totalIncome:totalIncome, totalAllEntries:totalAllEntries,
      execIncomeReg:execIncomeReg, nonExecInc:nonExecInc,
      profitMargins:profitMargins,
      profit:profit, remaining:remaining,
      cfAmt:cfAmt,
      isInternalMkt:isInternalMkt, missingItems:missingItems
    };
  }
};

/* ═══════════════════════════════════════════
   NAV
═══════════════════════════════════════════ */
var Nav = {
  _cur: 'dash', _params: {},
  go: function(page, params) {
    Nav._cur = page; Nav._params = params||{};
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    document.querySelectorAll('.sb-item').forEach(function(a){ a.classList.remove('active'); });
    var el = document.getElementById('pg-'+page);
    if (el) el.classList.add('active');
    var navEl = document.getElementById('nav-'+page);
    if (navEl) navEl.classList.add('active');
    if (page==='client') { var ni=document.getElementById('nav-clients'); if(ni) ni.classList.add('active'); }
    if (page==='fin') { var ni2=document.getElementById('nav-projects'); if(ni2) ni2.classList.add('active'); }
    if (Pages['render_'+page]) Pages['render_'+page](params);
    Nav.updateBreadcrumb(page, params);
    var m = document.getElementById('pg-'+page);
    if (m) m.scrollTop = 0;
    Nav.closeSidebar();
  },
  updateBreadcrumb: function(page, params) {
    var bc = document.getElementById('breadcrumb');
    if (!bc) return;
    var icons = {dash:'squares-four', clients:'users-three', projects:'briefcase', settings:'gear-six'};
    var labels = {dash:'الرئيسية', clients:'العملاء', projects:'المشاريع', settings:'الإعدادات'};
    function iconHtml(n){ return n ? '<i class="ph-duotone ph-'+n+'" style="font-size:13px;opacity:.7;flex-shrink:0"></i>' : ''; }
    if (labels[page]) {
      bc.innerHTML = iconHtml(icons[page])+'<span class="bc-page">'+labels[page]+'</span>';
      return;
    }
    if (page==='client' && params && params.clientId) {
      var clients = DB.getClients();
      var cl = clients.find(function(c){ return c.id===params.clientId; });
      bc.innerHTML = iconHtml('users-three')+'<span onclick="Nav.go(\'clients\')" style="cursor:pointer;color:var(--primary-600)">العملاء</span><span class="bc-sep">/</span><span class="bc-page">'+(cl?UI.escHtml(cl.name):'عميل')+'</span>';
      return;
    }
    if (page==='fin' && params && params.projId) {
      var projects = DB.getProjects();
      var pr = projects.find(function(p){ return p.id===params.projId; });
      bc.innerHTML = iconHtml('briefcase')+'<span onclick="Nav.go(\'projects\')" style="cursor:pointer;color:var(--primary-600)">المشاريع</span><span class="bc-sep">/</span><span class="bc-page">'+(pr?UI.escHtml(pr.name):'مشروع')+'</span>';
      return;
    }
    bc.innerHTML='';
  },
  toggleSidebar: function() {
    var sb = document.getElementById('sidebar');
    if (sb.classList.contains('collapsed')) {
      sb.classList.remove('collapsed');
      localStorage.setItem('buad2_sb','0');
    } else {
      sb.classList.add('collapsed');
      localStorage.setItem('buad2_sb','1');
    }
  },
  openSidebar: function() {
    var sb = document.getElementById('sidebar');
    sb.classList.remove('collapsed');
    sb.classList.add('mobile-open');
    document.getElementById('sb-overlay').classList.add('active');
  },
  closeSidebar: function() {
    var sb = document.getElementById('sidebar');
    sb.classList.remove('mobile-open');
    document.getElementById('sb-overlay').classList.remove('active');
  }
};

/* ═══════════════════════════════════════════
   UI HELPERS
═══════════════════════════════════════════ */
var UI = {
  openModal: function(html) {
    document.getElementById('modal-box').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('active');
  },
  closeModal: function(e) {
    if (!e || e.target===document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('active');
      document.getElementById('modal-box').innerHTML = '';
    }
  },
  closeModalForce: function() {
    document.getElementById('modal-overlay').classList.remove('active');
    document.getElementById('modal-box').innerHTML = '';
  },
  toast: function(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type?' '+type:'');
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.className='toast'; }, 2800);
  },
  fmt: function(n) {
    n = parseFloat(n)||0;
    return n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
  },
  escHtml: function(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
};

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function statusBadge(s) {
  var map = {active:'نشط', completed:'مكتمل', paused:'متوقف', cancelled:'ملغي'};
  var cls = {active:'success', completed:'brand', paused:'warn', cancelled:'danger'};
  return '<span class="badge '+(cls[s]||'gray')+'">'+( map[s]||UI.escHtml(s))+'</span>';
}

function typeLabel(t) {
  var map = {training:'تدريب', consulting:'استشارات', event:'فعالية', other:'أخرى'};
  return map[t]||t||'—';
}

function clientTypeLabel(t) {
  var map = {'company':'شركة','association':'جمعية','government':'جهة حكومية','individual':'فرد','other':'أخرى'};
  return map[t]||t||'—';
}

function catLabel(c) {
  var map = {vat:'ضريبة', exec:'أتعاب', mkt:'تسويق', cashback:'كاش باك', cf:'ضريبة القيمة المضافة', salary:'رواتب', logistics:'لوجستيات', materials:'مواد', other:'أخرى'};
  return map[c]||c||'—';
}

function fmtDate(d) {
  if (!d) return '—';
  try {
    var parts = d.split('-');
    if (parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];
    return d;
  } catch(e){ return d; }
}

/* ═══════════════════════════════════════════
   PAGES
═══════════════════════════════════════════ */
var Pages = {};

/* ─── DASHBOARD v2 ─── */
Pages.render_dash = function() {
  var clients  = DB.getClients();
  var projects = DB.getProjects();

  /* ── KPIs ── */
  var activeProj    = projects.filter(function(p){ return p.status==='active'; });
  var completedProj = projects.filter(function(p){ return p.status==='completed'; });
  var pausedProj    = projects.filter(function(p){ return p.status==='paused'; });
  var cancelledProj = projects.filter(function(p){ return p.status==='cancelled'; });

  var totalContract = 0, totalProfit = 0, totalExpenses = 0;
  projects.forEach(function(p){
    var r = FinCalc.calc(p.id);
    totalContract += r.grossTotal      || 0;
    totalProfit   += r.profit          || 0;
    totalExpenses += r.totalExpenses   || 0;
  });
  var profitMargin = totalContract > 0 ? (totalProfit / totalContract * 100).toFixed(1) : '0';

  /* ── Date ── */
  var now = new Date();
  var days   = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var dateStr = days[now.getDay()] + '، ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  /* ── Top projects by contract value (horizontal bars) ── */
  var topProjects = projects.map(function(p){
    var r = FinCalc.calc(p.id);
    return { p:p, val:r.grossTotal||0, profit:r.profit||0 };
  }).sort(function(a,b){ return b.val - a.val; }).slice(0,5);
  var maxVal = topProjects.length ? topProjects[0].val : 1;
  var barColors = ['#00197D','#0230e0','#1a56fb','#4c7afc','#80a3fd'];

  var hbarRows = '';
  if (topProjects.length === 0) {
    hbarRows = '<div style="text-align:center;padding:28px 0;color:var(--gray-400);font-size:12px">لا توجد مشاريع بعد</div>';
  } else {
    topProjects.forEach(function(item, i){
      var pct = maxVal > 0 ? Math.round(item.val / maxVal * 100) : 0;
      hbarRows +=
        '<div class="hbar-item" onclick="Nav.go(\'fin\',{projId:\''+item.p.id+'\'})" style="cursor:pointer">' +
          '<div class="hbar-label">' +
            '<span class="hbar-name" title="'+UI.escHtml(item.p.name)+'">'+UI.escHtml(item.p.name)+'</span>' +
            '<span class="hbar-val">'+UI.fmt(item.val)+' ر.س</span>' +
          '</div>' +
          '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+barColors[i%5]+'"></div></div>' +
        '</div>';
    });
  }

function _buildDonut(segments, total) {
  if (!segments || segments.length === 0 || !total) {
    return '<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="40" fill="none" stroke="#E2E8F0" stroke-width="14"/><text x="55" y="60" text-anchor="middle" font-size="14" fill="#A0AEC0">0</text></svg>';
  }
  var r = 40, cx = 55, cy = 55, sw = 14;
  var circ = 2 * Math.PI * r;
  var offset = 0, paths = '';
  segments.forEach(function(seg){
    var pct   = seg.count / total;
    var dash  = pct * circ;
    var gap   = circ - dash;
    var angle = (offset / total) * 360 - 90;
    paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="'+sw+'" stroke-dasharray="'+dash.toFixed(2)+' '+gap.toFixed(2)+'" transform="rotate('+angle.toFixed(2)+' '+cx+' '+cy+')"/>';
    offset += seg.count;
  });
  return '<svg width="110" height="110" viewBox="0 0 110 110">' +
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#F0F2F5" stroke-width="'+sw+'"/>' +
    paths +
    '<text x="'+cx+'" y="'+(cy-5)+'" text-anchor="middle" font-size="18" font-weight="700" fill="#1A202C">'+total+'</text>' +
    '<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="10" fill="#A0AEC0">مشروع</text>' +
    '</svg>';
}

Pages.saveClient = function(editId) {
  var name = (document.getElementById('cl-name').value||'').trim();
  if (!name) { UI.toast('اسم العميل مطلوب','danger'); return; }
  var clients = DB.getClients();
  if (editId) {
    var idx = clients.findIndex(function(c){ return c.id===editId; });
    if (idx>=0) {
      clients[idx].name = name;
      clients[idx].type = document.getElementById('cl-type').value;
      clients[idx].email = document.getElementById('cl-email').value.trim();
      clients[idx].phone = document.getElementById('cl-phone').value.trim();
      clients[idx].city = document.getElementById('cl-city').value.trim();
    }
    UI.toast('تم تحديث بيانات العميل','success');
  } else {
    clients.push({
      id: DB.uid(), name: name,
      type: document.getElementById('cl-type').value,
      email: document.getElementById('cl-email').value.trim(),
      phone: document.getElementById('cl-phone').value.trim(),
      city: document.getElementById('cl-city').value.trim(),
      created: new Date().toISOString().slice(0,10)
    });
    UI.toast('تم إضافة العميل','success');
  }
  DB.saveClients(clients);
  UI.closeModalForce();
  if (Nav._cur==='clients') Pages.render_clients();
  else if (Nav._cur==='client') Pages.render_client(Nav._params);
};

Pages.deleteClient = function(id) {
  var clients = DB.getClients();
  var cl = clients.find(function(c){ return c.id===id; });
  if (!cl) return;
  if (!confirm('هل تريد حذف العميل "'+cl.name+'"؟ سيتم حذف جميع مشاريعه أيضاً.')) return;
  var projs = DB.getProjects().filter(function(p){ return p.client_id!==id; });
  DB.saveProjects(projs);
  DB.saveClients(clients.filter(function(c){ return c.id!==id; }));
  UI.toast('تم الحذف');
  Pages.render_clients();
};

Pages.saveProject = function(presetClientId) {
  var clientId = presetClientId;
  if (!clientId) {
    var sel = document.getElementById('proj-client');
    clientId = sel ? sel.value : '';
  }
  if (!clientId) { UI.toast('يرجى اختيار العميل','danger'); return; }
  var name = (document.getElementById('proj-name').value||'').trim();
  if (!name) { UI.toast('اسم المشروع مطلوب','danger'); return; }
  var proj = {
    id: DB.uid(),
    client_id: clientId,
    name: name,
    type: document.getElementById('proj-type').value,
    status: document.getElementById('proj-status').value,
    notes: document.getElementById('proj-notes').value.trim(),
    created: new Date().toISOString().slice(0,10)
  };
  var projects = DB.getProjects();
  projects.push(proj);
  DB.saveProjects(projects);
  UI.toast('تم إضافة المشروع','success');
  UI.closeModalForce();
  if (Nav._cur==='projects') Pages.render_projects();
  else if (Nav._cur==='client') Pages.render_client(Nav._params);
  else if (Nav._cur==='dash') Pages.render_dash();
};

function _calcTrailHtml(r, c) {
  function feeLabel(v, type, base) {
    if (type === 'fixed') return UI.fmt(v) + ' ر.س ثابت';
    return (parseFloat(v)||0) + '% ' + (base === 'gross' ? 'من الإجمالي' : 'من الصافي');
  }
  function row(sign, lbl, formula, val, col, divider) {
    var valStyle = col==='red' ? 'color:var(--danger)' : col==='green' ? 'color:var(--success)' : col==='brand' ? 'color:var(--brand)' : 'color:var(--gray-900)';
    var rowCls = 'calc-trail-row' + (divider ? ' ct-divider' : '');
    return '<div class="'+rowCls+'">' +
      '<span class="calc-trail-sign">'+(sign||'')+'</span>' +
      '<span class="calc-trail-lbl">'+lbl+(formula?'<span class="calc-trail-formula"> ('+formula+')</span>':'')+'</span>' +
      '<span class="calc-trail-val" style="'+valStyle+'">'+UI.fmt(val)+' ر.س</span>' +
    '</div>';
  }
  var vatLabel = (r.vatPct||0) + '% ' + (r.vatIncluded ? 'مستخرجة' : 'مضافة');
  var available = r.contractNet - r.execAmt - r.mkt - r.cb - r.cfAmt;
  var html = '<div class="calc-trail" id="calc-trail-inner">';
  html += row('', 'قيمة العقد المدخلة', '', r.cv, 'brand');
  html += row('−', 'ضريبة القيمة المضافة', vatLabel, r.vatAmt, 'red');
  html += row('=', 'صافي العقد', '', r.contractNet, '', true);
  if ((parseFloat(c.exec_v)||0) > 0) html += row('−', 'أتعاب التنفيذ', feeLabel(c.exec_v, c.exec_type||'pct', c.exec_base||'net'), r.execAmt, 'red');
  if ((parseFloat(c.mkt_v)||0) > 0)  html += row('−', 'التسويق', feeLabel(c.mkt_v, c.mkt_type||'pct', c.mkt_base||'net')+(c.mkt_internal?' — داخلي':''), r.mkt, 'red');
  if ((parseFloat(c.cb_v)||0) > 0)   html += row('−', 'كاش باك', feeLabel(c.cb_v, c.cb_type||'pct', c.cb_base||'net'), r.cb, 'red');
  if ((parseFloat(c.cf_v)||0) > 0)   html += row('−', 'ضريبة القيمة المضافة', feeLabel(c.cf_v, c.cf_type||'pct', c.cf_base||'net'), r.cfAmt, 'red');
  html += row('=', 'المتاح للتنفيذ', '', available, available >= 0 ? 'green' : 'red', true);
  html += '</div>';
  return html;
}

Pages.autoSaveCtrl = function(projId) {
  var fin = DB.getFin(projId);
  fin.ctrl = fin.ctrl||{};
  var g = function(id){ var e=document.getElementById(id); return e?e.value:''; };
  var chk = function(id){ var e=document.getElementById(id); return e?e.checked:false; };
  fin.ctrl.contract_no    = g('fc-no');
  fin.ctrl.contract_date  = g('fc-date');
  fin.ctrl.cv_locked      = chk('fc-cvlock');
  if (!fin.ctrl.cv_locked) fin.ctrl.contract_value = parseFloat(g('fc-cv'))||0;
  fin.ctrl.vat_included   = chk('fc-vatinc');
  fin.ctrl.vat_pct        = parseFloat(g('fc-vatp'))||15;
  fin.ctrl.exec_v         = parseFloat(g('fc-execv'))||0;
  fin.ctrl.exec_type      = g('fc-exect')||'pct';
  fin.ctrl.exec_base      = g('fc-execb')||'net';
  fin.ctrl.mkt_v          = parseFloat(g('fc-mktv'))||0;
  fin.ctrl.mkt_type       = g('fc-mktt')||'pct';
  fin.ctrl.mkt_base       = g('fc-mktb')||'net';
  fin.ctrl.mkt_internal   = chk('fc-mkti');
  fin.ctrl.cb_v           = parseFloat(g('fc-cbv'))||0;
  fin.ctrl.cb_type        = g('fc-cbt')||'pct';
  fin.ctrl.cb_base        = g('fc-cbb')||'net';
  fin.ctrl.cf_v           = parseFloat(g('fc-cfv'))||0;
  fin.ctrl.cf_type        = g('fc-cft')||'pct';
  fin.ctrl.cf_base        = g('fc-cfb')||'net';
  DB.saveFin(projId, fin);
  var r = FinCalc.calc(projId);
  var c = fin.ctrl;
  // Update stat cards in control panel
  var ctrlBox = document.getElementById(Pages._ctrlContainer||'ctrl-drawer-body');
  var statVals = [r.contractNet, r.totalExpenses, r.profit, r.remaining];
  if (ctrlBox) {
    ctrlBox.querySelectorAll('.stat-card .stat-card-value').forEach(function(el,i){
      if (statVals[i]!==undefined) el.textContent = UI.fmt(statVals[i]);
    });
    ctrlBox.querySelectorAll('.stat-card:first-child .stat-card-sub').forEach(function(el){
      el.textContent = UI.fmt(r.grossTotal)+' شاملاً الضريبة';
    });
    ctrlBox.querySelectorAll('.stat-card:last-child .stat-card-sub').forEach(function(el){
      el.textContent = 'من إجمالي العقد '+UI.fmt(r.grossTotal)+(r.totalAllEntries>0?' − بنود '+UI.fmt(r.totalAllEntries):'');
    });
  }
  // Update hero stats bar
  var phsC = document.getElementById('phs-contract'); if(phsC) phsC.textContent = UI.fmt(r.grossTotal);
  var phsR = document.getElementById('phs-remaining'); if(phsR) phsR.textContent = UI.fmt(r.remaining);
  var phsP = document.getElementById('phs-profit'); if(phsP) phsP.textContent = UI.fmt(r.profit);
  // Update calc trail
  var oldTrail = document.getElementById('calc-trail-inner');
  if (oldTrail) oldTrail.outerHTML = _calcTrailHtml(r, c);
  // Update fee amount badges
  var amtEl;
  amtEl = document.getElementById('fc-execb-amt'); if(amtEl) amtEl.textContent = UI.fmt(r.execAmt)+' ر.س';
  amtEl = document.getElementById('fc-mktb-amt');  if(amtEl) amtEl.textContent = UI.fmt(r.mkt)+' ر.س';
  amtEl = document.getElementById('fc-cbb-amt');   if(amtEl) amtEl.textContent = UI.fmt(r.cb)+' ر.س';
  amtEl = document.getElementById('fc-cfb-amt');   if(amtEl) amtEl.textContent = UI.fmt(r.cfAmt)+' ر.س';
};

Pages.addBudgetRow = function(projId) {
  var fin = DB.getFin(projId);
  fin.budget = fin.budget||[];
  fin.budget.push({name:'', amount:0, note:''});
  DB.saveFin(projId, fin);
  Pages.renderFinCtrl(projId);
};

Pages.applyCtrlLock = function() {
  var locked = !!(document.getElementById('fc-cvlock')||{}).checked;
  var inp = document.getElementById('fc-cv');
  if (inp) {
    inp.readOnly = locked;
    inp.style.background = locked ? 'var(--gray-100)' : '';
    inp.style.cursor = locked ? 'not-allowed' : '';
  }
};

Pages.updateBudget = function(projId, idx, field, value) {
  var fin = DB.getFin(projId);
  fin.budget = fin.budget||[];
  if (fin.budget[idx]) fin.budget[idx][field] = field==='amount' ? (parseFloat(value)||0) : value;
  DB.saveFin(projId, fin);
};

Pages.deleteBudgetRow = function(projId, idx) {
  var fin = DB.getFin(projId);
  fin.budget = fin.budget||[];
  fin.budget.splice(idx,1);
  DB.saveFin(projId, fin);
  Pages.renderFinCtrl(projId);
};

/* ─── ENTRIES TAB ─── */
Pages.renderFinEntries = function(projId) {
  var fin = DB.getFin(projId);
  var entries = fin.entries||[];
  var filter = window._entriesFilter||'all';
  var search = window._entriesSearch||'';

  var filtered = entries.filter(function(e){
    var typeOk = filter==='all' || e.type===filter;
    var searchOk = !search || (e.desc||'').indexOf(search)>=0 || (e.cat||'').indexOf(search)>=0;
    return typeOk && searchOk;
  });

  var r = FinCalc.calc(projId);
  var profitPct = r.contractNet>0 ? (r.profit/r.contractNet*100).toFixed(1) : '0';
  var expCount = entries.filter(function(e){return e.type==='expense';}).length;

  var rows = '';
  if (filtered.length===0) {
    rows = '<tr><td colspan="4"><div class="empty-state" style="padding:32px"><div class="empty-state-icon"><i class="ph-duotone ph-receipt"></i></div><h3>لا توجد قيود</h3><p>أضف أول بند مالي</p></div></td></tr>';
  } else {
    var statusLabel = {paid:'مدفوع', pending:'معلق', cancelled:'ملغي'};
    filtered.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).forEach(function(e){
      var isIncome = e.type==='income';
      var typeBadge = isIncome ? '<span class="badge success" style="font-size:10px;padding:2px 8px">دخل</span>'
                                : '<span class="badge danger" style="font-size:10px;padding:2px 8px">مصروف</span>';
      var amtCls = isIncome ? 'amount-income' : 'amount-expense';
      var amtSign = isIncome ? '+' : '−';
      var pm = parseFloat(e.profit_margin)||0;
      var pmText = pm>0 ? (e.profit_margin_type==='fixed'?UI.fmt(pm)+' ر.س':pm+'%') : '';
      var stBadge = statusLabel[e.status] ? '<span class="badge gray" style="font-size:10px;padding:2px 7px">'+statusLabel[e.status]+'</span>' : '<span style="color:var(--gray-300)">—</span>';
      var agrMark = e.note==='من الاتفاقية' ? ' <span class="badge brand" style="font-size:9px;padding:1px 5px;vertical-align:middle">اتفاقية</span>' : '';
      // Main row
      rows +=
        '<tr class="er '+(isIncome?'income-row':'expense-row')+'" id="er-'+e.id+'" onclick="Pages.toggleEntryRow(\''+e.id+'\')">' +
          '<td style="overflow:hidden;text-overflow:ellipsis;max-width:0">' +
            '<span style="font-weight:600;color:var(--gray-900)">'+UI.escHtml(e.desc||'')+'</span>' +
            agrMark +
          '</td>' +
          '<td class="col-cat" style="display:table-cell">' +
            '<span class="badge gray" style="font-size:10px;padding:2px 7px">'+catLabel(e.cat)+'</span>' +
          '</td>' +
          '<td class="col-amt mono '+amtCls+'" style="font-size:13px;letter-spacing:-.3px">'+amtSign+' '+UI.fmt(e.amount)+'</td>' +
          '<td class="col-date" style="font-size:11.5px;color:var(--gray-400)">'+fmtDate(e.date)+'</td>' +
          '<td class="col-chev"><span class="entry-chev" id="chev-'+e.id+'"><i class="ph-bold ph-caret-down"></i></span></td>' +
        '</tr>' +
        // Expandable detail row
        '<tr class="ed" id="ed-'+e.id+'">' +
          '<td colspan="5">' +
            '<div class="entry-detail-grid">' +
              '<div class="entry-detail-item"><div class="edi-lbl">النوع</div><div class="edi-val">'+typeBadge+'</div></div>' +
              '<div class="entry-detail-item"><div class="edi-lbl">الحالة</div><div class="edi-val">'+stBadge+'</div></div>' +
              (pmText?'<div class="entry-detail-item"><div class="edi-lbl">هامش الربح</div><div class="edi-val" style="color:var(--success);font-family:monospace">'+pmText+'</div></div>':'') +
              (e.note&&e.note!=='من الاتفاقية'?'<div class="entry-detail-item"><div class="edi-lbl">ملاحظة</div><div class="edi-val">'+UI.escHtml(e.note)+'</div></div>':'') +
              '<div style="margin-right:auto;display:flex;gap:6px;align-items:center">' +
                '<button class="btn btn-sm" onclick="event.stopPropagation();Pages.editEntryModal(\''+projId+'\',\''+e.id+'\')" style="display:inline-flex;align-items:center;gap:4px"><i class="ph ph-pencil-simple" style="font-size:12px"></i>تعديل</button>' +
                '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();Pages.deleteEntry(\''+projId+'\',\''+e.id+'\')" style="display:inline-flex;align-items:center;gap:4px"><i class="ph ph-trash" style="font-size:12px"></i>حذف</button>' +
              '</div>' +
            '</div>' +
          '</td>' +
        '</tr>';
    });
  }

  var warnHtml = '';
  if (r.missingItems && r.missingItems.length > 0) {
    warnHtml = '<div class="alert-notice">⚠️ لم تُسجَّل بعد: '+r.missingItems.join('، ')+' — <button class="btn btn-sm" style="padding:2px 10px;margin-right:8px" onclick="Pages.addEntryModal(\''+projId+'\');Pages.switchEntryTab(\'contract\')">تسجيل الآن</button></div>';
  }

  var incCount = entries.filter(function(e){return e.type==='income';}).length;

  document.getElementById('fin-tab-entries').innerHTML =
    warnHtml +

    /* ── KPI strip ── */
    '<div class="fin-stat-strip">' +
      '<div class="fsi fsi-brand">' +
        '<div class="fsi-lbl">إجمالي العقد</div>' +
        '<div class="fsi-val">'+UI.fmt(r.grossTotal)+'</div>' +
        '<div class="fsi-sub">ر.س</div>' +
      '</div>' +
      '<div class="fsi fsi-success">' +
        '<div class="fsi-lbl">إجمالي الدخل</div>' +
        '<div class="fsi-val">'+UI.fmt(r.totalIncome)+'</div>' +
        '<div class="fsi-sub">'+incCount+' بنود دخل</div>' +
      '</div>' +
      '<div class="fsi fsi-danger">' +
        '<div class="fsi-lbl">إجمالي المصاريف</div>' +
        '<div class="fsi-val">'+UI.fmt(r.totalExpenses)+'</div>' +
        '<div class="fsi-sub">'+expCount+' بنود مصروف</div>' +
      '</div>' +
      '<div class="fsi '+(r.remaining<0?'fsi-danger':'fsi-warn')+'">' +
        '<div class="fsi-lbl">المتبقي'+(r.remaining<0?' ⚠':'')+'</div>' +
        '<div class="fsi-val">'+UI.fmt(r.remaining)+'</div>' +
        '<div class="fsi-sub">هامش '+profitPct+'%</div>' +
      '</div>' +
    '</div>' +

    /* ── Toolbar ── */
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">' +
      /* Filter pills */
      '<div style="display:flex;gap:4px;background:var(--gray-100);border-radius:8px;padding:3px">' +
        '<button class="tab-btn'+(filter==='all'?' active':'')+'" style="padding:5px 12px;font-size:11.5px" onclick="window._entriesFilter=\'all\';Pages.renderFinEntries(\''+projId+'\')">الكل <span style="font-family:monospace;font-size:10px;margin-right:2px">('+entries.length+')</span></button>' +
        '<button class="tab-btn'+(filter==='income'?' active':'')+'" style="padding:5px 12px;font-size:11.5px;color:var(--success)" onclick="window._entriesFilter=\'income\';Pages.renderFinEntries(\''+projId+'\')">دخل</button>' +
        '<button class="tab-btn'+(filter==='expense'?' active':'')+'" style="padding:5px 12px;font-size:11.5px;color:var(--danger)" onclick="window._entriesFilter=\'expense\';Pages.renderFinEntries(\''+projId+'\')">مصروف</button>' +
      '</div>' +
      /* Search */
      '<div style="position:relative;flex:1;min-width:140px;max-width:220px">' +
        '<i class="ph ph-magnifying-glass" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--gray-400);pointer-events:none"></i>' +
        '<input class="field-input" style="padding-right:32px;width:100%;font-size:12px" placeholder="بحث في البيانات..." value="'+UI.escHtml(search)+'" oninput="window._entriesSearch=this.value;Pages.renderFinEntries(\''+projId+'\')">' +
      '</div>' +
      /* Actions */
      '<div style="margin-right:auto;display:flex;gap:6px;align-items:center">' +
        '<button class="btn btn-sm" onclick="Pages.exportCSV(\''+projId+'\')" title="تصدير CSV" style="display:inline-flex;align-items:center;gap:5px"><i class="ph-bold ph-download-simple" style="font-size:13px"></i>تصدير</button>' +
        '<button class="btn btn-sm btn-primary" onclick="Pages.addEntryModal(\''+projId+'\')" style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 16px">' +
          '<i class="ph-fill ph-plus-circle" style="font-size:15px"></i>إضافة بند' +
        '</button>' +
      '</div>' +
    '</div>' +

    /* ── Table ── */
    '<div class="card" style="padding:0;overflow:hidden">' +
      '<div class="tbl-responsive"><table class="entry-tbl">' +
        '<thead><tr>' +
          '<th>البيان</th>' +
          '<th class="col-cat" style="display:table-cell">التصنيف</th>' +
          '<th class="col-amt" style="text-align:left">المبلغ</th>' +
          '<th class="col-date">التاريخ</th>' +
          '<th class="col-chev"></th>' +
        '</tr></thead>' +

      '</table></div>' +
    '</div>'  +

    /* Empty state if needed */
    (filtered.length===0&&entries.length>0?'<div style="text-align:center;padding:12px 0;font-size:12px;color:var(--gray-400)">لا توجد نتائج للفلتر الحالي</div>':'');

};

Pages.toggleProfitField = function() {
  var has = document.getElementById('ent-has-pm');

  if (has && row) row.style.display = has.checked ? '' : 'none';
};

Pages.switchEntryTab = function(tab) {
  document.getElementById('entry-new-tab').style.display = tab==='new'?'block':'none';
  document.getElementById('entry-contract-tab').style.display = tab==='contract'?'block':'none';
  document.getElementById('entry-modal-footer').style.display = tab==='new'?'flex':'none';
  document.getElementById('etab-new').classList.toggle('active',tab==='new');
  document.getElementById('etab-contract').classList.toggle('active',tab==='contract');
};

Pages.registerContractItem = function(projId, cat, amount, nameOverride) {
  var typeMap = {exec:'income', vat:'expense', mkt:'expense', cashback:'expense', cf:'expense'};
  var descMap = {exec:'أتعاب التنفيذ', vat:'ضريبة القيمة المضافة', mkt:'تسويق', cashback:'كاش باك', cf:'ضريبة القيمة المضافة'};
  var fin = DB.getFin(projId);
  fin.entries = fin.entries||[];
  fin.entries.push({
    id: DB.uid(),
    date: new Date().toISOString().slice(0,10),
    desc: nameOverride || descMap[cat] || cat,
    cat: cat,
    type: typeMap[cat]||'expense',
    amount: amount,
    profit_margin: 0,
    status: 'paid',
    note: 'من الاتفاقية'
  });
  DB.saveFin(projId, fin);
  UI.toast('تم تسجيل البند','success');
  UI.closeModalForce();
  Pages.renderFinEntries(projId);
};

Pages.saveEntry = function(projId) {
  var desc = (document.getElementById('ent-desc').value||'').trim();
  var amount = parseFloat(document.getElementById('ent-amount').value)||0;
  if (!desc) { UI.toast('الوصف مطلوب','danger'); return; }
  if (amount<=0) { UI.toast('المبلغ يجب أن يكون أكبر من صفر','danger'); return; }
  var fin = DB.getFin(projId);
  fin.entries = fin.entries||[];
  fin.entries.push({
    id: DB.uid(),
    date: document.getElementById('ent-date').value,
    desc: desc,
    cat: document.getElementById('ent-cat').value,
    type: document.getElementById('ent-type').value,
    amount: amount,
    profit_margin: (document.getElementById('ent-has-pm')&&document.getElementById('ent-has-pm').checked) ? (parseFloat(document.getElementById('ent-pm').value)||0) : 0,
    profit_margin_type: (document.getElementById('ent-pmt') ? document.getElementById('ent-pmt').value : 'pct')||'pct',
    status: document.getElementById('ent-status').value,
    note: document.getElementById('ent-note').value.trim()
  });
  DB.saveFin(projId, fin);
  UI.toast('تم حفظ القيد','success');
  UI.closeModalForce();
  Pages.renderFinEntries(projId);
};

Pages.editEntryModal = function(projId, entId) {
  var fin = DB.getFin(projId);
  var e = (fin.entries||[]).find(function(x){ return x.id===entId; });
  if (!e) return;
  var hasPm = (parseFloat(e.profit_margin)||0) > 0;
