<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6D5CDD">
<title>بُعد — إدارة مالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root {
  /* ── Iris — accent (Axis Design System) ── */
  --iris-50:  oklch(0.97 0.025 275);
  --iris-100: oklch(0.93 0.05  275);
  --iris-200: oklch(0.86 0.10  275);
  --iris-300: oklch(0.78 0.15  275);
  --iris-500: oklch(0.62 0.21  275);
  --iris-600: oklch(0.56 0.21  275);
  --iris-700: oklch(0.48 0.19  275);

  /* ── Neutrals — cool cast ── */
  --neutral-50:  oklch(0.985 0.003 260);
  --neutral-100: oklch(0.97  0.004 260);
  --neutral-200: oklch(0.93  0.005 260);
  --neutral-300: oklch(0.88  0.006 260);
  --neutral-400: oklch(0.74  0.008 260);
  --neutral-500: oklch(0.60  0.010 260);
  --neutral-600: oklch(0.49  0.011 260);
  --neutral-700: oklch(0.38  0.012 260);
  --neutral-800: oklch(0.28  0.012 260);
  --neutral-900: oklch(0.20  0.012 260);
  --neutral-950: oklch(0.14  0.012 260);

  /* ── Semantic ── */
  --success-500: oklch(0.68 0.16 155);
  --success-600: oklch(0.62 0.16 155);
  --success-700: oklch(0.55 0.15 155);
  --success-50:  oklch(0.97 0.04 155);
  --success-100: oklch(0.94 0.06 155);
  --warning-500: oklch(0.78 0.16  75);
  --warning-600: oklch(0.70 0.15  75);
  --warning-700: oklch(0.60 0.14  75);
  --warning-50:  oklch(0.98 0.04  75);
  --warning-100: oklch(0.95 0.07  75);
  --danger-500:  oklch(0.62 0.21  25);
  --danger-600:  oklch(0.55 0.21  25);
  --danger-700:  oklch(0.47 0.19  25);
  --danger-50:   oklch(0.97 0.04  25);
  --danger-100:  oklch(0.94 0.07  25);
  --info-500:    oklch(0.68 0.14 230);
  --info-600:    oklch(0.60 0.14 230);
  --info-700:    oklch(0.52 0.13 230);
  --info-50:     oklch(0.97 0.04 230);
  --info-100:    oklch(0.94 0.06 230);

  /* ── Accent (teal — secondary) ── */
  --accent-50:  oklch(0.97 0.04 185);
  --accent-500: oklch(0.68 0.16 185);
  --accent-600: oklch(0.60 0.15 185);
  --accent-700: oklch(0.52 0.14 185);

  /* ── Surfaces ── */
  --surface-0: white;
  --surface-1: white;
  --surface-2: white;

  /* ── Foreground ── */
  --fg-1: var(--neutral-950);
  --fg-2: var(--neutral-700);
  --fg-3: var(--neutral-500);
  --fg-4: var(--neutral-400);

  /* ── Borders ── */
  --border-subtle:  var(--neutral-200);
  --border-default: var(--neutral-300);

  /* ── Fonts (Axis) ── */
  --font-sans:  'Inter', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;

  /* ── Typography Scale (Axis: 12/13/14/16/18/20/24/30/36) ── */
  --font-2xs:  12px;
  --font-xs:   13px;
  --font-sm:   14px;
  --font-base: 14px;
  --font-md:   16px;
  --font-lg:   18px;
  --font-xl:   20px;
  --font-2xl:  24px;
  --font-3xl:  clamp(24px, 2.4vw + 14px, 30px);
  --font-4xl:  clamp(28px, 4vw + 16px, 36px);
  --font-5xl:  clamp(34px, 5vw + 18px, 48px);

  --lh-tight:   1.2;
  --lh-snug:    1.4;
  --lh-normal:  1.65;
  --lh-relaxed: 1.75;

  /* ── Spacing (8pt grid) ── */
  --space-0_5: 2px;   --space-1: 4px;    --space-1_5: 6px;
  --space-2:   8px;   --space-2_5: 10px; --space-3:   12px;
  --space-3_5: 14px;  --space-4: 16px;
  --space-5:   20px;  --space-6: 24px;   --space-8:   32px;
  --space-10:  40px;  --space-12: 48px;  --space-16:  64px;

  /* ── Radii (Axis) ── */
  --radius-xs:   4px;
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   16px;
  --radius-2xl:  20px;
  --radius-full: 9999px;

  /* ── Shadows (Axis oklch-based) ── */
  --shadow-xs:    0 1px 2px oklch(0.14 0.012 260 / 0.06);
  --shadow-sm:    0 1px 3px oklch(0.14 0.012 260 / 0.08), 0 1px 2px -1px oklch(0.14 0.012 260 / 0.04);
  --shadow-md:    0 4px 8px -2px oklch(0.14 0.012 260 / 0.10), 0 2px 4px -2px oklch(0.14 0.012 260 / 0.06);
  --shadow-lg:    0 12px 24px -6px oklch(0.14 0.012 260 / 0.12);
  --shadow-xl:    0 24px 48px -12px oklch(0.14 0.012 260 / 0.14);
  --shadow-focus: 0 0 0 3px oklch(0.62 0.21 275 / 0.25);
  --shadow-brand: 0 8px 24px -8px oklch(0.62 0.21 275 / 0.40);

  /* ── Motion (Axis) ── */
  --duration-micro: 120ms;
  --duration-small: 200ms;
  --duration-large: 320ms;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --transition-fast: var(--duration-micro) var(--ease-out);
  --transition:      var(--duration-small) var(--ease-out);
  --transition-slow: var(--duration-large) var(--ease-out);

  /* ── Layout ── */
  --sidebar-w:   260px;
  --sidebar-col: 64px;
  --topbar-h:    56px;
  --container-pad: clamp(16px, 3vw, 28px);

  /* ── Backward-compat aliases ── */
  --primary-50:  var(--iris-50);
  --primary-100: var(--iris-100);
  --primary-200: var(--iris-200);
  --primary-300: var(--iris-300);
  --primary-400: var(--iris-300);
  --primary-500: var(--iris-500);
  --primary-600: var(--iris-500);
  --primary-700: var(--iris-600);
  --primary-800: var(--iris-700);
  --primary-900: var(--iris-700);
  --primary-950: var(--iris-700);
  --neutral-0:   white;
  --bg-app:      var(--surface-0);
  --bg-elevated: var(--surface-1);
  --bg-subtle:   var(--neutral-100);
  --bg-muted:    var(--neutral-200);
  --border:      var(--border-subtle);
  --border-hover:var(--border-default);
  --text:        var(--fg-1);
  --text-strong: var(--fg-1);
  --text-muted:  var(--fg-2);
  --text-subtle: var(--fg-3);
  --font-ui:     var(--font-sans);
  --font-latin:  var(--font-sans);
  --brand:       var(--iris-500);
  --brand-light: var(--iris-50);
  --brand-hover: var(--iris-600);
  --success:     var(--success-500);
  --success-light:var(--success-50);
  --danger:      var(--danger-500);
  --danger-light:var(--danger-50);
  --warn:        var(--warning-500);
  --warn-light:  var(--warning-50);
  --gray-50:  var(--neutral-50);  --gray-100: var(--neutral-100);
  --gray-200: var(--neutral-200); --gray-300: var(--neutral-300);
  --gray-400: var(--neutral-400); --gray-500: var(--neutral-500);
  --gray-700: var(--neutral-700); --gray-800: var(--neutral-800);
  --gray-900: var(--neutral-900);
  --radius:   var(--radius-md);
  --shadow:   var(--shadow-sm);
}

/* Dark mode (Axis) */
[data-theme="dark"] {
  --surface-0: var(--neutral-950);
  --surface-1: oklch(0.18 0.012 260);
  --fg-1: var(--neutral-50);
  --fg-2: var(--neutral-300);
  --fg-3: var(--neutral-500);
  --border-subtle:  oklch(0.27 0.012 260);
  --border-default: oklch(0.35 0.012 260);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:var(--font-sans);direction:rtl;
  background:var(--surface-0);color:var(--fg-1);
  font-size:var(--font-sm);line-height:var(--lh-normal);
  font-feature-settings:"kern" 1,"liga" 1,"lnum" 1;
}
a{text-decoration:none;color:inherit;cursor:pointer}
button{font-family:inherit}

/* Focus ring (Axis) */
:focus-visible{outline:none;box-shadow:var(--shadow-focus);border-radius:var(--radius-sm)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{box-shadow:var(--shadow-focus)}

/* Skip-to-content */
.skip-link{position:absolute;top:-40px;inset-inline-start:8px;background:var(--iris-500);color:#fff;padding:8px 16px;border-radius:var(--radius-sm);z-index:9999;font-size:var(--font-sm);font-weight:600;transition:top var(--transition)}
.skip-link:focus{top:8px}

/* Lucide icon base (Axis) */
[data-lucide]{
  display:inline-flex;align-items:center;justify-content:center;
  width:1em;height:1em;stroke-width:1.5;
  vertical-align:middle;flex-shrink:0;
  pointer-events:none;
}

/* ── App shell ── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar (Axis) ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--neutral-50);
  border-inline-start:1px solid var(--border-subtle);
  display:flex;flex-direction:column;
  transition:width var(--transition);
  overflow:hidden;position:relative;z-index:200;
}
.sidebar.collapsed{width:var(--sidebar-col)}

.sb-header{
  display:flex;align-items:center;gap:var(--space-2);
  padding:var(--space-4) var(--space-3) var(--space-3);
  flex-shrink:0;
}
.sb-logo{display:flex;align-items:center;gap:var(--space-2);flex:1;overflow:hidden;white-space:nowrap;min-width:0}
.sb-logo-icon{
  width:32px;height:32px;border-radius:var(--radius-sm);
  background:var(--iris-500);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:#fff;flex-shrink:0;
  letter-spacing:-.5px;
}
.sb-logo-text{font-size:var(--font-md);font-weight:700;color:var(--fg-1);opacity:1;transition:opacity var(--transition);letter-spacing:-.2px}
.sidebar.collapsed .sb-logo-text,
.sidebar.collapsed .sb-version{opacity:0;pointer-events:none;width:0;overflow:hidden}

.sb-version{
  font-family:var(--font-mono);font-size:10px;font-weight:500;
  color:var(--fg-3);background:var(--bg-elevated);
  border:1px solid var(--border);padding:1px 6px;
  border-radius:var(--radius-xs);letter-spacing:0;
  flex-shrink:0;transition:opacity var(--transition);
}

.sb-toggle{
  background:transparent;border:none;color:var(--fg-4);
  cursor:pointer;width:28px;height:28px;border-radius:var(--radius-sm);
  transition:var(--transition-fast);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.sb-toggle:hover{background:var(--neutral-100);color:var(--fg-2)}
.sb-toggle [data-lucide]{font-size:16px;width:16px;height:16px;transition:transform var(--transition)}
.sidebar.collapsed .sb-toggle [data-lucide]{transform:scaleX(-1)}

/* ── Sidebar search ── */
.sb-search{
  position:relative;padding:0 var(--space-3) var(--space-3);
  flex-shrink:0;transition:opacity var(--transition);
}
.sidebar.collapsed .sb-search{opacity:0;height:0;padding:0;overflow:hidden;pointer-events:none}
.sb-search-input{
  width:100%;height:32px;
  padding:0 32px 0 var(--space-2);
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  font-size:var(--font-xs);color:var(--fg-1);
  font-family:inherit;
  transition:border-color var(--transition-fast),box-shadow var(--transition-fast);
}
.sb-search-input::placeholder{color:var(--fg-4)}
.sb-search-input:focus{outline:none;border-color:var(--iris-500);box-shadow:var(--shadow-focus)}
.sb-search-icon{
  position:absolute;inset-inline-start:calc(var(--space-3) + 10px);top:0;height:32px;
  width:14px;color:var(--fg-4);pointer-events:none;
  display:flex;align-items:center;
}
.sb-search-icon [data-lucide]{width:14px;height:14px}
.sb-search-kbd{
  position:absolute;inset-inline-end:calc(var(--space-3) + 8px);top:50%;transform:translateY(-50%);
  font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--fg-3);
  background:var(--neutral-100);border:1px solid var(--border);
  padding:0 5px;height:18px;border-radius:var(--radius-xs);
  display:inline-flex;align-items:center;letter-spacing:0;
  pointer-events:none;
}

.sb-nav{flex:1;padding:var(--space-2) var(--space-2) var(--space-3);overflow-y:auto;overflow-x:hidden}
.sb-nav::-webkit-scrollbar{width:4px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--neutral-200);border-radius:2px}
.sb-nav::-webkit-scrollbar-thumb:hover{background:var(--neutral-300)}

.sb-section-label{
  font-size:var(--font-2xs);font-weight:500;letter-spacing:0;
  color:var(--fg-3);padding:var(--space-3) var(--space-3) var(--space-1_5);
  white-space:nowrap;overflow:hidden;transition:opacity var(--transition);
}
.sb-section-label:first-child{padding-top:var(--space-1)}
.sidebar.collapsed .sb-section-label{opacity:0;height:0;padding:0}

.sb-item{
  display:flex;align-items:center;gap:var(--space-2_5);
  padding:8px var(--space-3);
  border:1px solid transparent;
  border-radius:var(--radius-md);cursor:pointer;
  color:var(--fg-2);font-size:var(--font-sm);font-weight:500;
  transition:var(--transition-fast);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;position:relative;
  min-height:38px;text-decoration:none;
}
.sb-item:hover{background:var(--neutral-100);color:var(--fg-1)}
.sb-item.active{
  background:var(--bg-elevated);
  border-color:var(--border);
  color:var(--fg-1);font-weight:600;
  box-shadow:0 1px 2px oklch(0 0 0 / 0.04);
}

.sb-icon{
  width:18px;height:18px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:var(--transition-fast);
  color:var(--fg-3);
}
.sb-icon [data-lucide]{font-size:18px;width:18px;height:18px;stroke-width:1.5}
.sb-item:hover .sb-icon{color:var(--fg-2)}
.sb-item.active .sb-icon{color:var(--fg-1)}

.sb-label{transition:opacity var(--transition);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .sb-label{opacity:0;width:0;overflow:hidden}

.sb-badge{
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  color:var(--fg-3);
  padding:0 var(--space-1_5);min-width:18px;height:18px;
  display:inline-flex;align-items:center;justify-content:center;
  text-align:center;flex-shrink:0;letter-spacing:0;
}
.sb-item.active .sb-badge{color:var(--fg-2)}
.sidebar.collapsed .sb-badge{opacity:0;width:0;padding:0;overflow:hidden}

.sb-dot{
  width:6px;height:6px;border-radius:50%;background:var(--warning-500);
  flex-shrink:0;
}
.sb-dot.success{background:var(--success-500)}
.sb-dot.danger{background:var(--danger-500)}
.sb-dot.brand{background:var(--iris-500)}
.sidebar.collapsed .sb-dot{opacity:0;width:0;overflow:hidden}

/* ── Sidebar footer (user profile) ── */
.sb-footer{
  padding:var(--space-2_5) var(--space-2);
  border-top:1px solid var(--border-subtle);flex-shrink:0;
  position:relative;
}
.sb-user{
  display:flex;align-items:center;gap:var(--space-2_5);
  padding:var(--space-2) var(--space-2_5);
  border-radius:var(--radius-md);
  cursor:pointer;transition:var(--transition-fast);
  border:1px solid transparent;
}
.sb-user:hover{background:var(--neutral-100);border-color:var(--border-subtle)}
.sb-user.menu-open{background:var(--bg-elevated);border-color:var(--border)}
.sb-user-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--iris-500);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;letter-spacing:-.3px;
}
.sb-user-info{flex:1;min-width:0;line-height:1.3;transition:opacity var(--transition);text-align:start}
.sb-user-name{
  font-size:var(--font-sm);font-weight:600;color:var(--fg-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.1px;
}
.sb-user-sub{
  font-size:var(--font-2xs);color:var(--fg-3);font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;
}
.sb-user-action{
  background:transparent;border:none;cursor:pointer;
  width:26px;height:26px;border-radius:var(--radius-xs);
  color:var(--fg-4);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition-fast);
}
.sb-user:hover .sb-user-action{color:var(--fg-2)}
.sb-user-action [data-lucide]{width:14px;height:14px;stroke-width:1.5}
.sidebar.collapsed .sb-user-info,
.sidebar.collapsed .sb-user-action{opacity:0;width:0;overflow:hidden;pointer-events:none}

/* ── User profile dropdown menu ── */
.sb-user-menu{
  position:absolute;bottom:calc(100% + 4px);inset-inline-start:var(--space-2);inset-inline-end:var(--space-2);
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:var(--shadow-lg);
  padding:var(--space-1_5);z-index:50;
  opacity:0;transform:translateY(4px);pointer-events:none;
  transition:opacity var(--transition-fast),transform var(--transition-fast);
}
.sb-user-menu.open{opacity:1;transform:translateY(0);pointer-events:all}
.sb-user-menu-header{
  display:flex;align-items:center;gap:var(--space-2_5);
  padding:var(--space-2) var(--space-2_5);
  border-bottom:1px solid var(--border-subtle);margin-bottom:var(--space-1_5);
}
.sb-user-menu-header-avatar{
  width:32px;height:32px;border-radius:50%;
  background:var(--iris-500);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;letter-spacing:-.3px;
}
.sb-user-menu-header-info{flex:1;min-width:0;line-height:1.3}
.sb-user-menu-header-name{font-size:var(--font-xs);font-weight:600;color:var(--fg-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-menu-header-mail{font-size:var(--font-2xs);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sb-user-menu-item{
  display:flex;align-items:center;gap:var(--space-2_5);
  padding:7px var(--space-2);width:100%;
  background:transparent;border:none;cursor:pointer;
  color:var(--fg-2);font-size:var(--font-xs);font-weight:500;
  font-family:inherit;border-radius:var(--radius-sm);
  transition:var(--transition-fast);text-align:start;
}
.sb-user-menu-item:hover{background:var(--neutral-100);color:var(--fg-1)}
.sb-user-menu-item.danger{color:var(--danger-600)}
.sb-user-menu-item.danger:hover{background:var(--danger-50);color:var(--danger-700)}
.sb-user-menu-item [data-lucide]{width:14px;height:14px;stroke-width:1.5;flex-shrink:0;color:var(--fg-4)}
.sb-user-menu-item:hover [data-lucide]{color:currentColor}
.sb-user-menu-sep{height:1px;background:var(--border-subtle);margin:var(--space-1_5) 0}

/* Sidebar overlay for mobile */
.sb-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(15,23,42,.4);backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  z-index:190;opacity:0;transition:opacity var(--transition);pointer-events:none;
}
.sb-overlay.active{opacity:1;display:block;pointer-events:all}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Top bar (v2) ── */
.top-bar{
  background:var(--bg-elevated);border-bottom:1px solid var(--border-subtle);
  padding:0 var(--container-pad);display:flex;align-items:center;gap:var(--space-3);
  flex-shrink:0;height:var(--topbar-h);
  position:relative;z-index:50;
}
.top-bar-menu{
  display:none;background:transparent;border:none;cursor:pointer;
  color:var(--text-strong);width:36px;height:36px;border-radius:var(--radius-sm);
  align-items:center;justify-content:center;transition:var(--transition-fast);
}
.top-bar-menu [data-lucide]{font-size:20px}
.top-bar-menu:hover{background:var(--neutral-100)}
.top-bar-divider{width:1px;height:24px;background:var(--border);flex-shrink:0}

.top-bar-breadcrumb{
  flex:1;font-size:var(--font-xs);color:var(--text-muted);
  display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;
}
.top-bar-breadcrumb span{cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar-breadcrumb .bc-page{
  font-weight:700;color:var(--text);font-size:var(--font-sm);
  letter-spacing:-.1px;
}
.top-bar-breadcrumb .bc-sep{color:var(--neutral-300);font-weight:400;flex-shrink:0}

.top-bar-actions{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0}
.tb-icon-btn{
  background:transparent;border:none;cursor:pointer;
  width:36px;height:36px;border-radius:var(--radius-sm);
  color:var(--neutral-500);transition:var(--transition-fast);
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.tb-icon-btn:hover{background:var(--neutral-100);color:var(--neutral-800)}
.tb-icon-btn [data-lucide]{font-size:18px}
.tb-user{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:var(--iris-500);
  color:#fff;font-weight:600;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:var(--transition-fast);letter-spacing:-.5px;
}
.tb-user:hover{opacity:.85}

/* ── Pages ── */
.page{display:none;flex:1;min-height:0;overflow-y:auto;padding:var(--container-pad);background:var(--surface-1)}
.page.active{display:block}

/* ── Buttons (v2 — solid / soft / outline / ghost / link × md/sm/lg) ── */
.btn{
  font-family:inherit;font-size:var(--font-sm);font-weight:600;
  padding:9px 16px;min-height:38px;
  border-radius:var(--radius-sm);border:1px solid var(--neutral-200);
  cursor:pointer;background:var(--neutral-0);color:var(--neutral-700);
  transition:background var(--transition-fast),border-color var(--transition-fast),color var(--transition-fast),box-shadow var(--transition-fast),transform var(--transition-fast);
  white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;
  gap:7px;line-height:1.2;letter-spacing:-.05px;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.btn:hover{background:var(--neutral-50);border-color:var(--neutral-300)}
.btn:active{transform:translateY(.5px)}
.btn:disabled,.btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}

/* Solid variants */
.btn-primary{background:var(--iris-500);color:#fff;border-color:var(--iris-500)}
.btn-primary:hover{background:var(--iris-600);border-color:var(--iris-600)}
.btn-success-solid{background:var(--success-500);color:#fff;border-color:var(--success-500)}
.btn-success-solid:hover{background:var(--success-600);border-color:var(--success-600)}
.btn-danger-solid{background:var(--danger-500);color:#fff;border-color:var(--danger-500)}
.btn-danger-solid:hover{background:var(--danger-600);border-color:var(--danger-600)}

/* Soft variants */
.btn-soft{background:var(--iris-50);color:var(--iris-600);border-color:transparent}
.btn-soft:hover{background:var(--iris-100);color:var(--iris-700)}
.btn-danger{background:var(--danger-50);color:var(--danger-700);border-color:transparent}
.btn-danger:hover{background:var(--danger-100);color:var(--danger-700)}
.btn-success{background:var(--success-50);color:var(--success-700);border-color:transparent}
.btn-success:hover{background:var(--success-100)}
.btn-warning{background:var(--warning-50);color:var(--warning-700);border-color:transparent}
.btn-warning:hover{background:var(--warning-100)}

/* Outline variant */
.btn-outline{background:transparent;color:var(--iris-500);border-color:var(--iris-200)}
.btn-outline:hover{background:var(--iris-50);border-color:var(--iris-300);color:var(--iris-600)}

/* Ghost (no border, no background until hover) */
.btn-ghost{background:transparent;border-color:transparent;color:var(--neutral-500);box-shadow:none}
.btn-ghost:hover{background:var(--neutral-100);color:var(--neutral-800);border-color:transparent}

/* Sizes */
.btn-sm{padding:6px 11px;min-height:30px;font-size:var(--font-xs);gap:5px;border-radius:var(--radius-xs)}
.btn-lg{padding:11px 22px;min-height:46px;font-size:var(--font-base);gap:8px;border-radius:var(--radius-md)}

/* Icon-only square */
.btn-icon{padding:0;width:36px;min-width:36px;height:36px}
.btn-icon.btn-sm{width:30px;min-width:30px;height:30px}
.btn-icon.btn-lg{width:46px;min-width:46px;height:46px}

/* ── Cards (v2) ── */
.card{
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6);
  transition:border-color var(--transition);
}
.card-hover:hover,.card.card-interactive:hover{border-color:var(--neutral-300)}
.card-title{font-size:var(--font-md);font-weight:700;color:var(--text);margin-bottom:var(--space-4);letter-spacing:-.2px}
.card-sub{font-size:var(--font-xs);color:var(--text-muted);margin-top:var(--space-1)}

/* ── Stat cards (v2 — legacy compat) ── */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);margin-bottom:var(--space-4)}
.stat-card{
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:var(--space-4);
  position:relative;overflow:hidden;
  transition:border-color var(--transition);
}
.stat-card:hover{border-color:var(--neutral-300)}
.stat-card-label{font-size:var(--font-2xs);color:var(--fg-3);margin-bottom:var(--space-1_5);font-weight:500}
.stat-card-value{font-size:clamp(16px,2vw,22px);font-weight:700;color:var(--fg-1);font-family:var(--font-mono);line-height:var(--lh-tight);letter-spacing:-.5px}
.stat-card-sub{font-size:var(--font-2xs);color:var(--fg-3);margin-top:var(--space-1)}
.stat-card.brand .stat-card-value{color:var(--iris-600)}
.stat-card.success .stat-card-value{color:var(--success-600)}
.stat-card.danger .stat-card-value{color:var(--danger-600)}
.stat-card.warn .stat-card-value{color:var(--warning-600)}
/* ctrl drawer always uses narrow layout */
.ctrl-drawer .stat-cards{grid-template-columns:1fr 1fr}
.ctrl-drawer .ctrl-2col{grid-template-columns:1fr}

/* ── Fin stat strip (entries tab) ── */
.fin-stat-strip{
  display:flex;background:var(--bg-elevated);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;margin-bottom:var(--space-4);
}
.fsi{flex:1;padding:var(--space-3) var(--space-4);border-inline-start:1px solid var(--border-subtle);position:relative;min-width:0;transition:background var(--transition-fast);display:flex;flex-direction:column;justify-content:center}
.fsi:hover{background:var(--neutral-50)}
.fsi:last-child{border-inline-start:none}
.fsi-lbl{font-size:var(--font-2xs);color:var(--fg-3);margin-bottom:var(--space-1);font-weight:500;white-space:nowrap}
.fsi-val{font-size:clamp(14px,1.9vw,20px);font-weight:700;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:var(--lh-tight);letter-spacing:-.3px}
.fsi.fsi-danger .fsi-val{color:var(--danger-600)}
.fsi.fsi-success .fsi-val{color:var(--success-600)}
.fsi.fsi-warn .fsi-val{color:var(--warning-600)}
.fsi.fsi-brand .fsi-val{color:var(--iris-600)}
.fsi-sub{font-size:var(--font-2xs);color:var(--fg-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* mobile: 2×2 grid, horizontal layout per cell */
@media(max-width:600px){
  .fin-stat-strip{flex-wrap:wrap}
  .fsi{flex:0 0 50%;flex-direction:row;align-items:center;gap:var(--space-2_5);padding:var(--space-3)}
  .fsi:nth-child(2){border-inline-start:none;border-inline-end:1px solid var(--border-subtle)}
  .fsi:nth-child(3),.fsi:nth-child(4){border-top:1px solid var(--border-subtle)}
  .fsi-lbl{margin-bottom:0;flex-shrink:0;max-width:52px;white-space:normal;line-height:1.3}
  .fsi-val{font-size:13px;letter-spacing:-.2px}
  .fsi-sub{font-size:10px;margin-top:1px}
}

/* ── Page header ── */
.page-header{
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3);
  margin-bottom:var(--space-5);flex-wrap:wrap;
  padding-bottom:var(--space-4);border-bottom:1px solid var(--border);
}
.page-header h1{font-size:clamp(22px,3vw,28px);font-weight:800;color:var(--text);letter-spacing:-.8px;line-height:var(--lh-tight)}
.page-header-sub{font-size:var(--font-xs);color:var(--text-muted);margin-top:var(--space-1)}

/* ── Tables (v2 — desktop) ── */
.data-table{width:100%;border-collapse:collapse;font-size:var(--font-sm)}
.data-table th{
  text-align:right;padding:var(--space-2_5) var(--space-4);
  font-size:var(--font-xs);font-weight:500;color:var(--fg-3);
  background:var(--neutral-50);letter-spacing:0;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
.data-table td{
  padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--border-subtle);
  color:var(--fg-1);vertical-align:middle;
}
.data-table tr{transition:background var(--transition-fast)}
.data-table tr:hover td{background:var(--neutral-50)}
.data-table tr:last-child td{border-bottom:none}

/* ── Entry table (Axis — flat, hover-reveal actions) ── */
.entry-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.entry-tbl th{
  text-align:right;padding:var(--space-2_5) var(--space-4);
  font-size:var(--font-xs);font-weight:500;color:var(--fg-3);
  background:var(--neutral-50);letter-spacing:0;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
.entry-tbl td{
  padding:0 var(--space-4);height:44px;
  border-bottom:1px solid var(--border-subtle);
  vertical-align:middle;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  color:var(--fg-1);
}
.entry-tbl tbody tr:last-child td{border-bottom:none}
.entry-tbl .er{transition:background var(--transition-fast)}
.entry-tbl .er:hover td{background:var(--neutral-50)}
/* type dot column */
.entry-tbl .col-dot{width:28px;text-align:center;overflow:visible}
.entry-type-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;
}
.entry-type-dot.income{background:var(--success-500)}
.entry-type-dot.expense{background:var(--danger-500)}
/* columns */
.entry-tbl .col-cat{width:90px}
.entry-tbl .col-amt{width:140px;text-align:left}
.entry-tbl .col-chev{width:40px;text-align:center;overflow:visible}
/* chevron toggle button */
.entry-chev-btn{
  background:transparent;border:none;cursor:pointer;
  width:28px;height:28px;border-radius:var(--radius-xs);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg-4);transition:var(--transition-fast);
}
.entry-chev-btn:hover{background:var(--neutral-100);color:var(--fg-2)}
.entry-chev-btn [data-lucide]{width:14px;height:14px;stroke-width:1.5;transition:transform .2s}
.entry-chev-btn.open [data-lucide]{transform:rotate(180deg)}
.er.expanded > td{background:var(--iris-50)}
/* expand panel rows */
.entry-expand-row td{
  padding:0;border-bottom:1px solid var(--border-subtle);
  height:auto;white-space:normal;overflow:visible;
  background:var(--neutral-50);
}
.entry-expand-panel{
  padding:var(--space-3) var(--space-4) var(--space-4);
  display:flex;flex-direction:column;gap:var(--space-3);
}
.entry-expand-meta{
  display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;
  font-size:var(--font-xs);color:var(--fg-3);
}
.entry-expand-lbl{font-size:var(--font-2xs);color:var(--fg-3);font-weight:500;margin-bottom:4px}
.entry-expand-note{
  width:100%;box-sizing:border-box;
  padding:var(--space-2) var(--space-3);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font-family:var(--font-sans);font-size:var(--font-xs);
  color:var(--fg-2);background:var(--bg-elevated);
  resize:vertical;min-height:52px;line-height:var(--lh-normal);
  transition:border-color var(--transition-fast);
}
.entry-expand-note:focus{outline:none;border-color:var(--iris-300)}
.entry-expand-actions{display:flex;align-items:center;gap:var(--space-2)}
/* tfoot summary */
.entry-tbl tfoot td{
  padding:var(--space-3) var(--space-4);height:auto;
  border-top:1px solid var(--border);border-bottom:none;
  font-size:var(--font-xs);font-weight:600;color:var(--fg-2);
  background:var(--neutral-50);white-space:nowrap;
}
/* project filter pills */
.proj-filter-bar{
  display:flex;gap:2px;background:var(--neutral-100);
  border-radius:var(--radius-md);padding:3px;width:fit-content;
  margin-bottom:var(--space-4);
}
.proj-filter-btn{
  padding:5px var(--space-3);border-radius:var(--radius-sm);
  font-size:var(--font-xs);font-weight:500;color:var(--fg-3);
  background:transparent;border:1px solid transparent;cursor:pointer;
  font-family:inherit;transition:var(--transition-fast);
  display:inline-flex;align-items:center;gap:var(--space-1_5);
  white-space:nowrap;
}
.proj-filter-btn:hover{color:var(--fg-1)}
.proj-filter-btn.active{background:var(--bg-elevated);color:var(--fg-1);border-color:var(--border)}
.proj-filter-count{font-family:var(--font-mono);font-size:11px;color:var(--fg-4);font-weight:400}
.entry-detail-item .edi-val{font-weight:600;color:var(--fg-1);font-size:var(--font-sm)}

/* ── Tables responsive (mobile card transform) ── */
@media (max-width: 767px) {
  /* data-table → cards */
  .data-table,
  .data-table thead,
  .data-table tbody,
  .data-table tr,
  .data-table th,
  .data-table td { display: block; box-sizing: border-box; }
  .data-table thead { display: none; }
  .data-table tr {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-md); margin-bottom: var(--space-3);
    padding: var(--space-3);
  }
  .data-table tr:hover{background:var(--bg-elevated)}
  .data-table tr:hover td{background:transparent}
  .data-table td {
    padding: var(--space-1_5) 0;
    border-bottom: 1px solid var(--neutral-100);
    display: flex; justify-content: space-between; align-items: center;
    text-align: left; gap: var(--space-3);
  }
  .data-table td:last-child { border-bottom: none; }
  .data-table td::before {
    content: attr(data-label);
    font-size: var(--font-2xs); font-weight: 500;
    color: var(--fg-3); flex-shrink: 0;
  }

  /* entry-tbl → hide extras, let description breathe */
  .entry-tbl .col-dot{display:none}
  .entry-tbl .col-cat{display:none}
  .entry-tbl .col-amt{width:126px;padding-inline-start:var(--space-2);padding-inline-end:var(--space-2)}
  .entry-tbl .col-chev{width:36px;padding-inline-start:4px;padding-inline-end:4px}
  /* allow desc to wrap on narrow screens */
  .entry-tbl tbody td:nth-child(2){white-space:normal;overflow:visible;height:auto;padding-top:10px;padding-bottom:10px;line-height:var(--lh-snug);padding-inline-start:var(--space-3)}
  /* proper margin for first visible column on mobile */
  .entry-tbl thead th:nth-child(2){padding-inline-start:var(--space-3)}
}

/* ── Badges (v2 — with dot/icon/sizes) ── */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:var(--radius-full);
  font-size:var(--font-2xs);font-weight:600;
  border:1px solid transparent;line-height:1.4;
  white-space:nowrap;
}
.badge::before{content:'';display:none}
.badge.with-dot::before{
  display:block;width:6px;height:6px;border-radius:50%;
  background:currentColor;flex-shrink:0;
}
.badge.success{background:var(--success-50);color:var(--success-700);border-color:oklch(0.68 0.16 155 / 0.2)}
.badge.brand{background:var(--iris-50);color:var(--iris-700);border-color:oklch(0.62 0.21 275 / 0.2)}
.badge.warn{background:var(--warning-50);color:var(--warning-700);border-color:oklch(0.78 0.16 75 / 0.2)}
.badge.danger{background:var(--danger-50);color:var(--danger-700);border-color:oklch(0.62 0.21 25 / 0.2)}
.badge.gray{background:var(--neutral-100);color:var(--neutral-600);border-color:var(--neutral-200)}
.badge.info{background:var(--info-50);color:var(--info-700);border-color:oklch(0.68 0.14 230 / 0.2)}
/* Extended palette */
.badge.purple {background:var(--iris-50);   color:var(--iris-700);   border-color:oklch(0.62 0.21 275 / 0.2)}
.badge.amber  {background:var(--warning-50);color:var(--warning-700);border-color:oklch(0.78 0.16 75 / 0.2)}
.badge.emerald{background:var(--success-50);color:var(--success-700);border-color:oklch(0.68 0.16 155 / 0.2)}
.badge.indigo {background:var(--iris-50);   color:var(--iris-700);   border-color:oklch(0.62 0.21 275 / 0.2)}
.badge.rose   {background:var(--danger-50); color:var(--danger-700); border-color:oklch(0.62 0.21 25 / 0.2)}
.badge.cyan   {background:var(--info-50);   color:var(--info-700);   border-color:oklch(0.68 0.14 230 / 0.2)}
/* Solid variant */
.badge.solid.brand{background:var(--primary-600);color:#fff;border-color:transparent}
.badge.solid.success{background:var(--success-600);color:#fff;border-color:transparent}
.badge.solid.danger{background:var(--danger-600);color:#fff;border-color:transparent}
.badge.solid.warn{background:var(--warning-600);color:#fff;border-color:transparent}
/* Sizes */
.badge.lg{padding:5px 12px;font-size:var(--font-xs);gap:6px}
.badge.sm{padding:1px 7px;font-size:10px;gap:3px}
.badge [data-lucide]{font-size:11px;line-height:1}

/* ── Forms (v2) ── */
.form-group{margin-bottom:var(--space-4)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-3)}
.field-label{
  display:block;font-size:var(--font-xs);font-weight:600;
  color:var(--text-strong);margin-bottom:var(--space-1_5);
  letter-spacing:.1px;
}
.field-label .req{color:var(--danger-600);margin-right:2px}
.field-input{
  width:100%;padding:10px 14px;min-height:42px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font-family:inherit;font-size:var(--font-sm);
  color:var(--text);background:var(--bg-elevated);
  transition:border-color var(--transition-fast),box-shadow var(--transition-fast);
  outline:none;
}
.field-input::placeholder{color:var(--text-subtle)}
.field-input:hover{border-color:var(--border-hover)}
.field-input:focus{border-color:var(--iris-500);box-shadow:var(--shadow-focus)}
.field-input.error{border-color:var(--danger-500)}
.field-input.error:focus{box-shadow:0 0 0 3px oklch(0.62 0.21 25 / 0.2)}
.field-input:disabled{background:var(--neutral-50);color:var(--text-muted);cursor:not-allowed}
select.field-input{cursor:pointer;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:left 12px center;background-size:16px;padding-left:36px;appearance:none;-webkit-appearance:none}
textarea.field-input{min-height:84px;resize:vertical;line-height:var(--lh-normal)}
.field-hint{font-size:var(--font-2xs);color:var(--text-subtle);margin-top:var(--space-1)}
.field-error{font-size:var(--font-2xs);color:var(--danger-600);margin-top:var(--space-1);display:flex;align-items:center;gap:4px}

/* Toggle switch */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) 0}
.toggle-label{font-size:var(--font-sm);color:var(--text-strong);font-weight:500}
.toggle{position:relative;width:38px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{
  position:absolute;inset:0;background:var(--neutral-300);
  border-radius:var(--radius-full);cursor:pointer;transition:var(--transition);
}
.toggle-slider:before{
  content:'';position:absolute;width:16px;height:16px;
  bottom:3px;right:3px;background:#fff;border-radius:50%;
  transition:var(--transition);box-shadow:var(--shadow-sm);
}
.toggle input:checked + .toggle-slider{background:var(--iris-500)}
.toggle input:checked + .toggle-slider:before{transform:translateX(-16px)}
.toggle input:focus-visible + .toggle-slider{box-shadow:var(--shadow-focus)}
.inline-group{display:flex;gap:6px;align-items:center}
.inline-group .field-input{flex:1}

/* ── Modal (v2 — sheet on mobile) ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity var(--transition);
  padding:var(--space-4);
}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal-box{
  background:var(--bg-elevated);border-radius:var(--radius-xl);
  width:100%;max-width:560px;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-xl);
  transform:translateY(16px) scale(.98);
  transition:transform var(--transition);
  overflow:hidden;
}
.modal-overlay.active .modal-box{transform:translateY(0) scale(1)}
.modal-header{
  padding:var(--space-5) var(--space-5) var(--space-4);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;gap:var(--space-3);
}
.modal-header h3{font-size:var(--font-lg);font-weight:700;color:var(--text);letter-spacing:-.2px}
.modal-close{
  background:var(--neutral-100);border:none;cursor:pointer;
  font-size:18px;line-height:1;color:var(--neutral-500);
  width:32px;height:32px;border-radius:var(--radius-sm);
  display:inline-flex;align-items:center;justify-content:center;
  transition:var(--transition-fast);flex-shrink:0;
}
.modal-close:hover{background:var(--neutral-200);color:var(--neutral-800)}
.modal-body{padding:var(--space-5);overflow-y:auto;flex:1}
.modal-footer{
  padding:var(--space-4) var(--space-5);
  border-top:1px solid var(--border);background:var(--neutral-50);
  display:flex;gap:var(--space-2);justify-content:flex-end;flex-shrink:0;
}
/* Mobile: bottom sheet */
@media (max-width: 600px) {
  .modal-overlay{align-items:flex-end;padding:0}
  .modal-box{max-width:none;max-height:92vh;border-radius:var(--radius-xl) var(--radius-xl) 0 0;transform:translateY(100%) scale(1)}
  .modal-overlay.active .modal-box{transform:translateY(0)}
  .modal-header{padding:var(--space-4)}
  .modal-body{padding:var(--space-4)}
  .modal-footer{padding:var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom))}
}

/* ── Tabs ── */
.tabs{
  display:flex;gap:3px;margin-bottom:20px;
  background:var(--neutral-100);border-radius:var(--radius-md);padding:4px;
  border:1px solid var(--border);
}
.tab-btn{
  padding:9px 20px;font-family:inherit;font-size:var(--font-sm);font-weight:500;
  border:none;background:transparent;cursor:pointer;color:var(--text-muted);
  border-radius:var(--radius-sm);transition:var(--transition);display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;flex:1;justify-content:center;
}
.tab-btn:hover{background:var(--neutral-50);color:var(--text-strong)}
.tab-btn.active{
  background:var(--surface-1);color:var(--iris-600);font-weight:600;
}
.tab-btn [data-lucide]{font-size:15px}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── Hero Tab Bar — pill style, sticky below hero card ── */
.hero-tab-bar{
  display:flex;gap:var(--space-2);
  margin-bottom:var(--space-5);
  position:sticky;top:var(--topbar-h);z-index:10;
  background:var(--bg);
  padding:var(--space-2_5) 0;
  border-bottom:1px solid var(--border-subtle);
}
.hero-tab-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 20px;border-radius:var(--radius-full);
  border:1px solid var(--border);
  background:var(--bg-elevated);color:var(--fg-2);
  font-size:var(--font-sm);font-weight:500;
  cursor:pointer;font-family:inherit;
  transition:border-color var(--transition-fast),background var(--transition-fast),color var(--transition-fast);
  white-space:nowrap;
}
.hero-tab-pill:hover{border-color:var(--neutral-300);color:var(--fg-1)}
.hero-tab-pill.active{
  background:oklch(0.15 0.02 275);border-color:oklch(0.15 0.02 275);
  color:#fff;font-weight:600;
}
.hero-tab-pill [data-lucide]{width:14px;height:14px;flex-shrink:0}
.hero-tab-count{
  font-family:var(--font-mono);font-size:10px;
  padding:1px 6px;border-radius:var(--radius-full);
}
.hero-tab-pill:not(.active) .hero-tab-count{background:var(--neutral-100);color:var(--fg-4)}
.hero-tab-pill.active .hero-tab-count{background:oklch(1 0 0 / 0.15);color:inherit}
@media(max-width:600px){
  .hero-tab-bar{gap:var(--space-1_5)}
  .hero-tab-pill{padding:7px 14px;font-size:var(--font-xs)}
}

/* ── Toast (v2) ── */
.toast{
  position:fixed;bottom:var(--space-6);left:50%;
  transform:translateX(-50%) translateY(24px);
  background:var(--neutral-900);color:#fff;
  padding:var(--space-3) var(--space-5);
  border-radius:var(--radius-md);
  font-size:var(--font-sm);font-weight:500;
  opacity:0;pointer-events:none;
  transition:opacity var(--transition),transform var(--transition);
  z-index:2000;white-space:nowrap;
  box-shadow:var(--shadow-lg);
  display:inline-flex;align-items:center;gap:var(--space-2);
  max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success-600)}
.toast.danger{background:var(--danger-600)}
.toast.warn{background:var(--warning-600)}
.toast.info{background:var(--info-600)}

/* ── Empty state (v2) ── */
.empty-state{text-align:center;padding:var(--space-12) var(--space-5);color:var(--text-subtle)}
.empty-state-icon{
  width:72px;height:72px;margin:0 auto var(--space-4);
  display:flex;align-items:center;justify-content:center;
  background:var(--neutral-100);border-radius:var(--radius-full);
  color:var(--neutral-400);
}
.empty-state-icon [data-lucide]{font-size:36px;color:var(--neutral-400)}
.empty-state h3{font-size:var(--font-md);font-weight:700;color:var(--text-strong);margin-bottom:var(--space-1)}
.empty-state p{font-size:var(--font-xs);color:var(--text-muted);max-width:320px;margin:0 auto}

/* ── Client cards grid (v2) ── */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-4)}
.client-card{
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:var(--space-5);
  transition:border-color var(--transition);
  cursor:default;display:flex;flex-direction:column;
}
.client-card:hover{border-color:var(--neutral-300)}
.client-card-name{font-size:var(--font-md);font-weight:700;color:var(--text);margin-bottom:var(--space-1);letter-spacing:-.1px}
.client-card-meta{font-size:var(--font-xs);color:var(--text-muted);margin-bottom:var(--space-3);line-height:var(--lh-snug)}
.client-card-actions{display:flex;gap:var(--space-1_5);margin-top:auto}

/* ── Project row card (unified list item) ── */
.proj-row-list{display:flex;flex-direction:column;gap:var(--space-2)}
.proj-row-card{
  display:flex;align-items:center;gap:var(--space-3);
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
  cursor:pointer;transition:border-color var(--transition-fast),background var(--transition-fast);
  min-width:0;text-decoration:none;color:inherit;
}
.proj-row-card:hover{border-color:var(--neutral-300);background:var(--neutral-50)}
.prc-status-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--neutral-300);align-self:center;
}
.prc-status-dot.active{background:var(--success-500)}
.prc-status-dot.completed{background:var(--iris-500)}
.prc-status-dot.paused{background:var(--warning-500)}
.prc-status-dot.cancelled{background:var(--neutral-400)}
.prc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prc-title-row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.prc-name{font-size:var(--font-sm);font-weight:600;color:var(--fg-1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prc-meta{display:flex;align-items:center;gap:var(--space-3);font-size:var(--font-2xs);color:var(--fg-3);flex-wrap:wrap}
.prc-meta-item{display:inline-flex;align-items:center;gap:4px;min-width:0}
.prc-meta-item [data-lucide]{width:12px;height:12px;opacity:.7;stroke-width:1.75}
.prc-client-link{color:var(--iris-600);font-weight:500;cursor:pointer}
.prc-client-link:hover{color:var(--iris-700);text-decoration:underline}
.prc-value-wrap{text-align:left;flex-shrink:0;min-width:0}
.prc-value{
  font-family:var(--font-mono);font-size:var(--font-sm);font-weight:700;
  color:var(--fg-1);white-space:nowrap;letter-spacing:-.2px;line-height:var(--lh-tight);
}
.prc-value-sub{font-size:10px;color:var(--fg-4);font-weight:400;font-family:var(--font-sans);margin-top:2px;white-space:nowrap}
.prc-arrow{
  width:32px;height:32px;flex-shrink:0;border-radius:var(--radius-xs);
  background:transparent;border:none;cursor:pointer;color:var(--fg-3);
  display:inline-flex;align-items:center;justify-content:center;
  transition:var(--transition-fast);
}
.proj-row-card:hover .prc-arrow{background:var(--iris-50);color:var(--iris-600)}
.prc-arrow [data-lucide]{width:14px;height:14px;stroke-width:1.5}
.proj-row-empty{
  padding:var(--space-8) var(--space-4);text-align:center;
  color:var(--fg-3);font-size:var(--font-sm);
  background:var(--neutral-50);border:1px dashed var(--border);
  border-radius:var(--radius-md);
}
@media(max-width:600px){
  .proj-row-card{padding:var(--space-3);gap:var(--space-2)}
  .prc-value{font-size:var(--font-xs)}
  .prc-value-sub{display:none}
  .prc-meta{font-size:11px;gap:var(--space-2)}
  .prc-arrow{width:28px;height:28px}
}

/* ── Status distribution bar (client overview) ── */
.status-dist{display:flex;flex-direction:column;gap:var(--space-2_5)}
.status-dist-row{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-xs)}
.status-dist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dist-lbl{flex:1;color:var(--fg-2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.status-dist-track{flex:2;background:var(--neutral-100);border-radius:var(--radius-full);height:6px;overflow:hidden;min-width:60px}
.status-dist-fill{height:100%;border-radius:var(--radius-full);transition:width .5s var(--ease-out)}
.status-dist-val{font-family:var(--font-mono);font-weight:700;color:var(--fg-1);font-size:var(--font-xs);min-width:24px;text-align:left;flex-shrink:0}

/* ── Client hero ── */
.client-hero{
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-4);
}
.client-hero-band{
  padding:var(--space-5) var(--space-6);
  background:linear-gradient(145deg, oklch(0.96 0.03 275) 0%, var(--bg-elevated) 68%);
  border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:flex-start;gap:var(--space-4);
}
.client-hero-avatar{
  width:64px;height:64px;flex-shrink:0;border-radius:var(--radius-lg);
  background:var(--iris-500);color:#fff;font-weight:800;font-size:var(--font-2xl);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px oklch(0.52 0.22 275 / 0.22);
}
.client-hero-info{flex:1;min-width:0}
.client-hero-name{font-size:var(--font-2xl);font-weight:700;color:var(--fg-1);line-height:var(--lh-tight);letter-spacing:-.015em;margin-bottom:var(--space-1_5)}
.client-hero-meta{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font-size:var(--font-xs);color:var(--fg-3);align-items:center}
.client-hero-meta-item{display:flex;align-items:center;gap:5px}
.client-hero-meta-item [data-lucide]{width:13px;height:13px}
.client-hero-actions{display:flex;gap:var(--space-2);flex-shrink:0}
.client-hero-stats{display:grid;grid-template-columns:repeat(4,1fr)}
.chs{
  padding:var(--space-4);border-inline-start:1px solid var(--border-subtle);
  min-width:0;
}
.chs:last-child{border-inline-start:none}
.chs-lbl{font-size:var(--font-2xs);color:var(--fg-3);font-weight:500;margin-bottom:var(--space-1)}
.chs-val{font-size:clamp(16px,2vw,22px);font-weight:700;font-family:var(--font-mono);letter-spacing:-.5px;line-height:var(--lh-tight)}
@media(max-width:600px){
  .client-hero-band{align-items:flex-start;padding:var(--space-4);gap:var(--space-3)}
  .client-hero-avatar{width:48px;height:48px;font-size:var(--font-xl)}
  .client-hero-name{font-size:var(--font-xl)}
  .client-hero-actions{flex-wrap:wrap;gap:var(--space-1_5)}
  .client-hero-stats{grid-template-columns:repeat(2,1fr)}
  .chs:nth-child(2){border-inline-start:none}
  .chs:nth-child(1),.chs:nth-child(2){border-bottom:1px solid var(--border-subtle)}
}

/* ── Filter bar ── */
.filter-bar{display:flex;gap:var(--space-2);align-items:center;margin-bottom:var(--space-4);flex-wrap:wrap}
.filter-bar .field-input{max-width:220px}
.filter-select{
  padding:8px 12px;min-height:36px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font-family:inherit;font-size:var(--font-xs);font-weight:500;
  color:var(--text-strong);background:var(--bg-elevated);
  cursor:pointer;outline:none;transition:var(--transition-fast);
}
.filter-select:hover{border-color:var(--border-hover)}
.filter-select:focus{border-color:var(--primary-500);box-shadow:var(--shadow-focus)}

/* ── Info grid ── */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.info-item{}
.info-item-label{font-size:var(--font-2xs);color:var(--fg-3);margin-bottom:3px;font-weight:500}
.info-item-value{font-size:13px;font-weight:500;color:var(--text)}

/* ── Fin page specifics ── */
.fin-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fin-summary-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--neutral-100);font-size:12.5px}
.fin-summary-row:last-child{border-bottom:none;font-weight:700;font-size:13px}
.fin-summary-row .lbl{color:var(--text-muted)}
.fin-summary-row .val{font-family:"IBM Plex Mono",monospace;font-weight:600}
/* ── Ctrl page grids ── */
.ctrl-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.ctrl-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
/* ── Calc Trail (waterfall) ── */
.calc-trail{padding:0}
.calc-trail-row{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--neutral-100);font-size:12.5px}
.calc-trail-row:last-child{border-bottom:none}
.calc-trail-row.ct-divider{border-top:2px solid var(--neutral-300);margin-top:4px;padding-top:10px;border-bottom:none}
.calc-trail-sign{width:14px;text-align:center;font-weight:700;color:var(--text-subtle);flex-shrink:0;font-family:"IBM Plex Mono",monospace}
.calc-trail-lbl{flex:1;color:var(--text-strong)}
.calc-trail-formula{font-size:11px;color:var(--text-subtle);font-weight:400}
.calc-trail-val{font-family:"IBM Plex Mono",monospace;font-weight:600;min-width:105px;text-align:left;flex-shrink:0}

.budget-table-wrap{overflow-x:auto;margin-top:10px}
.add-row-btn{font-size:12px;color:var(--primary-600);background:none;border:none;cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:4px}
.add-row-btn:hover{text-decoration:underline}
.fee-calc-badge{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--danger-700);background:var(--danger-50);padding:4px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.ctrl-fees{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.badge-registered{font-size:11px;font-weight:600;color:var(--success-700);background:var(--success-50);padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}

/* ── KPI / Activity semantic classes (used by JS render functions) ── */
.kpi-icon-brand  {background:var(--primary-50);color:var(--primary-600)}
.kpi-icon-success{background:var(--success-50);color:var(--success-600)}
.kpi-icon-danger {background:var(--danger-50); color:var(--danger-600)}
.kpi-icon-warn   {background:var(--warning-50);color:var(--warning-600)}
.kpi-icon-accent {background:var(--accent-50); color:var(--accent-600)}
.kpi-val-brand   {color:var(--primary-700)}
.kpi-val-success {color:var(--success-700)}
.kpi-val-danger  {color:var(--danger-700)}
.kpi-val-warn    {color:var(--warning-700)}
.act-dot-active    {background:var(--success-50);color:var(--success-600)}
.act-dot-completed {background:var(--primary-50);color:var(--primary-600)}
.act-dot-paused    {background:var(--warning-50);color:var(--warning-600)}
.act-dot-cancelled {background:var(--danger-50); color:var(--danger-600)}
@media(max-width:600px){.ctrl-fees{grid-template-columns:1fr}}
.alert-notice{
  background:var(--warning-50);border:1px solid oklch(0.78 0.16 75 / 0.25);
  color:var(--warning-700);padding:var(--space-3) var(--space-4);
  border-radius:var(--radius-md);font-size:var(--font-xs);font-weight:500;
  margin-bottom:var(--space-3);display:flex;align-items:center;gap:var(--space-2);
}

/* ── Ctrl Drawer ── */
.ctrl-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:900;opacity:0;pointer-events:none;transition:opacity .2s}
.ctrl-drawer-overlay.active{opacity:1;pointer-events:all}
.ctrl-drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,96vw);background:var(--bg-elevated);z-index:901;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;box-shadow:var(--shadow-xl)}
.ctrl-drawer.active{transform:translateX(0)}
.ctrl-drawer-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-elevated);z-index:2}
.ctrl-drawer-header h3{font-size:14px;font-weight:700;color:var(--text)}
.ctrl-drawer-body{padding:16px}
.ctrl-fab{
  position:fixed;bottom:24px;inset-inline-start:24px;
  width:54px;height:54px;border-radius:50%;
  background:var(--iris-500);color:#fff;
  border:none;font-size:22px;cursor:pointer;
  box-shadow:var(--shadow-lg),var(--shadow-brand);
  z-index:800;display:none;align-items:center;justify-content:center;
  transition:transform var(--transition),box-shadow var(--transition);
}
.ctrl-fab:hover{transform:scale(1.05);box-shadow:var(--shadow-lg),var(--shadow-brand)}
.ctrl-fab:active{transform:scale(.96)}
.ctrl-fab.visible{display:flex}
.ctrl-fab [data-lucide]{font-size:22px}

/* ── Table enhancements ── */
.amount-income{color:var(--success-700)!important;font-weight:600}
.amount-expense{color:var(--danger-700)!important;font-weight:600}

/* ── Report tabs ── */
.report-tabs{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;width:fit-content}
.report-tab{padding:8px 20px;font-size:13px;font-weight:500;cursor:pointer;background:var(--bg-elevated);color:var(--text-muted);border:none;font-family:inherit;transition:.15s}
.report-tab.active{background:var(--iris-500);color:#fff}

/* ── Waterfall ── */
.wf-table{width:100%;font-size:var(--font-xs)}
.wf-row{display:flex;align-items:center;gap:var(--space-2);padding:7px 12px;border-radius:var(--radius-sm);margin-bottom:2px}
.wf-row:hover{background:var(--neutral-50)}
.wf-row.wf-total{background:var(--neutral-50);border:1px solid var(--border);font-weight:700;margin-top:var(--space-2);border-radius:var(--radius-md)}
.wf-sign{width:16px;text-align:center;font-family:var(--font-mono);font-weight:700;color:var(--fg-3);flex-shrink:0;font-size:var(--font-xs)}
.wf-lbl{flex:1;color:var(--fg-2);font-size:var(--font-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wf-val{font-family:var(--font-mono);font-weight:700;white-space:nowrap;font-size:var(--font-xs);text-align:left;flex-shrink:0}

/* ── Download panel ── */
.dl-panel{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--neutral-50);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:12px 16px;margin-bottom:16px;
}
.dl-panel-info{font-size:12px;color:var(--text-muted)}
.dl-panel-info strong{color:var(--text);font-size:13px}
.dl-panel-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-dl{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;font-size:12px;font-weight:500;font-family:inherit;
  border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);border:1px solid;
  white-space:nowrap;
}
.btn-dl-pdf{background:var(--danger-50);border-color:var(--danger-100);color:var(--danger-700)}
.btn-dl-pdf:hover{background:var(--danger-100)}
.btn-dl-csv{background:var(--success-50);border-color:var(--success-100);color:var(--success-700)}
.btn-dl-csv:hover{background:var(--success-100)}
.btn-dl-print{background:var(--primary-50);border-color:var(--primary-200);color:var(--primary-700)}
.btn-dl-print:hover{background:var(--primary-100)}
.btn-dl [data-lucide]{font-size:13px}

/* ── Overview report layout ── */
.ov-2col{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-bottom:16px}
.ov-inc-exp-bar{margin-top:10px}
.ov-bar-row{margin-bottom:10px}
.ov-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.ov-bar-track{background:var(--neutral-100);border-radius:20px;height:8px;overflow:hidden}
.ov-bar-fill{height:100%;border-radius:20px;transition:width .5s}

@media(max-width:700px){.ov-2col{grid-template-columns:1fr}}

/* ── Stat mini ── */
.stat-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-mini{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.stat-mini-label{font-size:10px;color:var(--text-muted);margin-bottom:4px}
.stat-mini-val{font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace}
@media(max-width:600px){.stat-mini-grid{grid-template-columns:repeat(2,1fr)}}

/* ── Inline tab mini ── */
.mini-tabs{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;width:fit-content}
.mini-tab{padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;background:var(--bg-elevated);color:var(--text-muted);border:none;font-family:inherit;transition:var(--transition)}
.mini-tab.active{background:var(--iris-500);color:#fff}

/* ── Progress bar ── */
.progress-bar-wrap{background:var(--neutral-100);border-radius:var(--radius-full);height:6px;overflow:hidden;margin-top:var(--space-1)}
.progress-bar{height:100%;border-radius:var(--radius-full);background:var(--iris-500);transition:width .5s var(--ease-out)}

/* ── Divider ── */
.divider{height:1px;background:var(--border);margin:var(--space-4) 0;border:none}

/* ── Scrollable table wrapper ── */
.tbl-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-responsive .data-table{min-width:560px}
/* entry table on mobile: no scroll, hide extras */
@media(max-width:767px){
  .tbl-responsive:has(.entry-tbl){overflow-x:visible}
}
.entry-tbl tbody tr:last-child td{border-bottom:none}

/* ── Print ── */
@media print{
  .sidebar,.top-bar,.ctrl-fab,.modal-overlay,.ctrl-drawer,.ctrl-drawer-overlay,
  .tabs,.filter-bar,.page-header .flex,.alert-notice,
  .entry-tbl .col-chev,.entry-expand-row{display:none!important}
  body{background:white}
  .page{display:block!important;padding:0;overflow:visible}
  .card{box-shadow:none!important;break-inside:avoid}
  #main{width:100%!important}
  @page{margin:18mm 15mm}
}

/* ── Responsive ── */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;bottom:0;right:0;z-index:200;transform:translateX(100%);transition:transform .28s cubic-bezier(.16,1,.3,1)}
  .sidebar.mobile-open{transform:translateX(0)}
  .sb-overlay{display:block;pointer-events:none}
  #main{width:100%}
  .top-bar-menu{display:flex}
  .stat-cards{grid-template-columns:repeat(2,1fr)}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .client-grid{grid-template-columns:1fr}
  .ctrl-2col,.ctrl-3col{grid-template-columns:1fr}
  .calc-trail-row{font-size:12px}
  .calc-trail-val{min-width:90px}
  .page{padding:14px}
  .sidebar.collapsed{width:var(--sidebar-w)}
}
@media(max-width:480px){
  .stat-cards{grid-template-columns:1fr}
}

/* ── Project hero header ── */
/* ── Project hero (v2) ── */
.proj-hero{
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;
  margin-bottom:var(--space-5);
}
.proj-hero-band{
  background:linear-gradient(145deg, oklch(0.96 0.03 275) 0%, var(--bg-elevated) 68%);
  padding:var(--space-6);position:relative;overflow:hidden;color:var(--fg-1);
  border-bottom:1px solid var(--border-subtle);
}
.proj-hero-band::after{display:none}
.proj-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);position:relative;z-index:1}
.proj-hero-badges{display:flex;gap:var(--space-1_5);flex-wrap:wrap;margin-bottom:var(--space-2)}
.proj-hero-badge{
  border-radius:var(--radius-full);padding:4px 12px;
  font-size:var(--font-2xs);font-weight:700;letter-spacing:.3px;
  display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;
}
.proj-hero-badge-status{background:var(--neutral-100);color:var(--fg-2);border-color:var(--border-subtle)}
.proj-hero-badge-status.st-active{background:var(--success-50);color:var(--success-700);border-color:oklch(0.68 0.16 155 / 0.25)}
.proj-hero-badge-status.st-completed{background:var(--iris-50);color:var(--iris-700);border-color:oklch(0.62 0.21 275 / 0.25)}
.proj-hero-badge-status.st-paused{background:var(--warning-50);color:var(--warning-700);border-color:oklch(0.78 0.16 75 / 0.25)}
.proj-hero-badge-type{background:var(--neutral-100);color:var(--fg-2);border-color:var(--border-subtle)}
.proj-hero-name{
  font-size:var(--font-2xl);font-weight:700;color:var(--fg-1);
  line-height:var(--lh-tight);margin-bottom:var(--space-2);letter-spacing:-0.015em;
}
.proj-hero-meta{
  font-size:var(--font-xs);color:var(--fg-2);
  display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);align-items:center;
}
.proj-hero-meta-item{display:flex;align-items:center;gap:5px}
.proj-hero-meta-item [data-lucide]{font-size:13px;opacity:.85}
.proj-hero-actions{display:flex;gap:var(--space-2);flex-shrink:0;position:relative;z-index:1}
.proj-hero-edit{
  background:var(--surface-1);border:1px solid var(--border-subtle);
  color:var(--fg-1);border-radius:var(--radius-sm);padding:8px 14px;
  font-size:var(--font-xs);font-weight:500;cursor:pointer;font-family:inherit;
  transition:var(--transition-fast);white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.proj-hero-edit:hover{background:var(--neutral-100);border-color:var(--border-default)}

/* Progress bar in hero */
.proj-hero-progress{margin-top:var(--space-4);position:relative;z-index:1}
.proj-hero-progress-labels{display:flex;justify-content:space-between;font-size:var(--font-2xs);color:var(--fg-3);margin-bottom:var(--space-1);font-weight:600}
.proj-hero-progress-track{background:var(--neutral-200);border-radius:var(--radius-full);height:6px;overflow:hidden}
.proj-hero-progress-fill{
  height:100%;border-radius:var(--radius-full);
  background:var(--iris-500);
  transition:width .6s var(--ease-out);
}
.proj-hero-progress-fill.overspent{background:var(--danger-500)}

/* Stats strip */
.proj-hero-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border)}
.phs{
  padding:var(--space-4);border-inline-start:1px solid var(--border-subtle);
  min-width:0;transition:background var(--transition-fast);
}
.phs:hover{background:var(--neutral-50)}
.phs:last-child{border-inline-start:none}
.phs-lbl{
  font-size:var(--font-2xs);color:var(--fg-3);
  margin-bottom:var(--space-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:500;
}
.phs-val{
  font-size:clamp(16px,2vw,22px);font-weight:700;font-family:var(--font-mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:var(--lh-tight);letter-spacing:-.5px;
}
.phs.ph-brand .phs-val{color:var(--iris-600)}
.phs.ph-danger .phs-val{color:var(--danger-600)}
.phs.ph-success .phs-val{color:var(--success-600)}
.phs.ph-warn .phs-val{color:var(--warning-600)}
@media(max-width:600px){
  .proj-hero-band{padding:var(--space-4)}
  .proj-hero-name{font-size:var(--font-xl)}
  .proj-hero-stats{grid-template-columns:repeat(2,1fr)}
  .phs{padding:var(--space-3)}
  .phs:nth-child(2){border-inline-start:none}
  .phs:nth-child(1),.phs:nth-child(2){border-bottom:1px solid var(--border-subtle)}
  .phs-val{font-size:var(--font-lg)}
}

/* ── Client avatar in project hero ── */
.proj-client-avatar{
  width:52px;height:52px;flex-shrink:0;border-radius:var(--radius-lg);
  background:var(--iris-500);color:#fff;font-weight:800;font-size:var(--font-xl);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;transition:opacity var(--transition-fast);user-select:none;
  box-shadow:0 2px 8px oklch(0.52 0.22 275 / 0.22);
}
.proj-client-avatar:hover{opacity:.85}
@media(max-width:600px){
  .proj-client-avatar{width:42px;height:42px;font-size:var(--font-md);flex-shrink:0}
  /* move action buttons to their own row below the title area */
  .proj-hero-top{flex-wrap:wrap;gap:var(--space-2)}
  .proj-hero-actions{
    width:100%;order:10;
    border-top:1px solid var(--border-subtle);
    padding-top:var(--space-2_5);margin-top:2px;
    gap:var(--space-2);
  }
  .proj-hero-edit{flex:1;justify-content:center;padding:7px 10px;font-size:var(--font-xs)}
}

/* ── Budget item card (replaces table rows) ── */
.budget-item{
  border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-3);margin-bottom:var(--space-2);
  background:var(--neutral-50);
}
.budget-item:last-child{margin-bottom:0}

/* ── Page safe-area bottom on mobile ── */
@media(max-width:767px){
  .page{padding-bottom:max(var(--container-pad), env(safe-area-inset-bottom, 20px))}
}

/* ── Entry table date column ── */
.entry-tbl .col-date{width:82px;font-size:12px;color:var(--text-muted)}

/* ── Utility ── */
.text-muted{color:var(--text-muted)}
.text-right{text-align:left}/* in RTL left = visual right */
.mono{font-family:"IBM Plex Mono",monospace}
.fw-600{font-weight:600}
.mt-8{margin-top:8px}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.mt-20{margin-top:20px}
.mb-12{margin-bottom:12px}
.gap-8{gap:8px}
.flex{display:flex}.flex-center{align-items:center}.justify-between{justify-content:space-between}
.w-full{width:100%}
.section-title{font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── Dashboard v2 ── */
/* ── Dashboard greeting (Axis — white card, iris accent) ── */
.dash-greeting{
  background:var(--surface-1);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);padding:var(--space-6) var(--space-6);
  margin-bottom:var(--space-5);
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--space-4);
  position:relative;overflow:hidden;
}
.dash-greeting-grid{display:none}
.dash-greeting > * {position:relative;z-index:1}
.dash-greeting-text h2{
  font-size:var(--font-2xl);font-weight:700;color:var(--fg-1);
  margin-bottom:var(--space-1);letter-spacing:-0.015em;line-height:var(--lh-tight);
}
.dash-greeting-text p{font-size:var(--font-sm);color:var(--fg-3);font-weight:400}
.dash-greeting-actions{display:flex;gap:var(--space-2);flex-shrink:0;flex-wrap:wrap}

/* Replaced btn-white/btn-white-solid with standard btn variants */
.btn-white{
  background:var(--surface-1);border:1px solid var(--border-subtle);
  color:var(--fg-1);border-radius:var(--radius-sm);padding:9px 16px;
  font-size:var(--font-sm);font-weight:500;cursor:pointer;
  font-family:inherit;transition:var(--transition);
  display:inline-flex;align-items:center;gap:6px;
}
.btn-white:hover{background:var(--neutral-100);border-color:var(--border-default)}
.btn-white-solid{
  background:var(--iris-500);border:1px solid var(--iris-500);color:#fff;
  border-radius:var(--radius-sm);padding:9px 16px;
  font-size:var(--font-sm);font-weight:600;cursor:pointer;
  font-family:inherit;transition:var(--transition);
  display:inline-flex;align-items:center;gap:6px;
}
.btn-white-solid:hover{background:var(--iris-600);border-color:var(--iris-600)}

/* ── KPI Cards (v2) ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);margin-bottom:var(--space-4)}
.kpi-card{
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:var(--space-4);
  position:relative;overflow:hidden;
  transition:border-color var(--transition);
}
.kpi-card:hover{border-color:var(--neutral-300)}
.kpi-card-accent{display:none}
.kpi-card-icon{
  width:32px;height:32px;border-radius:var(--radius-xs);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:var(--space-2);
}
.kpi-card-icon [data-lucide]{width:16px;height:16px}
.kpi-card-label{
  font-size:var(--font-2xs);color:var(--fg-3);font-weight:500;
  margin-bottom:var(--space-1_5);
}
.kpi-card-value{
  font-size:clamp(18px,2.2vw,26px);font-weight:700;
  font-family:var(--font-mono);line-height:var(--lh-tight);
  margin-bottom:var(--space-1_5);letter-spacing:-.8px;
}
.kpi-card-sub{font-size:var(--font-2xs);color:var(--fg-3);display:flex;align-items:center;gap:var(--space-1);font-weight:500}
.kpi-trend-up{color:var(--success-600);font-weight:600;background:var(--success-50);padding:1px 6px;border-radius:var(--radius-full);font-size:11px}
.kpi-trend-down{color:var(--danger-600);font-weight:600;background:var(--danger-50);padding:1px 6px;border-radius:var(--radius-full);font-size:11px}

/* Dashboard 2-col */
.dash-2col{display:grid;grid-template-columns:1fr 340px;gap:var(--space-4);margin-bottom:var(--space-5)}
.dash-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-5)}

/* Project status donut */
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);padding:var(--space-1) 0}
.donut-legend{width:100%;display:flex;flex-direction:column;gap:var(--space-2)}
.donut-legend-item{display:flex;align-items:center;justify-content:space-between;font-size:var(--font-xs)}
.donut-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-left:var(--space-2)}
.donut-legend-lbl{flex:1;color:var(--text-strong);font-weight:500}
.donut-legend-val{font-family:var(--font-mono);font-weight:700;color:var(--text);font-size:var(--font-2xs);background:var(--neutral-100);padding:2px 8px;border-radius:var(--radius-xs)}

/* Horizontal bar chart */
.hbar-item{margin-bottom:var(--space-3);cursor:pointer;padding:6px 8px;border-radius:var(--radius-sm);transition:background var(--transition-fast);margin-right:-8px;margin-left:-8px}
.hbar-item:hover{background:var(--neutral-50)}
.hbar-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:var(--font-xs)}
.hbar-name{color:var(--text-strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
.hbar-val{font-family:var(--font-mono);font-weight:700;color:var(--text);font-size:var(--font-2xs);white-space:nowrap}
.hbar-track{background:var(--neutral-100);border-radius:var(--radius-full);height:8px;overflow:hidden}
.hbar-fill{height:100%;border-radius:var(--radius-full);transition:width .5s cubic-bezier(.16,1,.3,1)}

/* Activity feed */
.activity-feed{display:flex;flex-direction:column;gap:0}
.activity-item{
  display:flex;gap:var(--space-3);padding:var(--space-3) 0;
  border-bottom:1px solid var(--neutral-100);font-size:var(--font-xs);
  transition:background var(--transition-fast);align-items:center;
}
.activity-item:hover{background:var(--neutral-50);margin:0 calc(var(--space-3) * -1);padding-left:var(--space-3);padding-right:var(--space-3);border-radius:var(--radius-sm)}
.activity-item:last-child{border-bottom:none}
.activity-dot{
  width:36px;height:36px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.activity-dot [data-lucide]{font-size:16px}
.activity-body{flex:1;min-width:0}
.activity-title{font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--font-sm)}
.activity-meta{color:var(--text-muted);font-size:var(--font-2xs)}

/* Quick actions */
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.qa-btn{
  background:var(--neutral-50);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:var(--space-4) var(--space-3);
  cursor:pointer;font-family:inherit;font-size:var(--font-xs);font-weight:600;
  color:var(--text-strong);transition:var(--transition);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2);text-align:right;
  min-height:76px;
}
.qa-btn:hover{background:var(--iris-50);border-color:var(--iris-200);color:var(--iris-600)}
.qa-btn [data-lucide]{width:22px;height:22px;flex-shrink:0;color:var(--iris-500)}

/* Dash section header */
.dash-sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4)}
.dash-sec-hdr h3{
  font-size:var(--font-md);font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:var(--space-2);letter-spacing:-.1px;
}
.dash-sec-hdr h3 [data-lucide]{width:18px;height:18px;color:var(--iris-500)}

@media(max-width:900px){
  .dash-2col{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:var(--space-2_5)}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:var(--space-2)}
  .kpi-card{padding:var(--space-3)}
  .kpi-card-value{font-size:clamp(16px,5vw,20px)}
  .dash-greeting{flex-direction:column;align-items:flex-start}
  .quick-actions{grid-template-columns:1fr}
}

/* ══════════════════════════════════════════
   CONTRACT EDITOR — layout + A4 canvas
══════════════════════════════════════════ */
.contract-editor-page{padding:0!important;overflow:hidden}
.contract-editor-page.active{display:flex!important;flex-direction:row}
.contract-sidebar{
  width:260px;flex-shrink:0;overflow-y:auto;
  background:var(--bg-elevated);
  border-inline-start:1px solid var(--border);
  display:flex;flex-direction:column;
}
.contract-sidebar-left{border-inline-start:none;border-inline-end:1px solid var(--border)}
.contract-sidebar-header{
  padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--border);
  font-size:var(--font-xs);font-weight:600;color:var(--fg-2);
  position:sticky;top:0;background:var(--bg-elevated);z-index:1;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.contract-sidebar-body{padding:var(--space-3);flex:1;overflow-y:auto}
.contract-sidebar-right{width:300px}
.contract-canvas-area{
  flex:1;overflow-y:auto;background:oklch(0.94 0.008 260);
  padding:40px 20px;display:flex;flex-direction:column;align-items:center;
  min-width:0;
}

/* A4 Document */
.contract-doc{
  width:794px;max-width:100%;background:#fff;
  box-shadow:0 4px 32px oklch(0 0 0 / 0.12);
  font-family:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;
  font-size:14pt;line-height:1.5;color:#1F2937;direction:rtl;
  margin-bottom:40px;
}

/* Cover Page */
.cov-page{
  padding:0;position:relative;
  min-height:1122px;
  display:flex;flex-direction:column;
  page-break-after:always;
}
.cov-frame-wrap{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:60px 50px;
}
.cov-frame-modern .cov-frame-wrap{
  border:2.5px solid #0F2A4A;margin:24px;border-radius:4px;
}
.cov-frame-classical .cov-frame-wrap{
  border:2px solid #B8860B;outline:6px double #B8860B;outline-offset:-12px;margin:20px;padding:50px;
}
.cov-frame-minimal .cov-frame-wrap{
  border-top:4px solid #0F2A4A;border-bottom:1px solid #E5E7EB;
  margin:0;padding:60px 60px;
}
.cov-logo-slot{
  width:80px;height:80px;border-radius:12px;
  background:var(--iris-50);border:2px dashed var(--iris-300);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;color:var(--iris-400);font-size:11px;cursor:pointer;
}
.cov-title{font-size:18pt;font-weight:700;color:#0F2A4A;line-height:1.3;margin-bottom:12px}
.cov-subtitle{font-size:12pt;color:#6B7280;margin-bottom:40px}
.cov-parties-box{
  border:1px solid #E5E7EB;border-radius:6px;padding:20px 32px;
  max-width:420px;text-align:right;font-size:11pt;
}
.cov-parties-row{padding:6px 0;border-bottom:1px solid #F3F4F6;color:#374151}
.cov-parties-row:last-child{border-bottom:none}
.cov-parties-row strong{color:#0F2A4A;display:block;font-size:10pt;color:#6B7280;font-weight:500}
.cov-ref-line{margin-top:32px;font-size:10pt;color:#9CA3AF}

/* Image cover frame */
.cov-frame-image{
  background:#0F2A4A;
  position:relative;overflow:hidden;
}
.cov-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:0;
}
.cov-overlay{
  position:absolute;inset:0;z-index:1;
  background:rgba(0,0,0,0.55);
}
.cov-frame-image .cov-frame-wrap{
  position:relative;z-index:2;border:none;margin:0;
  color:#fff;
}
.cov-frame-image .cov-title{color:#fff}
.cov-frame-image .cov-subtitle{color:rgba(255,255,255,0.8)}
.cov-frame-image .cov-parties-box{
  background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25);
  color:#fff;backdrop-filter:blur(4px);
}
.cov-frame-image .cov-parties-row{border-bottom-color:rgba(255,255,255,0.15)}
.cov-frame-image .cov-ref-line{color:rgba(255,255,255,0.6)}
