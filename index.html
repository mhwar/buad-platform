/* Position picker grid (used in overlay slot cards) */
.pos-grid{display:grid;grid-template-columns:repeat(3,28px);gap:3px}
.pos-grid-btn{width:28px;height:22px;border:1px solid var(--border);border-radius:3px;background:var(--bg-elevated);cursor:pointer;position:relative;padding:0;transition:background 100ms,border-color 100ms}
.pos-grid-btn:hover{background:var(--iris-50);border-color:var(--iris-300)}
.pos-grid-btn.active{background:var(--iris-50);border-color:var(--iris-500)}
.pos-grid-btn::after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:var(--fg-4)}
.pos-grid-btn.active::after{background:var(--iris-600)}
.pos-grid-btn[data-pos="top-right"]::after{top:3px;right:3px}
.pos-grid-btn[data-pos="top-center"]::after{top:3px;left:50%;transform:translateX(-50%)}
.pos-grid-btn[data-pos="top-left"]::after{top:3px;left:3px}
.pos-grid-btn[data-pos="center-right"]::after{top:50%;right:3px;transform:translateY(-50%)}
.pos-grid-btn[data-pos="center"]::after{top:50%;left:50%;transform:translate(-50%,-50%)}
.pos-grid-btn[data-pos="center-left"]::after{top:50%;left:3px;transform:translateY(-50%)}
.pos-grid-btn[data-pos="bottom-right"]::after{bottom:3px;right:3px}
.pos-grid-btn[data-pos="bottom-center"]::after{bottom:3px;left:50%;transform:translateX(-50%)}
.pos-grid-btn[data-pos="bottom-left"]::after{bottom:3px;left:3px}
/* Preset chips for adding overlay slots quickly */
.preset-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;font-size:10px;border:1px solid var(--border);border-radius:100px;background:var(--bg-elevated);cursor:pointer;color:var(--fg-2);white-space:nowrap;font-family:inherit;line-height:1.6}
.preset-chip:hover{background:var(--iris-50);border-color:var(--iris-300);color:var(--iris-700)}

/* Empty header/footer placeholder (no image, no overlay) */
.doc-page-hdr.empty,.doc-page-ftr.empty{
  background:repeating-linear-gradient(45deg,#FAFAFA,#FAFAFA 8px,#F3F4F6 8px,#F3F4F6 16px);
  display:flex;align-items:center;justify-content:center;
  color:#D1D5DB;font-size:11px;
}

/* Body area — holds clauses with inner padding (text margins) */
.doc-page-body{
  padding:1cm 2cm;
  overflow:hidden;position:relative;
}
.doc-page-body.cov-body{padding:0}

/* Print: each .doc-page exactly fills one A4 sheet */
@media print{
  body{background:white!important}
  .contract-doc{gap:0!important;margin:0!important}
  .doc-page{
    margin:0!important;
    box-shadow:none!important;
    width:210mm!important;height:297mm!important;
    page-break-after:always!important;break-after:page!important;
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  }
  .doc-page:last-child{page-break-after:auto!important;break-after:auto!important}
  .doc-page-hdr,.doc-page-ftr,
  .doc-page-hdr-img,.doc-page-ftr-img{
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  }
  .doc-page-hdr.empty,.doc-page-ftr.empty{background:transparent!important}
}

/* Cover Page */
.cov-page{
  padding:0;position:relative;
  min-height:1122px;
  display:flex;flex-direction:column;
  page-break-after:always;
}
.cov-frame-wrap{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:60px 50px;
}
.cov-frame-modern .cov-frame-wrap{
  border:2.5px solid #0F2A4A;margin:24px;border-radius:4px;
}
.cov-frame-classical .cov-frame-wrap{
  border:2px solid #B8860B;outline:6px double #B8860B;outline-offset:-12px;margin:20px;padding:50px;
}
.cov-frame-minimal .cov-frame-wrap{
  border-top:4px solid #0F2A4A;border-bottom:1px solid #E5E7EB;
  margin:0;padding:60px 60px;
}
.cov-logo-slot{
  width:80px;height:80px;border-radius:12px;
  background:var(--iris-50);border:2px dashed var(--iris-300);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;color:var(--iris-400);font-size:11px;cursor:pointer;
}
.cov-title{font-size:18pt;font-weight:700;color:#0F2A4A;line-height:1.3;margin-bottom:12px}
.cov-subtitle{font-size:12pt;color:#6B7280;margin-bottom:40px}
.cov-parties-box{
  border:1px solid #E5E7EB;border-radius:6px;padding:20px 32px;
  max-width:420px;text-align:right;font-size:11pt;
}
.cov-parties-row{padding:6px 0;border-bottom:1px solid #F3F4F6;color:#374151}
.cov-parties-row:last-child{border-bottom:none}
.cov-parties-row strong{color:#0F2A4A;display:block;font-size:10pt;color:#6B7280;font-weight:500}
.cov-ref-line{margin-top:32px;font-size:10pt;color:#9CA3AF}

/* Image cover frame */
.cov-frame-image{
  background:#0F2A4A;
  position:relative;overflow:hidden;
}
.cov-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;z-index:0;
}
.cov-overlay{
  position:absolute;inset:0;z-index:1;
  background:rgba(0,0,0,0.55);
}
.cov-frame-image .cov-frame-wrap{
  position:relative;z-index:2;border:none;margin:0;
  color:#fff;
}
.cov-frame-image .cov-title{color:#fff}
.cov-frame-image .cov-subtitle{color:rgba(255,255,255,0.8)}
.cov-frame-image .cov-parties-box{
  background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25);
  color:#fff;backdrop-filter:blur(4px);
}
.cov-frame-image .cov-parties-row{border-bottom-color:rgba(255,255,255,0.15)}
.cov-frame-image .cov-ref-line{color:rgba(255,255,255,0.6)}
.cov-frame-image .cov-parties-row strong{color:rgba(255,255,255,0.7)}

/* ─── Free-form cover canvas ─── */
.cov-free-canvas{position:relative;width:100%;height:1123px;overflow:hidden;display:block}
.cov-free-bg{position:absolute;inset:0;z-index:0}
.cov-free-bg img.cov-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:block}
.cov-free-bg-overlay{position:absolute;inset:0;z-index:1;pointer-events:none}
.cov-el{position:absolute;box-sizing:border-box;z-index:2;touch-action:none}
.cov-el[data-draggable="1"]{cursor:move;user-select:none}
.cov-el-dragging{opacity:0.7;outline:2px dashed var(--iris-400);outline-offset:3px}
.cov-el-logo{display:flex;flex-direction:column;align-items:center;justify-content:center}
.cov-el-logo img{max-width:100%;max-height:90px;object-fit:contain;display:block;margin:0 auto}
.cov-el-logo .logo-ph{min-width:80px;min-height:56px;border:2px dashed #CBD5E1;border-radius:8px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#94A3B8;padding:8px;cursor:pointer}
.cov-el-text{line-height:1.4;white-space:pre-wrap;word-break:break-word}
.cov-el-parties .cov-parties-box{border:1px solid #E5E7EB;border-radius:6px;padding:14px 24px;width:100%;box-sizing:border-box}
.cov-el-parties .cov-parties-row{padding:5px 0;border-bottom:1px solid #F3F4F6;font-size:11pt;color:#374151}
.cov-el-parties .cov-parties-row:last-child{border-bottom:none}
.cov-el-parties .cov-parties-row strong{display:block;font-size:10pt;color:#6B7280;font-weight:500}
.cov-el-divider hr{border:none;margin:0}
.cov-el-image img{max-width:100%;display:block}
/* cover element settings cards */
.cov-el-card{border:1px solid var(--border);border-radius:var(--radius-xs);padding:8px 10px;margin-bottom:6px;background:var(--bg-elevated)}
.cov-el-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.cov-el-type-label{font-size:11px;font-weight:600;color:var(--fg-2)}
.cov-pos-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:6px}
.cov-pos-field label{font-size:10px;color:var(--fg-3);display:block;margin-bottom:2px}
.cov-pos-field input{width:100%;font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--fg-1)}

/* Doc header (shown on body pages, hidden on cover) */
.contract-doc-header{
  display:none;
  padding:10px 50px;border-bottom:1.5px solid #0F2A4A;
  font-size:9pt;color:#4B5563;
  align-items:center;justify-content:space-between;
}
.contract-doc-footer{
  padding:8px 50px;border-top:1px solid #E5E7EB;
  font-size:9pt;color:#9CA3AF;
  display:flex;align-items:center;justify-content:space-between;
  background:#FAFAFA;
}
.contract-hdr-img-band{width:100%;display:block;margin:0}
.contract-hdr-img-band img{width:100%;display:block;object-fit:contain}
.contract-ftr-img-band{width:100%;display:block;margin:0}
.contract-ftr-img-band img{width:100%;display:block;object-fit:contain}

/* Article / Clause block — uniform 14px padding top/bottom on every clause
   including the first; with body padding-top:0 this creates a 14px gap
   from header bottom to first clause title, identical to inter-clause gap. */
.clause-block{
  padding:14px 0;
  position:relative;
}
.clause-block-inner{padding-inline-start:0}
.clause-block + .clause-block::before{
  content:'';display:block;height:1px;
  background:var(--border);margin-bottom:14px;
}
.clause-title{
  font-size:14pt;font-weight:700;color:#0F2A4A;
  margin-bottom:10px;cursor:default;
}
.clause-body{
  outline:none;min-height:60px;
  color:#1F2937;white-space:pre-wrap;word-wrap:break-word;text-align:justify;
}
.clause-body:focus{
  background:oklch(0.97 0.02 275 / 0.35);
  border-radius:4px;padding:4px;margin:-4px;
}
/* Clause controls */
.clause-controls{
  position:absolute;inset-inline-end:12px;top:18px;
  display:flex;gap:3px;
  opacity:0;transition:opacity 150ms;
}
.clause-block:hover .clause-controls{opacity:1}
.clause-ctrl-btn{
  width:26px;height:26px;border-radius:var(--radius-xs);
  border:1px solid var(--border);background:var(--bg-elevated);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--fg-3);padding:0;
  transition:var(--transition-fast);
}
.clause-ctrl-btn:hover{background:var(--neutral-100);color:var(--fg-1)}
.clause-ctrl-btn.danger:hover{background:var(--danger-50);color:var(--danger-600)}
.clause-ctrl-btn.break-active{background:var(--iris-100);color:var(--iris-600);border-color:var(--iris-300)}
.clause-block.has-break{border-top:2px dashed var(--iris-400)!important;margin-top:20px}
.clause-block.has-break::before{content:'↧ بداية صفحة جديدة';display:block;font-size:9px;color:var(--iris-400);margin-bottom:8px;text-align:center;letter-spacing:.02em}
.clause-ctrl-btn [data-lucide]{width:13px;height:13px}
/* Continuation fragment styling: the (تابع) title shows muted to signal it's not a new clause */
.clause-body[data-fragment-mode="continued"]{border-top:1px dashed var(--neutral-200);padding-top:8px}

/* Variable chip */
.var-chip{
  display:inline;background:#FEF3C7;color:#92400E;
  border-radius:3px;padding:0 4px;font-weight:500;font-size:0.95em;
}
.var-chip.empty{background:var(--danger-50);color:var(--danger-700);text-decoration:underline dotted}

/* Signature page */
.sig-page{padding:24px 0 0}
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.sig-block{border:1px solid #E5E7EB;border-radius:6px;padding:24px;text-align:center}
.sig-block-title{font-size:11pt;font-weight:700;color:#0F2A4A;margin-bottom:6px}
.sig-block-org{font-size:10.5pt;font-weight:600;color:#1F2937;margin-bottom:4px}
.sig-block-rep{font-size:10pt;color:#374151;margin-bottom:2px}
.sig-block-rep-title{font-size:9pt;color:#6B7280;margin-bottom:32px}
.sig-placeholder{color:#D1D5DB!important}
.sig-line{border-bottom:1.5px solid #374151;width:180px;margin:0 auto 8px}
.sig-line-label{font-size:9pt;color:#9CA3AF}

/* Clause library sidebar items */
.clause-lib-item{
  padding:8px 10px;border-radius:var(--radius-sm);
  border:1px solid var(--border);margin-bottom:5px;
  font-size:var(--font-xs);color:var(--fg-2);
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);
  cursor:pointer;transition:var(--transition-fast);background:var(--bg-elevated);
}
.clause-lib-item:hover{border-color:var(--iris-300);background:var(--iris-50);color:var(--iris-700)}
.clause-lib-add-btn{
  width:20px;height:20px;border-radius:50%;border:none;
  background:var(--iris-100);color:var(--iris-600);
  font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:inherit;padding:0;
}

/* Variable fields in right sidebar */
.var-field{margin-bottom:10px}
.var-field-lbl{font-size:var(--font-2xs);color:var(--fg-3);margin-bottom:3px;font-weight:500}
.var-field-inp{
  width:100%;padding:6px 8px;border-radius:var(--radius-xs);
  border:1px solid var(--border);background:var(--bg-elevated);
  font-family:inherit;font-size:var(--font-xs);color:var(--fg-1);
  outline:none;box-sizing:border-box;
}
.var-field-inp:focus{border-color:var(--iris-400);box-shadow:var(--shadow-focus)}
.var-field-inp.auto-val{
  background:oklch(0.96 0.02 275);border-color:var(--iris-200);color:var(--iris-700);
}
/* Contract sidebar tabs */
.ctab-pills{display:flex;gap:4px;padding:var(--space-1_5) var(--space-2);border-bottom:1px solid var(--border);flex-shrink:0}
.ctab-pill{flex:1;padding:6px 0;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);font-size:var(--font-xs);color:var(--fg-2);cursor:pointer;font-family:inherit;text-align:center;transition:var(--transition-fast)}
.ctab-pill.active{background:oklch(0.15 0.02 275);border-color:oklch(0.15 0.02 275);color:#fff;font-weight:600}
/* Variable group labels */
.var-group-lbl{font-size:var(--font-2xs);font-weight:700;color:var(--fg-3);letter-spacing:.4px;padding:var(--space-2) 0 var(--space-1);margin-top:var(--space-3);border-bottom:1px solid var(--border);margin-bottom:var(--space-2);display:flex;align-items:center;gap:5px}
.var-group-lbl:first-child{margin-top:0}
.var-group-lbl [data-lucide]{width:12px;height:12px;flex-shrink:0}
/* Settings sub-section */
.stg-section{margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--border)}
.stg-section-lbl{font-size:var(--font-xs);font-weight:600;color:var(--fg-2);margin-bottom:var(--space-3)}
/* Margin grid */
.margin-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.margin-field label{font-size:var(--font-2xs);color:var(--fg-3);display:block;margin-bottom:2px}
.margin-field input{width:100%;font-size:var(--font-xs);padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--bg);text-align:center;font-family:var(--font-mono)}

/* Contract card in project page (contract list) */
.contract-card{
  display:flex;align-items:center;gap:var(--space-3);
  background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
  margin-bottom:var(--space-2);transition:border-color var(--transition-fast);
}
.contract-card:hover{border-color:var(--neutral-300)}
.contract-card-icon{
  width:40px;height:40px;flex-shrink:0;border-radius:var(--radius-sm);
  background:var(--iris-50);color:var(--iris-600);
  display:flex;align-items:center;justify-content:center;
}
.contract-card-main{flex:1;min-width:0}
.contract-card-title{font-size:var(--font-sm);font-weight:600;color:var(--fg-1);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.contract-card-meta{font-size:var(--font-2xs);color:var(--fg-3);display:flex;gap:var(--space-3)}

/* Preview / Print mode */
.contract-editor-page.cep-preview .clause-controls,
.contract-editor-page.cep-preview .contract-sidebar-left{display:none!important}
.contract-editor-page.cep-preview .clause-body{pointer-events:none}
.contract-editor-page.cep-preview .contract-doc-header{display:flex}

/* Responsive: hide sidebars on small screens */
@media(max-width:1100px){
  .contract-sidebar-left{display:none}
}
@media(max-width:900px){
  .contract-sidebar-right{display:none}
}

/* A4 Print rules: in-page Ctrl+P (the printContract popup uses its own self-contained CSS) */
@media print{
  body > *:not(#app){display:none!important}
  #app .page:not(.contract-editor-page){display:none!important}
  .contract-editor-page{display:flex!important}
  .contract-sidebar,#top-bar-wrap,.top-bar,.ctrl-fab,
  .modal-overlay,.ctrl-drawer,.ctrl-drawer-overlay,
  .clause-controls,.contract-mobile-bar{display:none!important}
  .contract-canvas-area{background:white!important;padding:0!important;overflow:visible!important;flex:1}
  .contract-doc{margin:0!important;gap:0!important}
  @page{size:A4 portrait;margin:0}
  /* .doc-page already set to A4 dimensions in its own rule */
}

/* Template picker cards in modal */
.tpl-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-bottom:var(--space-4)}
.tpl-pick-card{
  border:2px solid var(--border);border-radius:var(--radius-md);padding:var(--space-4);
  cursor:pointer;text-align:center;transition:var(--transition-fast);
  background:var(--bg-elevated);
}
.tpl-pick-card:hover{border-color:var(--iris-400);background:var(--iris-50)}
.tpl-pick-card.selected{border-color:var(--iris-500);background:var(--iris-50)}
.tpl-pick-icon{
  width:44px;height:44px;border-radius:var(--radius-sm);
  background:var(--iris-100);color:var(--iris-600);
  display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-2);
}
.tpl-pick-name{font-size:var(--font-xs);font-weight:600;color:var(--fg-1)}
.tpl-pick-sub{font-size:11px;color:var(--fg-3);margin-top:3px}
@media(max-width:600px){
  .tpl-pick-grid{grid-template-columns:1fr 1fr}
  .clause-ctrl-btn{width:22px;height:22px}
  .contract-doc{width:100%}
  .clause-block{padding:16px 20px}
  .clause-block-inner{padding-inline-start:0}
  .sig-grid{grid-template-columns:1fr}
}

/* Mobile contract editor — bottom tab bar */
@media(max-width:768px){

  .contract-sidebar-left,.contract-sidebar-right{

<script>
/* ═══════════════════════════════════════════
   DB LAYER
═══════════════════════════════════════════ */
var DB = {
  uid: function() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  },
  getClients: function() {
    try { return JSON.parse(localStorage.getItem('buad2_clients')||'[]'); } catch(e){ return []; }
  },
  saveClients: function(a) {
    localStorage.setItem('buad2_clients', JSON.stringify(a));
  },
  getProjects: function() {
    try { return JSON.parse(localStorage.getItem('buad2_projects')||'[]'); } catch(e){ return []; }
  },
  saveProjects: function(a) {
    localStorage.setItem('buad2_projects', JSON.stringify(a));
  },
  getFin: function(pid) {
    try {
      var d = JSON.parse(localStorage.getItem('buad2_fin_'+pid)||'null');
      if (d && typeof d==='object') return d;
    } catch(e){}
    return {
      ctrl: {
        contract_value:0, vat_pct:15, vat_type:'pct', vat_base:'gross',
        vat_included:false, exec_v:10, exec_type:'pct', exec_base:'gross',
        mkt_v:0, mkt_type:'pct', mkt_base:'gross', mkt_internal:false,
        cb_v:0, cb_type:'pct', cb_base:'gross',
        contract_no:'', contract_date:'', client_name_override:''
      },
      budget: [],
      entries: [],
      tasks: { tasks:[], 'req-us':[], 'req-cl':[] },
      contracts: []
    };
  },
  saveFin: function(pid, d) {
    localStorage.setItem('buad2_fin_'+pid, JSON.stringify(d));
  }
};
DB.getSettings = function() {
  try { return JSON.parse(localStorage.getItem('buad2_settings') || '{}'); } catch(e) { return {}; }
};
DB.saveSettings = function(upd) {
  var cur = DB.getSettings();
  localStorage.setItem('buad2_settings', JSON.stringify(Object.assign(cur, upd)));
};
DB.getContracts = function(pid) {
  var fin = DB.getFin(pid);
  return fin.contracts || [];
};
DB.saveContract = function(pid, c) {
  var fin = DB.getFin(pid);
  if (!fin.contracts) fin.contracts = [];
  var idx = -1;
  for(var i=0;i<fin.contracts.length;i++){ if(fin.contracts[i].id===c.id){idx=i;break;} }
  if (idx>=0) fin.contracts[idx]=c; else fin.contracts.push(c);
  DB.saveFin(pid, fin);
};
DB.deleteContract = function(pid, cid) {
  var fin = DB.getFin(pid);
  fin.contracts = (fin.contracts||[]).filter(function(x){ return x.id!==cid; });
  DB.saveFin(pid, fin);
};
DB.getCustomTemplates = function() {
  try { return JSON.parse(localStorage.getItem('buad2_custom_templates')||'[]'); } catch(e){ return []; }
};
DB.saveCustomTemplate = function(t) {
  var arr = DB.getCustomTemplates();
  var idx = -1;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===t.id){idx=i;break;} }
  if(idx>=0) arr[idx]=t; else arr.push(t);
  localStorage.setItem('buad2_custom_templates', JSON.stringify(arr));
};
DB.deleteCustomTemplate = function(id) {
  var arr = DB.getCustomTemplates().filter(function(x){return x.id!==id;});
  localStorage.setItem('buad2_custom_templates', JSON.stringify(arr));
};

/* ═══════════════════════════════════════════
   FINCALC
═══════════════════════════════════════════ */
var FinCalc = {
  calc: function(pid) {
    var fin = DB.getFin(pid);
    var c = fin.ctrl || {};
    var cv = parseFloat(c.contract_value)||0;
    var vatPct = parseFloat(c.vat_pct)||0;
    var vatIncluded = !!c.vat_included;
    var execV = parseFloat(c.exec_v)||0;
    var mktV = parseFloat(c.mkt_v)||0;
    var cbV = parseFloat(c.cb_v)||0;
    var isInternalMkt = !!c.mkt_internal;

    var contractNet, vatAmt;
    if (vatIncluded) {
      contractNet = cv / (1 + vatPct/100);
      vatAmt = cv - contractNet;
    } else {
      contractNet = cv;
      vatAmt = cv * vatPct / 100;
    }
    var grossTotal = contractNet + vatAmt;

    function _applyFee(v, type, base, net, gross) {
      if (type === 'fixed') return parseFloat(v) || 0;
      return (base === 'gross' ? gross : net) * (parseFloat(v) || 0) / 100;
    }
    var execAmt = _applyFee(c.exec_v, c.exec_type||'pct', c.exec_base||'net', contractNet, grossTotal);
    var mkt     = _applyFee(c.mkt_v,  c.mkt_type||'pct',  c.mkt_base||'net',  contractNet, grossTotal);
    var cb      = _applyFee(c.cb_v,   c.cb_type||'pct',   c.cb_base||'net',   contractNet, grossTotal);
    var cfAmt   = _applyFee(c.cf_v,   c.cf_type||'pct',   c.cf_base||'net',   contractNet, grossTotal);

    var budget = fin.budget || [];
    var budgetTotal = budget.reduce(function(s,b){ return s+(parseFloat(b.amount)||0); }, 0);

    var entries = fin.entries || [];
    var totalExpenses = entries.filter(function(e){ return e.type==='expense'; })
      .reduce(function(s,e){ return s+(parseFloat(e.amount)||0); }, 0);
    var totalIncome = entries.filter(function(e){ return e.type==='income'; })
      .reduce(function(s,e){ return s+(parseFloat(e.amount)||0); }, 0);
    var execIncomeReg = entries.filter(function(e){ return e.type==='income' && e.cat==='exec'; })
      .reduce(function(s,e){ return s+(parseFloat(e.amount)||0); }, 0);
    var profitMargins = entries.filter(function(e){ return e.type==='expense'; })
      .reduce(function(s,e){
        var pm = parseFloat(e.profit_margin)||0;
        var pmt = e.profit_margin_type||'pct';
        return s + (pmt==='fixed' ? pm : pm*(parseFloat(e.amount)||0)/100);
      }, 0);
    var nonExecInc = totalIncome - execIncomeReg;

    var execHasIncome = execIncomeReg > 0;
    var profit = execHasIncome
      ? Math.max(0, execIncomeReg + profitMargins + nonExecInc + (isInternalMkt ? mkt : 0))
      : Math.max(0, execAmt + profitMargins + nonExecInc + (isInternalMkt ? mkt : 0));

    var available  = contractNet - execAmt - mkt - cb - cfAmt;
    // المتبقي = إجمالي العقد − كل البنود المسجّلة (هامش الربح يُضاف للربح فقط ولا يُخصم مرة إضافية)
    var totalAllEntries = entries.reduce(function(s,e){ return s+(parseFloat(e.amount)||0); }, 0);
    var remaining  = grossTotal - totalAllEntries;

    // اكتشاف بنود الاتفاقية غير المسجّلة
    var regCats = entries.map(function(e){ return e.cat; });
    var missingItems = [];
    if (cfAmt > 0 && regCats.indexOf('cf') < 0) missingItems.push('ضريبة القيمة المضافة (الرسوم)');
    if (execAmt > 0 && regCats.indexOf('exec') < 0) missingItems.push('أتعاب التنفيذ');
    if (mkt > 0 && regCats.indexOf('mkt') < 0) missingItems.push('التسويق');
    if (cb > 0 && regCats.indexOf('cashback') < 0) missingItems.push('كاش باك');

    return {
      cv:cv, vatIncluded:vatIncluded, vatPct:vatPct, vatAmt:vatAmt,
      contractNet:contractNet, grossTotal:grossTotal,
      execAmt:execAmt, mkt:mkt, cb:cb,
      budgetTotal:budgetTotal, available:available,
      totalExpenses:totalExpenses, totalIncome:totalIncome, totalAllEntries:totalAllEntries,
      execIncomeReg:execIncomeReg, nonExecInc:nonExecInc,
      profitMargins:profitMargins,
      profit:profit, remaining:remaining,
      cfAmt:cfAmt,
      isInternalMkt:isInternalMkt, missingItems:missingItems
    };
  }
};

/* ═══════════════════════════════════════════
   NAV
═══════════════════════════════════════════ */
var Nav = {
  _cur: 'dash', _params: {},
  go: function(page, params) {
    Nav._cur = page; Nav._params = params||{};
    if (Pages._contractAutosaveTimer) { clearInterval(Pages._contractAutosaveTimer); Pages._contractAutosaveTimer = null; }
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    document.querySelectorAll('.sb-item').forEach(function(a){ a.classList.remove('active'); });
    var el = document.getElementById('pg-'+page);
    if (el) el.classList.add('active');
    var navEl = document.getElementById('nav-'+page);
    if (navEl) navEl.classList.add('active');
    if (page==='client') { var ni=document.getElementById('nav-clients'); if(ni) ni.classList.add('active'); }
    if (page==='fin') { var ni2=document.getElementById('nav-projects'); if(ni2) ni2.classList.add('active'); }
    if (page==='contract') { var ni3=document.getElementById('nav-projects'); if(ni3) ni3.classList.add('active'); }
    if (page==='templates') { var nt=document.getElementById('nav-templates'); if(nt) nt.classList.add('active'); }
    if (page==='template-editor') { var nt2=document.getElementById('nav-templates'); if(nt2) nt2.classList.add('active'); }
    if (page==='fin' && params && params.tab) { Pages._finTab = params.tab; }
    if (Pages['render_'+page]) Pages['render_'+page](params);
    if (typeof lucide !== 'undefined') lucide.createIcons();
    Nav.updateBreadcrumb(page, params);
    Nav.updateBadges();
    var m = document.getElementById('pg-'+page);
    if (m) m.scrollTop = 0;
    Nav.closeSidebar();
  },
  updateBadges: function() {
    try {
      var clients = DB.getClients();
      var projects = DB.getProjects();
      var bc = document.getElementById('sb-badge-clients');
      var bp = document.getElementById('sb-badge-projects');
      if (bc) bc.textContent = clients.length;
      if (bp) bp.textContent = projects.length;
    } catch(e){}
  },
  updateBreadcrumb: function(page, params) {
    var bc = document.getElementById('breadcrumb');
    if (!bc) return;
    var icons = {dash:'layout-dashboard', clients:'users', projects:'briefcase', settings:'settings-2'};
    var labels = {dash:'الرئيسية', clients:'العملاء', projects:'المشاريع', settings:'الإعدادات'};
    function iconHtml(n){ return n ? '<i data-lucide="'+n+'" style="width:14px;height:14px;opacity:.6;flex-shrink:0"></i>' : ''; }
    if (labels[page]) {
      bc.innerHTML = iconHtml(icons[page])+'<span class="bc-page">'+labels[page]+'</span>';
      if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: bc});
      return;
    }
    if (page==='client' && params && params.clientId) {
      var clients = DB.getClients();
      var cl = clients.find(function(c){ return c.id===params.clientId; });
      bc.innerHTML = iconHtml('users')+'<span onclick="Nav.go(\'clients\')" style="cursor:pointer;color:var(--iris-500)">العملاء</span><span class="bc-sep">/</span><span class="bc-page">'+(cl?UI.escHtml(cl.name):'عميل')+'</span>';
      if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: bc});
      return;
    }
    if (page==='fin' && params && params.projId) {
      var projects = DB.getProjects();
      var pr = projects.find(function(p){ return p.id===params.projId; });
      bc.innerHTML = iconHtml('briefcase')+'<span onclick="Nav.go(\'projects\')" style="cursor:pointer;color:var(--iris-500)">المشاريع</span><span class="bc-sep">/</span><span class="bc-page">'+(pr?UI.escHtml(pr.name):'مشروع')+'</span>';
      if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: bc});
      return;
    }
    if (page==='contract' && params && params.projId) {
      var pp = DB.getProjects().find(function(p){return p.id===params.projId;});
      var cc = pp ? DB.getContracts(params.projId).find(function(c){return c.id===params.contractId;}) : null;
      bc.innerHTML = iconHtml('briefcase')+
        '<span onclick="Nav.go(\'projects\')" style="cursor:pointer;color:var(--iris-500)">المشاريع</span>' +
        '<span class="bc-sep">←</span>' +
        (pp?'<span onclick="Nav.go(\'fin\',{projId:\''+params.projId+'\',tab:\'contracts\'})" style="cursor:pointer;color:var(--iris-500)">'+UI.escHtml(pp.name)+'</span><span class="bc-sep">←</span>':'') +
        '<span class="bc-page">'+(cc?UI.escHtml(cc.title):'عقد')+'</span>';
      if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: bc});
      return;
    }
    if (page==='templates') { bc.innerHTML = iconHtml('layout-template')+'<span class="bc-page">النماذج</span>'; if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: bc}); return; }
    if (page==='template-editor') {
      var tid = params && params.templateId;
      var tt = tid && tid!=='new' ? DB.getCustomTemplates().find(function(x){return x.id===tid;}) : null;
      bc.innerHTML = iconHtml('layout-template')+
        '<span onclick="Nav.go(\'templates\')" style="cursor:pointer;color:var(--iris-500)">النماذج</span>'+
        '<span class="bc-sep">←</span>'+
        '<span class="bc-page">'+(tt?UI.escHtml(tt.name):'نموذج جديد')+'</span>';
      if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: bc});
      return;
    }
    bc.innerHTML='';
  },
  toggleSidebar: function() {
    var sb = document.getElementById('sidebar');
    if (sb.classList.contains('collapsed')) {
      sb.classList.remove('collapsed');
      localStorage.setItem('buad2_sb','0');
    } else {
      sb.classList.add('collapsed');
      localStorage.setItem('buad2_sb','1');
    }
  },
  openSidebar: function() {
    var sb = document.getElementById('sidebar');
    sb.classList.remove('collapsed');
    sb.classList.add('mobile-open');
    document.getElementById('sb-overlay').classList.add('active');
  },
  closeSidebar: function() {
    var sb = document.getElementById('sidebar');
    sb.classList.remove('mobile-open');
    document.getElementById('sb-overlay').classList.remove('active');
  },
  toggleUserMenu: function(e) {
    if (e) e.stopPropagation();
    var menu = document.getElementById('sb-user-menu');
    var btn  = document.getElementById('sb-user-btn');
    if (!menu) return;
    var isOpen = menu.classList.toggle('open');
    if (btn) btn.classList.toggle('menu-open', isOpen);
    if (isOpen) {
      setTimeout(function(){
        document.addEventListener('click', Nav._userMenuOutside);
      }, 0);
    }
  },
  closeUserMenu: function() {
    var menu = document.getElementById('sb-user-menu');
    var btn  = document.getElementById('sb-user-btn');
    if (menu) menu.classList.remove('open');
    if (btn) btn.classList.remove('menu-open');
    document.removeEventListener('click', Nav._userMenuOutside);
  },
  _userMenuOutside: function(e) {
    var menu = document.getElementById('sb-user-menu');
    var btn  = document.getElementById('sb-user-btn');
    if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) {
      Nav.closeUserMenu();
    }
  },
  search: function(q) {
    var query = (q||'').trim().toLowerCase();
    var items = document.querySelectorAll('.sb-nav .sb-item');
    items.forEach(function(item){
      var label = item.querySelector('.sb-label');
      var text = label ? label.textContent.toLowerCase() : '';
      item.style.display = (!query || text.indexOf(query)>=0) ? '' : 'none';
    });
  },
  initSearchHotkey: function() {
    document.addEventListener('keydown', function(e){
      if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') {
        e.preventDefault();
        var inp = document.getElementById('sb-search-input');
        if (inp) inp.focus();
      }
      if (e.key==='Escape') {

var UI = {
  openModal: function(html) {
    document.getElementById('modal-box').innerHTML = html;
    if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: document.getElementById('modal-box')});
    document.getElementById('modal-overlay').classList.add('active');
  },
  closeModal: function(e) {
    if (!e || e.target===document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('active');
      document.getElementById('modal-box').innerHTML = '';
    }
  },
  closeModalForce: function() {
    document.getElementById('modal-overlay').classList.remove('active');
    document.getElementById('modal-box').innerHTML = '';
  },
  toast: function(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type?' '+type:'');
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.className='toast'; }, 2800);
  },
  fmt: function(n) {
    n = parseFloat(n)||0;
    return n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
  },
  escHtml: function(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
};

function statusLabel(s) {
  var map = {active:'نشط', completed:'مكتمل', paused:'متوقف', cancelled:'ملغي'};

}

function typeLabel(t) {

}

function clientTypeLabel(t) {
  var map = {'company':'شركة','association':'جمعية','government':'جهة حكومية','individual':'فرد','other':'أخرى'};

}

function catLabel(c) {
  var map = {vat:'ضريبة', exec:'أتعاب', mkt:'تسويق', cashback:'كاش باك', cf:'ضريبة القيمة المضافة', salary:'رواتب', logistics:'لوجستيات', materials:'مواد', other:'أخرى'};

function fmtDate(d) {
  if (!d) return '—';
  try {
    var parts = d.split('-');
    if (parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];
    return d;
  } catch(e){ return d; }
}

var Pages = {};

/* ─── DASHBOARD v2 ─── */
Pages.render_dash = function() {
  var clients  = DB.getClients();
  var projects = DB.getProjects();

  /* ── KPIs ── */
  var activeProj    = projects.filter(function(p){ return p.status==='active'; });
  var completedProj = projects.filter(function(p){ return p.status==='completed'; });
  var pausedProj    = projects.filter(function(p){ return p.status==='paused'; });
  var cancelledProj = projects.filter(function(p){ return p.status==='cancelled'; });

  var totalContract = 0, totalProfit = 0, totalExpenses = 0;
  projects.forEach(function(p){
    var r = FinCalc.calc(p.id);
    totalContract += r.grossTotal      || 0;
    totalProfit   += r.profit          || 0;
    totalExpenses += r.totalExpenses   || 0;
  });
  var profitMargin = totalContract > 0 ? (totalProfit / totalContract * 100).toFixed(1) : '0';

  /* ── Date ── */
  var now = new Date();
  var days   = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var dateStr = days[now.getDay()] + '، ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  /* ── Top projects by contract value (horizontal bars) ── */
  var topProjects = projects.map(function(p){
    var r = FinCalc.calc(p.id);
    return { p:p, val:r.grossTotal||0, profit:r.profit||0 };
  }).sort(function(a,b){ return b.val - a.val; }).slice(0,5);
  var maxVal = topProjects.length ? topProjects[0].val : 1;
  var barColors = ['oklch(0.48 0.19 275)','oklch(0.62 0.21 275)','oklch(0.78 0.15 275)','oklch(0.86 0.10 275)','oklch(0.93 0.05 275)'];

  var hbarRows = '';
  if (topProjects.length === 0) {
    hbarRows = '<div style="text-align:center;padding:28px 0;color:var(--gray-400);font-size:12px">لا توجد مشاريع بعد</div>';
  } else {
    topProjects.forEach(function(item, i){
      var pct = maxVal > 0 ? Math.round(item.val / maxVal * 100) : 0;
      hbarRows +=
        '<div class="hbar-item" onclick="Nav.go(\'fin\',{projId:\''+item.p.id+'\'})" style="cursor:pointer">' +
          '<div class="hbar-label">' +
            '<span class="hbar-name" title="'+UI.escHtml(item.p.name)+'">'+UI.escHtml(item.p.name)+'</span>' +
            '<span class="hbar-val">'+UI.fmt(item.val)+' ر.س</span>' +
          '</div>' +
          '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+barColors[i%5]+'"></div></div>' +
        '</div>';
    });
  }

  /* ── Donut SVG ── */
  var statusData = [
    {label:'نشط',   count:activeProj.length,    color:'oklch(0.68 0.16 155)'},
    {label:'مكتمل', count:completedProj.length,  color:'oklch(0.62 0.21 275)'},
    {label:'متوقف', count:pausedProj.length,     color:'oklch(0.78 0.16 75)'},
    {label:'ملغي',  count:cancelledProj.length,  color:'oklch(0.62 0.21 25)'}
  ].filter(function(d){ return d.count > 0; });
  var donutSvg  = _buildDonut(statusData, projects.length);
  var legendHtml = statusData.length ? statusData.map(function(d){
    return '<div class="donut-legend-item">' +
      '<span class="donut-legend-dot" style="background:'+d.color+'"></span>' +
      '<span class="donut-legend-lbl">'+d.label+'</span>' +
      '<span class="donut-legend-val">'+d.count+'</span>' +
    '</div>';
  }).join('') : '<div style="font-size:12px;color:var(--gray-400);text-align:center;padding:12px 0">لا توجد بيانات</div>';

  /* ── Activity feed ── */
  var feedItems = projects.slice().sort(function(a,b){
    return (b.created||'').localeCompare(a.created||'');
  }).slice(0, 6);
  var stColors = {active:'var(--success-50)',completed:'var(--primary-50)',paused:'var(--warning-50)',cancelled:'var(--danger-50)'};
  var stIcons  = {active:'play-circle',completed:'check-circle',paused:'pause-circle',cancelled:'x-circle'};
  var stStroke = {active:'oklch(0.55 0.15 155)',completed:'oklch(0.56 0.21 275)',paused:'oklch(0.60 0.14 75)',cancelled:'oklch(0.55 0.21 25)'};

  var activityHtml = '';
  if (feedItems.length === 0) {
    activityHtml = '<div style="text-align:center;padding:24px 0;color:var(--gray-400);font-size:12px">لا يوجد نشاط بعد</div>';
  } else {
    feedItems.forEach(function(p){
      var cl = clients.find(function(c){ return c.id===p.client_id; });
      var icon = stIcons[p.status]||'circle';
      activityHtml +=
        '<div class="activity-item" onclick="Nav.go(\'fin\',{projId:\''+p.id+'\'})" style="cursor:pointer">' +
          '<div class="activity-dot" style="background:'+(stColors[p.status]||'var(--gray-100)')+';color:'+(stStroke[p.status]||'var(--gray-400)')+'">' +
            '<i data-lucide="'+icon+'"></i>' +
          '</div>' +
          '<div class="activity-body">' +
            '<div class="activity-title">'+UI.escHtml(p.name)+'</div>' +
            '<div class="activity-meta">'+(cl?UI.escHtml(cl.name)+' · ':'')+typeLabel(p.type)+'</div>' +
          '</div>' +
          statusBadge(p.status) +
        '</div>';
    });
  }

  /* ── Render ── */
  document.getElementById('pg-dash').innerHTML =

    /* Greeting banner */
    '<div class="dash-greeting">' +
      '<div class="dash-greeting-grid"></div>' +
      '<div class="dash-greeting-text">' +
        '<h2>مرحباً بك في بُعد</h2>' +
        '<p>'+dateStr+' &nbsp;·&nbsp; '+projects.length+' مشروع، '+activeProj.length+' نشط حالياً</p>' +
      '</div>' +
      '<div class="dash-greeting-actions">' +
        '<button class="btn-white" onclick="Nav.go(\'projects\')"><i data-lucide="folder-open" style="font-size:14px"></i>المشاريع</button>' +
        '<button class="btn-white-solid" onclick="Pages.addProjectModal(null)"><i data-lucide="plus" style="font-size:14px"></i>مشروع جديد</button>' +
      '</div>' +
    '</div>' +

    /* KPI Cards */
    '<div class="kpi-grid">' +

      '<div class="kpi-card">' +
        '<div class="kpi-card-accent" style="background:var(--primary-600)"></div>' +
        '<div class="kpi-card-icon" style="background:var(--primary-50);color:var(--primary-600)"><i data-lucide="briefcase"></i></div>' +
        '<div class="kpi-card-label">إجمالي قيمة العقود</div>' +
        '<div class="kpi-card-value" style="color:var(--primary-700)">'+UI.fmt(totalContract)+'</div>' +
        '<div class="kpi-card-sub">ريال سعودي</div>' +
      '</div>' +

      '<div class="kpi-card">' +
        '<div class="kpi-card-accent" style="background:var(--success-500)"></div>' +
        '<div class="kpi-card-icon" style="background:var(--success-50);color:var(--success-600)"><i data-lucide="trending-up"></i></div>' +
        '<div class="kpi-card-label">صافي الأرباح</div>' +
        '<div class="kpi-card-value" style="color:var(--success-700)">'+UI.fmt(totalProfit)+'</div>' +
        '<div class="kpi-card-sub"><span class="kpi-trend-up">'+profitMargin+'%</span>&nbsp;هامش الربح</div>' +
      '</div>' +

      '<div class="kpi-card">' +
        '<div class="kpi-card-accent" style="background:var(--accent-500)"></div>' +
        '<div class="kpi-card-icon kpi-icon-accent"><i data-lucide="activity"></i></div>' +
        '<div class="kpi-card-label">المشاريع النشطة</div>' +
        '<div class="kpi-card-value" style="color:var(--accent-700)">'+activeProj.length+'</div>' +
        '<div class="kpi-card-sub">من إجمالي '+projects.length+' مشروع</div>' +
      '</div>' +

      '<div class="kpi-card">' +
        '<div class="kpi-card-accent" style="background:var(--warning-500)"></div>' +
        '<div class="kpi-card-icon" style="background:var(--warning-50);color:var(--warning-600)"><i data-lucide="users"></i></div>' +
        '<div class="kpi-card-label">العملاء المسجلون</div>' +
        '<div class="kpi-card-value" style="color:var(--warning-700)">'+clients.length+'</div>' +
        '<div class="kpi-card-sub">'+completedProj.length+' مشروع مكتمل</div>' +
      '</div>' +

    '</div>' +

    /* Row 2: Top Projects + Donut */
    '<div class="dash-2col">' +

      '<div class="card">' +
        '<div class="dash-sec-hdr">' +
          '<h3><i data-lucide="bar-chart-2"></i>أعلى المشاريع قيمةً</h3>' +
          '<button class="btn btn-sm btn-ghost" onclick="Nav.go(\'projects\')">عرض الكل</button>' +
        '</div>' +
        hbarRows +
      '</div>' +

      '<div class="card">' +
        '<div class="dash-sec-hdr"><h3><i data-lucide="pie-chart"></i>توزيع المشاريع</h3></div>' +
        '<div class="donut-wrap">' + donutSvg +
          '<div class="donut-legend">'+legendHtml+'</div>' +
        '</div>' +
      '</div>' +

    '</div>' +

    /* Row 3: Activity + Quick Actions */

      '<div class="card">' +
        '<div class="dash-sec-hdr">' +
          '<h3><i data-lucide="clock"></i>آخر المشاريع</h3>' +
          '<button class="btn btn-sm btn-ghost" onclick="Nav.go(\'projects\')">عرض الكل</button>' +

          '<button class="qa-btn" onclick="Pages.addClientModal()"><i data-lucide="user-plus"></i>عميل جديد</button>' +
          '<button class="qa-btn" onclick="Nav.go(\'projects\')"><i data-lucide="list"></i>كل المشاريع</button>' +

function _buildDonut(segments, total) {
  if (!segments || segments.length === 0 || !total) {
    return '<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="40" fill="none" stroke="oklch(0.93 0.005 260)" stroke-width="14"/><text x="55" y="60" text-anchor="middle" font-size="14" fill="oklch(0.74 0.008 260)">0</text></svg>';
  }
  var r = 40, cx = 55, cy = 55, sw = 14;
  var circ = 2 * Math.PI * r;
  var offset = 0, paths = '';
  segments.forEach(function(seg){
    var pct   = seg.count / total;
    var dash  = pct * circ;
    var gap   = circ - dash;
    var angle = (offset / total) * 360 - 90;
    paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="'+sw+'" stroke-dasharray="'+dash.toFixed(2)+' '+gap.toFixed(2)+'" transform="rotate('+angle.toFixed(2)+' '+cx+' '+cy+')"/>';
    offset += seg.count;
  });
  return '<svg width="110" height="110" viewBox="0 0 110 110">' +
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="oklch(0.97 0.004 260)" stroke-width="'+sw+'"/>' +
    paths +
    '<text x="'+cx+'" y="'+(cy-5)+'" text-anchor="middle" font-size="18" font-weight="700" fill="oklch(0.20 0.012 260)">'+total+'</text>' +
    '<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="10" fill="oklch(0.74 0.008 260)">مشروع</text>' +
    '</svg>';
}

Pages.saveClientNotes = function(clientId) {
  var ta = document.getElementById('cl-notes-area');

  var cl = clients.find(function(c){ return c.id===clientId; });

Pages.saveClientField = function(clientId, field, value) {
  var clients = DB.getClients();

Pages.editClientModal = function(id) { Pages.addClientModal(id); };

Pages.saveClient = function(editId) {
  var name = (document.getElementById('cl-name').value||'').trim();
  if (!name) { UI.toast('اسم العميل مطلوب','danger'); return; }
  var clients = DB.getClients();
  if (editId) {
    var idx = clients.findIndex(function(c){ return c.id===editId; });
    if (idx>=0) {
      clients[idx].name = name;
      clients[idx].type = document.getElementById('cl-type').value;
      clients[idx].email = document.getElementById('cl-email').value.trim();
      clients[idx].phone = document.getElementById('cl-phone').value.trim();
      clients[idx].city = document.getElementById('cl-city').value.trim();
    }
    UI.toast('تم تحديث بيانات العميل','success');
  } else {
    clients.push({
      id: DB.uid(), name: name,
      type: document.getElementById('cl-type').value,
      email: document.getElementById('cl-email').value.trim(),
      phone: document.getElementById('cl-phone').value.trim(),
      city: document.getElementById('cl-city').value.trim(),
      created: new Date().toISOString().slice(0,10)
    });
    UI.toast('تم إضافة العميل','success');
  }
  DB.saveClients(clients);
  UI.closeModalForce();
  if (Nav._cur==='clients') Pages.render_clients();
  else if (Nav._cur==='client') Pages.render_client(Nav._params);
};

Pages.deleteClient = function(id) {
  var clients = DB.getClients();
  var cl = clients.find(function(c){ return c.id===id; });
  if (!cl) return;
  if (!confirm('هل تريد حذف العميل "'+cl.name+'"؟ سيتم حذف جميع مشاريعه أيضاً.')) return;
  var projs = DB.getProjects().filter(function(p){ return p.client_id!==id; });
  DB.saveProjects(projs);
  DB.saveClients(clients.filter(function(c){ return c.id!==id; }));
  UI.toast('تم الحذف');
  Pages.render_clients();
};

        '<span class="prc-name">'+UI.escHtml(p.name)+'</span>' +

Pages.render_projects = function() {
  var projects = DB.getProjects();
  var clients = DB.getClients();
  var filterStatus = window._projFilter||'all';
  var filtered = filterStatus==='all' ? projects : projects.filter(function(p){ return p.status===filterStatus; });

  var listHtml = '';
  if (projects.length===0) {
    listHtml = '<div class="empty-state" style="padding:var(--space-10)">' +
      '<div class="empty-state-icon"><i data-lucide="briefcase"></i></div>' +
      '<h3>لا توجد مشاريع بعد</h3>' +
      '<p>أضف أول مشروع لبدء تتبع أعمالك</p>' +
      '<button class="btn btn-primary" onclick="Pages.addProjectModal(null)" style="margin-top:var(--space-4);display:inline-flex;align-items:center;gap:var(--space-1_5)"><i data-lucide="plus"></i>مشروع جديد</button>' +
    '</div>';
  } else if (filtered.length===0) {
    listHtml = '<div class="proj-row-empty">لا توجد مشاريع بهذه الحالة</div>';
  } else {
    listHtml = '<div class="proj-row-list">' +
      filtered.slice().sort(function(a,b){ return (b.created||'').localeCompare(a.created||''); }).map(function(p){
        var cl = clients.find(function(c){ return c.id===p.client_id; });
        return Pages._projRowCard(p, cl);
      }).join('') +
    '</div>';
  }

  var filterOpts = [
    {v:'all',l:'الكل'},
    {v:'active',l:'نشط'},
    {v:'completed',l:'مكتمل'},
    {v:'paused',l:'متوقف'},
    {v:'cancelled',l:'ملغي'}
  ];
  var pillsHtml = '<div class="proj-filter-bar">' +
    filterOpts.map(function(o){
      var isActive = filterStatus===o.v;
      var count = o.v==='all' ? projects.length : projects.filter(function(p){return p.status===o.v;}).length;
      return '<button class="proj-filter-btn'+(isActive?' active':'')+'" onclick="window._projFilter=\''+o.v+'\';Pages.render_projects()">' +
        o.l+'<span class="proj-filter-count">'+count+'</span></button>';
    }).join('') +
    '</div>';

  document.getElementById('pg-projects').innerHTML =
    '<div class="page-header">' +
      '<div>' +
        '<h1>المشاريع</h1>' +
        '<div class="page-header-sub">'+projects.length+' مشروع · '+filtered.length+' معروض</div>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="Pages.addProjectModal(null)" style="display:inline-flex;align-items:center;gap:var(--space-1_5)"><i data-lucide="plus"></i>مشروع جديد</button>' +
    '</div>' +
    pillsHtml +
    listHtml;
  document.getElementById('top-actions').innerHTML='';
};

Pages.saveProject = function(presetClientId) {
  var clientId = presetClientId;
  if (!clientId) {
    var sel = document.getElementById('proj-client');
    clientId = sel ? sel.value : '';
  }
  if (!clientId) { UI.toast('يرجى اختيار العميل','danger'); return; }
  var name = (document.getElementById('proj-name').value||'').trim();
  if (!name) { UI.toast('اسم المشروع مطلوب','danger'); return; }
  var proj = {
    id: DB.uid(),
    client_id: clientId,
    name: name,
    type: document.getElementById('proj-type').value,
    status: document.getElementById('proj-status').value,
    notes: document.getElementById('proj-notes').value.trim(),
    created: new Date().toISOString().slice(0,10)
  };
  var projects = DB.getProjects();
  projects.push(proj);
  DB.saveProjects(projects);
  UI.toast('تم إضافة المشروع','success');
  UI.closeModalForce();
  if (Nav._cur==='projects') Pages.render_projects();
  else if (Nav._cur==='client') Pages.render_client(Nav._params);
  else if (Nav._cur==='dash') Pages.render_dash();
};

Pages.switchFinTab = function(tab, projId) {
  Pages._finTab = tab;
  document.querySelectorAll('#pg-fin .hero-tab-pill').forEach(function(b){
    var match = (tab==='overview' && b.textContent.indexOf('نظرة عامة')>=0) ||
                (tab==='entries' && b.textContent.indexOf('سجل المعاملات')>=0) ||
                (tab==='contracts' && b.textContent.indexOf('العقود')>=0);
    b.classList.toggle('active', match);
  });
  ['overview','entries','contracts'].forEach(function(t){
    var el = document.getElementById('fin-tab-'+t);
    if (el) el.className = 'tab-content'+(t===tab?' active':'');
  });
  if (tab==='overview') Pages.renderFinOverview(projId);
  else if (tab==='contracts') Pages.renderFinContracts(projId);
  else Pages.renderFinEntries(projId);
};

Pages.createContract = function(projId, tplKey) {
  var projects = DB.getProjects();
  var proj = projects.find(function(p){return p.id===projId;});
  var clients = DB.getClients();
  var cl = proj ? clients.find(function(c){return c.id===proj.client_id;}) : null;
  var fin = DB.getFin(projId);
  var r = FinCalc.calc(projId);
  var today = (new Date()).toISOString().slice(0,10);

  var isCustom = tplKey && tplKey.indexOf('custom:')===0;
  var tpl, clauses, contract_cover, contract_footer;

  if (isCustom) {
    var customId = tplKey.replace('custom:','');
    var customArr = DB.getCustomTemplates();
    var customT = customArr.find(function(x){return x.id===customId;});
    if (!customT) { UI.closeModalForce(); return; }
    tpl = { title: customT.name };
    clauses = customT.clauses.filter(function(c){return c.enabled!==false;}).map(function(clItem) {
      return { id: DB.uid(), key: clItem.key, title: clItem.title, content: clItem.content, enabled: true };
    });
    contract_cover = customT.cover ? JSON.parse(JSON.stringify(customT.cover)) : {frame_style:'modern',bg_position:'center'};
    if (!contract_cover.bg_position) contract_cover.bg_position = 'center';
    contract_footer = customT.footer_label || 'سري';
    // Carry over layout/style from the custom template
    if (customT.doc_style) tpl._doc_style = JSON.parse(JSON.stringify(customT.doc_style));
    if (customT.doc_margins) tpl._doc_margins = JSON.parse(JSON.stringify(customT.doc_margins));
    if (customT.page_layout) tpl._page_layout = JSON.parse(JSON.stringify(customT.page_layout));
    if (customT.custom_vars) tpl._custom_vars = JSON.parse(JSON.stringify(customT.custom_vars));
  } else {
    tpl = CONTRACT_TEMPLATES[tplKey] || CONTRACT_TEMPLATES['blank'];
    clauses = tpl.clauses.map(function(clItem, i) {
      return {
        id: DB.uid(),
        key: clItem.key,
        title: 'المادة ' + (CONTRACT_ORDINALS[i] || (i+1).toString()) + ': ' + clItem.baseTitle,
        content: clItem.content,
        enabled: true
      };
    });
    contract_cover = {frame_style:'modern',bg_position:'center'};
    contract_footer = 'سري';
  }

  var vars = {
    party_a_name: '',
    party_a_rep_name: '',
    party_a_title: '',
    party_a_id: '',
    party_a_address: '',
    party_a_phone: '',
    party_a_email: '',
    party_a_reg: '',
    party_a_tax: '',
    party_b_name: cl ? cl.name : '',
    party_b_rep_name: cl ? (cl.contact_name||'') : '',
    party_b_title: '',
    party_b_id: cl ? (cl.reg_no||'') : '',
    party_b_address: cl ? (cl.city||'') : '',
    party_b_phone: cl ? (cl.phone||'') : '',
    party_b_email: cl ? (cl.email||'') : '',
    party_b_reg: cl ? (cl.reg_no||'') : '',
    party_b_tax: cl ? (cl.tax_no||'') : '',
    contract_date_gregorian: fin.ctrl && fin.ctrl.contract_date ? fin.ctrl.contract_date : today,
    contract_city: cl ? (cl.city||'الرياض') : 'الرياض',
    signature_city: cl ? (cl.city||'الرياض') : 'الرياض',
    contract_amount: r.grossTotal > 0 ? Math.round(r.grossTotal).toString() : '',
    currency: 'ر.س',
    duration_months: '12',
    subject: proj ? proj.name : '',
    payment_method: 'تحويل بنكي',
    contract_no: ''
  };

  // Seed custom variable values (from a custom template) so they appear in the panel
  if (tpl._custom_vars && tpl._custom_vars.length) {
    tpl._custom_vars.forEach(function(cv){ if (!(cv.key in vars)) vars[cv.key] = ''; });
  }

  var contract = {
    id: DB.uid(),
    template_type: tplKey,
    title: tpl.title,
    status: 'draft',
    created: today,
    updated: today,
    variables: vars,
    custom_vars: tpl._custom_vars || [],
    clauses: clauses,
    cover: contract_cover,
    footer_label: contract_footer,
    doc_style: tpl._doc_style || { font_size: 14, line_height: 1.5, title_size: 18, clause_title_size: 14, subtitle_size: 12 },
    doc_margins: tpl._doc_margins || { top: 0, right: 2.0, bottom: 0, left: 2.0 },
    page_layout: tpl._page_layout || {
      header: {
        show: true,
        image: '',
        height: 180,  /* 48mm — Word/PandaDoc standard */
        overlay: []
      },
      footer: {
        show: true,
        image: '',
        height: 90,   /* 24mm — fits 2 lines of content + page number */
        overlay: [
          { text: 'صفحة {{page_number}} من {{total_pages}}', pos: 'bottom-center', font_size: 9, color: '#6B7280', font_weight: '400' }
        ]
      }
    }
  };

  DB.saveContract(projId, contract);
  UI.closeModalForce();
  Nav.go('contract', {projId: projId, contractId: contract.id});
};

function _calcTrailHtml(r, c) {
  function feeLabel(v, type, base) {
    if (type === 'fixed') return UI.fmt(v) + ' ر.س ثابت';
    return (parseFloat(v)||0) + '% ' + (base === 'gross' ? 'من الإجمالي' : 'من الصافي');
  }
  function row(sign, lbl, formula, val, col, divider) {
    var valStyle = col==='red' ? 'color:var(--danger-700)' : col==='green' ? 'color:var(--success-700)' : col==='brand' ? 'color:var(--iris-700)' : 'color:var(--fg-1)';
    var rowCls = 'calc-trail-row' + (divider ? ' ct-divider' : '');
    return '<div class="'+rowCls+'">' +
      '<span class="calc-trail-sign">'+(sign||'')+'</span>' +
      '<span class="calc-trail-lbl">'+lbl+(formula?'<span class="calc-trail-formula"> ('+formula+')</span>':'')+'</span>' +
      '<span class="calc-trail-val" style="'+valStyle+'">'+UI.fmt(val)+' ر.س</span>' +
    '</div>';
  }
  var vatLabel = (r.vatPct||0) + '% ' + (r.vatIncluded ? 'مستخرجة' : 'مضافة');
  var available = r.contractNet - r.execAmt - r.mkt - r.cb - r.cfAmt;
  var html = '<div class="calc-trail" id="calc-trail-inner">';
  html += row('', 'قيمة العقد المدخلة', '', r.cv, 'brand');
  html += row('−', 'ضريبة القيمة المضافة', vatLabel, r.vatAmt, 'red');
  html += row('=', 'صافي العقد', '', r.contractNet, '', true);
  if ((parseFloat(c.exec_v)||0) > 0) html += row('−', 'أتعاب التنفيذ', feeLabel(c.exec_v, c.exec_type||'pct', c.exec_base||'net'), r.execAmt, 'red');
  if ((parseFloat(c.mkt_v)||0) > 0)  html += row('−', 'التسويق', feeLabel(c.mkt_v, c.mkt_type||'pct', c.mkt_base||'net')+(c.mkt_internal?' — داخلي':''), r.mkt, 'red');
  if ((parseFloat(c.cb_v)||0) > 0)   html += row('−', 'كاش باك', feeLabel(c.cb_v, c.cb_type||'pct', c.cb_base||'net'), r.cb, 'red');
  if ((parseFloat(c.cf_v)||0) > 0)   html += row('−', 'ضريبة القيمة المضافة', feeLabel(c.cf_v, c.cf_type||'pct', c.cf_base||'net'), r.cfAmt, 'red');
  html += row('=', 'المتاح للتنفيذ', '', available, available >= 0 ? 'green' : 'red', true);
  html += '</div>';
  return html;
}

Pages.autoSaveCtrl = function(projId) {
  var fin = DB.getFin(projId);
  fin.ctrl = fin.ctrl||{};
  var g = function(id){ var e=document.getElementById(id); return e?e.value:''; };
  var chk = function(id){ var e=document.getElementById(id); return e?e.checked:false; };
  fin.ctrl.contract_no    = g('fc-no');
  fin.ctrl.contract_date  = g('fc-date');
  fin.ctrl.cv_locked      = chk('fc-cvlock');
  if (!fin.ctrl.cv_locked) fin.ctrl.contract_value = parseFloat(g('fc-cv'))||0;
  fin.ctrl.vat_included   = chk('fc-vatinc');
  fin.ctrl.vat_pct        = parseFloat(g('fc-vatp'))||15;
  fin.ctrl.exec_v         = parseFloat(g('fc-execv'))||0;
  fin.ctrl.exec_type      = g('fc-exect')||'pct';
  fin.ctrl.exec_base      = g('fc-execb')||'net';
  fin.ctrl.mkt_v          = parseFloat(g('fc-mktv'))||0;
  fin.ctrl.mkt_type       = g('fc-mktt')||'pct';
  fin.ctrl.mkt_base       = g('fc-mktb')||'net';
  fin.ctrl.mkt_internal   = chk('fc-mkti');
  fin.ctrl.cb_v           = parseFloat(g('fc-cbv'))||0;
  fin.ctrl.cb_type        = g('fc-cbt')||'pct';
  fin.ctrl.cb_base        = g('fc-cbb')||'net';
  fin.ctrl.cf_v           = parseFloat(g('fc-cfv'))||0;
  fin.ctrl.cf_type        = g('fc-cft')||'pct';
  fin.ctrl.cf_base        = g('fc-cfb')||'net';
  DB.saveFin(projId, fin);
  var r = FinCalc.calc(projId);
  var c = fin.ctrl;
  // Update stat cards in control panel
  var ctrlBox = document.getElementById(Pages._ctrlContainer||'ctrl-drawer-body');
  var statVals = [r.contractNet, r.totalExpenses, r.profit, r.remaining];
  if (ctrlBox) {
    ctrlBox.querySelectorAll('.stat-card .stat-card-value').forEach(function(el,i){
      if (statVals[i]!==undefined) el.textContent = UI.fmt(statVals[i]);
    });
    ctrlBox.querySelectorAll('.stat-card:first-child .stat-card-sub').forEach(function(el){
      el.textContent = UI.fmt(r.grossTotal)+' شاملاً الضريبة';
    });
    ctrlBox.querySelectorAll('.stat-card:last-child .stat-card-sub').forEach(function(el){
      el.textContent = 'من إجمالي العقد '+UI.fmt(r.grossTotal)+(r.totalAllEntries>0?' − بنود '+UI.fmt(r.totalAllEntries):'');
    });
  }
  // Update hero stats bar
  var phsC = document.getElementById('phs-contract'); if(phsC) phsC.textContent = UI.fmt(r.grossTotal);
  var phsR = document.getElementById('phs-remaining'); if(phsR) phsR.textContent = UI.fmt(r.remaining);
  var phsP = document.getElementById('phs-profit'); if(phsP) phsP.textContent = UI.fmt(r.profit);
  // Update calc trail
  var oldTrail = document.getElementById('calc-trail-inner');
  if (oldTrail) oldTrail.outerHTML = _calcTrailHtml(r, c);
  // Update fee amount badges
  var amtEl;
  amtEl = document.getElementById('fc-execb-amt'); if(amtEl) amtEl.textContent = UI.fmt(r.execAmt)+' ر.س';
  amtEl = document.getElementById('fc-mktb-amt');  if(amtEl) amtEl.textContent = UI.fmt(r.mkt)+' ر.س';
  amtEl = document.getElementById('fc-cbb-amt');   if(amtEl) amtEl.textContent = UI.fmt(r.cb)+' ر.س';
  amtEl = document.getElementById('fc-cfb-amt');   if(amtEl) amtEl.textContent = UI.fmt(r.cfAmt)+' ر.س';
};

  var inp = document.getElementById('fc-cv');
  if (inp) {

    inp.style.background = locked ? 'var(--gray-100)' : '';
    inp.style.cursor = locked ? 'not-allowed' : '';
  }
};

Pages.updateBudget = function(projId, idx, field, value) {
  var fin = DB.getFin(projId);
  fin.budget = fin.budget||[];
  if (fin.budget[idx]) fin.budget[idx][field] = field==='amount' ? (parseFloat(value)||0) : value;
  DB.saveFin(projId, fin);
};

Pages.deleteBudgetRow = function(projId, idx) {
  var fin = DB.getFin(projId);
  fin.budget = fin.budget||[];
  fin.budget.splice(idx,1);
  DB.saveFin(projId, fin);
  Pages.renderFinCtrl(projId);
};

/* ─── ENTRIES TAB ─── */
Pages.renderFinEntries = function(projId) {
  var fin = DB.getFin(projId);
  var entries = fin.entries||[];
  var filter = window._entriesFilter||'all';
  var search = (window._entriesSearch||'').trim();

  var filtered = entries.filter(function(e){
    var typeOk = filter==='all' || e.type===filter;
    var searchOk = !search || (e.desc||'').indexOf(search)>=0 || (e.cat||'').indexOf(search)>=0 || (e.note||'').indexOf(search)>=0;
    return typeOk && searchOk;
  });

  var r = FinCalc.calc(projId);
  var profitPct = r.contractNet>0 ? (r.profit/r.contractNet*100).toFixed(1) : '0';
  var incCount = entries.filter(function(e){return e.type==='income';}).length;
  var expCount = entries.filter(function(e){return e.type==='expense';}).length;

  /* ── Build rows (main + expand pairs) ── */
  var rows = '';
  var totalInc = 0, totalExp = 0;
  if (entries.length===0) {
    rows = '<tr><td colspan="5">' +
      '<div class="empty-state" style="padding:var(--space-10)">' +
        '<div class="empty-state-icon"><i data-lucide="receipt"></i></div>' +
        '<h3>لا توجد قيود بعد</h3>' +
        '<p>أضف أول بند مالي للمشروع</p>' +
        '<button class="btn btn-primary btn-sm" onclick="Pages.addEntryModal(\''+projId+'\')" style="margin-top:var(--space-3);display:inline-flex;align-items:center;gap:var(--space-1_5)"><i data-lucide="plus"></i>إضافة بند</button>' +
      '</div></td></tr>';
  } else if (filtered.length===0) {
    rows = '<tr><td colspan="5"><div style="text-align:center;padding:var(--space-8);color:var(--fg-3);font-size:var(--font-sm)">لا توجد نتائج مطابقة</div></td></tr>';
  } else {
    var stLabelMap = {paid:'مدفوع', pending:'معلق', cancelled:'ملغي'};
    var stBadgeClass = {paid:'emerald', pending:'amber', cancelled:'gray'};
    filtered.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).forEach(function(e){
      var isIncome = e.type==='income';
      var amt = parseFloat(e.amount)||0;
      if (isIncome) totalInc += amt; else totalExp += amt;
      var amtSign = isIncome ? '+' : '−';
      var amtColor = isIncome ? 'var(--success-700)' : 'var(--danger-700)';
      var stKey = stBadgeClass[e.status];
      var stBadge = stKey ? '<span class="badge '+stKey+' sm">'+stLabelMap[e.status]+'</span>' : '';
      var agrMark = (e.note==='من الاتفاقية') ? '<span class="badge purple sm" style="margin-inline-start:6px;vertical-align:middle">اتفاقية</span>' : '';
      var pm = parseFloat(e.profit_margin)||0;
      var pmBadge = pm>0 ? '<span class="badge gray sm" style="font-family:var(--font-mono)">'+(e.profit_margin_type==='fixed'?UI.fmt(pm)+' ر.س':pm+'%')+'</span>' : '';
      var noteVal = (e.note && e.note!=='من الاتفاقية') ? UI.escHtml(e.note) : '';

      /* ── Main clickable row ── */
      rows +=
        '<tr class="er" id="er-'+e.id+'" onclick="Pages.openEntryDetail(\''+projId+'\',\''+e.id+'\')" style="cursor:pointer">' +
          '<td class="col-dot" style="overflow:visible;padding:0 var(--space-2)">' +
            '<span class="entry-type-dot '+(isIncome?'income':'expense')+'"></span>' +
          '</td>' +
          '<td style="max-width:0;padding-inline-start:0">' +
            '<span style="font-weight:500;color:var(--fg-1)">'+UI.escHtml(e.desc||'')+'</span>'+agrMark +
          '</td>' +
          '<td class="col-cat"><span class="badge gray sm">'+catLabel(e.cat)+'</span></td>' +
          '<td class="col-amt" style="font-family:var(--font-mono);font-weight:600;font-size:var(--font-sm);color:'+amtColor+';letter-spacing:-.3px">' +
            amtSign+' '+UI.fmt(e.amount)+' <span style="font-size:10px;font-weight:400;color:var(--fg-4)">ر.س</span>' +
          '</td>' +
          '<td class="col-chev">' +
            '<button class="entry-chev-btn" onclick="event.stopPropagation();Pages.openEntryDetail(\''+projId+'\',\''+e.id+'\')" title="تفاصيل">' +
              '<i data-lucide="chevron-down"></i>' +
            '</button>' +
          '</td>' +
        '</tr>' +

        '';
    });
  }

  /* ── tfoot summary ── */
  var tfootHtml = filtered.length>0
    ? '<tfoot><tr>' +
        '<td class="col-dot"></td>' +
        '<td style="padding-inline-start:0"><span style="color:var(--fg-3)">'+filtered.length+' عملية</span></td>' +
        '<td class="col-cat"></td>' +
        '<td class="col-amt" style="font-family:var(--font-mono)">' +
          '<span style="color:var(--success-700)">+'+UI.fmt(totalInc)+'</span>' +
          '<span style="color:var(--fg-4);margin:0 4px">/</span>' +
          '<span style="color:var(--danger-700)">−'+UI.fmt(totalExp)+'</span>' +
        '</td>' +
        '<td class="col-chev"></td>' +
      '</tr></tfoot>'
    : '';

  /* ── Warning ── */
  var warnHtml = '';
  if (r.missingItems && r.missingItems.length > 0) {
    warnHtml = '<div class="alert-notice"><i data-lucide="alert-triangle"></i>لم تُسجَّل بعد: '+r.missingItems.join('، ')+
      ' — <button class="btn btn-sm" style="margin-inline-start:var(--space-2);display:inline-flex;align-items:center;gap:4px" onclick="Pages.addEntryModal(\''+projId+'\');Pages.switchEntryTab(\'contract\')"><i data-lucide="plus"></i>تسجيل الآن</button></div>';
  }

  document.getElementById('fin-tab-entries').innerHTML =
    warnHtml +

    /* ── Toolbar ── */
    '<div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap">' +
      '<div class="proj-filter-bar" style="margin-bottom:0">' +
        '<button class="proj-filter-btn'+(filter==='all'?' active':'')+'" onclick="window._entriesFilter=\'all\';Pages.renderFinEntries(\''+projId+'\')">الكل<span class="proj-filter-count">'+entries.length+'</span></button>' +
        '<button class="proj-filter-btn'+(filter==='income'?' active':'')+'" onclick="window._entriesFilter=\'income\';Pages.renderFinEntries(\''+projId+'\')">دخل<span class="proj-filter-count">'+incCount+'</span></button>' +
        '<button class="proj-filter-btn'+(filter==='expense'?' active':'')+'" onclick="window._entriesFilter=\'expense\';Pages.renderFinEntries(\''+projId+'\')">مصروف<span class="proj-filter-count">'+expCount+'</span></button>' +
      '</div>' +
      '<div style="position:relative;flex:1;min-width:160px;max-width:240px">' +
        '<i data-lucide="search" style="position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--fg-4);pointer-events:none"></i>' +
        '<input class="field-input" style="padding-inline-end:34px;width:100%;font-size:var(--font-sm)" placeholder="بحث..." value="'+UI.escHtml(search)+'" oninput="window._entriesSearch=this.value;Pages.renderFinEntries(\''+projId+'\')">' +
      '</div>' +
      '<div style="margin-inline-start:auto;display:flex;gap:var(--space-2)">' +
        '<button class="btn btn-sm" onclick="Pages.exportCSV(\''+projId+'\')" style="display:inline-flex;align-items:center;gap:var(--space-1_5)"><i data-lucide="download"></i>تصدير</button>' +
        '<button class="btn btn-sm btn-primary" onclick="Pages.addEntryModal(\''+projId+'\')" style="display:inline-flex;align-items:center;gap:var(--space-1_5)"><i data-lucide="plus"></i>إضافة بند</button>' +
      '</div>' +
    '</div>' +

    /* ── Table ── */
    '<div class="card" style="padding:0;overflow:hidden">' +
      '<div class="tbl-responsive"><table class="entry-tbl">' +
        '<thead><tr>' +
          '<th class="col-dot"></th>' +
          '<th style="padding-inline-start:0">البيان</th>' +
          '<th class="col-cat">التصنيف</th>' +
          '<th class="col-amt" style="text-align:left">المبلغ</th>' +
          '<th class="col-chev"></th>' +
        '</tr></thead>' +
        '<tbody>'+rows+'</tbody>' +
        tfootHtml +
      '</table></div>' +
    '</div>';

  if (typeof lucide !== 'undefined') lucide.createIcons({rootElement: document.getElementById('fin-tab-entries')});
};

Pages.saveEntryDetail = function(projId, entryId) {

  var entry = (fin.entries||[]).find(function(e){ return e.id===entryId; });

Pages.toggleProfitField = function() {
  var has = document.getElementById('ent-has-pm');
  var row = document.getElementById('ent-profit-row');
  if (has && row) row.style.display = has.checked ? '' : 'none';
};

Pages.switchEntryTab = function(tab) {
  document.getElementById('entry-new-tab').style.display = tab==='new'?'block':'none';
  document.getElementById('entry-contract-tab').style.display = tab==='contract'?'block':'none';
  document.getElementById('entry-modal-footer').style.display = tab==='new'?'flex':'none';
  document.getElementById('etab-new').classList.toggle('active',tab==='new');
  document.getElementById('etab-contract').classList.toggle('active',tab==='contract');
};

Pages.registerContractItem = function(projId, cat, amount, nameOverride) {
  var typeMap = {exec:'income', vat:'expense', mkt:'expense', cashback:'expense', cf:'expense'};
  var descMap = {exec:'أتعاب التنفيذ', vat:'ضريبة القيمة المضافة', mkt:'تسويق', cashback:'كاش باك', cf:'ضريبة القيمة المضافة'};
  var fin = DB.getFin(projId);
  fin.entries = fin.entries||[];
  fin.entries.push({
    id: DB.uid(),
    date: new Date().toISOString().slice(0,10),
    desc: nameOverride || descMap[cat] || cat,
    cat: cat,
    type: typeMap[cat]||'expense',
    amount: amount,
    profit_margin: 0,
    status: 'paid',
    note: 'من الاتفاقية'
  });
  DB.saveFin(projId, fin);
  UI.toast('تم تسجيل البند','success');
  UI.closeModalForce();
  Pages.renderFinEntries(projId);
};

Pages.saveEntry = function(projId) {
  var desc = (document.getElementById('ent-desc').value||'').trim();
  var amount = parseFloat(document.getElementById('ent-amount').value)||0;
  if (!desc) { UI.toast('الوصف مطلوب','danger'); return; }
  if (amount<=0) { UI.toast('المبلغ يجب أن يكون أكبر من صفر','danger'); return; }
  var fin = DB.getFin(projId);
  fin.entries = fin.entries||[];
  fin.entries.push({
    id: DB.uid(),
    date: document.getElementById('ent-date').value,
    desc: desc,
    cat: document.getElementById('ent-cat').value,
    type: document.getElementById('ent-type').value,
    amount: amount,
    profit_margin: (document.getElementById('ent-has-pm')&&document.getElementById('ent-has-pm').checked) ? (parseFloat(document.getElementById('ent-pm').value)||0) : 0,

Pages.toggleEditPmField = function() {
  var has = document.getElementById('eed-has-pm');
  var row = document.getElementById('eed-profit-row');
  if (has && row) row.style.display = has.checked ? '' : 'none';
};

Pages.updateEntry = function(projId, entId) {
  var desc = (document.getElementById('eed-desc').value||'').trim();
  var amount = parseFloat(document.getElementById('eed-amount').value)||0;
  if (!desc) { UI.toast('الوصف مطلوب','danger'); return; }
  if (amount<=0) { UI.toast('المبلغ يجب أن يكون أكبر من صفر','danger'); return; }
  var fin = DB.getFin(projId);
  fin.entries = fin.entries||[];
  var idx = fin.entries.findIndex(function(e){ return e.id===entId; });
  if (idx < 0) return;
  var hasPm = document.getElementById('eed-has-pm').checked;
  fin.entries[idx] = Object.assign({}, fin.entries[idx], {
    date: document.getElementById('eed-date').value,
    desc: desc,
    cat: document.getElementById('eed-cat').value,
    type: document.getElementById('eed-type').value,
    amount: amount,
    profit_margin: hasPm ? (parseFloat(document.getElementById('eed-pm').value)||0) : 0,
    profit_margin_type: document.getElementById('eed-pmt').value||'pct',
    status: document.getElementById('eed-status').value,
    note: document.getElementById('eed-note').value
  });
  DB.saveFin(projId, fin);
  UI.toast('تم حفظ التعديل','success');
  UI.closeModalForce();
  Pages.renderFinEntries(projId);
};

Pages.deleteEntry = function(projId, entId) {
  var fin = DB.getFin(projId);
  fin.entries = (fin.entries||[]).filter(function(e){ return e.id!==entId; });
  DB.saveFin(projId, fin);
  UI.toast('تم الحذف');
  Pages.renderFinEntries(projId);
};

Pages.exportCSV = function(projId) {
  var projects = DB.getProjects();
  var proj = projects.find(function(p){ return p.id===projId; });
  var clients = DB.getClients();
  var cl = proj ? clients.find(function(c){ return c.id===proj.client_id; }) : null;
  var fin  = DB.getFin(projId);
  var r    = FinCalc.calc(projId);
  var c    = fin.ctrl||{};
  var entries = (fin.entries||[]).slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  var available = r.contractNet - r.execAmt - r.mkt - r.cb - r.cfAmt;
  var profitPct = r.contractNet>0 ? (r.profit/r.contractNet*100).toFixed(1) : '0';

  function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  function row(){ return Array.prototype.slice.call(arguments).map(q).join(','); }

  var today = new Date();
  var todayStr = today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();

  var lines = [];
  /* ── ملخص المشروع ── */
  lines.push(row('# ملخص التقرير المالي — بُعد'));
  lines.push(row('تاريخ الإصدار', todayStr));
  lines.push(row('اسم المشروع', (proj||{}).name||''));
  lines.push(row('العميل', cl?cl.name:''));
  lines.push(row('رقم العقد', c.contract_no||''));
  lines.push(row('تاريخ العقد', c.contract_date||''));
  lines.push(row(''));

  /* ── الملخص المالي ── */
  lines.push(row('# الملخص المالي'));
  lines.push(row('البند', 'القيمة (ر.س)'));
  lines.push(row('إجمالي قيمة العقد', r.grossTotal));
  lines.push(row('ضريبة القيمة المضافة', r.vatAmt));
  lines.push(row('صافي العقد', r.contractNet));
  lines.push(row('أتعاب التنفيذ', r.execAmt));
  lines.push(row('التسويق', r.mkt));
  lines.push(row('كاش باك', r.cb));
  lines.push(row('المتاح للتنفيذ', available));
  lines.push(row('إجمالي المصاريف الفعلية', r.totalExpenses));
  lines.push(row('إجمالي الدخل المسجّل', r.totalIncome));
  lines.push(row('صافي الربح', r.profit));
  lines.push(row('هامش الربحية %', profitPct));
  lines.push(row('المتبقي', r.remaining));
  lines.push(row(''));

  /* ── سجل المعاملات ── */
  lines.push(row('# سجل المعاملات'));
  lines.push(row('التاريخ','البيان','التصنيف','النوع','المبلغ','الحالة','ملاحظة'));
  entries.forEach(function(e){
    lines.push(row(
      e.date||'', e.desc||'', catLabel(e.cat),
      e.type==='income'?'دخل':'مصروف',
      e.amount||0,
      e.status==='paid'?'مدفوع':e.status==='pending'?'معلق':e.status==='cancelled'?'ملغي':'',
      e.note||''
    ));
  });
  /* Totals */
  lines.push(row('','','','إجمالي الدخل', r.totalIncome,'',''));
  lines.push(row('','','','إجمالي المصاريف', r.totalExpenses,'',''));
  lines.push(row('','','','صافي الربح', r.profit,'',''));

  var csv = '﻿' + lines.join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var fname = ((proj||{}).name||projId).replace(/[^a-zA-Z0-9؀-ۿ]/g,'_');
  a.href = url; a.download = fname+'_تقرير_'+todayStr+'.csv'; a.click();
  URL.revokeObjectURL(url);
  UI.toast('تم تصدير التقرير بنجاح','success');
};

Pages.saveProjectEdit = function(projId) {
  var projects = DB.getProjects();
  var idx = projects.findIndex(function(p){ return p.id===projId; });
  if (idx<0) return;
  projects[idx].name = document.getElementById('ep-name').value.trim()||projects[idx].name;
  projects[idx].type = document.getElementById('ep-type').value;
  projects[idx].status = document.getElementById('ep-status').value;
  DB.saveProjects(projects);
  UI.toast('تم الحفظ','success');
  UI.closeModalForce();
  Pages.render_fin({projId:projId});
};

Pages.deleteProjectConfirm = function(projId) {
  var projects = DB.getProjects();
  var proj = projects.find(function(p){ return p.id===projId; });
  if (!proj) return;
  if (!confirm('هل تريد حذف المشروع "'+proj.name+'"؟')) return;
  DB.saveProjects(projects.filter(function(p){ return p.id!==projId; }));
  localStorage.removeItem('buad2_fin_'+projId);
  UI.toast('تم الحذف');
  UI.closeModalForce();
  Nav.go('projects');
};
