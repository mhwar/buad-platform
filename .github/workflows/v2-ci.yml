name: v2-ci
on:
  push:
    paths: ["v2/**", ".github/workflows/v2-ci.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/v2-ci.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # End-to-end on the real Worker with the web app `pnpm verify` just built, at desktop and phone sizes.
      - run: pnpm --filter @buad/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @buad/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            v2/e2e/playwright-report
            v2/e2e/test-results
          retention-days: 7
