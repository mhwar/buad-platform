name: v2-deploy
# Deploys the v2 Worker (API + web) to Cloudflare, on every merge to main that touches v2/,
# or manually: Actions → v2-deploy → Run workflow.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, JWT_SECRET.
# Optional: OWNER_SETUP_TOKEN enables the one-time /setup page that creates the first owner.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["v2/**", ".github/workflows/v2-deploy.yml"]
concurrency:
  group: v2-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --filter @buad/web build
        env:
          # Lets an open browser notice a newer deploy and offer to reload.
          VITE_APP_VERSION: ${{ github.sha }}
      # Nothing reaches production unless the end-to-end tests pass on this exact build.
      - run: pnpm --filter @buad/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @buad/e2e e2e
      # A full copy of the live database before any migration touches it (kept 30 days, private
      # to this repository). Restore: see «النسخ الاحتياطي والاستعادة» in v2/README.md.
      - name: Back up the database
        working-directory: v2/apps/api
        run: pnpm exec wrangler d1 export buad-v2 --remote --output "../../backup-${GITHUB_SHA::7}.sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.sha }}
          path: v2/backup-*.sql
          retention-days: 30
          if-no-files-found: error
      - name: Apply database migrations
        working-directory: v2/apps/api
        run: pnpm exec wrangler d1 migrations apply buad-v2 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set JWT secret
        working-directory: v2/apps/api
        run: printf '%s' "$JWT_SECRET" | pnpm exec wrangler secret put JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set owner setup token (only if provided)
        working-directory: v2/apps/api
        if: ${{ env.OWNER_SETUP_TOKEN != '' }}
        run: printf '%s' "$OWNER_SETUP_TOKEN" | pnpm exec wrangler secret put OWNER_SETUP_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        working-directory: v2/apps/api
        run: pnpm exec wrangler deploy --var "APP_VERSION:${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
