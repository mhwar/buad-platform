<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">الموقع الرسمي</title>
<meta id="page-desc" name="description" content="">
<meta property="og:type" content="website">
<meta id="og-title" property="og:title" content="">
<meta id="og-desc" property="og:description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1e2a4a;--brand-2:#162035;--brand-soft:#f3f5f9;
  --accent:#1d9b8a;--accent-2:#15806f;
  --fg:#141a26;--fg-2:#3d4757;--fg-3:#6b7585;--fg-4:#9aa3b2;
  --bg:#ffffff;--bg-2:#f7f9fc;--line:#e7ebf1;
  --radius:18px;--shadow:0 4px 24px rgba(20,30,55,.08);--shadow-lg:0 18px 50px rgba(20,30,55,.16);
  --maxw:1180px;
}
/* theme palettes (brand color) */
[data-theme="navy"]{--brand:#1e2a4a;--brand-2:#141d33}
[data-theme="teal"]{--brand:#0d7e6e;--brand-2:#0a5f53}
[data-theme="emerald"]{--brand:#047857;--brand-2:#035c43}
[data-theme="royal"]{--brand:#1d4ed8;--brand-2:#1740b0}
[data-theme="violet"]{--brand:#6d28d9;--brand-2:#581fb0}
[data-theme="maroon"]{--brand:#9f1239;--brand-2:#7d0e2d}
[data-theme="amber"]{--brand:#b45309;--brand-2:#8f4107}
[data-theme="national"]{--brand:#0A4D5C;--brand-2:#073540;--brand-soft:#EAF4F6;--accent:#0A4D5C;--accent-2:#073540}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--fg);font-feature-settings:'lnum' 1;-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:.18s;white-space:nowrap}
.btn-accent{background:var(--accent);color:var(--btn-tx,#fff)}
.btn-accent:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 8px 22px rgba(29,155,138,.35)}
.btn-white{background:#fff;color:var(--brand)}
.btn-white:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.2)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-outline{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* ── Top bar / Nav ── */
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);transition:.2s}
.nav-inner{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-logo{width:46px;height:46px;border-radius:12px;object-fit:contain;background:var(--brand-soft);padding:3px}
.brand-abbr{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.brand-tx b{display:block;font-size:17px;font-weight:800;color:var(--brand);line-height:1.2}
.brand-tx span{font-size:11.5px;color:var(--fg-3)}
.nav-links{display:flex;gap:4px;margin-right:auto}
.nav-links a{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg-2);transition:.15s}
.nav-links a:hover{background:var(--brand-soft);color:var(--brand)}
.nav-cta{display:flex;align-items:center;gap:10px}
.nav-burger{display:none;width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;align-items:center;justify-content:center;color:var(--brand)}
.nav-burger svg{width:22px;height:22px}

/* ── Hero ── */
.hero{position:relative;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%)}
.hero-bg{position:absolute;inset:0;z-index:0;opacity:.22;background-size:cover;background-position:center}
.hero-ov{position:absolute;inset:0;z-index:1;background:linear-gradient(135deg,rgba(20,29,51,.78),rgba(20,29,51,.55))}
.hero-deco{position:absolute;z-index:1;border-radius:50%;filter:blur(60px);opacity:.4}
.hero-deco.a{width:340px;height:340px;background:var(--accent);top:-120px;left:-80px}
.hero-deco.b{width:300px;height:300px;background:#fff;bottom:-140px;right:-60px;opacity:.12}
.hero-inner{position:relative;z-index:2;padding:96px 0 104px;max-width:760px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:30px;margin-bottom:22px}
.hero-badge .pulse{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;line-height:1.18;letter-spacing:-.5px;margin-bottom:18px}
.hero p{font-size:clamp(16px,2vw,19px);color:rgba(255,255,255,.85);line-height:1.8;margin-bottom:32px;max-width:620px}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.hero-wave{position:absolute;bottom:-1px;left:0;right:0;z-index:2;line-height:0}
.hero-wave svg{width:100%;height:60px;display:block}
/* ── generic hero slider (classic/modern/premium/minimal) ── */
.hero-slider{display:grid;position:relative;z-index:2;width:100%}
.hero-slide{grid-area:1/1;position:relative;opacity:0;visibility:hidden;transition:opacity .55s ease;pointer-events:none}
.hero-slide.on{opacity:1;visibility:visible;pointer-events:auto}
.hero-slide-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
.hero-slide-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(8,12,24,.34),rgba(8,12,24,.66))}
.hero-slide>.wrap{position:relative;z-index:2}
.hero-arrow{position:absolute;top:42%;z-index:6;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);backdrop-filter:blur(6px);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
.hero-arrow:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6)}
.hero-arrow.prev{left:22px}.hero-arrow.next{right:22px}
.hero-arrow svg{width:20px;height:20px}
.hero-dots{position:absolute;bottom:30px;left:0;right:0;z-index:6;display:flex;gap:8px;justify-content:center}
.hero-dot{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,.4);cursor:pointer;transition:.2s;padding:0}
.hero-dot.on{background:#fff;width:26px;border-radius:5px}
.hero .hero-dots{bottom:86px}
.p-hero .hero-dots{bottom:58px}
.m-hero .hero-slider{flex:1}
@media(max-width:640px){.hero-arrow{display:none}}
/* trusted-organization pill (classic/modern/premium heroes) */
.trust-pill{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;padding:8px 16px;border-radius:999px;background:linear-gradient(135deg,#D4AF37,#B8961D);color:#1a0e00;font-size:13px;font-weight:800;box-shadow:0 6px 18px rgba(212,175,55,.3)}
.trust-pill svg{width:17px;height:17px}

/* ── Sections ── */
section{padding:80px 0}
.sec-head{text-align:center;max-width:640px;margin:0 auto 52px}
.sec-eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin-bottom:12px;position:relative;padding:0 4px}
.sec-eyebrow::before,.sec-eyebrow::after{content:'';position:absolute;top:50%;width:24px;height:2px;background:var(--accent);opacity:.4}
.sec-eyebrow::before{right:-30px}.sec-eyebrow::after{left:-30px}
.sec-title{font-size:clamp(24px,3.4vw,36px);font-weight:800;color:var(--brand);letter-spacing:-.4px;margin-bottom:14px}
.sec-sub{font-size:16px;color:var(--fg-3);line-height:1.8}
.alt{background:var(--bg-2)}

/* ── About ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about-img{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:4/3;background:var(--brand-soft)}
.about-img img{width:100%;height:100%;object-fit:cover}
.about-tx h2{font-size:30px;font-weight:800;color:var(--brand);margin-bottom:18px;letter-spacing:-.3px}
.about-tx p{font-size:15.5px;color:var(--fg-2);line-height:1.95;white-space:pre-line;margin-bottom:16px}
.vm-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.vm-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.vm-card .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.vm-card .ic svg{width:22px;height:22px}
.vm-card h4{font-size:16px;font-weight:800;color:var(--brand);margin-bottom:8px}
.vm-card p{font-size:14px;color:var(--fg-3);line-height:1.8;white-space:pre-line;margin:0}

/* ── Stats ── */
.stats{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:30px;text-align:center}
.stat-ic{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.12);color:#fff;margin-bottom:16px}
.stat-ic svg{width:26px;height:26px}
.stat .n{font-size:clamp(34px,5vw,52px);font-weight:800;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,rgba(255,255,255,.7));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:15px;color:rgba(255,255,255,.8);margin-top:10px;font-weight:500}

/* ── Values ── */
.val-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.val-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px 26px;transition:.2s;position:relative;overflow:hidden}
.val-card::before{content:'';position:absolute;top:0;right:0;width:100%;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:.3s}
.val-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.val-card:hover::before{transform:scaleX(1)}
.val-num{font-size:14px;font-weight:800;color:var(--accent);background:var(--brand-soft);width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.val-card h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px}
.val-card p{font-size:14.5px;color:var(--fg-3);line-height:1.85}

/* ── Programs ── */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px}
.prog-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.2s;display:flex;flex-direction:column}
.prog-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.prog-img{aspect-ratio:16/10;background:var(--brand-soft);overflow:hidden;position:relative}
.prog-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s;z-index:1}
.prog-card:hover .prog-img img{transform:scale(1.06)}
.ph-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ph-ico svg{width:46px;height:46px;opacity:.35}
.prog-body{padding:24px;flex:1;display:flex;flex-direction:column}
.prog-body h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px}
.prog-body p{font-size:14.5px;color:var(--fg-3);line-height:1.85;white-space:pre-line}

/* ── News ── */
.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px}
.news-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.news-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.news-img{aspect-ratio:16/9;background:var(--brand-soft);overflow:hidden;position:relative}
.news-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s;z-index:1}
.news-card:hover .news-img img{transform:scale(1.06)}
.news-body{padding:22px;flex:1;display:flex;flex-direction:column}
.news-date{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.news-date svg{width:15px;height:15px;flex-shrink:0}
.news-body h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px;line-height:1.4}
.news-body p{font-size:14px;color:var(--fg-3);line-height:1.8;flex:1}
.news-more{font-size:13.5px;font-weight:700;color:var(--accent);margin-top:14px;display:inline-flex;align-items:center;gap:6px}

/* ── Board ── */
.board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.board-card{text-align:center}
.board-ava{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;object-fit:cover;background:var(--brand-soft);border:4px solid #fff;box-shadow:var(--shadow)}
.board-ava.ph{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:var(--accent)}
.board-card h4{font-size:17px;font-weight:800;color:var(--brand);margin-bottom:4px}
.board-card span{font-size:13.5px;color:var(--fg-3)}

/* ── Governance ── */
.gov-cats{display:flex;flex-direction:column;gap:30px}
.gov-cat-title{font-size:16px;font-weight:800;color:var(--brand);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.gov-cat-title .b{width:5px;height:20px;border-radius:3px;background:var(--accent)}
.gov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gov-doc{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.18s}
.gov-doc:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.gov-doc .ic{width:44px;height:44px;border-radius:11px;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gov-doc .ic svg{width:22px;height:22px}
.gov-doc .tx{flex:1;min-width:0}
.gov-doc .tx b{display:block;font-size:14.5px;font-weight:700;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gov-doc .tx span{font-size:12px;color:var(--fg-4)}
.gov-doc .dl{color:var(--accent);flex-shrink:0}
.gov-doc .dl svg{width:20px;height:20px}

/* ── Partners ── */
.partners-grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:center}
.partner{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 28px;min-width:150px;min-height:88px;display:flex;align-items:center;justify-content:center;transition:.18s}
.partner:hover{box-shadow:var(--shadow)}
.partner img{max-height:48px;max-width:130px;object-fit:contain;filter:grayscale(1);opacity:.7;transition:.2s}
.partner:hover img{filter:none;opacity:1}
.partner span{font-size:15px;font-weight:700;color:var(--fg-3)}

/* ── FAQ ── */
.faq-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.faq-item{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s}
.faq-item.open{box-shadow:var(--shadow);border-color:var(--accent)}
.faq-q{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;cursor:pointer;font-size:15.5px;font-weight:700;color:var(--brand)}
.faq-q .chev{width:24px;height:24px;flex-shrink:0;color:var(--accent);transition:.25s}
.faq-item.open .chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:14.5px;color:var(--fg-2);line-height:1.9}
.faq-a div{padding:0 22px 20px;white-space:pre-line}

/* ── Donation CTA ── */
.donate{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:24px;padding:56px 40px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.donate::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.1);top:-150px;right:-80px}
.donate-ic{position:relative;width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.donate-ic svg{width:36px;height:36px}
.donate h2{position:relative;font-size:clamp(26px,4vw,38px);font-weight:800;margin-bottom:14px}
.donate p{position:relative;font-size:17px;color:rgba(255,255,255,.9);max-width:560px;margin:0 auto 28px;line-height:1.8}
.donate-account{position:relative;display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;direction:ltr;margin-top:18px}
.donate-account svg{width:18px;height:18px;flex-shrink:0}

/* ── Contact ── */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.contact-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;align-items:center;gap:16px;margin-bottom:14px;transition:.18s}
.contact-card:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.contact-card .ic{width:50px;height:50px;border-radius:13px;background:var(--brand-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-card .ic svg{width:24px;height:24px}
.contact-card .tx b{display:block;font-size:13px;color:var(--fg-4);font-weight:600;margin-bottom:3px}
.contact-card .tx span{font-size:15px;font-weight:700;color:var(--brand);direction:ltr;unicode-bidi:plaintext}
.contact-map{border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:300px;height:100%}
.contact-map iframe{width:100%;height:100%;min-height:300px;border:0}
.contact-social{display:flex;gap:12px;margin-top:8px}
.contact-social a{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;transition:.18s}
.contact-social a:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}
.contact-social svg{width:21px;height:21px}

/* ── Footer ── */
footer{background:var(--brand-2);color:rgba(255,255,255,.65);padding:56px 0 0}
.foot-top{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.1)}
.foot-brand b{font-size:20px;font-weight:800;color:#fff;display:block;margin-bottom:12px}
.foot-brand p{font-size:14px;line-height:1.8;max-width:320px}
.foot-col h5{font-size:14px;font-weight:700;color:#fff;margin-bottom:16px}
.foot-col a{display:block;font-size:13.5px;color:rgba(255,255,255,.6);padding:5px 0;transition:.15s}
.foot-col a:hover{color:#fff;padding-right:5px}
.foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;flex-wrap:wrap;font-size:13px}
.foot-buad{display:inline-flex;align-items:center;gap:7px;color:rgba(255,255,255,.8);font-weight:600}
.foot-buad b{color:#fff;font-weight:800}

/* ── Article / Page view ── */
.article{max-width:820px;margin:0 auto;padding:60px 0}
.article-back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:28px;cursor:pointer}
.article-date{font-size:13.5px;color:var(--accent);font-weight:700;margin-bottom:12px}
.article h1{font-size:clamp(26px,4vw,40px);font-weight:800;color:var(--brand);line-height:1.3;margin-bottom:24px;letter-spacing:-.3px}
.article-hero{width:100%;border-radius:var(--radius);margin-bottom:30px;max-height:420px;object-fit:cover}
.article-body{font-size:16.5px;color:var(--fg-2);line-height:2}
.article-body p{margin:0 0 16px}
.article-body h2{font-size:26px;font-weight:800;color:var(--fg);margin:28px 0 12px;line-height:1.3}
.article-body h3{font-size:20px;font-weight:700;color:var(--fg);margin:22px 0 10px;line-height:1.35}
.article-body ul,.article-body ol{margin:0 0 16px;padding-right:24px}
.article-body li{margin-bottom:7px}
.article-body blockquote{border-right:4px solid var(--accent);margin:18px 0;padding:10px 20px;background:var(--bg-2,#f6f8fb);border-radius:0 10px 10px 0;color:var(--fg)}
.article-body img{max-width:100%;height:auto;border-radius:12px;margin:16px 0;display:block}
.article-body a{color:var(--accent);text-decoration:underline}
.article-body hr{border:none;border-top:1px solid var(--line);margin:26px 0}
body.theme-national .article-body blockquote{border-right-color:var(--n-teal)}
body.theme-national .article-body h2,body.theme-national .article-body h3{color:var(--n-teal)}
body.theme-national .article-body a{color:var(--n-teal)}

/* ── States ── */
.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;gap:16px;padding:40px}
.state-ic{width:72px;height:72px;border-radius:20px;background:var(--brand-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.state-ic svg{width:36px;height:36px}
.state-title{font-size:23px;font-weight:800;color:var(--brand)}
.state-sub{font-size:14.5px;color:var(--fg-3);max-width:420px;line-height:1.7}
@keyframes spin{to{transform:rotate(360deg)}}

/* preview banner */
.pv-banner{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--brand);color:#fff;padding:11px 22px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px}
.pv-banner .d{width:8px;height:8px;border-radius:50%;background:#fbbf24;animation:pulse 2s infinite}

/* mobile menu */
.mmenu{position:fixed;inset:0;z-index:300;background:rgba(20,29,51,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.2s}
.mmenu.open{opacity:1;pointer-events:auto}
.mmenu-panel{position:absolute;top:0;right:0;bottom:0;width:min(300px,80vw);background:#fff;padding:24px;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;gap:6px}
.mmenu.open .mmenu-panel{transform:none}
.mmenu-panel a{padding:13px 14px;border-radius:10px;font-size:15px;font-weight:600;color:var(--fg-2)}
.mmenu-panel a:hover{background:var(--brand-soft);color:var(--brand)}
.mmenu-close{align-self:flex-start;background:var(--brand-soft);border:none;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--brand);margin-bottom:10px}

@media(max-width:900px){
  .about-grid,.contact-grid{grid-template-columns:1fr;gap:32px}
  .vm-grid{grid-template-columns:1fr}
  .foot-top{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .nav-links{display:none}
  .nav-burger{display:flex}
  .nav-cta .btn{display:none}
  section{padding:56px 0}
  .hero-inner{padding:64px 0 80px}
  .foot-top{grid-template-columns:1fr;gap:28px}
  .foot-bottom{flex-direction:column;text-align:center}
}

/* ═══════════════════════════════════════════════
   MODERN THEME — layout_theme: 'modern'
   ═══════════════════════════════════════════════ */
body.theme-modern{--radius:20px;--shadow:0 6px 28px rgba(20,30,55,.09);--shadow-lg:0 20px 56px rgba(20,30,55,.17)}

/* Modern Nav */
body.theme-modern .nav{background:#fff;border-bottom:none;box-shadow:0 1px 0 var(--line)}
body.theme-modern .nav-inner{height:76px}
body.theme-modern .brand-abbr{border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--accent))}

/* Modern Hero — diagonal split */
.m-hero{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden;background:var(--brand)}
.m-hero-bg{position:absolute;inset:0;z-index:0;opacity:.18;background-size:cover;background-position:center}
.m-hero-shape{position:absolute;top:0;left:0;bottom:0;width:50%;background:linear-gradient(160deg,var(--accent) 0%,var(--brand) 100%);clip-path:polygon(0 0,85% 0,100% 100%,0 100%);z-index:1;opacity:.55}
.m-hero-deco-a{position:absolute;width:480px;height:480px;border-radius:50%;border:1.5px solid rgba(255,255,255,.08);top:-160px;right:-100px;z-index:1}
.m-hero-deco-b{position:absolute;width:280px;height:280px;border-radius:50%;border:1px solid rgba(255,255,255,.06);bottom:-80px;left:22%;z-index:1}
.m-hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;padding:100px 0 110px;width:100%}
.m-hero-tx{color:#fff}
.m-hero-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.92);font-size:12.5px;font-weight:700;padding:7px 18px;border-radius:30px;margin-bottom:26px;letter-spacing:.03em}
.m-hero-pill .dot{width:7px;height:7px;border-radius:50%;background:#34d399;animation:pulse 2s infinite}
.m-hero-tx h1{font-size:clamp(32px,5vw,58px);font-weight:800;line-height:1.14;letter-spacing:-.6px;margin-bottom:20px}
.m-hero-tx p{font-size:clamp(15px,2vw,18px);color:rgba(255,255,255,.82);line-height:1.85;margin-bottom:34px;max-width:520px}
.m-hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.m-hero-vis{display:flex;align-items:center;justify-content:center;position:relative}
.m-hero-card{background:rgba(255,255,255,.1);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:28px;color:#fff;width:100%;max-width:340px}
.m-hero-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.m-hero-stat{background:rgba(255,255,255,.08);border-radius:14px;padding:16px;text-align:center}
.m-hero-stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.m-hero-stat .l{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}

/* Modern About */
.m-about{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.m-about-tx .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(29,155,138,.1);color:var(--accent);font-size:12.5px;font-weight:800;padding:6px 16px;border-radius:20px;margin-bottom:20px;letter-spacing:.04em}
.m-about-tx h2{font-size:clamp(26px,3.5vw,38px);font-weight:800;color:var(--brand);line-height:1.22;letter-spacing:-.4px;margin-bottom:18px}
.m-about-tx p{font-size:15.5px;color:var(--fg-2);line-height:1.95;white-space:pre-line;margin-bottom:20px}
.m-about-img{position:relative}
.m-about-img-main{border-radius:28px;overflow:hidden;aspect-ratio:4/3;background:var(--brand-soft);box-shadow:var(--shadow-lg)}
.m-about-img-main img{width:100%;height:100%;object-fit:cover}
.m-about-badge{position:absolute;bottom:-16px;right:-16px;background:var(--brand);color:#fff;border-radius:18px;padding:16px 22px;box-shadow:var(--shadow-lg)}
.m-about-badge .n{font-size:28px;font-weight:800;line-height:1}
.m-about-badge .l{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}
.m-vm{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.m-vm-card{background:var(--brand-soft);border-radius:16px;padding:20px;display:flex;gap:14px;align-items:flex-start}
.m-vm-ic{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.m-vm-ic svg{width:20px;height:20px}
.m-vm-card h4{font-size:15px;font-weight:800;color:var(--brand);margin-bottom:5px}
.m-vm-card p{font-size:13px;color:var(--fg-3);line-height:1.75;white-space:pre-line;margin:0}

/* Modern Stats strip */
.m-stats{background:linear-gradient(135deg,var(--brand) 0%,var(--accent) 100%);padding:56px 0}
.m-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0}
.m-stat{text-align:center;color:#fff;padding:10px 20px;position:relative}
.m-stat+.m-stat::before{content:'';position:absolute;right:0;top:15%;height:70%;width:1px;background:rgba(255,255,255,.2)}
.m-stat-ic{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;margin-bottom:14px}
.m-stat-ic svg{width:24px;height:24px}
.m-stat .n{font-size:clamp(36px,5vw,54px);font-weight:800;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.m-stat .l{font-size:14px;color:rgba(255,255,255,.8);margin-top:10px;font-weight:500}

/* Modern Programs */
.m-prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px}
.m-prog-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.22s;display:flex;flex-direction:column;position:relative}
.m-prog-card::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--brand))}
.m-prog-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-5px)}
.m-prog-img{aspect-ratio:16/9;background:var(--brand-soft);overflow:hidden;position:relative}
.m-prog-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s;z-index:1}
.m-prog-card:hover .m-prog-img img{transform:scale(1.06)}
.m-prog-num{position:absolute;bottom:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.m-prog-body{padding:24px;flex:1;display:flex;flex-direction:column}
.m-prog-body h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px}
.m-prog-body p{font-size:14px;color:var(--fg-3);line-height:1.85;white-space:pre-line;flex:1}

/* Modern News — featured + grid */
.m-news-featured{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;margin-bottom:26px}
.m-news-big{border-radius:var(--radius);overflow:hidden;cursor:pointer;background:#fff;border:1px solid var(--line);transition:.22s;display:flex;flex-direction:column}
.m-news-big:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.m-news-big-img{aspect-ratio:16/9;background:var(--brand-soft);overflow:hidden;position:relative}
.m-news-big-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}
.m-news-big:hover .m-news-big-img img{transform:scale(1.04)}
.m-news-big-body{padding:24px;flex:1;display:flex;flex-direction:column}
.m-news-big-body h4{font-size:20px;font-weight:800;color:var(--brand);margin-bottom:10px;line-height:1.35}
.m-news-big-body p{font-size:14.5px;color:var(--fg-3);line-height:1.8;flex:1}
.m-news-sm-list{display:flex;flex-direction:column;gap:12px}
.m-news-sm{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.18s;align-items:flex-start}
.m-news-sm:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.m-news-sm-img{width:72px;height:72px;border-radius:10px;background:var(--brand-soft);overflow:hidden;flex-shrink:0;position:relative}
.m-news-sm-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m-news-sm h5{font-size:14px;font-weight:700;color:var(--brand);margin-bottom:5px;line-height:1.4}
.m-news-sm span{font-size:12px;color:var(--accent);font-weight:600}
.m-news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}

/* Modern Board */
.m-board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.m-board-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center;transition:.2s;position:relative;overflow:hidden}
.m-board-card::after{content:'';position:absolute;bottom:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--brand))}
.m-board-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.m-board-ava{width:90px;height:90px;border-radius:50%;margin:0 auto 16px;object-fit:cover;background:var(--brand-soft);border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.m-board-ava.ph{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--accent)}
.m-board-card h4{font-size:16px;font-weight:800;color:var(--brand);margin-bottom:4px}
.m-board-card span{font-size:13px;color:var(--fg-3)}

/* Modern Values */
.m-val-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.m-val-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;transition:.2s;overflow:hidden}
.m-val-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--brand));border-radius:0 var(--radius) var(--radius) 0}
.m-val-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.m-val-num{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;margin-bottom:18px}
.m-val-card h4{font-size:17px;font-weight:800;color:var(--brand);margin-bottom:9px}
.m-val-card p{font-size:14px;color:var(--fg-3);line-height:1.85}

/* Modern Donation CTA */
.m-donate{position:relative;border-radius:28px;overflow:hidden;background:var(--brand);color:#fff;padding:64px 40px;text-align:center}
.m-donate::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;background:var(--accent);opacity:.2;top:-200px;left:-150px}
.m-donate::after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-140px;right:-60px}
.m-donate-inner{position:relative;z-index:1}
.m-donate-ic{width:80px;height:80px;border-radius:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.m-donate-ic svg{width:40px;height:40px}
.m-donate h2{font-size:clamp(26px,4vw,40px);font-weight:800;margin-bottom:14px}
.m-donate p{font-size:17px;color:rgba(255,255,255,.88);max-width:560px;margin:0 auto 30px;line-height:1.85}

/* Modern Footer */
.m-footer{background:var(--brand);color:rgba(255,255,255,.65);padding:60px 0 0}
.m-foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:48px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.1)}
.m-foot-brand .logo{font-size:24px;font-weight:800;color:#fff;margin-bottom:14px}
.m-foot-brand p{font-size:14px;line-height:1.85;max-width:300px}
.m-foot-col h5{font-size:14px;font-weight:800;color:rgba(255,255,255,.9);margin-bottom:18px;letter-spacing:.02em}
.m-foot-col a{display:block;font-size:13.5px;color:rgba(255,255,255,.55);padding:6px 0;transition:.15s}
.m-foot-col a:hover{color:#fff;padding-right:6px}
.m-foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0;font-size:13px;flex-wrap:wrap}
.m-foot-buad{display:inline-flex;align-items:center;gap:7px;color:rgba(255,255,255,.8);font-weight:600}
.m-foot-buad b{color:#fff;font-weight:800}

@media(max-width:900px){
  .m-hero-inner{grid-template-columns:1fr;gap:40px}
  .m-hero-vis{display:none}
  .m-about{grid-template-columns:1fr}
  .m-news-featured{grid-template-columns:1fr}
  .m-foot-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .m-hero{min-height:auto}
  .m-hero-inner{padding:80px 0 90px}
  .m-vm{grid-template-columns:1fr}
  .m-foot-grid{grid-template-columns:1fr;gap:28px}
  .m-foot-bottom{flex-direction:column;text-align:center}
}

/* ═══════════════════════════════════════════════
   PREMIUM THEME — layout_theme: 'premium'
   ═══════════════════════════════════════════════ */
body.theme-premium{--radius:16px;--shadow:0 4px 20px rgba(20,30,55,.07);--shadow-lg:0 16px 48px rgba(20,30,55,.14);--shadow-xl:0 32px 80px rgba(20,30,55,.20)}
body.theme-premium .nav{background:#fff;border-bottom:none;box-shadow:0 1px 0 var(--line)}
body.theme-premium .nav-inner{height:80px}
body.theme-premium .brand-abbr{width:50px;height:50px;border-radius:14px;font-size:22px}

/* Premium Hero */
.p-hero{position:relative;background:var(--brand);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.p-hero-bg{position:absolute;inset:0;z-index:0;opacity:.15;background-size:cover;background-position:center}
.p-hero-deco-a{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%);top:-220px;right:-140px;z-index:0}
.p-hero-deco-b{position:absolute;width:400px;height:400px;background:var(--accent);opacity:.1;filter:blur(90px);bottom:-80px;left:8%;z-index:0}
.p-hero-inner{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:108px 0 88px}
.p-hero-tx{color:#fff}
.p-eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:22px}
.p-eyebrow .line{width:28px;height:2px;background:var(--accent);border-radius:2px;flex-shrink:0}
.p-hero-eyebrow{margin-bottom:28px}
.p-hero-tx h1{font-size:clamp(34px,5.5vw,62px);font-weight:800;line-height:1.1;letter-spacing:-.8px;margin-bottom:24px;background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.65) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.p-hero-tx p{font-size:clamp(15px,2vw,18px);color:rgba(255,255,255,.72);line-height:1.9;margin-bottom:38px;max-width:500px}
.p-hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.p-btn-primary{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;background:var(--accent);color:var(--btn-tx,#fff);border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:.18s;box-shadow:0 8px 24px rgba(29,155,138,.38);text-decoration:none}
.p-btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(29,155,138,.5)}
.p-btn-ghost{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;background:rgba(255,255,255,.08);color:#fff;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;border:1.5px solid rgba(255,255,255,.18);cursor:pointer;transition:.18s;backdrop-filter:blur(8px);text-decoration:none}
.p-btn-ghost:hover{background:rgba(255,255,255,.16)}
.p-hero-vis{display:flex;align-items:center;justify-content:center}
.p-hero-img-frame{position:relative;width:100%;max-width:400px;padding-bottom:24px;padding-left:24px}
.p-hero-img-main{border-radius:24px;overflow:hidden;aspect-ratio:3/4;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);position:relative;z-index:1}
.p-hero-img-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-hero-img-badge{position:absolute;bottom:0;left:0;z-index:2;width:148px;border-radius:18px;border:4px solid var(--brand);background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;color:#fff;box-shadow:var(--shadow-xl);text-align:center}
.p-hero-img-badge .n{font-size:34px;font-weight:800;line-height:1}
.p-hero-img-badge .l{font-size:11px;color:rgba(255,255,255,.78);margin-top:4px;line-height:1.4}
.p-hero-scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(255,255,255,.35);font-size:11px;font-weight:600;letter-spacing:.09em}
.p-scroll-pip{width:4px;height:30px;border:1.5px solid rgba(255,255,255,.25);border-radius:4px;overflow:hidden;position:relative}
.p-scroll-pip::after{content:'';position:absolute;top:0;left:0;right:0;height:55%;background:rgba(255,255,255,.45);border-radius:4px;animation:pscroll 1.7s ease-in-out infinite}
@keyframes pscroll{0%{transform:translateY(-100%)}100%{transform:translateY(200%)}}

/* Premium About */
.p-about{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start}
.p-about-img{position:relative;padding-bottom:24px;padding-left:24px}
.p-about-img-main{border-radius:24px;overflow:hidden;aspect-ratio:3/4;background:var(--brand-soft);box-shadow:var(--shadow-xl);position:relative;z-index:1}
.p-about-img-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-about-img-deco{position:absolute;bottom:0;left:0;width:85%;height:85%;border:2px solid var(--accent);border-radius:24px;opacity:.3}
.p-about-tx h2{font-size:clamp(26px,3.5vw,40px);font-weight:800;color:var(--brand);line-height:1.2;letter-spacing:-.4px;margin-bottom:22px}
.p-about-tx p{font-size:16px;color:var(--fg-2);line-height:2;white-space:pre-line;margin-bottom:24px}
.p-vm{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.p-vm-item{padding:22px;border-radius:16px;background:var(--bg-2);border-top:3px solid var(--accent);transition:.2s}
.p-vm-item:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.p-vm-item h4{font-size:15px;font-weight:800;color:var(--brand);margin-bottom:8px}
.p-vm-item p{font-size:13.5px;color:var(--fg-3);line-height:1.8;white-space:pre-line;margin:0}

/* Premium Stats */
.p-stats{background:var(--brand);padding:80px 0;position:relative;overflow:hidden}
.p-stats::before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.04) 0%,transparent 70%);top:-220px;right:-120px}
.p-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:rgba(255,255,255,.08);border-radius:20px;overflow:hidden}
.p-stat{background:rgba(255,255,255,.04);padding:40px 30px;text-align:center;color:#fff;transition:.2s}
.p-stat:hover{background:rgba(255,255,255,.09)}
.p-stat-ic{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.07);color:var(--accent);margin-bottom:18px}
.p-stat-ic svg{width:25px;height:25px}
.p-stat .n{font-size:clamp(38px,6vw,56px);font-weight:800;line-height:1;letter-spacing:-2px;display:block;margin-bottom:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.p-stat .l{font-size:14px;color:rgba(255,255,255,.6);font-weight:500;line-height:1.5}

/* Premium Values */
.p-val-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.p-val-card{background:#fff;border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow);transition:.25s;position:relative;overflow:hidden;border-bottom:3px solid transparent}
.p-val-card:hover{border-bottom-color:var(--accent);transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.p-val-ghost{position:absolute;top:8px;left:12px;font-size:60px;font-weight:800;color:var(--brand);opacity:.05;line-height:1;pointer-events:none;user-select:none}
.p-val-icon{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--brand));display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:#fff;box-shadow:0 6px 16px rgba(29,155,138,.28)}
.p-val-icon svg{width:24px;height:24px}
.p-val-card h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px}
.p-val-card p{font-size:14px;color:var(--fg-3);line-height:1.9}

/* Premium Programs */
.p-prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.p-prog-card{border-radius:var(--radius);overflow:hidden;transition:.25s;position:relative;display:flex;flex-direction:column}
.p-prog-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-xl)}
.p-prog-img{aspect-ratio:4/3;position:relative;background:var(--brand-soft);overflow:hidden}
.p-prog-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s;z-index:1}
.p-prog-card:hover .p-prog-img img{transform:scale(1.07)}
.p-prog-ov{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(14,20,40,.9) 0%,rgba(14,20,40,.18) 55%,transparent 100%)}
.p-prog-num{position:absolute;top:14px;right:14px;z-index:3;width:36px;height:36px;background:var(--accent);border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.p-prog-img-title{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:18px 20px 16px;color:#fff}
.p-prog-img-title h4{font-size:18px;font-weight:800;line-height:1.3}
.p-prog-body{padding:18px 20px;background:#fff;flex:1;border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
.p-prog-body p{font-size:14px;color:var(--fg-3);line-height:1.85;white-space:pre-line;margin:0}

/* Premium News */
.p-news-lead{display:grid;grid-template-columns:1.55fr 1fr;gap:26px;margin-bottom:26px}
.p-news-big{cursor:pointer;border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow);transition:.22s;display:flex;flex-direction:column}
.p-news-big:hover{box-shadow:var(--shadow-xl);transform:translateY(-4px)}
.p-news-big-img{aspect-ratio:16/9;background:var(--brand-soft);position:relative;overflow:hidden}
.p-news-big-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}
.p-news-big:hover .p-news-big-img img{transform:scale(1.04)}
.p-news-big-body{padding:28px;flex:1;display:flex;flex-direction:column}
.p-news-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--accent);background:rgba(29,155,138,.1);padding:4px 10px;border-radius:6px;margin-bottom:12px}
.p-news-big-body h3{font-size:clamp(18px,2.2vw,24px);font-weight:800;color:var(--brand);line-height:1.3;margin-bottom:12px;letter-spacing:-.3px}
.p-news-big-body p{font-size:15px;color:var(--fg-3);line-height:1.8;flex:1}
.p-news-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-4);margin-top:14px;font-weight:600}
.p-news-meta svg{width:15px;height:15px;flex-shrink:0;color:var(--accent)}
.p-news-side{display:flex;flex-direction:column;gap:13px}
.p-news-sm{display:flex;gap:14px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.18s;align-items:flex-start}
.p-news-sm:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.p-news-sm-img{width:78px;height:70px;border-radius:10px;background:var(--brand-soft);overflow:hidden;flex-shrink:0;position:relative}
.p-news-sm-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-news-sm h5{font-size:14px;font-weight:700;color:var(--brand);line-height:1.4;margin-bottom:5px}
.p-news-sm span{font-size:12px;color:var(--fg-4);font-weight:500}
.p-news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.p-news-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.p-news-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.p-news-card-img{aspect-ratio:16/9;background:var(--brand-soft);position:relative;overflow:hidden}
.p-news-card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}
.p-news-card:hover .p-news-card-img img{transform:scale(1.06)}
.p-news-card-body{padding:20px;flex:1;display:flex;flex-direction:column}
.p-news-card-body h4{font-size:17px;font-weight:800;color:var(--brand);line-height:1.4;margin-bottom:8px}
.p-news-card-body p{font-size:14px;color:var(--fg-3);line-height:1.8;flex:1}

/* Premium Board */
.p-board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
.p-board-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;padding-bottom:24px;text-align:center;transition:.22s}
.p-board-card:hover{box-shadow:var(--shadow-xl);transform:translateY(-5px)}
.p-board-header{height:72px;background:linear-gradient(135deg,var(--brand),var(--accent))}
.p-board-ava{width:90px;height:90px;border-radius:50%;margin:0 auto;display:block;object-fit:cover;background:var(--brand-soft);border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.14);position:relative;z-index:1;margin-top:-45px}
.p-board-ava.ph{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--accent)}
.p-board-card h4{font-size:17px;font-weight:800;color:var(--brand);margin:14px 16px 5px;line-height:1.25}
.p-board-badge{display:inline-block;margin-top:8px;padding:5px 14px;background:var(--brand-soft);color:var(--accent);font-size:12px;font-weight:700;border-radius:20px}

/* Premium Donate */
.p-donate{background:var(--brand);border-radius:28px;padding:72px 48px;text-align:center;position:relative;overflow:hidden;color:#fff}
.p-donate::before{content:'';position:absolute;width:480px;height:480px;border-radius:50%;background:var(--accent);opacity:.12;top:-240px;right:-160px;filter:blur(60px)}
.p-donate::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-180px;left:-100px}
.p-donate-inner{position:relative;z-index:1}
.p-donate-ic{width:88px;height:88px;border-radius:26px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 28px}
.p-donate-ic svg{width:44px;height:44px}
.p-donate h2{font-size:clamp(28px,4.5vw,44px);font-weight:800;margin-bottom:16px;letter-spacing:-.5px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.78));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.p-donate p{font-size:17px;color:rgba(255,255,255,.8);max-width:560px;margin:0 auto 32px;line-height:1.85}
.p-donate-iban{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;direction:ltr;margin-top:16px}
.p-donate-iban svg{width:17px;height:17px;opacity:.7;flex-shrink:0}

/* Premium Footer */
.p-footer{background:#0d1628;color:rgba(255,255,255,.5);padding:72px 0 0}
.p-foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:56px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.07)}
.p-foot-logo{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.p-foot-logo .abbr{width:46px;height:46px;border-radius:13px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.p-foot-logo b{font-size:20px;font-weight:800;color:#fff}
.p-foot-brand p{font-size:14px;line-height:1.85;max-width:300px}
.p-foot-social{display:flex;gap:10px;margin-top:20px}
.p-foot-social a{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);transition:.18s}
.p-foot-social a:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px)}
.p-foot-social svg{width:18px;height:18px}
.p-foot-col h5{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.1em;margin-bottom:18px}
.p-foot-col a{display:block;font-size:14px;color:rgba(255,255,255,.5);padding:6px 0;transition:.15s}
.p-foot-col a:hover{color:#fff;padding-right:6px}
.p-foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0;font-size:13px;flex-wrap:wrap}
.p-foot-buad{display:inline-flex;align-items:center;gap:7px;color:rgba(255,255,255,.55);font-weight:600}
.p-foot-buad b{color:#fff;font-weight:800}

@media(max-width:1000px){
  .p-hero-inner{grid-template-columns:1fr;gap:40px}
  .p-hero-vis{display:none}
  .p-about{grid-template-columns:1fr;gap:40px}
  .p-about-img{display:none}
  .p-news-lead{grid-template-columns:1fr}
  .p-foot-grid{grid-template-columns:1fr 1fr;gap:36px}
}
@media(max-width:720px){
  .p-hero{min-height:auto}
  .p-hero-inner{padding:80px 0 100px}
  .p-vm{grid-template-columns:1fr}
  .p-stats-grid{grid-template-columns:1fr 1fr}
  .p-foot-grid{grid-template-columns:1fr;gap:30px}
  .p-foot-bottom{flex-direction:column;text-align:center}
}

/* ═══════════════════════════════════════════════
   MINIMAL THEME — layout_theme: 'minimal'
   White · spacious · single accent · thin line icons
   ═══════════════════════════════════════════════ */
body.theme-minimal{--radius:14px;--shadow:none;--shadow-lg:none;--fg:#0f172a;--fg-2:#475569;--fg-3:#94a3b8;--fg-4:#b4bdca;--line:#edf0f4;--bg:#fff;--bg-2:#fafbfc;background:#fff}
body.theme-minimal .nav{background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);box-shadow:none}
body.theme-minimal .brand-abbr{background:var(--accent);border-radius:10px}
body.theme-minimal .brand-tx b{color:var(--fg)}
body.theme-minimal .nav-links a:hover{background:transparent;color:var(--accent)}
body.theme-minimal .nav-burger{border-color:var(--line);color:var(--fg)}
body.theme-minimal .btn{border-radius:10px;font-weight:700}
body.theme-minimal .btn-accent{box-shadow:none}
body.theme-minimal .btn-accent:hover{transform:none;box-shadow:none;filter:brightness(.94)}
body.theme-minimal .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
body.theme-minimal .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
/* hero: light & airy with dark text */
body.theme-minimal .hero{background:#fff;color:var(--fg)}
body.theme-minimal .hero-deco{display:none}
body.theme-minimal .hero-inner{padding:118px 0 128px;max-width:840px}
body.theme-minimal .hero h1{color:var(--fg);font-size:clamp(34px,5.4vw,60px);letter-spacing:-1.2px;font-weight:800}
body.theme-minimal .hero p{color:var(--fg-2)}
body.theme-minimal .hero-badge{background:var(--brand-soft);border:1px solid var(--line);color:var(--accent)}
body.theme-minimal .hero-badge .pulse{background:var(--accent)}
body.theme-minimal .hero-wave{display:none}
body.theme-minimal .hero-slide-bg::after{background:linear-gradient(to right,rgba(255,255,255,.80),rgba(255,255,255,.93))}
body.theme-minimal .hero-arrow{border-color:var(--line);background:#fff;color:var(--fg)}
body.theme-minimal .hero-arrow:hover{border-color:var(--accent);color:var(--accent)}
body.theme-minimal .hero-dot{background:var(--line)}
body.theme-minimal .hero-dot.on{background:var(--accent)}
body.theme-minimal .hero .hero-dots{bottom:44px}
body.theme-minimal .trust-pill{background:var(--brand-soft);color:var(--accent);border:1px solid var(--line);box-shadow:none}
/* spacious sections */
body.theme-minimal section{padding:100px 0}
body.theme-minimal .alt{background:var(--bg-2)}
body.theme-minimal .sec-title{color:var(--fg)}
body.theme-minimal .sec-eyebrow{color:var(--accent)}
/* cards: hairline border, no shadow */
body.theme-minimal .prog-card,body.theme-minimal .news-card,body.theme-minimal .board-card,body.theme-minimal .vm-card,body.theme-minimal .gov-doc,body.theme-minimal .gov-cat,body.theme-minimal .faq-item,body.theme-minimal .partner,body.theme-minimal .contact-card{box-shadow:none;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
body.theme-minimal .prog-card:hover,body.theme-minimal .news-card:hover,body.theme-minimal .board-card:hover{box-shadow:none;border-color:var(--accent);transform:translateY(-3px)}
/* stats: light surface, accent icons, dark numbers */
body.theme-minimal .stats{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--fg)}
body.theme-minimal .stat-ic{background:var(--brand-soft);color:var(--accent)}
body.theme-minimal .stat .n{background:none;-webkit-text-fill-color:currentColor;color:var(--fg)}
body.theme-minimal .stat .l{color:var(--fg-3)}
/* footer: light */
body.theme-minimal footer{background:#fff;border-top:1px solid var(--line);color:var(--fg-2)}
body.theme-minimal footer .foot-brand b,body.theme-minimal footer .foot-col h5{color:var(--fg)}
body.theme-minimal footer a{color:var(--fg-2)}
body.theme-minimal footer a:hover{color:var(--accent)}
body.theme-minimal .foot-bottom{border-top:1px solid var(--line)}
@media(max-width:760px){body.theme-minimal .hero-inner{padding:80px 0 90px}body.theme-minimal section{padding:64px 0}}

/* ═══════════════════════════════════════════════
   NATIONAL THEME — layout_theme: 'national'
   Light & airy · Deep Teal #0A4D5C (hero+footer+text only)
   Muted Gold #D4AF37 (CTA + impact only) · Ice White #F8FAFC
   All rules scoped under body.theme-national to avoid leakage.
   ═══════════════════════════════════════════════ */
body.theme-national{
  --n-teal:#0A4D5C;--n-teal-2:#073540;--n-teal-soft:#E7F1F3;
  --n-gold:#D4AF37;--n-gold-2:#B8961D;
  --n-ice:#F8FAFC;--n-ink:#1E293B;--n-ink-2:#475569;--n-ink-3:#64748B;--n-line:#E2E8F0;
  --n-fz:1;--radius:16px;
  --shadow:0 4px 20px rgba(10,77,92,.07);--shadow-lg:0 18px 50px rgba(10,77,92,.14);
  background:var(--n-ice);color:var(--n-ink);font-size:calc(15.5px * var(--n-fz))
}
body.theme-national.n-hc{--n-ink:#0b1220;--n-ink-2:#1E293B;--n-ink-3:#334155;--n-line:#94A3B8;--n-ice:#fff}
/* sections light by default — kill any dark `alt` inheritance */
body.theme-national section{background:var(--n-ice);color:var(--n-ink);padding:72px 0}
body.theme-national section.n-alt{background:#fff}
body.theme-national h1,body.theme-national h2,body.theme-national h3,body.theme-national h4{color:var(--n-teal)}
/* headings on dark surfaces must stay light — override the teal default (higher specificity) */
body.theme-national .n-hero h1,body.theme-national .n-hero h2,
body.theme-national .n-cta-box h2,body.theme-national .n-cta-box h3,
body.theme-national .n-footer h1,body.theme-national .n-footer h2,body.theme-national .n-footer h3,body.theme-national .n-footer h4{color:#fff}
body.theme-national .sec-title{color:var(--n-teal)}
body.theme-national .sec-eyebrow{color:var(--n-gold)}
body.theme-national .sec-eyebrow::before,body.theme-national .sec-eyebrow::after{background:var(--n-gold)}
body.theme-national .sec-sub{color:var(--n-ink-3)}

/* ── Utility bar (top) ── */
.n-util{background:var(--n-teal-2);color:rgba(255,255,255,.72);font-size:12.5px}
.n-util-inner{display:flex;align-items:center;justify-content:space-between;height:40px;gap:16px}
.n-util-l,.n-util-r{display:flex;align-items:center;gap:14px}
.n-util button{background:transparent;border:none;color:rgba(255,255,255,.72);font-family:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;transition:.15s}
.n-util button:hover{background:rgba(255,255,255,.1);color:#fff}
.n-util button svg{width:15px;height:15px}
.n-util-lic{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.6)}
.n-lic-badge{background:var(--n-gold);color:#1a0e00;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:5px;letter-spacing:.02em}
.n-util-drop{position:relative}
.n-util-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:#fff;border:1px solid var(--n-line);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;opacity:0;transform:translateY(6px);pointer-events:none;transition:.16s;z-index:330}
.n-util-drop.open .n-util-menu{opacity:1;transform:none;pointer-events:auto}
.n-util-menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--n-ink-2);transition:.14s}
.n-util-menu a:hover{background:var(--n-teal-soft);color:var(--n-teal)}
.n-util-menu a svg{width:17px;height:17px;color:var(--n-teal);flex-shrink:0}

/* ── Main nav with mega menus ── */
.n-nav{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--n-line);box-shadow:0 1px 14px rgba(10,77,92,.05);overflow:visible}
.n-nav-inner{display:flex;align-items:center;gap:18px;height:76px}
.n-brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.n-brand-logo{width:50px;height:50px;border-radius:13px;object-fit:contain;background:var(--n-teal-soft);padding:4px}
.n-brand-abbr{width:50px;height:50px;border-radius:13px;background:linear-gradient(135deg,var(--n-teal),var(--n-teal-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}
.n-brand-tx b{display:block;font-size:17px;font-weight:800;color:var(--n-teal);line-height:1.2}
.n-brand-tx span{font-size:11px;color:var(--n-ink-3);font-weight:600}
.n-menu{display:flex;align-items:center;gap:2px;margin-right:auto}
.n-megawrap{position:relative}
.n-mega-trigger{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:9px;font-size:14.5px;font-weight:700;color:var(--n-ink-2);background:transparent;border:none;font-family:inherit;cursor:pointer;transition:.14s}
.n-mega-trigger svg{width:15px;height:15px;transition:.2s;opacity:.6}
.n-megawrap:hover .n-mega-trigger,.n-megawrap.open .n-mega-trigger{background:var(--n-teal-soft);color:var(--n-teal)}
.n-megawrap:hover .n-mega-trigger svg,.n-megawrap.open .n-mega-trigger svg{transform:rotate(180deg)}
.n-mega{position:absolute;top:calc(100% + 8px);right:0;min-width:540px;max-width:min(680px,92vw);background:#fff;border:1px solid var(--n-line);border-top:3px solid var(--n-gold);border-radius:0 0 18px 18px;box-shadow:var(--shadow-lg);padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.16s;z-index:310}
.n-megawrap:hover .n-mega,.n-megawrap:focus-within .n-mega,.n-mega.open{opacity:1;transform:none;pointer-events:auto}
.n-megawrap:last-child .n-mega{right:auto;left:0}
.n-mega-head{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--n-gold);padding:0 12px 8px;border-bottom:1px solid var(--n-line);margin-bottom:6px}
.n-mega a{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:12px;transition:.14s}
.n-mega a:hover{background:var(--n-teal-soft)}
.n-mega a .ic{width:38px;height:38px;border-radius:10px;background:var(--n-teal-soft);color:var(--n-teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.n-mega a:hover .ic{background:var(--n-teal);color:#fff}
.n-mega a .ic svg{width:19px;height:19px}
.n-mega a b{display:block;font-size:14px;font-weight:700;color:var(--n-teal);margin-bottom:2px}
.n-mega a span{font-size:12px;color:var(--n-ink-3);line-height:1.5}
.n-donate-btn{position:relative;background:var(--n-gold);color:#1a0e00;font-weight:800;padding:11px 24px;border-radius:11px;font-size:14.5px;transition:.18s;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;text-decoration:none;box-shadow:0 4px 16px rgba(212,175,55,.32);animation:npulse 2.4s infinite}
@keyframes npulse{0%{box-shadow:0 4px 16px rgba(212,175,55,.32),0 0 0 0 rgba(212,175,55,.5)}70%{box-shadow:0 4px 16px rgba(212,175,55,.32),0 0 0 12px rgba(212,175,55,0)}100%{box-shadow:0 4px 16px rgba(212,175,55,.32),0 0 0 0 rgba(212,175,55,0)}}
.n-donate-btn:hover{background:var(--n-gold-2);transform:translateY(-1px)}
.n-donate-btn svg{width:17px;height:17px}
.n-burger{display:none;width:44px;height:44px;border-radius:11px;border:1.5px solid var(--n-line);background:#fff;cursor:pointer;align-items:center;justify-content:center;color:var(--n-teal)}
.n-burger svg{width:22px;height:22px}

/* ── Buttons ── */
.n-btn-gold{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;background:var(--n-gold);color:var(--n-gold-tx,#1a0e00);border-radius:11px;font-size:15px;font-weight:800;font-family:inherit;border:none;cursor:pointer;transition:.18s;text-decoration:none;box-shadow:0 6px 20px rgba(212,175,55,.3)}
.n-btn-gold:hover{background:var(--n-gold-2);transform:translateY(-2px);box-shadow:0 12px 28px rgba(212,175,55,.4)}
.n-btn-teal{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;background:var(--n-teal);color:#fff;border-radius:11px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:.18s;text-decoration:none}
.n-btn-teal:hover{background:var(--n-teal-2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.n-btn-outline-w{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45);border-radius:11px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.18s;text-decoration:none}
.n-btn-outline-w:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.75)}
.n-btn-ghost{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;background:#fff;color:var(--n-teal);border:1.5px solid var(--n-line);border-radius:11px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:.16s;text-decoration:none}
.n-btn-ghost:hover{border-color:var(--n-teal);background:var(--n-teal-soft)}
.n-link-more{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--n-teal);text-decoration:none}
.n-link-more svg{width:16px;height:16px;transition:.18s}
.n-link-more:hover svg{transform:translateX(-4px)}

/* ── Hero (the only dark block at top) ── */
.n-hero{position:relative;background:linear-gradient(135deg,var(--n-teal) 0%,var(--n-teal-2) 100%);overflow:hidden;color:#fff}
.n-hero-bg{position:absolute;inset:0;z-index:0;opacity:.16;background-size:cover;background-position:center}
.n-hero-pattern{position:absolute;inset:0;z-index:1;opacity:.04;background-image:repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 0,transparent 50%);background-size:26px 26px}
.n-hero-deco{position:absolute;width:440px;height:440px;border-radius:50%;background:var(--n-gold);opacity:.08;filter:blur(90px);top:-180px;left:-90px;z-index:1}
.n-hero-inner{position:relative;z-index:2;padding:92px 0 116px;max-width:820px}
.n-hero-eyebrow{display:inline-flex;align-items:center;gap:12px;margin-bottom:24px}
.n-hero-eyebrow .ln{width:34px;height:3px;background:var(--n-gold);border-radius:2px;flex-shrink:0}
.n-hero-eyebrow span{font-size:13px;font-weight:700;color:var(--n-gold);letter-spacing:.06em}
.n-hero h1{font-size:clamp(32px,5.2vw,56px);font-weight:800;color:#fff;line-height:1.14;letter-spacing:-.6px;margin-bottom:20px}
.n-hero p{font-size:clamp(15px,2vw,19px);color:rgba(255,255,255,.85);line-height:1.85;margin-bottom:36px;max-width:640px}
.n-hero-btns{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:44px}
.n-hero-trust{display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.14);padding-top:26px}
.n-hero-trust .it{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.82);font-size:13.5px;font-weight:600}
.n-hero-trust .it svg{width:20px;height:20px;color:var(--n-gold);flex-shrink:0}
.n-hero-trust .it.n-it-trust{background:linear-gradient(135deg,var(--n-gold),var(--n-gold-2));color:var(--n-gold-tx,#1a0e00);padding:7px 15px;border-radius:999px;font-weight:800;box-shadow:0 4px 16px rgba(212,175,55,.32)}
.n-hero-trust .it.n-it-trust svg{color:inherit;width:18px;height:18px}
.n-foot-trust{display:inline-flex;align-items:center;gap:8px;margin:4px 0 12px;padding:7px 14px;border-radius:999px;background:linear-gradient(135deg,var(--n-gold),var(--n-gold-2));color:var(--n-gold-tx,#1a0e00);font-size:12.5px;font-weight:800}
.n-foot-trust svg{width:17px;height:17px;flex-shrink:0}
.n-hero-wave{position:absolute;bottom:-1px;left:0;right:0;z-index:3;line-height:0;pointer-events:none}
.n-hero-wave svg{width:100%;height:64px;display:block}

/* ── brand logomark ── */
.n-brandmark,.n-brandmark-sm{border-radius:13px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.n-brandmark{width:50px;height:50px}
.n-brandmark-sm{width:48px;height:48px}
.n-brandmark img,.n-brandmark-sm img{width:100%;height:100%;object-fit:contain;background:var(--n-teal-soft);padding:4px}
.n-brandmark .n-logo-svg,.n-brandmark-sm .n-logo-svg{width:100%;height:100%;display:block}
.n-logo-chip{background:#fff;border:1px solid var(--n-line);box-shadow:0 1px 4px rgba(10,77,92,.08)}
.n-logo-chip img{background:#fff!important;padding:6px!important}

/* ── hero slider ── */
.n-hero-track{display:grid;position:relative;z-index:2}
.n-slide{grid-area:1/1;position:relative;opacity:0;visibility:hidden;transition:opacity .6s ease;pointer-events:none}
.n-slide.on{opacity:1;visibility:visible;pointer-events:auto}
.n-slide .n-hero-bg{opacity:.25}
.n-slide.has-img .n-hero-imgov{position:absolute;inset:0;z-index:1;background:linear-gradient(to right,rgba(10,77,92,.5) 0%,rgba(10,77,92,.82) 52%,rgba(7,53,64,.95) 100%)}
.n-slide.has-img h1,.n-slide.has-img p{text-shadow:0 2px 16px rgba(4,28,34,.55)}
.n-slide>.wrap{position:relative;z-index:2}
.n-hero-inner{position:relative;z-index:2;padding:80px 0 34px;max-width:820px}
.n-hero-btns{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:0}
.n-hero-trustwrap{position:relative;z-index:2;padding-bottom:52px}
.n-hero-trust{display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.16);padding-top:24px}
.n-hero-arrow{position:absolute;top:40%;z-index:4;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);backdrop-filter:blur(6px);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
.n-hero-arrow:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.65)}
.n-hero-arrow svg{width:22px;height:22px}
.n-hero-arrow.prev{left:24px}.n-hero-arrow.prev svg{transform:rotate(90deg)}
.n-hero-arrow.next{right:24px}.n-hero-arrow.next svg{transform:rotate(-90deg)}
.n-hero-dots{display:flex;gap:9px;justify-content:center;margin-bottom:22px}
.n-hero-dot{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,.32);cursor:pointer;transition:.22s;padding:0}
.n-hero-dot.on{background:var(--n-gold);width:26px;border-radius:5px}

/* ── National hero v2 — split layout, per-slide chip & seal, progress nav ── */
.n-hero{position:relative;overflow:hidden;color:#fff;isolation:isolate;background:var(--n-teal-2)}
.n-hero-bg2{position:absolute;inset:0;z-index:0;background:
  radial-gradient(60% 75% at 80% 6%,rgba(212,175,55,.20),transparent 60%),
  radial-gradient(55% 70% at 6% 96%,rgba(21,120,140,.5),transparent 60%),
  radial-gradient(120% 120% at 50% -10%,var(--n-teal),transparent 55%),
  linear-gradient(155deg,var(--n-teal-2) 0%,var(--n-teal) 55%,var(--n-teal-2) 100%)}
.n-hero-grain{position:absolute;inset:0;z-index:1;opacity:.5;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.4px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(120% 90% at 75% 18%,#000 35%,transparent 80%);
  mask-image:radial-gradient(120% 90% at 75% 18%,#000 35%,transparent 80%)}
.n-htrack{display:grid;position:relative;z-index:2;padding-block:clamp(40px,5vw,72px) 0}
.n-hslide{grid-area:1/1;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,68px);align-items:center;opacity:0;visibility:hidden;transition:opacity .55s ease;pointer-events:none}
.n-hslide.on{opacity:1;visibility:visible;pointer-events:auto}
.n-htext{min-width:0}
.n-hslide.on .n-htext{animation:nHeroRise .65s cubic-bezier(.22,.61,.36,1)}
@keyframes nHeroRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.n-heyebrow{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;padding:7px 15px 7px 8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;font-size:13px;font-weight:700;color:#e6c963;letter-spacing:.01em}
.n-heyebrow .ic{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(212,175,55,.2);color:#e6c963}
.n-heyebrow .ic svg{width:15px;height:15px}
.n-htext h1{font-size:clamp(30px,4.4vw,52px);font-weight:900;color:#fff;line-height:1.16;letter-spacing:-.5px;margin:0}
.n-htext>p{margin:20px 0 0;max-width:52ch;font-size:clamp(15px,1.5vw,19px);color:#d6e7ea;line-height:1.75}
.n-hcta{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.n-hpills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.n-hpill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#d6e7ea;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:8px 14px;border-radius:999px}
.n-hpill svg{width:15px;height:15px;color:#e6c963;flex:none}
.n-hmedia{position:relative}
.n-hslide.on .n-hmedia{animation:nHeroRise .65s cubic-bezier(.22,.61,.36,1) .08s backwards}
.n-hframe{position:relative;aspect-ratio:4/3.6;border-radius:28px;padding:10px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:0 40px 80px -30px rgba(0,0,0,.5);backdrop-filter:blur(2px)}
.n-hframe-img{width:100%;height:100%;border-radius:20px;background-size:cover;background-position:center;overflow:hidden}
.n-hframe-ph{width:100%;height:100%;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--n-teal) 0%,var(--n-teal-2) 100%);position:relative;overflow:hidden}
.n-hframe-ph svg{width:80px;height:80px;color:rgba(255,255,255,.22);position:relative;z-index:1}
.n-hframe-ph::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.4px);background-size:18px 18px}
.n-hchip{position:absolute;inset-block-end:-20px;inset-inline-start:-16px;padding:15px 20px;border-radius:18px;background:var(--n-ice);box-shadow:0 24px 60px -20px rgba(7,53,64,.5);display:flex;flex-direction:column;animation:nPopIn .5s cubic-bezier(.22,.61,.36,1) .4s backwards}
.n-hchip .n{font-size:30px;font-weight:900;color:#b8941f;line-height:1}
.n-hchip .l{font-size:13px;color:var(--n-ink-3);font-weight:600;margin-top:2px}
@keyframes nPopIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.n-hseal{position:absolute;top:-18px;inset-inline-end:-12px;z-index:3;display:flex;align-items:center;gap:11px;padding:11px 17px 11px 13px;background:var(--n-ice);border-radius:999px;box-shadow:0 24px 60px -20px rgba(7,53,64,.5);animation:nPopIn .5s cubic-bezier(.22,.61,.36,1) .35s backwards}
.n-hseal .ring{position:relative;width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--n-teal);color:#fff}
.n-hseal .ring>svg{width:20px;height:20px}
.n-hseal .ck{position:absolute;bottom:-3px;inset-inline-start:-3px;width:19px;height:19px;border-radius:50%;background:var(--n-gold);color:#2a2208;display:grid;place-items:center;border:2px solid var(--n-ice)}
.n-hseal .ck>svg{width:11px;height:11px}
.n-hseal .tx{display:flex;flex-direction:column;line-height:1.3}
.n-hseal .tx strong{font-size:14px;font-weight:800;color:var(--n-ink)}
.n-hseal .tx small{font-size:11px;color:var(--n-ink-3);font-weight:600}
.n-hctrl{position:relative;z-index:5;padding-block:28px 0;display:flex}
.n-hnav{display:inline-flex;align-items:center;gap:12px;padding:7px;padding-inline-end:16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.n-hnav-arrow{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);cursor:pointer;transition:.18s}
.n-hnav-arrow:hover{background:var(--n-gold);color:#2a2208;border-color:var(--n-gold)}
.n-hnav-arrow svg{width:18px;height:18px}
.n-hnav-arrow.prev svg{transform:rotate(90deg)}
.n-hnav-arrow.next svg{transform:rotate(-90deg)}
.n-hdots{display:flex;align-items:center;gap:7px;padding-inline:4px}
.n-hdot{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.32);transition:width .35s ease,background .35s;position:relative;overflow:hidden;padding:0;border:none;cursor:pointer}
.n-hdot.on{width:42px;background:rgba(255,255,255,.28)}
.n-hdot .prog{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--n-gold);border-radius:999px}
.n-hdot.on .prog{animation:nDotFill 6.5s linear forwards}
.n-hero.paused .n-hdot .prog{animation-play-state:paused}
@keyframes nDotFill{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){.n-hdot .prog{animation:none;width:100%}}
.n-hcount{color:rgba(255,255,255,.7);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.02em;direction:ltr}
.n-hcount b{color:#fff;font-weight:800}
@media(max-width:900px){
  .n-hslide{grid-template-columns:1fr;gap:34px}
  .n-hmedia{max-width:430px;margin-inline:auto;width:100%}
  .n-htext{text-align:center}
  .n-heyebrow,.n-hcta,.n-hpills{justify-content:center}
  .n-htext>p{margin-inline:auto}
  .n-hctrl{justify-content:center;padding-block:34px 0}
}

/* ── partners band (above footer) ── */
.n-partners-band{background:#fff;border-top:1px solid var(--n-line)}
.n-partners-band .n-partner{background:var(--n-ice);border:1px solid var(--n-line);border-radius:16px;padding:20px 22px;min-width:180px;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:.18s;text-align:center}
.n-partners-band .n-partner:hover{box-shadow:var(--shadow);border-color:var(--n-teal);transform:translateY(-3px)}
.n-partner-mark{width:46px;height:46px;border-radius:12px;background:var(--n-teal-soft);color:var(--n-teal);display:flex;align-items:center;justify-content:center;filter:grayscale(.2);transition:.18s}
.n-partners-band .n-partner:hover .n-partner-mark{background:var(--n-teal);color:#fff;filter:none}
.n-partner-mark svg{width:22px;height:22px}
.n-partner-nm{font-size:13px;font-weight:700;color:var(--n-ink-2);line-height:1.4}
.n-partners-band .n-partner img{max-height:50px;max-width:140px;object-fit:contain;filter:grayscale(1);opacity:.7;transition:.2s}
.n-partners-band .n-partner:hover img{filter:none;opacity:1}

/* ── Stats strip (light cards, gold numbers) ── */
.n-stats{background:var(--n-ice);padding:56px 0!important}
.n-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.n-stat{background:#fff;border:1px solid var(--n-line);border-radius:18px;padding:30px 22px 26px;text-align:center;transition:.22s;position:relative;overflow:hidden}
.n-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--n-teal),var(--n-gold));opacity:0;transition:.22s}
.n-stat:hover{box-shadow:var(--shadow);transform:translateY(-4px);border-color:transparent}
.n-stat:hover::before{opacity:1}
.n-stat-ic{width:50px;height:50px;border-radius:15px;background:var(--n-teal-soft);color:var(--n-teal);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;transition:.22s}
.n-stat-ic svg{width:25px;height:25px}
.n-stat:hover .n-stat-ic{background:var(--n-teal);color:#fff;transform:scale(1.08)}
.n-stat .n{font-size:clamp(30px,4vw,42px);font-weight:800;line-height:1;letter-spacing:-1px;color:var(--n-gold);font-variant-numeric:tabular-nums}
.n-stat .l{font-size:14px;color:var(--n-ink-2);margin-top:10px;font-weight:600}
/* stats style: dark */
.n-stats-dark{background:linear-gradient(135deg,var(--n-teal),var(--n-teal-2))!important}
.n-stats-dark h2{color:#fff!important}
.n-stats-dark .n-stat{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.n-stats-dark .n-stat::before{background:linear-gradient(90deg,var(--n-gold),var(--n-gold-2))}
.n-stats-dark .n-stat-ic{background:rgba(212,175,55,.18);color:var(--n-gold)}
.n-stats-dark .n-stat:hover .n-stat-ic{background:var(--n-gold);color:#2a2208}
.n-stats-dark .n-stat .l{color:rgba(255,255,255,.82)}
/* stats style: minimal */
.n-stats-minimal{background:var(--n-ice)!important}
.n-stats-minimal .n-stat{background:transparent;border:none;padding:14px}
.n-stats-minimal .n-stat::before{display:none}
.n-stats-minimal .n-stat:hover{box-shadow:none;transform:none}
.n-stats-minimal .n-stat-ic{background:transparent;color:var(--n-gold)}
.n-stats-minimal .n-stat:hover .n-stat-ic{background:transparent;transform:none}
.n-stats-minimal .n-stat .n{font-size:clamp(36px,5vw,52px)}
