<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">الموقع الرسمي</title>
<meta id="page-desc" name="description" content="">
<meta property="og:type" content="website">
<meta id="og-title" property="og:title" content="">
<meta id="og-desc" property="og:description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1e2a4a;--brand-2:#162035;--brand-soft:#f3f5f9;
  --accent:#1d9b8a;--accent-2:#15806f;
  --fg:#141a26;--fg-2:#3d4757;--fg-3:#6b7585;--fg-4:#9aa3b2;
  --bg:#ffffff;--bg-2:#f7f9fc;--line:#e7ebf1;
  --radius:18px;--shadow:0 4px 24px rgba(20,30,55,.08);--shadow-lg:0 18px 50px rgba(20,30,55,.16);
  --maxw:1180px;
}
/* theme palettes (brand color) */
[data-theme="navy"]{--brand:#1e2a4a;--brand-2:#141d33}
[data-theme="teal"]{--brand:#0d7e6e;--brand-2:#0a5f53}
[data-theme="emerald"]{--brand:#047857;--brand-2:#035c43}
[data-theme="royal"]{--brand:#1d4ed8;--brand-2:#1740b0}
[data-theme="violet"]{--brand:#6d28d9;--brand-2:#581fb0}
[data-theme="maroon"]{--brand:#9f1239;--brand-2:#7d0e2d}
[data-theme="amber"]{--brand:#b45309;--brand-2:#8f4107}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--fg);font-feature-settings:'lnum' 1;-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:.18s;white-space:nowrap}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 8px 22px rgba(29,155,138,.35)}
.btn-white{background:#fff;color:var(--brand)}
.btn-white:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.2)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-outline{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* ── Top bar / Nav ── */
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);transition:.2s}
.nav-inner{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-logo{width:46px;height:46px;border-radius:12px;object-fit:contain;background:var(--brand-soft);padding:3px}
.brand-abbr{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.brand-tx b{display:block;font-size:17px;font-weight:800;color:var(--brand);line-height:1.2}
.brand-tx span{font-size:11.5px;color:var(--fg-3)}
.nav-links{display:flex;gap:4px;margin-right:auto}
.nav-links a{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg-2);transition:.15s}
.nav-links a:hover{background:var(--brand-soft);color:var(--brand)}
.nav-cta{display:flex;align-items:center;gap:10px}
.nav-burger{display:none;width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;align-items:center;justify-content:center;color:var(--brand)}
.nav-burger svg{width:22px;height:22px}

/* ── Hero ── */
.hero{position:relative;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%)}
.hero-bg{position:absolute;inset:0;z-index:0;opacity:.22;background-size:cover;background-position:center}
.hero-ov{position:absolute;inset:0;z-index:1;background:linear-gradient(135deg,rgba(20,29,51,.78),rgba(20,29,51,.55))}
.hero-deco{position:absolute;z-index:1;border-radius:50%;filter:blur(60px);opacity:.4}
.hero-deco.a{width:340px;height:340px;background:var(--accent);top:-120px;left:-80px}
.hero-deco.b{width:300px;height:300px;background:#fff;bottom:-140px;right:-60px;opacity:.12}
.hero-inner{position:relative;z-index:2;padding:96px 0 104px;max-width:760px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:30px;margin-bottom:22px}
.hero-badge .pulse{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;line-height:1.18;letter-spacing:-.5px;margin-bottom:18px}
.hero p{font-size:clamp(16px,2vw,19px);color:rgba(255,255,255,.85);line-height:1.8;margin-bottom:32px;max-width:620px}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.hero-wave{position:absolute;bottom:-1px;left:0;right:0;z-index:2;line-height:0}
.hero-wave svg{width:100%;height:60px;display:block}

/* ── Sections ── */
section{padding:80px 0}
.sec-head{text-align:center;max-width:640px;margin:0 auto 52px}
.sec-eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin-bottom:12px;position:relative;padding:0 4px}
.sec-eyebrow::before,.sec-eyebrow::after{content:'';position:absolute;top:50%;width:24px;height:2px;background:var(--accent);opacity:.4}
.sec-eyebrow::before{right:-30px}.sec-eyebrow::after{left:-30px}
.sec-title{font-size:clamp(24px,3.4vw,36px);font-weight:800;color:var(--brand);letter-spacing:-.4px;margin-bottom:14px}
.sec-sub{font-size:16px;color:var(--fg-3);line-height:1.8}
.alt{background:var(--bg-2)}

/* ── About ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about-img{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:4/3;background:var(--brand-soft)}
.about-img img{width:100%;height:100%;object-fit:cover}
.about-tx h2{font-size:30px;font-weight:800;color:var(--brand);margin-bottom:18px;letter-spacing:-.3px}
.about-tx p{font-size:15.5px;color:var(--fg-2);line-height:1.95;white-space:pre-line;margin-bottom:16px}
.vm-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.vm-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.vm-card .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.vm-card .ic svg{width:22px;height:22px}
.vm-card h4{font-size:16px;font-weight:800;color:var(--brand);margin-bottom:8px}
.vm-card p{font-size:14px;color:var(--fg-3);line-height:1.8;white-space:pre-line;margin:0}

/* ── Stats ── */
.stats{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:30px;text-align:center}
.stat .n{font-size:clamp(34px,5vw,52px);font-weight:800;line-height:1;letter-spacing:-1px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.7));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:15px;color:rgba(255,255,255,.8);margin-top:10px;font-weight:500}

/* ── Values ── */
.val-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.val-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px 26px;transition:.2s;position:relative;overflow:hidden}
.val-card::before{content:'';position:absolute;top:0;right:0;width:100%;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:.3s}
.val-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.val-card:hover::before{transform:scaleX(1)}
.val-num{font-size:14px;font-weight:800;color:var(--accent);background:var(--brand-soft);width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.val-card h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px}
.val-card p{font-size:14.5px;color:var(--fg-3);line-height:1.85}

/* ── Programs ── */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px}
.prog-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.2s;display:flex;flex-direction:column}
.prog-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.prog-img{aspect-ratio:16/10;background:var(--brand-soft);overflow:hidden;position:relative}
.prog-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s;z-index:1}
.prog-card:hover .prog-img img{transform:scale(1.06)}
.ph-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ph-ico svg{width:46px;height:46px;opacity:.35}
.prog-body{padding:24px;flex:1;display:flex;flex-direction:column}
.prog-body h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px}
.prog-body p{font-size:14.5px;color:var(--fg-3);line-height:1.85;white-space:pre-line}

/* ── News ── */
.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px}
.news-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.news-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.news-img{aspect-ratio:16/9;background:var(--brand-soft);overflow:hidden;position:relative}
.news-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s;z-index:1}
.news-card:hover .news-img img{transform:scale(1.06)}
.news-body{padding:22px;flex:1;display:flex;flex-direction:column}
.news-date{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.news-date svg{width:15px;height:15px;flex-shrink:0}
.news-body h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px;line-height:1.4}
.news-body p{font-size:14px;color:var(--fg-3);line-height:1.8;flex:1}
.news-more{font-size:13.5px;font-weight:700;color:var(--accent);margin-top:14px;display:inline-flex;align-items:center;gap:6px}

/* ── Board ── */
.board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.board-card{text-align:center}
.board-ava{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;object-fit:cover;background:var(--brand-soft);border:4px solid #fff;box-shadow:var(--shadow)}
.board-ava.ph{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:var(--accent)}
.board-card h4{font-size:17px;font-weight:800;color:var(--brand);margin-bottom:4px}
.board-card span{font-size:13.5px;color:var(--fg-3)}

/* ── Governance ── */
.gov-cats{display:flex;flex-direction:column;gap:30px}
.gov-cat-title{font-size:16px;font-weight:800;color:var(--brand);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.gov-cat-title .b{width:5px;height:20px;border-radius:3px;background:var(--accent)}
.gov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gov-doc{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.18s}
.gov-doc:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.gov-doc .ic{width:44px;height:44px;border-radius:11px;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gov-doc .ic svg{width:22px;height:22px}
.gov-doc .tx{flex:1;min-width:0}
.gov-doc .tx b{display:block;font-size:14.5px;font-weight:700;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gov-doc .tx span{font-size:12px;color:var(--fg-4)}
.gov-doc .dl{color:var(--accent);flex-shrink:0}
.gov-doc .dl svg{width:20px;height:20px}

/* ── Partners ── */
.partners-grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:center}
.partner{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 28px;min-width:150px;min-height:88px;display:flex;align-items:center;justify-content:center;transition:.18s}
.partner:hover{box-shadow:var(--shadow)}
.partner img{max-height:48px;max-width:130px;object-fit:contain;filter:grayscale(1);opacity:.7;transition:.2s}
.partner:hover img{filter:none;opacity:1}
.partner span{font-size:15px;font-weight:700;color:var(--fg-3)}

/* ── FAQ ── */
.faq-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.faq-item{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s}
.faq-item.open{box-shadow:var(--shadow);border-color:var(--accent)}
.faq-q{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;cursor:pointer;font-size:15.5px;font-weight:700;color:var(--brand)}
.faq-q .chev{width:24px;height:24px;flex-shrink:0;color:var(--accent);transition:.25s}
.faq-item.open .chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:14.5px;color:var(--fg-2);line-height:1.9}
.faq-a div{padding:0 22px 20px;white-space:pre-line}

/* ── Donation CTA ── */
.donate{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:24px;padding:56px 40px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.donate::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.1);top:-150px;right:-80px}
.donate-ic{position:relative;width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.donate-ic svg{width:36px;height:36px}
.donate h2{position:relative;font-size:clamp(26px,4vw,38px);font-weight:800;margin-bottom:14px}
.donate p{position:relative;font-size:17px;color:rgba(255,255,255,.9);max-width:560px;margin:0 auto 28px;line-height:1.8}
.donate-account{position:relative;display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;direction:ltr;margin-top:18px}
.donate-account svg{width:18px;height:18px;flex-shrink:0}

/* ── Contact ── */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.contact-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;align-items:center;gap:16px;margin-bottom:14px;transition:.18s}
.contact-card:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.contact-card .ic{width:50px;height:50px;border-radius:13px;background:var(--brand-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-card .ic svg{width:24px;height:24px}
.contact-card .tx b{display:block;font-size:13px;color:var(--fg-4);font-weight:600;margin-bottom:3px}
.contact-card .tx span{font-size:15px;font-weight:700;color:var(--brand);direction:ltr;unicode-bidi:plaintext}
.contact-map{border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:300px;height:100%}
.contact-map iframe{width:100%;height:100%;min-height:300px;border:0}
.contact-social{display:flex;gap:12px;margin-top:8px}
.contact-social a{width:46px;height:46px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;transition:.18s}
.contact-social a:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}
.contact-social svg{width:21px;height:21px}

/* ── Footer ── */
footer{background:var(--brand-2);color:rgba(255,255,255,.65);padding:56px 0 0}
.foot-top{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.1)}
.foot-brand b{font-size:20px;font-weight:800;color:#fff;display:block;margin-bottom:12px}
.foot-brand p{font-size:14px;line-height:1.8;max-width:320px}
.foot-col h5{font-size:14px;font-weight:700;color:#fff;margin-bottom:16px}
.foot-col a{display:block;font-size:13.5px;color:rgba(255,255,255,.6);padding:5px 0;transition:.15s}
.foot-col a:hover{color:#fff;padding-right:5px}
.foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;flex-wrap:wrap;font-size:13px}
.foot-buad{display:inline-flex;align-items:center;gap:7px;color:rgba(255,255,255,.8);font-weight:600}
.foot-buad b{color:#fff;font-weight:800}

/* ── Article / Page view ── */
.article{max-width:820px;margin:0 auto;padding:60px 0}
.article-back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:28px;cursor:pointer}
.article-date{font-size:13.5px;color:var(--accent);font-weight:700;margin-bottom:12px}
.article h1{font-size:clamp(26px,4vw,40px);font-weight:800;color:var(--brand);line-height:1.3;margin-bottom:24px;letter-spacing:-.3px}
.article-hero{width:100%;border-radius:var(--radius);margin-bottom:30px;max-height:420px;object-fit:cover}
.article-body{font-size:16.5px;color:var(--fg-2);line-height:2;white-space:pre-line}

/* ── States ── */
.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;gap:16px;padding:40px}
.state-ic{width:72px;height:72px;border-radius:20px;background:var(--brand-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.state-ic svg{width:36px;height:36px}
.state-title{font-size:23px;font-weight:800;color:var(--brand)}
.state-sub{font-size:14.5px;color:var(--fg-3);max-width:420px;line-height:1.7}
@keyframes spin{to{transform:rotate(360deg)}}

/* preview banner */
.pv-banner{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--brand);color:#fff;padding:11px 22px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px}
.pv-banner .d{width:8px;height:8px;border-radius:50%;background:#fbbf24;animation:pulse 2s infinite}

/* mobile menu */
.mmenu{position:fixed;inset:0;z-index:300;background:rgba(20,29,51,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.2s}
.mmenu.open{opacity:1;pointer-events:auto}
.mmenu-panel{position:absolute;top:0;right:0;bottom:0;width:min(300px,80vw);background:#fff;padding:24px;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;gap:6px}
.mmenu.open .mmenu-panel{transform:none}
.mmenu-panel a{padding:13px 14px;border-radius:10px;font-size:15px;font-weight:600;color:var(--fg-2)}
.mmenu-panel a:hover{background:var(--brand-soft);color:var(--brand)}
.mmenu-close{align-self:flex-start;background:var(--brand-soft);border:none;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--brand);margin-bottom:10px}

@media(max-width:900px){
  .about-grid,.contact-grid{grid-template-columns:1fr;gap:32px}
  .vm-grid{grid-template-columns:1fr}
  .foot-top{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .nav-links{display:none}
  .nav-burger{display:flex}
  .nav-cta .btn{display:none}
  section{padding:56px 0}
  .hero-inner{padding:64px 0 80px}
  .foot-top{grid-template-columns:1fr;gap:28px}
  .foot-bottom{flex-direction:column;text-align:center}
}

/* ═══════════════════════════════════════════════
   MODERN THEME — layout_theme: 'modern'
   ═══════════════════════════════════════════════ */
body.theme-modern{--radius:20px;--shadow:0 6px 28px rgba(20,30,55,.09);--shadow-lg:0 20px 56px rgba(20,30,55,.17)}

/* Modern Nav */
body.theme-modern .nav{background:#fff;border-bottom:none;box-shadow:0 1px 0 var(--line)}
body.theme-modern .nav-inner{height:76px}
body.theme-modern .brand-abbr{border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--accent))}

/* Modern Hero — diagonal split */
.m-hero{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden;background:var(--brand)}
.m-hero-bg{position:absolute;inset:0;z-index:0;opacity:.18;background-size:cover;background-position:center}
.m-hero-shape{position:absolute;top:0;left:0;bottom:0;width:50%;background:linear-gradient(160deg,var(--accent) 0%,var(--brand) 100%);clip-path:polygon(0 0,85% 0,100% 100%,0 100%);z-index:1;opacity:.55}
.m-hero-deco-a{position:absolute;width:480px;height:480px;border-radius:50%;border:1.5px solid rgba(255,255,255,.08);top:-160px;right:-100px;z-index:1}
.m-hero-deco-b{position:absolute;width:280px;height:280px;border-radius:50%;border:1px solid rgba(255,255,255,.06);bottom:-80px;left:22%;z-index:1}
.m-hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;padding:100px 0 110px;width:100%}
.m-hero-tx{color:#fff}
.m-hero-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.92);font-size:12.5px;font-weight:700;padding:7px 18px;border-radius:30px;margin-bottom:26px;letter-spacing:.03em}
.m-hero-pill .dot{width:7px;height:7px;border-radius:50%;background:#34d399;animation:pulse 2s infinite}
.m-hero-tx h1{font-size:clamp(32px,5vw,58px);font-weight:800;line-height:1.14;letter-spacing:-.6px;margin-bottom:20px}
.m-hero-tx p{font-size:clamp(15px,2vw,18px);color:rgba(255,255,255,.82);line-height:1.85;margin-bottom:34px;max-width:520px}
.m-hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.m-hero-vis{display:flex;align-items:center;justify-content:center;position:relative}
.m-hero-card{background:rgba(255,255,255,.1);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:28px;color:#fff;width:100%;max-width:340px}
.m-hero-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.m-hero-stat{background:rgba(255,255,255,.08);border-radius:14px;padding:16px;text-align:center}
.m-hero-stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.m-hero-stat .l{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}

/* Modern About */
.m-about{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.m-about-tx .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(29,155,138,.1);color:var(--accent);font-size:12.5px;font-weight:800;padding:6px 16px;border-radius:20px;margin-bottom:20px;letter-spacing:.04em}
.m-about-tx h2{font-size:clamp(26px,3.5vw,38px);font-weight:800;color:var(--brand);line-height:1.22;letter-spacing:-.4px;margin-bottom:18px}
.m-about-tx p{font-size:15.5px;color:var(--fg-2);line-height:1.95;white-space:pre-line;margin-bottom:20px}
.m-about-img{position:relative}
.m-about-img-main{border-radius:28px;overflow:hidden;aspect-ratio:4/3;background:var(--brand-soft);box-shadow:var(--shadow-lg)}
.m-about-img-main img{width:100%;height:100%;object-fit:cover}
.m-about-badge{position:absolute;bottom:-16px;right:-16px;background:var(--brand);color:#fff;border-radius:18px;padding:16px 22px;box-shadow:var(--shadow-lg)}
.m-about-badge .n{font-size:28px;font-weight:800;line-height:1}
.m-about-badge .l{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}
.m-vm{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.m-vm-card{background:var(--brand-soft);border-radius:16px;padding:20px;display:flex;gap:14px;align-items:flex-start}
.m-vm-ic{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.m-vm-ic svg{width:20px;height:20px}
.m-vm-card h4{font-size:15px;font-weight:800;color:var(--brand);margin-bottom:5px}
.m-vm-card p{font-size:13px;color:var(--fg-3);line-height:1.75;white-space:pre-line;margin:0}

/* Modern Stats strip */
.m-stats{background:linear-gradient(135deg,var(--brand) 0%,var(--accent) 100%);padding:56px 0}
.m-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0}
.m-stat{text-align:center;color:#fff;padding:10px 20px;position:relative}
.m-stat+.m-stat::before{content:'';position:absolute;right:0;top:15%;height:70%;width:1px;background:rgba(255,255,255,.2)}
.m-stat .n{font-size:clamp(36px,5vw,54px);font-weight:800;line-height:1;letter-spacing:-1.5px}
.m-stat .l{font-size:14px;color:rgba(255,255,255,.8);margin-top:10px;font-weight:500}

/* Modern Programs */
.m-prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px}
.m-prog-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.22s;display:flex;flex-direction:column;position:relative}
.m-prog-card::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--brand))}
.m-prog-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-5px)}
.m-prog-img{aspect-ratio:16/9;background:var(--brand-soft);overflow:hidden;position:relative}
.m-prog-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s;z-index:1}
.m-prog-card:hover .m-prog-img img{transform:scale(1.06)}
.m-prog-num{position:absolute;bottom:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.m-prog-body{padding:24px;flex:1;display:flex;flex-direction:column}
.m-prog-body h4{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:10px}
.m-prog-body p{font-size:14px;color:var(--fg-3);line-height:1.85;white-space:pre-line;flex:1}

/* Modern News — featured + grid */
.m-news-featured{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;margin-bottom:26px}
.m-news-big{border-radius:var(--radius);overflow:hidden;cursor:pointer;background:#fff;border:1px solid var(--line);transition:.22s;display:flex;flex-direction:column}
.m-news-big:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.m-news-big-img{aspect-ratio:16/9;background:var(--brand-soft);overflow:hidden;position:relative}
.m-news-big-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}
.m-news-big:hover .m-news-big-img img{transform:scale(1.04)}
.m-news-big-body{padding:24px;flex:1;display:flex;flex-direction:column}
.m-news-big-body h4{font-size:20px;font-weight:800;color:var(--brand);margin-bottom:10px;line-height:1.35}
.m-news-big-body p{font-size:14.5px;color:var(--fg-3);line-height:1.8;flex:1}
.m-news-sm-list{display:flex;flex-direction:column;gap:12px}
.m-news-sm{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.18s;align-items:flex-start}
.m-news-sm:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.m-news-sm-img{width:72px;height:72px;border-radius:10px;background:var(--brand-soft);overflow:hidden;flex-shrink:0;position:relative}
.m-news-sm-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m-news-sm h5{font-size:14px;font-weight:700;color:var(--brand);margin-bottom:5px;line-height:1.4}
.m-news-sm span{font-size:12px;color:var(--accent);font-weight:600}
.m-news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}

/* Modern Board */
.m-board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.m-board-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center;transition:.2s;position:relative;overflow:hidden}
.m-board-card::after{content:'';position:absolute;bottom:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--brand))}
.m-board-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.m-board-ava{width:90px;height:90px;border-radius:50%;margin:0 auto 16px;object-fit:cover;background:var(--brand-soft);border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.m-board-ava.ph{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--accent)}
.m-board-card h4{font-size:16px;font-weight:800;color:var(--brand);margin-bottom:4px}
.m-board-card span{font-size:13px;color:var(--fg-3)}

/* Modern Values */
.m-val-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.m-val-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;transition:.2s;overflow:hidden}
.m-val-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--brand));border-radius:0 var(--radius) var(--radius) 0}
.m-val-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.m-val-num{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;margin-bottom:18px}
.m-val-card h4{font-size:17px;font-weight:800;color:var(--brand);margin-bottom:9px}
.m-val-card p{font-size:14px;color:var(--fg-3);line-height:1.85}

/* Modern Donation CTA */
.m-donate{position:relative;border-radius:28px;overflow:hidden;background:var(--brand);color:#fff;padding:64px 40px;text-align:center}
.m-donate::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;background:var(--accent);opacity:.2;top:-200px;left:-150px}
.m-donate::after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-140px;right:-60px}
.m-donate-inner{position:relative;z-index:1}
.m-donate-ic{width:80px;height:80px;border-radius:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.m-donate-ic svg{width:40px;height:40px}
.m-donate h2{font-size:clamp(26px,4vw,40px);font-weight:800;margin-bottom:14px}
.m-donate p{font-size:17px;color:rgba(255,255,255,.88);max-width:560px;margin:0 auto 30px;line-height:1.85}

/* Modern Footer */
.m-footer{background:var(--brand);color:rgba(255,255,255,.65);padding:60px 0 0}
.m-foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:48px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.1)}
.m-foot-brand .logo{font-size:24px;font-weight:800;color:#fff;margin-bottom:14px}
.m-foot-brand p{font-size:14px;line-height:1.85;max-width:300px}
.m-foot-col h5{font-size:14px;font-weight:800;color:rgba(255,255,255,.9);margin-bottom:18px;letter-spacing:.02em}
.m-foot-col a{display:block;font-size:13.5px;color:rgba(255,255,255,.55);padding:6px 0;transition:.15s}
.m-foot-col a:hover{color:#fff;padding-right:6px}
.m-foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0;font-size:13px;flex-wrap:wrap}
.m-foot-buad{display:inline-flex;align-items:center;gap:7px;color:rgba(255,255,255,.8);font-weight:600}
.m-foot-buad b{color:#fff;font-weight:800}

@media(max-width:900px){
  .m-hero-inner{grid-template-columns:1fr;gap:40px}
  .m-hero-vis{display:none}
  .m-about{grid-template-columns:1fr}
  .m-news-featured{grid-template-columns:1fr}
  .m-foot-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .m-hero{min-height:auto}
  .m-hero-inner{padding:80px 0 90px}
  .m-vm{grid-template-columns:1fr}
  .m-foot-grid{grid-template-columns:1fr;gap:28px}
  .m-foot-bottom{flex-direction:column;text-align:center}
}

/* ═══════════════════════════════════════════════
   PREMIUM THEME — layout_theme: 'premium'
   ═══════════════════════════════════════════════ */
body.theme-premium{--radius:16px;--shadow:0 4px 20px rgba(20,30,55,.07);--shadow-lg:0 16px 48px rgba(20,30,55,.14);--shadow-xl:0 32px 80px rgba(20,30,55,.20)}

.p-prog-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s;z-index:1}
.p-prog-card:hover .p-prog-img img{transform:scale(1.07)}
.p-prog-ov{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(14,20,40,.9) 0%,rgba(14,20,40,.18) 55%,transparent 100%)}
.p-prog-num{position:absolute;top:14px;right:14px;z-index:3;width:36px;height:36px;background:var(--accent);border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.p-prog-img-title{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:18px 20px 16px;color:#fff}
.p-prog-img-title h4{font-size:18px;font-weight:800;line-height:1.3}
.p-prog-body{padding:18px 20px;background:#fff;flex:1;border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
.p-prog-body p{font-size:14px;color:var(--fg-3);line-height:1.85;white-space:pre-line;margin:0}

/* Premium News */
.p-news-lead{display:grid;grid-template-columns:1.55fr 1fr;gap:26px;margin-bottom:26px}
.p-news-big{cursor:pointer;border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow);transition:.22s;display:flex;flex-direction:column}
.p-news-big:hover{box-shadow:var(--shadow-xl);transform:translateY(-4px)}
.p-news-big-img{aspect-ratio:16/9;background:var(--brand-soft);position:relative;overflow:hidden}
.p-news-big-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}
.p-news-big:hover .p-news-big-img img{transform:scale(1.04)}
.p-news-big-body{padding:28px;flex:1;display:flex;flex-direction:column}
.p-news-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--accent);background:rgba(29,155,138,.1);padding:4px 10px;border-radius:6px;margin-bottom:12px}
.p-news-big-body h3{font-size:clamp(18px,2.2vw,24px);font-weight:800;color:var(--brand);line-height:1.3;margin-bottom:12px;letter-spacing:-.3px}
.p-news-big-body p{font-size:15px;color:var(--fg-3);line-height:1.8;flex:1}
.p-news-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-4);margin-top:14px;font-weight:600}
.p-news-meta svg{width:15px;height:15px;flex-shrink:0;color:var(--accent)}
.p-news-side{display:flex;flex-direction:column;gap:13px}
.p-news-sm{display:flex;gap:14px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.18s;align-items:flex-start}
.p-news-sm:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.p-news-sm-img{width:78px;height:70px;border-radius:10px;background:var(--brand-soft);overflow:hidden;flex-shrink:0;position:relative}
.p-news-sm-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-news-sm h5{font-size:14px;font-weight:700;color:var(--brand);line-height:1.4;margin-bottom:5px}
.p-news-sm span{font-size:12px;color:var(--fg-4);font-weight:500}
.p-news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.p-news-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.p-news-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px)}
.p-news-card-img{aspect-ratio:16/9;background:var(--brand-soft);position:relative;overflow:hidden}
.p-news-card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}
.p-news-card:hover .p-news-card-img img{transform:scale(1.06)}
.p-news-card-body{padding:20px;flex:1;display:flex;flex-direction:column}
.p-news-card-body h4{font-size:17px;font-weight:800;color:var(--brand);line-height:1.4;margin-bottom:8px}
.p-news-card-body p{font-size:14px;color:var(--fg-3);line-height:1.8;flex:1}

/* Premium Board */
.p-board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
.p-board-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;padding-bottom:24px;text-align:center;transition:.22s}
.p-board-card:hover{box-shadow:var(--shadow-xl);transform:translateY(-5px)}
.p-board-header{height:72px;background:linear-gradient(135deg,var(--brand),var(--accent))}
.p-board-ava{width:90px;height:90px;border-radius:50%;margin:0 auto;display:block;object-fit:cover;background:var(--brand-soft);border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.14);position:relative;z-index:1;margin-top:-45px}
.p-board-ava.ph{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--accent)}
.p-board-card h4{font-size:17px;font-weight:800;color:var(--brand);margin:14px 16px 5px;line-height:1.25}
.p-board-badge{display:inline-block;margin-top:8px;padding:5px 14px;background:var(--brand-soft);color:var(--accent);font-size:12px;font-weight:700;border-radius:20px}

/* Premium Donate */
.p-donate{background:var(--brand);border-radius:28px;padding:72px 48px;text-align:center;position:relative;overflow:hidden;color:#fff}
.p-donate::before{content:'';position:absolute;width:480px;height:480px;border-radius:50%;background:var(--accent);opacity:.12;top:-240px;right:-160px;filter:blur(60px)}
.p-donate::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.04);bottom:-180px;left:-100px}
.p-donate-inner{position:relative;z-index:1}
.p-donate-ic{width:88px;height:88px;border-radius:26px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 28px}
.p-donate-ic svg{width:44px;height:44px}
.p-donate h2{font-size:clamp(28px,4.5vw,44px);font-weight:800;margin-bottom:16px;letter-spacing:-.5px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.78));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.p-donate p{font-size:17px;color:rgba(255,255,255,.8);max-width:560px;margin:0 auto 32px;line-height:1.85}
.p-donate-iban{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;direction:ltr;margin-top:16px}
.p-donate-iban svg{width:17px;height:17px;opacity:.7;flex-shrink:0}

/* Premium Footer */
.p-footer{background:#0d1628;color:rgba(255,255,255,.5);padding:72px 0 0}
.p-foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:56px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.07)}
.p-foot-logo{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.p-foot-logo .abbr{width:46px;height:46px;border-radius:13px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.p-foot-logo b{font-size:20px;font-weight:800;color:#fff}
.p-foot-brand p{font-size:14px;line-height:1.85;max-width:300px}
.p-foot-social{display:flex;gap:10px;margin-top:20px}
.p-foot-social a{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);transition:.18s}
.p-foot-social a:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px)}
.p-foot-social svg{width:18px;height:18px}
.p-foot-col h5{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.1em;margin-bottom:18px}
.p-foot-col a{display:block;font-size:14px;color:rgba(255,255,255,.5);padding:6px 0;transition:.15s}
.p-foot-col a:hover{color:#fff;padding-right:6px}
.p-foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0;font-size:13px;flex-wrap:wrap}
.p-foot-buad{display:inline-flex;align-items:center;gap:7px;color:rgba(255,255,255,.55);font-weight:600}

  .p-hero-inner{grid-template-columns:1fr;gap:40px}
  .p-hero-vis{display:none}
  .p-about{grid-template-columns:1fr;gap:40px}
  .p-about-img{display:none}
  .p-news-lead{grid-template-columns:1fr}
  .p-foot-grid{grid-template-columns:1fr 1fr;gap:36px}
}

  .p-hero{min-height:auto}
  .p-hero-inner{padding:80px 0 100px}
  .p-vm{grid-template-columns:1fr}
  .p-stats-grid{grid-template-columns:1fr 1fr}
  .p-foot-grid{grid-template-columns:1fr;gap:30px}
  .p-foot-bottom{flex-direction:column;text-align:center}
}

</head>
<body>
<div id="root"></div>
<div class="mmenu" id="mmenu" onclick="if(event.target===this)closeMenu()"><div class="mmenu-panel" id="mmenu-panel"></div></div>

<script>
var API = '/api';
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function attr(s){ return (s==null?'':String(s)).replace(/"/g,'&quot;'); }
function imgToAbbr(el,cls){ var d=document.createElement('div'); d.className=cls; d.textContent=el.getAttribute('data-letter')||''; el.replaceWith(d); }
function getParam(k){ var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)')); return m?decodeURIComponent(m[1]):null; }
function isPreview(){ return /[?&]preview=1/.test(location.search); }

var CFG = null, ORGID = null, DRAFT = false;
function layoutTheme(){ return CFG.layout_theme || 'classic'; }

/* ── Boot ── */
(function init(){
  ORGID = getParam('org');
  if(!ORGID){ stateError('الرابط غير صحيح','لم يُحدَّد معرّف الجمعية في الرابط.'); return; }
  stateLoading();
  if(isPreview()){
    var tk=null; try{ tk=localStorage.getItem('buad_org_jwt'); }catch(e){}
    if(tk){
      fetch(API+'/org/website',{headers:{'Authorization':'Bearer '+tk}})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(d){ DRAFT=!d.published; CFG=d.config||{}; boot(); })
        .catch(function(){ loadPublic(); });
      return;
    }
  }
  loadPublic();
})();

function loadPublic(){
  fetch(API+'/public/org-site/'+encodeURIComponent(ORGID))
    .then(function(r){
      if(r.status===404){ return r.json().then(function(j){
        if(j&&j.error==='not_published') stateError('الموقع لم يُنشر بعد','فعّل مفتاح «نشر الموقع» ثم اضغط «حفظ التغييرات» من بوابة جمعيتك.');
        else stateError('الموقع غير متاح','تأكد من تفعيل الموقع من إدارة بُعد ومن صحة الرابط.');
        throw 'done'; }); }
      if(!r.ok) throw 0; return r.json();
    })
    .then(function(d){ if(d){ CFG=d.config||{}; boot(); } })
    .catch(function(e){ if(e!=='done') stateError('تعذّر تحميل الموقع','حدث خطأ غير متوقع، حاول لاحقاً.'); });
}

function boot(){
  applyMeta();
  window.addEventListener('hashchange', route);
  route();
  if(DRAFT){ var b=document.createElement('div'); b.className='pv-banner'; b.innerHTML='<span class="d"></span>وضع المعاينة — نسخة مسودة لم تُنشر للعامة'; document.body.appendChild(b); }
}

/* ── helpers to read config ── */
function brandName(){ var b=CFG.brand||{}; return b.name||CFG.name||'جمعيتنا'; }
function theme(){ return CFG.theme || (CFG.brand&&CFG.brand.theme) || 'navy'; }
function visible(key){ var s=CFG.sections||{}; if(s[key]===undefined) return key!=='donation'; return !!s[key]; }
function arr(k){ return Array.isArray(CFG[k])?CFG[k]:[]; }

function applyMeta(){
  var seo=CFG.seo||{}; var name=brandName();
  var title=seo.title||(name+' | الموقع الرسمي');
  var desc=seo.desc||(CFG.brand&&CFG.brand.tagline)||(CFG.hero&&CFG.hero.subtitle)||'';
  document.getElementById('page-title').textContent=title;
  document.getElementById('page-desc').content=desc;
  document.getElementById('og-title').content=title;
  document.getElementById('og-desc').content=desc;
  var ac=CFG.brand&&CFG.brand.accent;
  document.body.setAttribute('data-theme', theme());
  if(layoutTheme()==='modern') document.body.classList.add('theme-modern');
  if(layoutTheme()==='premium') document.body.classList.add('theme-premium');
  if(ac){ document.documentElement.style.setProperty('--accent',ac); }
}

/* ── Router ── */
function route(){
  var h=location.hash.replace(/^#\/?/,'');
  window.scrollTo(0,0);
  if(h.indexOf('news/')===0){ var id=h.slice(5); return renderArticle(id); }
  if(h.indexOf('page/')===0){ var sl=h.slice(5); return renderPage(sl); }
  renderHome();
  if(h){ var t=document.getElementById(h); if(t) setTimeout(function(){ t.scrollIntoView({behavior:'smooth'}); },60); }
}

/* ── Shared chrome ── */
function navHtml(){
  var b=CFG.brand||{}; var name=brandName();
  var logo = b.logo_url ? '<img src="'+attr(b.logo_url)+'" class="brand-logo" data-letter="'+attr(name.charAt(0))+'" onerror="imgToAbbr(this,\'brand-abbr\')">' : '<div class="brand-abbr">'+esc(name.charAt(0))+'</div>';
  var links=[];
  if(visible('about')) links.push(['من نحن','#about']);
  if(visible('programs')&&arr('programs').length) links.push(['البرامج','#programs']);
  if(visible('news')&&arr('news').length) links.push(['الأخبار','#news']);
  if(visible('governance')&&arr('governance').length) links.push(['الحوكمة','#governance']);
  if(visible('contact')) links.push(['تواصل معنا','#contact']);
  var linksHtml=links.map(function(l){ return '<a href="'+l[1]+'">'+l[0]+'</a>'; }).join('');
  var don=CFG.donation||{}; var donate = (visible('donation')&&(don.url||don.title)) ? '<a class="btn btn-accent" href="'+attr(don.url||'#donate')+'"'+(don.url?' target="_blank" rel="noopener"':'')+'>تبرّع الآن</a>' : '';
  return '<nav class="nav"><div class="wrap nav-inner">'+
    '<div class="brand" onclick="location.hash=\'\'">'+logo+'<div class="brand-tx"><b>'+esc(name)+'</b>'+(b.tagline?'<span>'+esc(b.tagline)+'</span>':'')+'</div></div>'+
    '<div class="nav-links">'+linksHtml+'</div>'+
    '<div class="nav-cta">'+donate+'<button class="nav-burger" onclick="openMenu()" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button></div>'+
    '</div></nav>';
}
function openMenu(){
  var links=[];
  if(visible('about')) links.push(['من نحن','#about']);
  if(visible('programs')&&arr('programs').length) links.push(['البرامج','#programs']);
  if(visible('news')&&arr('news').length) links.push(['الأخبار','#news']);
  if(visible('board')&&arr('board').length) links.push(['مجلس الإدارة','#board']);
  if(visible('governance')&&arr('governance').length) links.push(['الحوكمة','#governance']);
  if(visible('faq')&&arr('faq').length) links.push(['الأسئلة الشائعة','#faq']);
  if(visible('contact')) links.push(['تواصل معنا','#contact']);
  document.getElementById('mmenu-panel').innerHTML='<button class="mmenu-close" onclick="closeMenu()">✕</button>'+links.map(function(l){ return '<a href="'+l[1]+'" onclick="closeMenu()">'+l[0]+'</a>'; }).join('');
  document.getElementById('mmenu').classList.add('open');
}
function closeMenu(){ document.getElementById('mmenu').classList.remove('open'); }

function footHtml(){
  var name=brandName(); var c=CFG.contact||{}; var pages=arr('pages');
  var quick=[];
  if(visible('about')) quick.push(['من نحن','#about']);
  if(visible('programs')&&arr('programs').length) quick.push(['البرامج','#programs']);
  if(visible('news')&&arr('news').length) quick.push(['الأخبار','#news']);
  if(visible('governance')&&arr('governance').length) quick.push(['الحوكمة','#governance']);
  var pageLinks=pages.filter(function(p){return p.slug&&p.title;}).map(function(p){ return '<a href="#/page/'+attr(p.slug)+'">'+esc(p.title)+'</a>'; }).join('');
  return '<footer><div class="wrap">'+
    '<div class="foot-top">'+
      '<div class="foot-brand"><b>'+esc(name)+'</b><p>'+esc((CFG.brand&&CFG.brand.tagline)||(CFG.hero&&CFG.hero.subtitle)||'')+'</p></div>'+
      '<div class="foot-col"><h5>روابط سريعة</h5>'+quick.map(function(l){return '<a href="'+l[1]+'">'+l[0]+'</a>';}).join('')+'</div>'+
      '<div class="foot-col"><h5>'+(pageLinks?'صفحات':'تواصل')+'</h5>'+(pageLinks||((c.email?'<a href="mailto:'+attr(c.email)+'">'+esc(c.email)+'</a>':'')+(c.phone?'<a href="tel:'+attr(c.phone)+'" style="direction:ltr">'+esc(c.phone)+'</a>':'')))+'</div>'+
    '</div>'+
    '<div class="foot-bottom"><span>© '+new Date().getFullYear()+' '+esc(name)+' — جميع الحقوق محفوظة</span>'+
      '<a class="foot-buad" href="https://buad.sa" target="_blank" rel="noopener">صُمّم عبر <b>بُعد</b></a></div>'+
  '</div></footer>';
}

function svgFor(name){
  var m={
    'doc':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    'download':'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    'phone':'<path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 2 4.18 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    'mail':'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    'pin':'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    'cal':'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    'box':'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    'image':'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(m[name]||'')+'</svg>';
}

/* ── HOME ── */
function renderHome(){
  if(layoutTheme()==='modern'){
    document.getElementById('root').innerHTML = navHtml()+mHeroHtml()+mAboutHtml()+mStatsHtml()+mValuesHtml()+mProgramsHtml()+mNewsHtml()+boardHtml()+governanceHtml()+partnersHtml()+faqHtml()+mDonateHtml()+contactHtml()+mFootHtml();
  } else if(layoutTheme()==='premium'){
    document.getElementById('root').innerHTML = navHtml()+pHeroHtml()+pAboutHtml()+pStatsHtml()+pValuesHtml()+pProgramsHtml()+pNewsHtml()+pBoardHtml()+governanceHtml()+partnersHtml()+faqHtml()+pDonateHtml()+contactHtml()+pFootHtml();
  } else {
    document.getElementById('root').innerHTML = navHtml()+heroHtml()+aboutHtml()+statsHtml()+valuesHtml()+programsHtml()+newsHtml()+boardHtml()+governanceHtml()+partnersHtml()+faqHtml()+donateHtml()+contactHtml()+footHtml();
  }
  initFaq();
}

function heroHtml(){
  var h=CFG.hero||{}; var b=CFG.brand||{};
  var title=h.title||b.tagline||brandName();
  var bg=h.image_url?'<div class="hero-bg" style="background-image:url('+attr(h.image_url)+')"></div>':'';
  var p1=h.primary_label, p1l=h.primary_link||'#about';
  var p2=h.secondary_label, p2l=h.secondary_link||'#about';
  var don=CFG.donation||{};
  if(!p1 && visible('donation') && (don.url||don.title)){ p1='تبرّع الآن'; p1l=don.url||'#donate'; }
  if(!p2){ p2='تعرّف علينا'; p2l='#about'; }
  var ext1=/^https?:/.test(p1l)?' target="_blank" rel="noopener"':'';

        (social?'<div class="p-foot-social">'+social+'</div>':'')+
      '</div>'+
      '<div class="p-foot-col"><h5>روابط سريعة</h5>'+quick.map(function(l){return '<a href="'+l[1]+'">'+l[0]+'</a>';}).join('')+'</div>'+
      '<div class="p-foot-col"><h5>تواصل معنا</h5>'+
        (c.email?'<a href="mailto:'+attr(c.email)+'">'+esc(c.email)+'</a>':'')+
        (c.phone?'<a href="tel:'+attr(c.phone)+'" style="direction:ltr">'+esc(c.phone)+'</a>':'')+
        (c.address?'<a>'+esc(c.address)+'</a>':'')+
      '</div>'+
    '</div>'+
    '<div class="p-foot-bottom">'+
      '<span>© '+new Date().getFullYear()+' '+esc(name)+' — جميع الحقوق محفوظة</span>'+
      '<a class="p-foot-buad" href="https://buad.sa" target="_blank" rel="noopener">صُمّم عبر <b>بُعد</b></a>'+
    '</div>'+
  '</div></footer>';
}

/* ── Article view ── */
function renderArticle(id){
  var n=arr('news').filter(function(x){return String(x.id)===String(id);})[0];
  if(!n){ location.hash=''; return; }
  document.getElementById('root').innerHTML = navHtml()+
    '<div class="wrap"><article class="article">'+
      '<a class="article-back" onclick="history.length>1?history.back():location.hash=\'#news\'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>الأخبار</a>'+
      '<div class="article-date">'+fmtDate(n.date)+'</div>'+
      '<h1>'+esc(n.title)+'</h1>'+
      (n.image_url?'<img class="article-hero" src="'+attr(n.image_url)+'" alt="" onerror="this.style.display=\'none\'">':'')+
      '<div class="article-body">'+esc(n.body||n.excerpt||'')+'</div>'+
    '</article></div>'+footHtml();
}

/* ── Custom page view ── */
function renderPage(slug){
  var p=arr('pages').filter(function(x){return x.slug===slug;})[0];
  if(!p){ location.hash=''; return; }
  document.getElementById('root').innerHTML = navHtml()+
    '<div class="wrap"><article class="article">'+
      '<a class="article-back" onclick="location.hash=\'\'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>الرئيسية</a>'+
      '<h1>'+esc(p.title)+'</h1>'+
      '<div class="article-body">'+esc(p.body||'')+'</div>'+
    '</article></div>'+footHtml();
}

/* ── States ── */
function stateLoading(){ document.getElementById('root').innerHTML='<div class="state-wrap"><div style="width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite"></div><div class="state-sub">جارٍ التحميل...</div></div>'; }
function stateError(title,sub){ document.getElementById('root').innerHTML='<div class="state-wrap"><div class="state-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg></div><div class="state-title">'+esc(title)+'</div><div class="state-sub">'+esc(sub||'')+'</div><a href="https://buad.sa" style="margin-top:6px;color:var(--accent);font-weight:700">← الرجوع لبُعد</a></div>'; }
</script>
</body>
</html>
